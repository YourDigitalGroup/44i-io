<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>44i Strategist Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="../shared.css"/>
</head>
<body>

<div id="toast" class="toast"></div>

<!-- STRATEGIST PANEL — scaffold only (2026-07-18). No real strategist features yet;
     this is just the same login-gated shell pattern as /admin, sharing shared.js/
     shared.css per the plan in CLAUDE.md ("Future /strategist/accounting role-based
     views are expected to land as their own paths the same way"). What strategists
     actually need to see/do is intentionally NOT decided here — that's real business-
     logic scope waiting on its own review, same as everything else parked in
     io_project_tracking.md. -->
<div id="page-strategist" style="display:none">
  <div class="card" style="max-width:1500px;margin:24px auto;padding-bottom:20px">
    <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 16px;border-bottom:1px solid var(--border);background:#FAFCFE">
      <div id="strategist-user-badge" style="font-size:12px;color:var(--muted)"></div>
      <div style="display:flex;align-items:center;gap:10px">
        <a id="strategist-admin-portal-link" href="../admin/index.html" onclick="adminPortalHandoff()" style="display:none;font-size:12px;font-weight:600;color:var(--accent);text-decoration:none">Go to Admin →</a>
        <button onclick="strategistLogout()" style="background:var(--light);border:1px solid var(--border);color:var(--muted);padding:5px 14px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:600">Logout</button>
      </div>
    </div>

    <div style="padding:16px 20px 0">
      <!-- Top bar: month picker + My Campaigns/All Strategists scope toggle -->
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:14px">
        <div style="display:flex;align-items:center;gap:10px">
          <button onclick="strategistShiftMonth(-1)" style="padding:6px 10px;border-radius:6px;border:1px solid var(--border);background:var(--light);cursor:pointer;font-size:13px">‹</button>
          <span id="strategist-month-label" style="font-size:13px;font-weight:700;color:var(--text);min-width:110px;text-align:center"></span>
          <button onclick="strategistShiftMonth(1)" style="padding:6px 10px;border-radius:6px;border:1px solid var(--border);background:var(--light);cursor:pointer;font-size:13px">›</button>
        </div>
        <div style="display:flex;gap:10px;align-items:center;font-size:12px">
          <select id="strategist-group-filter" onchange="strategistSetGroupFilter(this.value)" style="padding:6px 10px;border-radius:7px;border:1px solid var(--border);font-size:12px;font-weight:600;cursor:pointer">
            <option value="">All Groups</option>
          </select>
          <span id="strategist-scope-mine" onclick="strategistSetScope('mine')" style="padding:6px 12px;border-radius:7px;border:1px solid var(--border);cursor:pointer;font-weight:600">My Campaigns</span>
          <span id="strategist-scope-all" onclick="strategistSetScope('all')" style="padding:6px 12px;border-radius:7px;border:1px solid var(--border);cursor:pointer;font-weight:600">All Strategists</span>
          <button onclick="strategistOpenImportForm()" style="padding:6px 14px;border-radius:7px;border:1px solid var(--accent);background:#fff;color:var(--accent);cursor:pointer;font-weight:600;font-size:12px">+ New Campaign</button>
          <button onclick="strategistOpenPasteReportForm()" style="padding:6px 14px;border-radius:7px;border:1px solid var(--accent);background:#fff;color:var(--accent);cursor:pointer;font-weight:600;font-size:12px">Paste Platform Report</button>
          <button onclick="strategistOpenBulkImportForm()" style="padding:6px 14px;border-radius:7px;border:1px solid var(--accent);background:#fff;color:var(--accent);cursor:pointer;font-weight:600;font-size:12px">Bulk Import (CSV)</button>
        </div>
      </div>

      <!-- Manual "+ New Campaign" import form -- for campaigns already running from the
           old IO system, ordered before this platform existed, so they don't have to
           wait on the order-insert trigger to show up here. -->
      <div id="strategist-import-form" style="display:none"></div>

      <!-- Bulk "paste a platform report" matcher -- updates many campaigns' current-
           month actuals at once, matched by campaign title, instead of opening each
           campaign one at a time. -->
      <div id="strategist-paste-report-form" style="display:none"></div>

      <!-- Bulk CSV/Sheets import -- many campaigns (and each one's month-by-month
           budgets) in one paste, instead of the "+ New Campaign" form one at a time. -->
      <div id="strategist-bulk-import-form" style="display:none"></div>

      <!-- Status tabs -->
      <div id="strategist-status-tabs" style="display:flex;gap:18px;border-bottom:1px solid var(--border);margin-bottom:16px"></div>

      <!-- Campaign Setup review panel (only rendered when the Campaign Setup tab is active) -->
      <div id="strategist-setup-panel"></div>

      <!-- Main pacing table -->
      <div id="strategist-table-wrap" style="overflow-x:auto"></div>

      <!-- Row detail panel -->
      <div id="strategist-detail-panel" style="margin-top:16px"></div>
    </div>
  </div>
</div>

<!-- STRATEGIST LOGIN MODAL — same shape as /admin's, scoped to strategist/super roles
     only (super included so James/Jon can log in to test this as it's built, per the
     existing "James stays a super admin for now" arrangement). -->
<div id="strategist-login-modal" style="position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9000;display:none;align-items:center;justify-content:center">
  <div style="background:#fff;border-radius:14px;padding:36px 32px;width:340px;box-shadow:0 24px 64px rgba(0,0,0,.2);text-align:center">
    <div style="font-size:32px;margin-bottom:12px">🔒</div>
    <h3 style="font-size:16px;font-weight:700;margin-bottom:6px;color:var(--text)">Strategist Access</h3>
    <p style="font-size:12px;color:var(--muted);margin-bottom:20px">Select your name and enter your password</p>
    <select id="strategist-name-select" style="width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--border);font-size:14px;text-align:center;margin-bottom:10px;font-family:inherit;background:#fff">
      <option value="">— Select your name —</option>
    </select>
    <input type="password" id="strategist-pw-input" placeholder="Password" onkeydown="if(event.key==='Enter')checkStrategistPw()" style="width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--border);font-size:14px;text-align:center;letter-spacing:.2em;margin-bottom:12px"/>
    <div id="strategist-pw-error" style="display:none;color:#EF4444;font-size:12px;margin-bottom:10px">Incorrect password. Please try again.</div>
    <div style="display:flex;gap:9px">
      <button onclick="checkStrategistPw()" style="flex:1;padding:10px;border-radius:8px;background:var(--accent);color:#fff;border:none;font-size:13px;font-weight:600;cursor:pointer">Enter</button>
    </div>
  </div>
</div>

<script src="../shared.js"></script>
<script>
// Same "don't hardcode a roster" pattern as /admin's login (see that file's 2026-07-18
// note on LOGIN_ROSTER) — populated from the shared get_login_roster RPC, filtered
// client-side to the roles that belong on this specific portal.
let currentStrategistUser = null; // {name, email, role, pw}

async function loadStrategistRoster() {
  const sel = document.getElementById('strategist-name-select');
  let roster = [];
  try {
    roster = await sb('rpc/get_login_roster', { method: 'POST', body: JSON.stringify({}) }) || [];
  } catch(e) {
    console.warn('Could not load login roster:', e.message);
  }
  const eligible = roster.filter(u => u.role === 'strategist' || u.role === 'super');
  sel.innerHTML = '<option value="">— Select your name —</option>' +
    eligible.map(u => `<option value="${esc(u.name)}">${esc(u.name)}</option>`).join('');
}

function promptStrategistLogin() {
  document.getElementById('strategist-login-modal').style.display = 'flex';
  document.getElementById('strategist-name-select').value = '';
  document.getElementById('strategist-pw-input').value = '';
  document.getElementById('strategist-pw-error').style.display = 'none';
}

// Pulled out of checkStrategistPw() (2026-08-04) so the same real login check can
// also be used by the silent admin->strategist handoff below, not just the modal's
// own submit button. Returns {ok, role, email} on success or {ok:false, error} —
// never throws, so both callers can just check `.ok`.
async function attemptStrategistLogin(name, pw) {
  if (!name) return { ok: false, error: 'Please select your name.' };
  let row;
  try {
    const res = await sb('rpc/admin_login', { method:'POST', body: JSON.stringify({ p_name: name, p_pw: pw }) });
    row = Array.isArray(res) ? res[0] : res;
  } catch(e) {
    return { ok: false, error: 'Could not reach the login service. Check your connection and try again.' };
  }
  if (!row || !row.role) return { ok: false, error: 'Incorrect password. Please try again.' };
  if (row.role !== 'strategist' && row.role !== 'super') {
    return { ok: false, error: 'This account isn\'t set up for the Strategist portal.' };
  }
  return { ok: true, role: row.role, email: row.email || '' };
}

async function checkStrategistPw() {
  const name = document.getElementById('strategist-name-select').value;
  const pw = document.getElementById('strategist-pw-input').value;
  const errEl = document.getElementById('strategist-pw-error');
  const result = await attemptStrategistLogin(name, pw);
  if (result.ok) {
    currentStrategistUser = { name, email: result.email, role: result.role, pw };
    document.getElementById('strategist-login-modal').style.display = 'none';
    showStrategistPanel(true);
  } else {
    errEl.textContent = result.error;
    errEl.style.display = 'block';
    document.getElementById('strategist-pw-input').value = '';
    if (result.error.includes('select your name')) return;
    document.getElementById('strategist-pw-input').focus();
  }
}

function showStrategistPanel(show) {
  document.getElementById('page-strategist').style.display = show ? 'block' : 'none';
  if (show && currentStrategistUser) {
    const badge = document.getElementById('strategist-user-badge');
    const roleLabel = currentStrategistUser.role === 'super' ? 'Super Admin' : 'Strategist';
    badge.innerHTML = `<span style="display:inline-flex;align-items:center;gap:6px"><span style="width:8px;height:8px;border-radius:50%;background:#8B5CF6"></span><strong style="color:var(--text)">${esc(currentStrategistUser.name)}</strong> <span style="color:var(--muted)">— ${roleLabel}</span></span>`;
    // Both strategist and super can log into /admin now (2026-08-04) — a strategist
    // sees Orders there, a super sees everything — so this link makes sense either way.
    const adminLink = document.getElementById('strategist-admin-portal-link');
    if (adminLink) adminLink.style.display = 'inline';
    loadStrategistDashboard();
  }
}

// Reciprocal handoff to admin/index.html's own tryAdminHandoffLogin() (2026-08-04,
// per Claire, symmetric with the admin->strategist handoff built earlier the same
// day) — same one-time sessionStorage pattern, cleared on the other side right after
// being read, whether it works or not.
function adminPortalHandoff() {
  if (!currentStrategistUser) return;
  try {
    sessionStorage.setItem('admin_handoff_name', currentStrategistUser.name);
    sessionStorage.setItem('admin_handoff_pw', currentStrategistUser.pw);
  } catch(e) { /* sessionStorage blocked -- the link's normal navigation still works, just prompts for login again */ }
}

// ══════════════════════════════════════════════════════════════════════════
// STRATEGIST DASHBOARD (2026-08-03) — v1 framework replacing the concept mockup.
// Every mechanic below matches a decision already confirmed with Claire/the
// strategist team (see io_project_tracking.md's STRATEGIST PORTAL section and
// this session's implementation plan). Not built here, deliberately: platform-
// report API automation, ad-group/keyword breakdown detail, and importing
// pre-existing campaigns — all confirmed as their own later phases.
// ══════════════════════════════════════════════════════════════════════════

let ALL_CAMPAIGN_LINES = [];
let ALL_CAMPAIGN_MONTHS = [];
let ALL_OPTIMIZE_LOG = [];
let ALL_STRATEGIST_CLIENTS = []; // {id, name, group_id, group_name} — for the "+ New Campaign" import picker
let PLATFORM_CPM_RATES = { base: {}, group: {} }; // service_id -> $CPM, and group_id|service_id -> $CPM
let strategistScope = 'mine';               // 'mine' | 'all'
let strategistGroupFilter = '';              // '' = all groups, else a group_name
let strategistStatusTab = 'pending';        // pending | active | paused | complete
let strategistCurrentMonth = null;          // Date, always day 1
let strategistSelectedLineId = null;

const PACING_THRESHOLDS = { good: 90, warn: 70 }; // >=90 good, 70-89.99 warn, <70 risk — Claire's confirmed spreadsheet rule

// The real platform set confirmed for this project (report-automation priority order:
// Facebook → Simpli.fi → Google Ads → The Trade Desk → StackAdapt). A dropdown instead
// of free text (2026-08-04, per Claire) — but "Other…" keeps this from being a hard
// wall if a campaign genuinely runs somewhere else.
const PLATFORM_OPTIONS = ['Google Ads', 'Facebook Ads', 'Simpli.fi', 'The Trade Desk', 'StackAdapt'];

// Renders a platform <select> + a hidden "Other" text input that reveals itself when
// either "Other…" is picked or the current value isn't one of the known platforms (so
// an existing custom value already saved on a campaign is never silently dropped).
// `baseId` becomes both the select's id and, with "-other" appended, the fallback
// text input's id — strategistReadPlatformValue(baseId) below resolves whichever one
// is actually in effect.
function strategistPlatformSelectHtml(baseId, currentValue, selectWidth) {
  const isKnown = PLATFORM_OPTIONS.includes(currentValue);
  const isOther = currentValue && !isKnown;
  return `<select id="${baseId}" onchange="strategistPlatformSelectChanged('${baseId}')" style="width:${selectWidth};padding:6px 8px;border-radius:6px;border:1px solid var(--border);font-size:12.5px">
    <option value="">— Select —</option>
    ${PLATFORM_OPTIONS.map(p => `<option value="${esc(p)}" ${p === currentValue ? 'selected' : ''}>${esc(p)}</option>`).join('')}
    <option value="__other__" ${isOther ? 'selected' : ''}>Other…</option>
  </select>
  <input type="text" id="${baseId}-other" value="${isOther ? esc(currentValue) : ''}" placeholder="Platform name" style="display:${isOther ? 'inline-block' : 'none'};width:120px;padding:6px 8px;border-radius:6px;border:1px solid var(--border);font-size:12.5px;margin-left:6px"/>`;
}

function strategistPlatformSelectChanged(baseId) {
  const sel = document.getElementById(baseId);
  const other = document.getElementById(baseId + '-other');
  if (!sel || !other) return;
  other.style.display = sel.value === '__other__' ? 'inline-block' : 'none';
  if (sel.value === '__other__') other.focus();
}

function strategistReadPlatformValue(baseId) {
  const sel = document.getElementById(baseId);
  if (!sel) return '';
  if (sel.value === '__other__') return (document.getElementById(baseId + '-other')?.value || '').trim();
  return sel.value;
}

function strategistMonthKey(d) {
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
}
function strategistMonthLabel(d) {
  return d.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
}
function strategistShiftMonth(delta) {
  strategistCurrentMonth.setMonth(strategistCurrentMonth.getMonth() + delta);
  renderStrategistDashboard();
}
function strategistFormatFlightDate(dateStr) {
  if (!dateStr) return null;
  // 2-digit year (2026-08-06, per Claire: rows are getting too tall once there are
  // a few hundred campaigns) -- "Jun 1, 26" instead of "Jun 1, 2026".
  return new Date(dateStr + 'T00:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: '2-digit' });
}
function strategistFormatFlightRange(start, end) {
  const s = strategistFormatFlightDate(start), e = strategistFormatFlightDate(end);
  if (!s && !e) return '—';
  return `${s || '—'} – ${e || '—'}`;
}
function strategistSetScope(scope) {
  strategistScope = scope;
  renderStrategistDashboard();
}
function strategistSetGroupFilter(groupName) {
  strategistGroupFilter = groupName;
  renderStrategistDashboard();
}
function strategistSetStatusTab(tab) {
  strategistStatusTab = tab;
  strategistSelectedLineId = null;
  renderStrategistDashboard();
}

// ── "+ NEW CAMPAIGN" MANUAL IMPORT (2026-08-04) ──────────────────
// For campaigns already running from the OLD IO system, ordered before this platform
// existed, so they aren't sitting on an order for the create_campaign_lines_from_order
// trigger to fan out from. Skips the Campaign Setup queue entirely — an imported
// campaign is already running, so it's created straight into whichever status is
// picked (Active by default). How much history to bring in per campaign is left
// entirely up to whoever's importing it — this form creates the line, then the row
// detail panel's month-by-month history editor (see below) can backfill as many past
// months as make sense for that specific campaign, one at a time.
function strategistOpenImportForm() {
  const el = document.getElementById('strategist-import-form');
  const isOpen = el.style.display !== 'none';
  if (isOpen) { el.style.display = 'none'; el.innerHTML = ''; return; }

  const spendServices = Object.values(CATALOG_ROWS).filter(r => r.pricing_mode === 'spend');
  el.style.display = 'block';
  el.innerHTML = `<div style="border:1px solid var(--accent);border-radius:10px;padding:16px 18px;margin-bottom:16px;background:#F0F9FF">
    <strong style="font-size:13px;display:block;margin-bottom:10px">Import a campaign already running from the old IO system</strong>
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:10px">
      <div>
        <label class="lbl">Client</label>
        <input type="text" id="import-client-search" oninput="strategistFilterClientOptions()" placeholder="Search clients…" style="width:100%;padding:6px 8px;border-radius:6px 6px 0 0;border:1px solid var(--border);border-bottom:none;font-size:12px"/>
        <select id="import-client" style="width:100%;padding:7px 8px;border-radius:0 0 6px 6px;border:1px solid var(--border);font-size:12.5px">
          <option value="">— Select —</option>
          ${ALL_STRATEGIST_CLIENTS.map(c => `<option value="${esc(c.id)}" data-group-id="${esc(c.group_id || '')}">${esc(c.name)}${c.group_name ? ' (' + esc(c.group_name) + ')' : ''}</option>`).join('')}
        </select>
      </div>
      <div>
        <label class="lbl">Tactic</label>
        <select id="import-service" style="width:100%;padding:7px 8px;border-radius:6px;border:1px solid var(--border);font-size:12.5px">
          <option value="">— Select —</option>
          ${spendServices.map(s => `<option value="${esc(s.id)}">${esc(s.accounting_label || s.label)}</option>`).join('')}
        </select>
      </div>
      <div>
        <label class="lbl">Platform</label>
        ${strategistPlatformSelectHtml('import-platform', '', '100%')}
      </div>
      <div>
        <label class="lbl">Status</label>
        <select id="import-status" style="width:100%;padding:7px 8px;border-radius:6px;border:1px solid var(--border);font-size:12.5px">
          <option value="active" selected>Active</option>
          <option value="paused">Paused</option>
          <option value="complete">Complete</option>
        </select>
      </div>
      <div>
        <label class="lbl">Flight Start</label>
        <input type="date" id="import-flight-start" style="width:100%;padding:7px 8px;border-radius:6px;border:1px solid var(--border);font-size:12.5px"/>
      </div>
      <div>
        <label class="lbl">Flight End</label>
        <input type="date" id="import-flight-end" style="width:100%;padding:7px 8px;border-radius:6px;border:1px solid var(--border);font-size:12.5px"/>
      </div>
      <div>
        <label class="lbl">Current Gross Budget</label>
        <input type="number" id="import-gross-budget" placeholder="$/mo" style="width:100%;padding:7px 8px;border-radius:6px;border:1px solid var(--border);font-size:12.5px"/>
      </div>
      <div style="grid-column:span 2">
        <label class="lbl">Exact campaign title in the ad platform <span style="font-weight:400;text-transform:none;letter-spacing:0;color:var(--muted)">— used to match this campaign when you paste a platform report below</span></label>
        <input id="import-platform-campaign-name" style="width:100%;padding:7px 8px;border-radius:6px;border:1px solid var(--border);font-size:12.5px"/>
      </div>
    </div>
    <p style="font-size:11px;color:var(--muted);margin:0 0 12px">This creates the campaign as of the current month. Once it's in the list, click into it to add any past months' budgets/actuals you want on record — as far back as makes sense for this one.</p>
    <div style="display:flex;gap:10px">
      <button onclick="strategistSubmitImport()" style="padding:7px 16px;border-radius:6px;background:var(--accent);color:#fff;border:none;font-size:12.5px;font-weight:600;cursor:pointer">Add Campaign</button>
      <button onclick="strategistOpenImportForm()" style="padding:7px 16px;border-radius:6px;background:var(--light);border:1px solid var(--border);font-size:12.5px;font-weight:600;cursor:pointer">Cancel</button>
    </div>
  </div>`;
}

// Filters the Client <select>'s options live as you type (2026-08-04, per Claire —
// "that list is really long"), rather than swapping to a whole separate combobox
// widget for one field. Keeps the current selection if it still matches after
// filtering, so typing to double-check a name doesn't lose what's already picked.
function strategistFilterClientOptions() {
  const search = document.getElementById('import-client-search').value.trim().toLowerCase();
  const sel = document.getElementById('import-client');
  const currentValue = sel.value;
  const filtered = search ? ALL_STRATEGIST_CLIENTS.filter(c => c.name.toLowerCase().includes(search)) : ALL_STRATEGIST_CLIENTS;
  sel.innerHTML = '<option value="">— Select —</option>' +
    filtered.map(c => `<option value="${esc(c.id)}" data-group-id="${esc(c.group_id || '')}">${esc(c.name)}${c.group_name ? ' (' + esc(c.group_name) + ')' : ''}</option>`).join('');
  if (filtered.some(c => c.id === currentValue)) sel.value = currentValue;
}

async function strategistSubmitImport() {
  const clientSel = document.getElementById('import-client');
  const clientId = clientSel.value;
  const groupId = clientSel.selectedOptions[0]?.dataset.groupId || null;
  const serviceSel = document.getElementById('import-service');
  const serviceId = serviceSel.value;
  const serviceLabel = serviceSel.selectedOptions[0]?.textContent || '';
  const platform = strategistReadPlatformValue('import-platform');
  const status = document.getElementById('import-status').value;
  const flightStart = document.getElementById('import-flight-start').value || null;
  const flightEnd = document.getElementById('import-flight-end').value || null;
  const grossBudget = document.getElementById('import-gross-budget').value;
  const platformCampaignName = document.getElementById('import-platform-campaign-name').value.trim();

  if (!clientId || !serviceId) { showToast('Pick a client and a tactic.', 'error'); return; }

  try {
    const newId = await sb('rpc/strategist_save_campaign_line', { method: 'POST', body: JSON.stringify({
      p_name: currentStrategistUser.name, p_pw: currentStrategistUser.pw, p_id: null,
      p_data: {
        client_id: clientId, group_id: groupId, service_id: serviceId, tactic_label: serviceLabel,
        platform: platform || null, platform_campaign_name: platformCampaignName || null,
        flight_start: flightStart, flight_end: flightEnd,
        status, assigned_strategist: currentStrategistUser.name
      }
    }) });
    if (grossBudget) {
      await sb('rpc/strategist_save_campaign_month', { method: 'POST', body: JSON.stringify({
        p_name: currentStrategistUser.name, p_pw: currentStrategistUser.pw,
        p_campaign_line_id: newId, p_month: new Date().toISOString().slice(0,10),
        p_data: { gross_budget: grossBudget }
      }) });
    }
    document.getElementById('strategist-import-form').style.display = 'none';
    document.getElementById('strategist-import-form').innerHTML = '';
    strategistStatusTab = status;
    await fetchStrategistData();
    renderStrategistDashboard();
    showToast('Campaign imported!');
  } catch(e) { showToast('Error importing campaign: ' + e.message, 'error'); }
}

// ── "PASTE PLATFORM REPORT" BULK MATCH (2026-08-04) ──────────────
// Claire: "Having to go into each campaign is not realistic. Right now my spreadsheet
// looks for the unique campaign title to pull the necessary information." Her real
// workflow pastes an entire platform export at once and matches EVERY row to the right
// campaign by its title (a VLOOKUP against the Layout tab) — not one campaign at a
// time. This mirrors that exact mechanic: paste a block of rows (Campaign Name, Spend,
// Clicks, Impressions — tab- or comma-separated, one campaign per line, matching the
// generic shape every platform's export ultimately reduces to for this dashboard's
// purposes), match each row's title against campaign_lines.platform_campaign_name
// (case/whitespace-insensitive), and update the CURRENT month's actuals for every
// match in one pass — no need to click into each row individually.
// Per-platform header synonyms (2026-08-04, per Claire: "I will need a way to do
// each individually because their formats are different. Simpli.fi. Google.
// Facebook. The TradeDesk"). Rather than hardcode each platform's EXACT real export
// column order (risky to get wrong, and it can change), this reads whatever header
// row is actually pasted and matches each column NAME against known synonyms —
// works with the real export as-is, no manual reformatting, regardless of which
// platform or which order that platform happens to put its columns in.
const REPORT_COLUMN_SYNONYMS = {
  actual_spend: ['spend', 'cost', 'amount spent', 'cost ($)'],
  actual_clicks: ['clicks', 'link clicks'],
  actual_impressions: ['impr', 'impressions', 'impr.'],
  actual_conversions: ['conversions', 'results', 'weighted actions'],
};

function strategistOpenPasteReportForm() {

  if (isOpen) { el.style.display = 'none'; el.innerHTML = ''; return; }

  el.style.display = 'block';
  const defaultMonthValue = strategistCurrentMonth.getFullYear() + '-' + String(strategistCurrentMonth.getMonth() + 1).padStart(2, '0');
  el.innerHTML = `<div style="border:1px solid var(--accent);border-radius:10px;padding:16px 18px;margin-bottom:16px;background:#F0F9FF">
    <strong style="font-size:13px;display:block;margin-bottom:6px">Paste a platform report</strong>
    <div style="display:flex;gap:16px;margin-bottom:10px">
      <div>
        <label class="lbl">Report month <span style="font-weight:400;text-transform:none;letter-spacing:0;color:var(--muted)">— which month this report's numbers apply to, NOT the month you're currently viewing</span></label>
        <input type="month" id="paste-report-month" value="${defaultMonthValue}" style="padding:6px 8px;border-radius:6px;border:1px solid var(--border);font-size:12.5px"/>
      </div>

        ${strategistPlatformSelectHtml('paste-report-platform', '', '200px')}
      </div>
    </div>
    <p style="font-size:11px;color:var(--muted);margin:0 0 10px">Paste the report's own export exactly as copied, header row included (Campaign Name, Spend/Cost, Clicks, Impressions, Conversions — in whatever order that platform actually uses; column NAMES are matched automatically). One campaign per line, tab- or comma-separated. Only campaigns whose "exact campaign title in the ad platform" (set on the campaign itself) matches a row will update — anything that doesn't match gets listed below.</p>
    <textarea id="paste-report-text" rows="8" style="width:100%;padding:10px;border-radius:7px;border:1px solid var(--border);font-size:12px;font-family:monospace;margin-bottom:10px" placeholder="Campaign	Cost	Clicks	Impr.
Ridgeline Dental - SEM - July	1540	350	92000
Northside Auto - Prospecting	560	0	150000"></textarea>
    <div style="display:flex;gap:10px;margin-bottom:10px">

      <button onclick="strategistOpenPasteReportForm()" style="padding:7px 16px;border-radius:6px;background:var(--light);border:1px solid var(--border);font-size:12.5px;font-weight:600;cursor:pointer">Cancel</button>
    </div>

function parsePastedReportRows(text) {
  return text.trim().split(/\r?\n/).filter(line => line.trim()).map(line =>
    (line.includes('\t') ? line.split('\t') : line.split(',')).map(c => c.trim())
  );
}

// Maps a header row's column names to the metric fields they represent, using
// REPORT_COLUMN_SYNONYMS above. Returns null if the first row doesn't look like a
// header at all (its 2nd column parses as a real number) — falls back to the
// original fixed Spend/Clicks/Impressions column order in that case.
function detectReportColumnMap(headerRow) {
  if (!headerRow || headerRow.length < 2 || !isNaN(parseFloat(headerRow[1]))) return null;
  const map = {};
  headerRow.forEach((label, i) => {
    if (i === 0) return; // column 0 is always the campaign title
    const lower = label.toLowerCase();
    for (const [field, synonyms] of Object.entries(REPORT_COLUMN_SYNONYMS)) {
      // First matching column wins, not the last -- found live 2026-08-06 against a
      // real Simpli.fi export: "Month To Date Spend", "Yesterday Spend", and
      // "Yesterday Spend Percentage" all contain "spend", so the old code (which kept
      // overwriting map[field] on every match) ended up pointing at the LAST column
      // ("Yesterday Spend Percentage", a %) instead of the real MTD dollar figure.
      if (map[field] !== undefined) continue;
      if (synonyms.some(s => lower.includes(s))) { map[field] = i; break; }
    }
  });
  return map;
}

async function strategistMatchPastedReport() {
  const raw = document.getElementById('paste-report-text').value;
  if (!raw.trim()) { showToast('Paste a report first.', 'error'); return; }
  const platform = strategistReadPlatformValue('paste-report-platform');
  if (!platform) { showToast('Pick which platform this report is from.', 'error'); return; }
  const reportMonthValue = document.getElementById('paste-report-month').value; // "YYYY-MM"
  if (!reportMonthValue) { showToast('Pick which month this report is for.', 'error'); return; }

  let rows = parsePastedReportRows(raw);
  const columnMap = detectReportColumnMap(rows[0]);
  // A real header row (matched above) never itself represents a campaign -- drop it.
  if (columnMap) rows = rows.slice(1);
  // No header detected -- fall back to the original fixed order.
  const fallbackMap = { actual_spend: 1, actual_clicks: 2, actual_impressions: 3 };
  const effectiveMap = columnMap && Object.keys(columnMap).length ? columnMap : fallbackMap;

  // Only match against THIS platform's own campaigns -- a title that happens to
  // match on the wrong platform would silently overwrite the wrong campaign's numbers.
  const byTitle = {};
  ALL_CAMPAIGN_LINES.forEach(l => {
    if (l.platform_campaign_name && l.platform === platform) byTitle[l.platform_campaign_name.trim().toLowerCase()] = l;
  });

  // The report's OWN chosen month, not whatever month happens to be selected in the
  // top bar (2026-08-04, per Claire: "we need a way to indicate what the date range
  // is for the report so it applies to the correct month") -- avoids silently filing
  // a report against the wrong month just because the top bar wasn't switched first.
  const monthStr = reportMonthValue + '-01';
  const matched = [], unmatched = [];
  for (const cols of rows) {
    const title = (cols[0] || '').trim();
    if (!title) continue;
    const line = byTitle[title.toLowerCase()];
    if (!line) { unmatched.push(title); continue; }
    const data = {};
    Object.entries(effectiveMap).forEach(([field, idx]) => {
      // Real exports use thousands-comma ("1,291") and dollar-sign ("$1.81")
      // formatting -- Postgres rejects both as invalid numeric syntax (22P02), found
      // live 2026-08-06 against real Trade Desk/Simpli.fi reports. Strip before saving.
      if (cols[idx] !== undefined && cols[idx] !== '') data[field] = cols[idx].replace(/[$,]/g, '').trim();
    });
    try {
      await sb('rpc/strategist_save_campaign_month', { method: 'POST', body: JSON.stringify({
        p_name: currentStrategistUser.name, p_pw: currentStrategistUser.pw,
        p_campaign_line_id: line.id, p_month: monthStr, p_data: data
      }) });
      matched.push(`${line.client_name || ''} / ${line.tactic_label || line.service_id}`.trim());
    } catch(e) {
      unmatched.push(title + ' (save failed: ' + e.message + ')');
    }
  }

  await fetchStrategistData();
  renderStrategistDashboard();

  const resultsEl = document.getElementById('paste-report-results');
  if (resultsEl) {
    resultsEl.innerHTML = `
      <p style="font-size:12px;color:#166534;font-weight:600;margin:0 0 4px">${matched.length} campaign${matched.length === 1 ? '' : 's'} updated${matched.length ? ': ' + matched.map(esc).join(', ') : ''}</p>
      ${unmatched.length ? `<p style="font-size:12px;color:#B91C1C;font-weight:600;margin:0">${unmatched.length} row${unmatched.length === 1 ? '' : 's'} didn't match any ${esc(platform)} campaign — check the exact title on the campaign itself: ${unmatched.map(esc).join(', ')}</p>` : ''}
    `;
  }
  showToast(matched.length ? `${matched.length} campaign(s) updated` : 'No matches found');
}

// ── BULK IMPORT (CSV / GOOGLE SHEETS) ────────────────────────────
// Claire: "Is there a way we can do a mass import from a csv or google sheet? How can
// we update for different month budgets?" One paste covers MANY campaigns AND each
// one's month-by-month budget history in a single pass — a real spreadsheet range
// copied straight out of Google Sheets pastes as tab-separated text, so this needs no
// actual file upload, just the same paste-into-a-textarea pattern already used above.
// One row per CAMPAIGN-MONTH — the same campaign (matched by Client+Tactic+Platform+
// Platform Campaign Name) can appear on several rows, one per month, which is exactly
// how several months of budget history get set in one go.
const BULK_IMPORT_COLUMNS = [
  { key: 'client', names: ['client'] },
  { key: 'tactic', names: ['tactic', 'service'] },
  { key: 'platform', names: ['platform'] },
  { key: 'platform_campaign_name', names: ['platform campaign name', 'campaign name', 'campaign title'] },
  { key: 'status', names: ['status'] },
  { key: 'flight_start', names: ['flight start', 'start date'] },
  { key: 'flight_end', names: ['flight end', 'end date'] },
  { key: 'month', names: ['month'] },
  { key: 'gross_budget', names: ['gross budget', 'budget'] },
];

function strategistOpenBulkImportForm() {
  const el = document.getElementById('strategist-bulk-import-form');
  const isOpen = el.style.display !== 'none';
  if (isOpen) { el.style.display = 'none'; el.innerHTML = ''; return; }

  el.style.display = 'block';
  el.innerHTML = `<div style="border:1px solid var(--accent);border-radius:10px;padding:16px 18px;margin-bottom:16px;background:#F0F9FF">
    <strong style="font-size:13px;display:block;margin-bottom:6px">Bulk import campaigns (paste from a CSV or a Google Sheets range)</strong>
    <p style="font-size:11px;color:var(--muted);margin:0 0 10px">First row must be a header with these column names (any order): <strong>Client, Tactic, Platform, Platform Campaign Name, Status, Flight Start, Flight End, Month, Gross Budget</strong>. Tab- or comma-separated — copying a range directly out of Google Sheets pastes as tab-separated automatically. One row per campaign PER MONTH — give the same campaign several rows (same Client/Tactic/Platform/Platform Campaign Name, different Month) to bring in more than one month's budget at once. Dates as YYYY-MM-DD, Month as YYYY-MM.</p>
    <textarea id="bulk-import-text" rows="8" style="width:100%;padding:10px;border-radius:7px;border:1px solid var(--border);font-size:12px;font-family:monospace;margin-bottom:10px" placeholder="Client	Tactic	Platform	Platform Campaign Name	Status	Flight Start	Flight End	Month	Gross Budget
Ridgeline Dental	SEM	Google Ads	Ridgeline Dental - SEM - July	active	2026-07-01	2026-07-31	2026-07	1500
Ridgeline Dental	SEM	Google Ads	Ridgeline Dental - SEM - July	active	2026-07-01	2026-07-31	2026-08	2000"></textarea>
    <div style="display:flex;gap:10px;margin-bottom:10px">
      <button onclick="strategistRunBulkImport()" style="padding:7px 16px;border-radius:6px;background:var(--accent);color:#fff;border:none;font-size:12.5px;font-weight:600;cursor:pointer">Import</button>
      <button onclick="strategistOpenBulkImportForm()" style="padding:7px 16px;border-radius:6px;background:var(--light);border:1px solid var(--border);font-size:12.5px;font-weight:600;cursor:pointer">Cancel</button>
    </div>
    <div id="bulk-import-results"></div>
  </div>`;
}

function normalizeHeaderName(s) {
  return s.trim().toLowerCase().replace(/[_-]+/g, ' ').replace(/\s+/g, ' ');
}

// Resolves a typed Client/Tactic cell against real data -- exact, case-insensitive.
// Returns null (not a guess) if nothing matches, so an unresolved row is reported
// back rather than silently imported against the wrong client or tactic.
function resolveBulkClient(name) {
  const norm = (name || '').trim().toLowerCase();
  return ALL_STRATEGIST_CLIENTS.find(c => c.name.trim().toLowerCase() === norm) || null;
}
function resolveBulkService(name) {
  const norm = (name || '').trim().toLowerCase();
  if (CATALOG_ROWS[name]) return CATALOG_ROWS[name]; // literal service_id typed directly
  return Object.values(CATALOG_ROWS).find(r => r.pricing_mode === 'spend' &&
    ((r.accounting_label || r.label || '').trim().toLowerCase() === norm)) || null;
}

async function strategistRunBulkImport() {
  const raw = document.getElementById('bulk-import-text').value;
  if (!raw.trim()) { showToast('Paste something first.', 'error'); return; }
  const rows = parsePastedReportRows(raw);
  if (rows.length < 2) { showToast('Need a header row plus at least one data row.', 'error'); return; }

  const header = rows[0].map(normalizeHeaderName);
  const colIndex = {};
  BULK_IMPORT_COLUMNS.forEach(({ key, names }) => {
    const idx = header.findIndex(h => names.includes(h));
    if (idx !== -1) colIndex[key] = idx;
  });
  const missingRequired = ['client', 'tactic'].filter(k => colIndex[k] === undefined);
  if (missingRequired.length) {
    showToast('Header row is missing required column(s): ' + missingRequired.join(', '), 'error');
    return;
  }

  const errors = [];
  // Group data rows by the campaign identity they belong to, so several months for
  // the SAME campaign share one campaign_lines row instead of creating a duplicate
  // per row.
  const groups = new Map(); // identityKey -> { fields, monthRows: [] }
  rows.slice(1).forEach((cols, i) => {
    const rowNum = i + 2; // 1-based, header is row 1
    const get = (key) => colIndex[key] !== undefined ? (cols[colIndex[key]] || '').trim() : '';
    const clientName = get('client'), tacticName = get('tactic');
    if (!clientName && !tacticName) return; // blank line
    const client = resolveBulkClient(clientName);
    const service = resolveBulkService(tacticName);
    if (!client) { errors.push(`Row ${rowNum}: no client matches "${clientName}"`); return; }
    if (!service) { errors.push(`Row ${rowNum}: no tactic matches "${tacticName}"`); return; }
    const platform = get('platform');
    const platformCampaignName = get('platform_campaign_name');
    const identityKey = [client.id, service.id, platform, platformCampaignName].join('|');
    if (!groups.has(identityKey)) {
      groups.set(identityKey, {
        client_id: client.id, group_id: client.group_id, service_id: service.id,
        tactic_label: service.accounting_label || service.label, platform: platform || null,
        platform_campaign_name: platformCampaignName || null,
        status: get('status') || 'active', flight_start: get('flight_start') || null, flight_end: get('flight_end') || null,
        monthRows: [],
      });
    }
    const month = get('month');
    // Same fix as the paste-report tool (2026-08-06): a real spreadsheet's Gross
    // Budget column can be "$1,500"-formatted -- strip $ and , before it ever reaches
    // a numeric column, or the save throws Postgres error 22P02.
    const grossBudget = get('gross_budget').replace(/[$,]/g, '').trim();
    if (month) groups.get(identityKey).monthRows.push({ month, grossBudget, rowNum });
  });

  // Existing campaigns are matched the same way the paste-report tool does -- by
  // platform_campaign_name -- so re-running an import (e.g. to add a newer month)
  // updates the SAME campaign instead of creating a duplicate.
  const existingByTitle = {};
  ALL_CAMPAIGN_LINES.forEach(l => {
    if (l.platform_campaign_name) existingByTitle[l.platform_campaign_name.trim().toLowerCase()] = l;
  });

  let createdCount = 0, matchedExistingCount = 0, monthsSavedCount = 0;
  for (const g of groups.values()) {
    let lineId = g.platform_campaign_name ? existingByTitle[g.platform_campaign_name.trim().toLowerCase()]?.id : null;
    if (lineId) {
      matchedExistingCount++;
    } else {
      try {
        lineId = await sb('rpc/strategist_save_campaign_line', { method: 'POST', body: JSON.stringify({
          p_name: currentStrategistUser.name, p_pw: currentStrategistUser.pw, p_id: null,
          p_data: {
            client_id: g.client_id, group_id: g.group_id, service_id: g.service_id, tactic_label: g.tactic_label,
            platform: g.platform, platform_campaign_name: g.platform_campaign_name,
            flight_start: g.flight_start, flight_end: g.flight_end,
            status: g.status, assigned_strategist: currentStrategistUser.name,
          }
        }) });
        createdCount++;
      } catch(e) { errors.push(`Couldn't create campaign for "${g.tactic_label}" (${g.platform_campaign_name || 'no title'}): ${e.message}`); continue; }
    }
    for (const mr of g.monthRows) {
      const match = /^(\d{4})-(\d{2})$/.exec(mr.month);
      if (!match) { errors.push(`Row ${mr.rowNum}: "${mr.month}" isn't a valid month (use YYYY-MM)`); continue; }
      try {
        await sb('rpc/strategist_save_campaign_month', { method: 'POST', body: JSON.stringify({
          p_name: currentStrategistUser.name, p_pw: currentStrategistUser.pw,
          p_campaign_line_id: lineId, p_month: `${match[1]}-${match[2]}-01`,
          p_data: mr.grossBudget ? { gross_budget: mr.grossBudget } : {}
        }) });
        monthsSavedCount++;
      } catch(e) { errors.push(`Row ${mr.rowNum}: couldn't save month: ${e.message}`); }
    }
  }

  await fetchStrategistData();
  renderStrategistDashboard();

  const resultsEl = document.getElementById('bulk-import-results');
  if (resultsEl) {
    resultsEl.innerHTML = `
      <p style="font-size:12px;color:#166534;font-weight:600;margin:0 0 4px">${createdCount} campaign(s) created, ${matchedExistingCount} matched to an existing campaign, ${monthsSavedCount} month(s) saved.</p>
      ${errors.length ? `<p style="font-size:12px;color:#B91C1C;font-weight:600;margin:4px 0 0">${errors.length} issue(s):</p><ul style="font-size:11.5px;color:#B91C1C;margin:4px 0 0;padding-left:18px">${errors.map(e => `<li>${esc(e)}</li>`).join('')}</ul>` : ''}
    `;
  }
  showToast(`Import done: ${createdCount} created, ${matchedExistingCount} matched, ${errors.length} issue(s)`);
}

// Fetches the four datasets fresh, WITHOUT touching any view state (current month,
// scope, status tab, selected row) — used both by the initial load and by every save
// handler afterward. Kept separate from loadStrategistDashboard() below on purpose:
// re-fetching after saving one field shouldn't reset which month a strategist happens
// to be looking at.
async function fetchStrategistData() {
  if (!Object.keys(CATALOG_ROWS).length) await loadCatalog();
  const [lines, months, log, rates, clients] = await Promise.all([
    sb('rpc/strategist_get_campaign_lines', { method: 'POST', body: JSON.stringify({ p_name: currentStrategistUser.name, p_pw: currentStrategistUser.pw }) }),
    sb('rpc/strategist_get_campaign_months', { method: 'POST', body: JSON.stringify({ p_name: currentStrategistUser.name, p_pw: currentStrategistUser.pw }) }),
    sb('rpc/strategist_get_optimize_log', { method: 'POST', body: JSON.stringify({ p_name: currentStrategistUser.name, p_pw: currentStrategistUser.pw }) }),
    sb('rpc/strategist_get_budgeted_spend_rates', { method: 'POST', body: JSON.stringify({ p_name: currentStrategistUser.name, p_pw: currentStrategistUser.pw }) }),
    sb('rpc/strategist_get_clients', { method: 'POST', body: JSON.stringify({ p_name: currentStrategistUser.name, p_pw: currentStrategistUser.pw }) }),
  ]);
  ALL_CAMPAIGN_LINES = lines || [];
  ALL_CAMPAIGN_MONTHS = months || [];
  ALL_OPTIMIZE_LOG = log || [];
  ALL_STRATEGIST_CLIENTS = clients || [];
  PLATFORM_CPM_RATES = { base: {}, group: {} };
  (rates || []).forEach(r => {
    if (r.scope === 'base') PLATFORM_CPM_RATES.base[r.service_id] = r.platform_cpm;
    else PLATFORM_CPM_RATES.group[r.group_id + '|' + r.service_id] = r.platform_cpm;
  });
}

async function loadStrategistDashboard() {
  strategistCurrentMonth = new Date(new Date().getFullYear(), new Date().getMonth(), 1);
  try {
    await fetchStrategistData();
  } catch(e) {
    showToast('Error loading dashboard: ' + e.message, 'error');
    return;
  }
  renderStrategistDashboard();
}

// Effective Platform CPM for a service, honoring a group-specific override — same
// resolution order as the admin Accounting Overrides tab (group override wins, else
// the base accounting_map rate). Never exposes 44i Cut %/Fixed Cut/Setup Fee Split —
// this dashboard only ever needs Platform CPM.
function effectivePlatformCpm(serviceId, groupId) {
  const groupKey = groupId + '|' + serviceId;
  if (PLATFORM_CPM_RATES.group[groupKey] != null) return Number(PLATFORM_CPM_RATES.group[groupKey]);
  return PLATFORM_CPM_RATES.base[serviceId] != null ? Number(PLATFORM_CPM_RATES.base[serviceId]) : null;
}

// Budgeted Impressions = Gross Budget ÷ Retail CPM × 1000 -- what was actually sold
// to the client, independent of platform cost efficiency. Confirmed against real
// strategist spreadsheets 2026-08-05 (Galaxy, Prairie Flower Casino, Fisher & Son,
// Auto Bank of KC) after Claire flagged In-Platform Budget/Goal numbers not matching
// what strategists were using: every example traced back to a clean Retail CPM here,
// while the old flat "Gross × Budgeted Spend %" model for In-Platform Budget produced
// a non-round % every time -- confirming this, not that, is the real source of truth.
// This is also now the direct basis for Goal (see computeGoal below) -- Goal never
// derives from In-Platform Budget, since what's promised to the client doesn't move
// just because the platform ends up more or less efficient than planned.
function budgetedImpressions(grossBudget, serviceId) {
  const row = CATALOG_ROWS[serviceId];
  if (grossBudget == null || !row || row.retail_cpm == null) return null;
  return (Number(grossBudget) / Number(row.retail_cpm)) * 1000;
}

// In-Platform Budget = Budgeted Impressions × Platform CPM ÷ 1000 -- always computed
// live, never stored, same derived-vs-stored principle as everywhere else in this
// project. Platform CPM is a real number entered per service/group (Admin →
// Accounting Map / Accounting Overrides), not derived from a flat %.
function computeInPlatformBudget(grossBudget, serviceId, groupId) {
  const impressions = budgetedImpressions(grossBudget, serviceId);
  const platformCpm = effectivePlatformCpm(serviceId, groupId);
  if (impressions == null || platformCpm == null) return null;
  return impressions * platformCpm / 1000;
}

// campaign_months.in_platform_override — an explicit override always wins over the
// computed value, same "override wins" pattern as Goal (2026-08-04, per Claire:
// "we will also need to be able to override the in platform spend while we confirm
// all of our logic is working correctly"). Per-MONTH, not per-campaign, since
// In-Platform Budget (like Gross Budget) is itself a per-month figure — lives on
// campaign_months, not campaign_lines. Every call site that used to call
// computeInPlatformBudget() directly on a monthRow now goes through this instead.
function effectiveInPlatformBudget(monthRow, serviceId, groupId) {
  if (!monthRow) return null;
  if (monthRow.in_platform_override != null) return Number(monthRow.in_platform_override);
  return computeInPlatformBudget(monthRow.gross_budget, serviceId, groupId);
}

// Goal: impressions for every platform except SEM (Goal = Budgeted Impressions =
// Gross Budget ÷ Retail CPM × 1000 -- see budgetedImpressions() above). Deliberately
// NOT derived from In-Platform Budget (changed 2026-08-05, per Claire's real-campaign
// testing): what's promised to the client is fixed by the Retail CPM they were sold
// on, not by how efficiently the platform happens to deliver that spend. SEM is a
// known v1 gap — the catalog only stores a CPC RANGE string ("$4-$12"), not a single
// rate, so an automatic clicks number isn't actually computable yet; falls back to
// campaign_lines.goal_override (manual entry, same trust level as Platform/monthly
// budgets) until a real single CPC rate is decided. goal_override is a general escape
// hatch, not just SEM's -- found live 2026-08-04, per Claire: a bulk-imported campaign
// that skips entering In-Platform spend (or whose auto-calculated Goal is simply
// wrong for some other reason) still needs a way to correct it, same as SEM already
// had. An explicit override always wins, regardless of whether an auto-calculated
// number is also available.
function computeGoal(line, grossBudget) {
  const row = CATALOG_ROWS[line.service_id];
  const isClicksBased = line.service_id === 'sem-bp' || !row || row.retail_cpm == null;
  const unit = isClicksBased ? 'clicks' : 'impr.';
  if (line.goal_override != null) return { value: Number(line.goal_override), unit, manual: true, overridden: true };
  if (isClicksBased) return { value: null, unit, manual: true };
  return { value: budgetedImpressions(grossBudget, line.service_id), unit, manual: false };
}

function strategistDaysBetweenInclusive(a, b) {
  const utcA = Date.UTC(a.getFullYear(), a.getMonth(), a.getDate());
  const utcB = Date.UTC(b.getFullYear(), b.getMonth(), b.getDate());
  return Math.round((utcB - utcA) / 86400000) + 1;
}

// The expected fraction of a month's flight window that should have delivered by
// today -- confirmed against Claire's real spreadsheet formula 2026-08-06. The window
// is the OVERLAP between the campaign's flight dates and the REAL current calendar
// month (not the full flight, and not just the calendar month alone); "today" clamps
// to the flight's own end date if the flight already finished mid-month.
function strategistExpectedPacingFraction(flightStart, flightEnd, today) {
  const monthStart = new Date(today.getFullYear(), today.getMonth(), 1);
  const monthEnd = new Date(today.getFullYear(), today.getMonth() + 1, 0);
  const fs = flightStart ? new Date(flightStart + 'T00:00:00') : null;
  const fe = flightEnd ? new Date(flightEnd + 'T00:00:00') : null;
  const windowStart = fs && fs > monthStart ? fs : monthStart;
  const windowEnd = fe && fe < monthEnd ? fe : monthEnd;
  if (windowEnd < windowStart) return null; // flight doesn't overlap this month at all
  const elapsedEnd = fe && fe < today ? fe : today;
  if (elapsedEnd < windowStart) return 0;
  const elapsedDays = strategistDaysBetweenInclusive(windowStart, elapsedEnd);
  const totalDays = strategistDaysBetweenInclusive(windowStart, windowEnd);
  return elapsedDays / totalDays;
}

// Spend/Perf Pacing -- confirmed against Claire's real spreadsheet formula
// 2026-08-06: a COMPLETED past month shows a plain final Actual ÷ Goal (that month
// already fully happened, nothing left to project); a month that hasn't started yet
// shows nothing (no actuals to pace); the REAL CURRENT month prorates Goal down to
// "what should have been spent by today," using the overlap between the campaign's
// flight and this calendar month, exactly as in that formula. Deliberately anchored
// to real today's date, not to whichever month is selected in the top-bar picker --
// only WHICH branch applies (past/current/future) depends on the viewed month.
function pacingPct(actual, goal, flightStart, flightEnd, viewedMonth) {
  if (actual == null || goal == null || goal === 0) return null;
  const now = new Date();
  const viewedKey = strategistMonthKey(viewedMonth);
  const nowKey = strategistMonthKey(now);
  if (viewedKey < nowKey) return (Number(actual) / Number(goal)) * 100;
  if (viewedKey > nowKey) return null;
  const frac = strategistExpectedPacingFraction(flightStart, flightEnd, now);
  if (frac == null || frac <= 0) return null;
  return (Number(actual) / (Number(goal) * frac)) * 100;
}
function pacingClass(pct) {
  if (pct == null) return '';
  if (pct >= PACING_THRESHOLDS.good) return 'good';
  if (pct >= PACING_THRESHOLDS.warn) return 'warn';
  return 'risk';
}
function pacingPillHtml(pct) {
  if (pct == null) return '<span style="color:var(--muted);font-size:11px">—</span>';
  const cls = pacingClass(pct);
  const colors = { good: ['#DDF2DE', '#2E7D42'], warn: ['#FBF3C7', '#8A6D12'], risk: ['#FBDBD6', '#A23B2E'] }[cls];
  return `<span style="display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap;background:${colors[0]};color:${colors[1]}">${Math.round(pct)}%</span>`;
}

// Finds this line's row for a specific month, carrying the prior month's Gross Budget
// forward when the campaign's budget doesn't vary month to month and no explicit row
// exists yet for the requested month — so a flat-budget campaign never needs its
// number re-entered every month, only a genuinely-varying one does.
function monthRowFor(lineId, monthDate) {
  const key = strategistMonthKey(monthDate);
  const rows = ALL_CAMPAIGN_MONTHS.filter(m => m.campaign_line_id === lineId).sort((a,b) => a.month.localeCompare(b.month));
  const exact = rows.find(m => strategistMonthKey(new Date(m.month + 'T00:00:00')) === key);
  const line = ALL_CAMPAIGN_LINES.find(l => l.id === lineId);
  const priorRow = () => rows.filter(m => m.month < monthDate.toISOString().slice(0,10)).pop();

  if (exact) {
    // Pasting a platform report (or adding a past month manually) can create/update
    // a month's ACTUALS before that month ever got a real Gross Budget entered —
    // found live 2026-08-05, checking Claire's own question about testing a past
    // month. Without this, that exact row's own gross_budget (null) would win over
    // carry-forward entirely, silently blanking In-Platform Budget for a month that
    // otherwise has real numbers on it. If the campaign doesn't vary month to month,
    // still carry the budget forward from the most recent PRIOR month while keeping
    // this row's own real actuals.
    if (exact.gross_budget == null && line && !line.budget_varies_by_month) {
      const prior = priorRow();
      if (prior) return { ...exact, gross_budget: prior.gross_budget, _carried: true };
    }
    return exact;
  }
  if (line && line.budget_varies_by_month) return null;
  // Carry forward the most recent PRIOR month's gross_budget as a synthetic row.
  const prior = priorRow();
  return prior ? { ...prior, month: monthDate.toISOString().slice(0,10), _carried: true } : null;
}

function strategistLineActiveInMonth(line, monthDate) {
  const monthKey = strategistMonthKey(monthDate);
  if (line.flight_start && monthKey < strategistMonthKey(new Date(line.flight_start + 'T00:00:00'))) return false;
  if (line.flight_end && monthKey > strategistMonthKey(new Date(line.flight_end + 'T00:00:00'))) return false;
  return true;
}

function visibleCampaignLines() {
  return ALL_CAMPAIGN_LINES.filter(l => {
    if (l.status !== strategistStatusTab) return false;
    if (strategistScope === 'mine' && l.assigned_strategist !== currentStrategistUser.name) return false;
    if (strategistGroupFilter && l.group_name !== strategistGroupFilter) return false;
    // Pending is a setup to-do queue, not a monthly performance view -- a campaign
    // flighted to start next month still needs its setup done now, so it stays
    // visible regardless of the month picker.
    if (l.status !== 'pending' && !strategistLineActiveInMonth(l, strategistCurrentMonth)) return false;
    return true;
  });
}

    groupFilterEl.innerHTML = '<option value="">All Groups</option>' +

  }

  }).join('');

function strategistToggleVaries(lineId, checked) {
  document.getElementById('setup-months-' + lineId).style.display = checked ? '' : 'none';
  strategistSaveLine(lineId, { budget_varies_by_month: checked }, false);
}

async function strategistAddSetupMonth(lineId) {
  const rows = ALL_CAMPAIGN_MONTHS.filter(m => m.campaign_line_id === lineId).sort((a,b) => a.month.localeCompare(b.month));
  const last = rows[rows.length - 1];
  const next = last ? new Date(last.month + 'T00:00:00') : new Date();
  next.setMonth(next.getMonth() + 1);
  await strategistSaveMonth(lineId, next.toISOString().slice(0,10), { gross_budget: last ? last.gross_budget : null });
}

// Backfilling a specific past month from the detail panel's history editor (2026-08-04)
// — unlike strategistAddSetupMonth() above (which just adds "the next month" for an
// ongoing campaign), an imported campaign needs to jump straight to a specific past
// month, however far back makes sense for that one — no fixed amount of history is
// assumed or required.
async function strategistAddHistoryMonth(lineId) {
  const input = prompt('Which month? (YYYY-MM)');
  if (!input) return;
  const match = /^(\d{4})-(\d{2})$/.exec(input.trim());
  if (!match) { showToast('Enter a month as YYYY-MM, e.g. 2026-03', 'error'); return; }
  const monthStr = `${match[1]}-${match[2]}-01`;
  await strategistSaveMonth(lineId, monthStr, {});
}

async function strategistSaveMonth(lineId, monthStr, data) {
  try {
    await sb('rpc/strategist_save_campaign_month', { method: 'POST', body: JSON.stringify({
      p_name: currentStrategistUser.name, p_pw: currentStrategistUser.pw,
      p_campaign_line_id: lineId, p_month: monthStr,
      p_data: Object.fromEntries(Object.entries(data).map(([k,v]) => [k, v === '' ? null : v]))
    }) });
    await fetchStrategistData();
    renderStrategistDashboard();
  } catch(e) { showToast('Error saving month: ' + e.message, 'error'); }
}

async function strategistSaveLine(lineId, data, reload) {
  try {
    const cleanData = Object.fromEntries(Object.entries(data).map(([k,v]) => [k, v === '' ? null : v]));
    await sb('rpc/strategist_save_campaign_line', { method: 'POST', body: JSON.stringify({
      p_name: currentStrategistUser.name, p_pw: currentStrategistUser.pw, p_id: lineId, p_data: cleanData
    }) });
    if (reload !== false) { await fetchStrategistData(); renderStrategistDashboard(); }
    else showToast('Saved');
  } catch(e) { showToast('Error saving: ' + e.message, 'error'); }
}

// Picks readable text (near-black or near-white) against an arbitrary hex background
// — the same relative-luminance approach browsers/design tools use for contrast, so a
// group's own brand color (which can be light or dark) never renders unreadable text.
function strategistContrastTextColor(hex) {
  if (!hex || !/^#[0-9a-fA-F]{6}$/.test(hex)) return '#0E5D82';
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  const luminance = (0.299*r + 0.587*g + 0.114*b) / 255;
  return luminance > 0.6 ? '#1F2937' : '#FFFFFF';
}

      const logCount = ALL_OPTIMIZE_LOG.filter(o => o.campaign_line_id === l.id).length;

            <option value="">— Select —</option>

        <td style="padding:9px 10px;max-width:110px">${esc(strategistFormatFlightRange(l.flight_start, l.flight_end))}</td>
        <td style="padding:9px 10px">${monthRow.gross_budget != null ? '$' + Number(monthRow.gross_budget).toLocaleString() + '/mo' : '—'}</td>
        <td style="padding:9px 10px">${inPlatform != null ? '$' + inPlatform.toLocaleString(undefined,{maximumFractionDigits:0}) + '/mo' : '—'}</td>
        <td style="padding:9px 10px">${monthRow.actual_spend != null ? '$' + Number(monthRow.actual_spend).toLocaleString() : '—'}</td>
        <td style="padding:9px 10px">${pacingPillHtml(spendPacing)}</td>
        <td style="padding:9px 10px">${goal.value != null ? Math.round(goal.value).toLocaleString() + ' ' + goal.unit : (goal.manual ? '— (enter manually)' : '—')}</td>
        <td style="padding:9px 10px">${actualPerf != null ? Number(actualPerf).toLocaleString() + ' ' + goal.unit : '—'}</td>
        <td style="padding:9px 10px">${pacingPillHtml(perfPacing)}</td>
        <td style="padding:9px 10px">${logCount} ${logCount === 1 ? 'entry' : 'entries'}</td>
        <td style="padding:9px 10px;color:var(--muted);max-width:160px;overflow-wrap:break-word">${esc(l.setup_notes || '—')}</td>
      </tr>`;
    });
  });
  html += '</tbody></table>';
  return html;
}

function strategistSelectLine(lineId) {
  strategistSelectedLineId = strategistSelectedLineId === lineId ? null : lineId;
  renderStrategistDashboard();
}

// ── ROW DETAIL PANEL ──────────────────────────────────────────────
function renderStrategistDetailPanel() {
  const panel = document.getElementById('strategist-detail-panel');
  if (!strategistSelectedLineId) { panel.innerHTML = ''; return; }
  const l = ALL_CAMPAIGN_LINES.find(x => x.id === strategistSelectedLineId);
  if (!l) { panel.innerHTML = ''; return; }
  const monthRow = monthRowFor(l.id, strategistCurrentMonth) || {};
  const log = ALL_OPTIMIZE_LOG.filter(o => o.campaign_line_id === l.id);
  const ctr = (monthRow.actual_clicks != null && monthRow.actual_impressions) ? (monthRow.actual_clicks / monthRow.actual_impressions * 100) : null;
  const inPlatform = effectiveInPlatformBudget(monthRow, l.service_id, l.group_id);
  const goal = computeGoal(l, monthRow.gross_budget);
  // What Goal would auto-calculate to WITHOUT the override, shown as a reference —
  // helps tell "there's nothing to auto-calculate from" apart from "there IS a real
  // number, I'm just choosing to override it."
  const autoGoal = computeGoal({ ...l, goal_override: null }, monthRow.gross_budget);

  panel.innerHTML = `<div style="border:1px solid var(--border);border-radius:10px;padding:16px 18px;background:#fff">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:10px">
      <strong style="font-size:13px">${esc(l.client_name || '(unknown)')} / ${esc(l.tactic_label || l.service_id)}</strong>
      <div style="display:flex;align-items:center;gap:8px">
        <input id="detail-platform-campaign-name-${l.id}" value="${esc(l.platform_campaign_name || '')}" placeholder="Exact title in the ad platform (for report matching)" onchange="strategistSaveLine('${l.id}', {platform_campaign_name: this.value}, false)" style="width:240px;padding:5px 8px;border-radius:6px;border:1px dashed var(--border);font-size:11px"/>
        <input id="detail-platform-url-${l.id}" value="${esc(l.platform_url || '')}" placeholder="Reference link to the live campaign" onchange="strategistSaveLine('${l.id}', {platform_url: this.value}, false)" style="width:220px;padding:5px 8px;border-radius:6px;border:1px dashed var(--border);font-size:11px"/>
        ${l.platform_url ? `<a href="${esc(l.platform_url)}" target="_blank" style="font-size:11px;font-weight:600;color:var(--accent)">View in ${esc(l.platform || 'platform')} ↗</a>` : ''}
      </div>
    </div>

    <div style="display:flex;align-items:center;gap:8px;margin-bottom:14px">
      <label class="lbl" style="margin:0">Status</label>
      <select onchange="strategistSaveLine('${l.id}', {status: this.value})" style="padding:5px 8px;border-radius:6px;border:1px solid var(--border);font-size:12.5px;font-weight:600">
        <option value="active" ${l.status === 'active' ? 'selected' : ''}>Active</option>
        <option value="paused" ${l.status === 'paused' ? 'selected' : ''}>Paused</option>
        <option value="complete" ${l.status === 'complete' ? 'selected' : ''}>Complete</option>
      </select>
      <span style="font-size:11px;color:var(--muted)">Pausing moves this campaign to the Paused tab; switch it back to Active to pick up where you left off.</span>
    </div>

    <p style="font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:0 0 8px">This month's numbers</p>
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px">
      ${[['Clicks','actual_clicks'],['Impressions','actual_impressions'],['Conversions','actual_conversions'],['Total Visits','actual_total_visits']].map(([label, field]) => `
        <div style="padding:8px 12px;border-radius:8px;background:var(--light);border:1px solid var(--border);min-width:100px">
          <div style="font-size:9.5px;font-weight:700;text-transform:uppercase;color:var(--muted);margin-bottom:3px">${label}</div>
          <input type="number" value="${monthRow[field] ?? ''}" onchange="strategistSaveMonth('${l.id}', '${strategistCurrentMonth.toISOString().slice(0,10)}', {${field}: this.value})" style="width:80px;padding:3px 5px;border:none;background:transparent;font-family:monospace;font-size:14px;font-weight:700"/>
        </div>`).join('')}
      <div style="padding:8px 12px;border-radius:8px;background:var(--light);border:1px solid var(--border);min-width:100px">
        <div style="font-size:9.5px;font-weight:700;text-transform:uppercase;color:var(--muted);margin-bottom:3px">CTR</div>
        <div style="font-family:monospace;font-size:14px;font-weight:700">${ctr != null ? ctr.toFixed(2) + '%' : '—'}</div>
      </div>
    </div>

    <p style="font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:0 0 4px">Monthly history</p>
    <p style="font-size:10.5px;color:var(--muted);margin:0 0 8px">In-Platform is normally computed automatically (Gross × Budgeted Spend %) — the override next to it is there while we're confirming that math is right; leave it blank once it's trusted.</p>
    <div style="border:1px solid var(--border);border-radius:8px;padding:4px 12px;margin-bottom:16px;background:var(--light)">
      ${ALL_CAMPAIGN_MONTHS.filter(m => m.campaign_line_id === l.id).sort((a,b) => a.month.localeCompare(b.month)).map(m => {
        const autoInPlatform = computeInPlatformBudget(m.gross_budget, l.service_id, l.group_id);
        return `
        <div style="display:flex;align-items:center;gap:8px;font-size:12px;padding:6px 0;border-top:1px solid var(--border)">
          <span style="width:90px;color:var(--muted);font-weight:600">${esc(strategistMonthLabel(new Date(m.month + 'T00:00:00')))}</span>
          <input type="number" value="${m.gross_budget ?? ''}" onchange="strategistSaveMonth('${l.id}', '${m.month}', {gross_budget: this.value})" placeholder="Gross" style="width:90px;padding:5px 6px;border-radius:6px;border:1px solid var(--border);font-size:11.5px"/>
          <input type="number" value="${m.in_platform_override ?? ''}" onchange="strategistSaveMonth('${l.id}', '${m.month}', {in_platform_override: this.value})" placeholder="${autoInPlatform != null ? 'Auto: ' + Math.round(autoInPlatform) : 'In-Platform override'}" title="${m.in_platform_override != null ? 'Overridden — auto-calculated value is ' + (autoInPlatform != null ? '$' + Math.round(autoInPlatform) : 'unavailable') : ''}" style="width:${autoInPlatform != null ? '110px' : '130px'};padding:5px 6px;border-radius:6px;border:1px ${m.in_platform_override != null ? 'solid var(--accent)' : 'dashed var(--border)'};font-size:11.5px"/>
          <input type="number" value="${m.actual_spend ?? ''}" onchange="strategistSaveMonth('${l.id}', '${m.month}', {actual_spend: this.value})" placeholder="Actual spend" style="width:90px;padding:5px 6px;border-radius:6px;border:1px solid var(--border);font-size:11.5px"/>
          <input type="number" value="${m.actual_clicks ?? ''}" onchange="strategistSaveMonth('${l.id}', '${m.month}', {actual_clicks: this.value})" placeholder="Clicks" style="width:75px;padding:5px 6px;border-radius:6px;border:1px solid var(--border);font-size:11.5px"/>
          <input type="number" value="${m.actual_impressions ?? ''}" onchange="strategistSaveMonth('${l.id}', '${m.month}', {actual_impressions: this.value})" placeholder="Impr." style="width:85px;padding:5px 6px;border-radius:6px;border:1px solid var(--border);font-size:11.5px"/>
        </div>`;
      }).join('') || '<p style="font-size:11px;color:var(--muted);padding:6px 0">No months on record yet.</p>'}
      <button onclick="strategistAddHistoryMonth('${l.id}')" style="margin:8px 0;padding:4px 10px;border-radius:6px;border:1px solid var(--border);background:#fff;font-size:11px;cursor:pointer">+ Add a past month</button>
    </div>

    <p style="font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:0 0 6px">Goal override <span style="font-weight:400;text-transform:none;letter-spacing:0;color:var(--muted)">— ${autoGoal.value != null ? `leave blank to use the auto-calculated ${Math.round(autoGoal.value).toLocaleString()} ${autoGoal.unit}` : `required — nothing to auto-calculate from yet (no In-Platform spend entered, or no rate on file)`}</span></p>
    <input type="number" value="${l.goal_override ?? ''}" onchange="strategistSaveLine('${l.id}', {goal_override: this.value})" placeholder="${autoGoal.value != null ? Math.round(autoGoal.value) : (goal.unit === 'clicks' ? 'Clicks goal' : 'Impressions goal')}" style="width:140px;padding:6px 8px;border-radius:6px;border:1px solid var(--border);font-size:12.5px;margin-bottom:16px"/>

    <p style="font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:0 0 8px">Optimize log</p>
    ${log.map(o => `<div style="display:flex;align-items:flex-start;gap:14px;padding:8px 0;border-top:1px solid var(--border)">
      <span style="font-family:monospace;font-size:11px;color:var(--muted);width:80px;flex:none">${esc(o.entry_date)}</span>
      <span style="font-size:12.5px;flex:1">${esc(o.note)}</span>
      <span style="flex:none;display:flex;gap:8px">
        <a onclick="strategistEditLogEntry('${l.id}','${o.id}')" style="font-size:11px;font-weight:600;color:var(--accent);cursor:pointer">Edit</a>
        <a onclick="strategistDeleteLogEntry('${o.id}')" style="font-size:11px;font-weight:600;color:#EF4444;cursor:pointer">Delete</a>
      </span>
    </div>`).join('') || '<p style="font-size:12px;color:var(--muted)">No entries yet.</p>'}

    <div id="log-entry-form-${l.id}" style="margin-top:12px;display:flex;gap:8px;align-items:flex-end">
      <div>
        <label class="lbl">Date</label>
        <input type="date" id="log-date-${l.id}" value="${new Date().toISOString().slice(0,10)}" style="padding:6px 8px;border-radius:6px;border:1px solid var(--border);font-size:12px"/>
      </div>
      <div style="flex:1">
        <label class="lbl">What was changed</label>
        <input type="text" id="log-note-${l.id}" style="width:100%;padding:6px 8px;border-radius:6px;border:1px solid var(--border);font-size:12px"/>
      </div>
      <input type="hidden" id="log-edit-id-${l.id}"/>
      <button onclick="strategistSaveLogEntry('${l.id}')" style="padding:7px 14px;border-radius:6px;background:var(--accent);color:#fff;border:none;font-size:12px;font-weight:600;cursor:pointer">Add</button>
    </div>
  </div>`;
}

function strategistEditLogEntry(lineId, logId) {
  const entry = ALL_OPTIMIZE_LOG.find(o => o.id === logId);
  if (!entry) return;
  document.getElementById('log-date-' + lineId).value = entry.entry_date;
  document.getElementById('log-note-' + lineId).value = entry.note;
  document.getElementById('log-edit-id-' + lineId).value = entry.id;
}

async function strategistSaveLogEntry(lineId) {
  const date = document.getElementById('log-date-' + lineId).value;
  const note = document.getElementById('log-note-' + lineId).value.trim();
  const editId = document.getElementById('log-edit-id-' + lineId).value || null;
  if (!note) { showToast('Enter what was changed.', 'error'); return; }
  try {
    await sb('rpc/strategist_save_optimize_log', { method: 'POST', body: JSON.stringify({
      p_name: currentStrategistUser.name, p_pw: currentStrategistUser.pw,
      p_id: editId, p_campaign_line_id: lineId, p_entry_date: date, p_note: note
    }) });
    await fetchStrategistData();
    strategistSelectedLineId = lineId;
    renderStrategistDashboard();
    showToast('Optimize log saved');
  } catch(e) { showToast('Error saving log entry: ' + e.message, 'error'); }
}

async function strategistDeleteLogEntry(logId) {
  try {
    await sb('rpc/strategist_delete_optimize_log', { method: 'POST', body: JSON.stringify({
      p_name: currentStrategistUser.name, p_pw: currentStrategistUser.pw, p_id: logId
    }) });
    await fetchStrategistData();
    renderStrategistDashboard();
    showToast('Entry deleted');
  } catch(e) { showToast('Error deleting entry: ' + e.message, 'error'); }
}

function strategistLogout() {
  currentStrategistUser = null;
  showStrategistPanel(false);
  promptStrategistLogin();
}

// Silent handoff from the admin portal's "Go to Strategist Portal" link (2026-08-04,
// per Claire: "When I click the strategist link from the admin portal I have to log
// in again"). admin/index.html stashes the already-authenticated name/password into
// sessionStorage right before navigating; picked up here ONCE (cleared immediately,
// whether it works or not) so it can never be replayed by, say, opening this page
// again later in the same tab. Same plaintext-in-memory trust model this whole app
// already uses everywhere (no tokens/cookies anywhere in this project) — sessionStorage
// just carries that same value across the one page hop, cleared right after reading.
async function tryStrategistHandoffLogin() {
  let name, pw;
  try {
    name = sessionStorage.getItem('strategist_handoff_name');
    pw = sessionStorage.getItem('strategist_handoff_pw');
    sessionStorage.removeItem('strategist_handoff_name');
    sessionStorage.removeItem('strategist_handoff_pw');
  } catch(e) { return false; } // e.g. sessionStorage blocked entirely (privacy mode, unusual origin)
  if (!name || !pw) return false;
  const result = await attemptStrategistLogin(name, pw);
  if (!result.ok) return false;
  currentStrategistUser = { name, email: result.email, role: result.role, pw };
  showStrategistPanel(true);
  return true;
}

document.addEventListener('DOMContentLoaded', async () => {
  await loadStrategistRoster();
  if (await tryStrategistHandoffLogin()) return;
  promptStrategistLogin();
});
</script>
