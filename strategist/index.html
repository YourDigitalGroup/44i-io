<!DOCTYPE html>

<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>44i Strategist Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="../shared.css?v=20260813b"/>
<style>
  /* Sticky header bar (2026-08-17) -- same root cause and fix as /admin's identical
     issue found the same day: the outer Logout/Admin-link bar scrolled away with the
     rest of the page on any long Strategist view, and shared.css's `.card` has
     `overflow:hidden`, which per spec makes `.card` the containing scrollport for any
     sticky descendant -- but `.card` itself never scrolls (its height is auto, fitting
     its content; the page scrolls, not `.card`), so position:sticky bound to it just
     tracks the page scroll 1:1 instead of clamping at top:0. `.card`'s own table
     (`#strategist-table-wrap`) isn't affected by this, since it has its OWN bounded
     `overflow:auto;max-height:70vh` wrapper closer to its thead -- a real internal
     scroll container, which is why that thead's sticky already worked correctly.
     `overflow:visible` on `.card` here only affects the outer page-level scroll
     behavior, not that inner bounded wrapper. Rounding the header bar's own top
     corners replaces the corner-clipping `.card`'s overflow:hidden used to provide. */
  #strategist-card{overflow:visible}
  #strategist-header-bar{position:sticky;top:0;z-index:11;border-radius:18px 18px 0 0}
  /* scroll-margin-top for the detail panel's scrollIntoView() target (2026-08-17) --
     see fitStrategistScrollBoxes()'s comment for why this is needed. */
  #strategist-detail-panel{scroll-margin-top:calc(var(--strategist-sticky-offset, 0px) + 12px)}
</style>
</head>
<body>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<!-- STRATEGIST PANEL — scaffold only (2026-07-18). No real strategist features yet;
     this is just the same login-gated shell pattern as /admin, sharing shared.js/
     shared.css per the plan in CLAUDE.md ("Future /strategist/accounting role-based
     views are expected to land as their own paths the same way"). What strategists
     actually need to see/do is intentionally NOT decided here — that's real business-
     logic scope waiting on its own review, same as everything else parked in
     io_project_tracking.md. -->
<div id="page-strategist" style="display:none;padding-top:1px">
  <div class="card" id="strategist-card" style="max-width:1500px;margin:24px auto;padding-bottom:20px">
    <div id="strategist-header-bar" style="display:flex;justify-content:space-between;align-items:center;padding:10px 16px;border-bottom:1px solid var(--border);background:#FAFCFE">
      <div id="strategist-user-badge" style="font-size:12px;color:var(--muted)"></div>
      <div style="display:flex;align-items:center;gap:10px">
        <button id="strategist-admin-portal-link" onclick="adminPortalHandoff();location.href='../admin/index.html'" style="display:none;padding:6px 14px;border:1.5px solid var(--accent-dark);background:#fff;color:var(--accent-dark);font-weight:600;font-size:12px;cursor:pointer">Go to Admin →</button>
        <button onclick="strategistLogout()" class="btn-quiet-green">Logout</button>
      </div>
    </div>

    <div style="padding:16px 20px 0" id="strategist-content-area">
      <!-- Platform report freshness banner (2026-08-17, per Claire -- "it would be
           nice for the strategists to know when numbers were updated" for the
           platforms she manually pastes reports for). One banner, not per-platform
           badges scattered around the page -- shows all 4 platforms Claire actually
           updates, each with its own last-updated time, so a strategist can tell
           WHICH platform's numbers might be stale without needing to guess from a
           single overall "last updated" timestamp that could just reflect whichever
           platform happened to be pasted most recently. Populated by
           renderPlatformReportFreshnessBanner(), called every time
           fetchStrategistData() refreshes PLATFORM_REPORT_CACHE. -->
      <div id="strategist-report-freshness-banner" role="status" aria-live="polite" style="margin-bottom:14px;padding:9px 16px;background:var(--light);border:1px solid var(--border);border-radius:8px;font-size:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center"></div>

      <!-- Top bar: month picker + My Campaigns/All Strategists scope toggle -->
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:14px">
        <div style="display:flex;align-items:center;gap:10px">
          <button onclick="strategistShiftMonth(-1)" aria-label="Previous month" style="padding:6px 10px;border:1.5px solid var(--accent-dark);background:#fff;color:var(--accent-dark);cursor:pointer;font-size:13px">‹</button>
          <span id="strategist-month-label" style="font-size:13px;font-weight:700;color:var(--text);min-width:110px;text-align:center"></span>
          <button onclick="strategistShiftMonth(1)" aria-label="Next month" style="padding:6px 10px;border:1.5px solid var(--accent-dark);background:#fff;color:var(--accent-dark);cursor:pointer;font-size:13px">›</button>
        </div>
        <div style="display:flex;gap:10px;align-items:center;font-size:12px">
          <select id="strategist-group-filter" onchange="strategistSetGroupFilter(this.value)" style="padding:6px 14px;border-radius:999px;border:1.5px solid var(--accent-dark);color:var(--accent-dark);font-size:12px;font-weight:600;cursor:pointer">
            <option value="">All Groups</option>
          </select>
          <select id="strategist-pacing-filter" onchange="strategistSetPacingFilter(this.value)" style="padding:6px 14px;border-radius:999px;border:1.5px solid var(--accent-dark);color:var(--accent-dark);font-size:12px;font-weight:600;cursor:pointer">
            <option value="">All Pacing</option>
            <option value="risk">🔴 Risk</option>
            <option value="warn">🟡 Watch</option>
            <option value="good">🟢 Good</option>
          </select>
          <button id="strategist-scope-mine" onclick="strategistSetScope('mine')" style="padding:6px 12px;border:1.5px solid var(--accent-dark);cursor:pointer;font-weight:600">My Campaigns</button>
          <button id="strategist-scope-all" onclick="strategistSetScope('all')" style="padding:6px 12px;border:1.5px solid var(--accent-green-text);color:var(--accent-green-text);cursor:pointer;font-weight:600">All Strategists</button>
          <button onclick="strategistOpenImportForm()" style="padding:6px 14px;border-radius:7px;border:1.5px solid var(--accent-dark);background:#fff;color:var(--accent-dark);cursor:pointer;font-weight:600;font-size:12px">+ New Campaign</button>
          <button onclick="strategistOpenPasteReportForm()" style="padding:6px 14px;border-radius:7px;border:1.5px solid var(--accent-dark);background:#fff;color:var(--accent-dark);cursor:pointer;font-weight:600;font-size:12px">Paste Platform Report</button>
          <button onclick="strategistOpenBulkImportForm()" style="padding:6px 14px;border-radius:7px;border:1.5px solid var(--accent-dark);background:#fff;color:var(--accent-dark);cursor:pointer;font-weight:600;font-size:12px">Bulk Import (CSV)</button>
          <button onclick="strategistRecheckCachedReports()" style="padding:6px 14px;border:1.5px solid var(--accent-dark);background:var(--accent-dark);color:#fff;cursor:pointer;font-weight:600;font-size:12px">Re-check Cached Reports</button>
        </div>
      </div>

      <!-- Manual "+ New Campaign" import form -- for campaigns already running from the
           old IO system, ordered before this platform existed, so they don't have to
           wait on the order-insert trigger to show up here. -->
      <div id="strategist-import-form" style="display:none"></div>

      <!-- Bulk "paste a platform report" matcher -- updates many campaigns' current-
           month actuals at once, matched by campaign title, instead of opening each
           campaign one at a time. -->
      <div id="strategist-paste-report-form" style="display:none"></div>

      <!-- Bulk CSV/Sheets import -- many campaigns (and each one's month-by-month
           budgets) in one paste, instead of the "+ New Campaign" form one at a time. -->
      <div id="strategist-bulk-import-form" style="display:none"></div>

      <!-- Status tabs. role="tablist" (2026-08-18, accessibility audit) -- same
           reasoning as Admin's section tabs: this dashboard has almost no heading
           structure for a screen reader to navigate by, and this bar IS a tablist
           (one queue visible at a time), so the real ARIA pattern serves that need
           better than an unrelated parallel heading system would. -->
      <div id="strategist-status-tabs" role="tablist" aria-label="Campaign status" style="display:flex;flex-wrap:wrap;gap:8px;padding-bottom:14px;border-bottom:1px solid var(--border);margin-bottom:16px"></div>

      <!-- Campaign Setup review panel (only rendered when the Campaign Setup tab is active).
           Bounded overflow:auto;max-height:70vh (2026-08-13, per Claire -- "freeze the
           headers" here too) -- same treatment as #strategist-table-wrap below, so the
           group band sticks while scrolling a long setup queue the same way the main
           table's group banner already does. -->
      <div id="strategist-setup-panel" role="tabpanel" aria-label="Campaign Setup" style="overflow:auto;max-height:70vh"></div>

      <!-- Row detail panel — lives ABOVE the table, same convention as every edit
           form in admin/index.html (e.g. #admin-service-form sits above the
           services list it edits, not below it) -- 2026-08-06, per Claire: "have
           it work like the admin portal editors" rather than scroll-to-the-bottom. -->
      <div id="strategist-detail-panel" style="margin-bottom:16px"></div>

      <!-- Main pacing table -->
      <!-- max-height added 2026-08-12 alongside Accounting's identical fix --
           overflow-x:auto alone forces this div into being its own vertical
           scroll container too (a CSS spec quirk: setting one overflow axis
           to non-visible forces the other to compute as 'auto' as well), but
           with no height limit it never actually scrolled internally, so the
           sticky header/group row just sat frozen and never tracked the
           page's own scroll. -->
      <div id="strategist-table-wrap" role="tabpanel" aria-label="Active, Paused, and Complete campaigns" style="overflow-x:auto;overflow-y:auto;max-height:70vh"></div>
    </div>
  </div>
</div>

<!-- Read-only order-detail modal (2026-08-13) -- shared markup/render logic
     with Accounting's own copy of this same block, via shared.js's

<!-- STRATEGIST LOGIN MODAL — same shape as /admin's, scoped to strategist/super roles
     only (super included so James/Jon can log in to test this as it's built, per the
     existing "James stays a super admin for now" arrangement). -->
<div id="strategist-login-modal" role="dialog" aria-modal="true" aria-labelledby="strategist-login-title" style="position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9000;display:none;align-items:center;justify-content:center">
  <div style="background:#fff;border-radius:14px;padding:36px 32px;width:340px;box-shadow:0 24px 64px rgba(0,0,0,.2);text-align:center">
    <div aria-hidden="true" style="font-size:32px;margin-bottom:12px">🔒</div>
    <h3 id="strategist-login-title" style="font-size:16px;font-weight:700;margin-bottom:6px;color:var(--text)">Strategist Access</h3>
    <p style="font-size:12px;color:var(--muted);margin-bottom:20px">Select your name and enter your password</p>
    <select id="strategist-name-select" style="width:100%;padding:10px 12px;border-radius:8px;border:1.5px solid var(--accent-dark);color:var(--accent-dark);font-size:14px;text-align:center;margin-bottom:10px;font-family:inherit;background:#fff">
      <option value="">— Select your name —</option>
    </select>
    <input type="password" id="strategist-pw-input" placeholder="Password" onkeydown="if(event.key==='Enter')checkStrategistPw()" style="width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--border);font-size:14px;text-align:center;letter-spacing:.2em;margin-bottom:12px"/>
    <div id="strategist-pw-error" style="display:none;color:#EF4444;font-size:12px;margin-bottom:10px">Incorrect password. Please try again.</div>
    <div style="display:flex;gap:9px">
      <button onclick="checkStrategistPw()" style="flex:1;padding:10px;border-radius:8px;background:var(--accent-dark);color:#fff;border:none;font-size:13px;font-weight:600;cursor:pointer">Enter</button>
    </div>
  </div>
</div>

<script src="../shared.js?v=20260813b"></script>
<script>
// Same "don't hardcode a roster" pattern as /admin's login (see that file's 2026-07-18
// note on LOGIN_ROSTER) — populated from the shared get_login_roster RPC, filtered
// client-side to the roles that belong on this specific portal.
let currentStrategistUser = null; // {name, email, role, pw}

async function loadStrategistRoster() {
  const sel = document.getElementById('strategist-name-select');
  let roster = [];
  try {
    roster = await sb('rpc/get_login_roster', { method: 'POST', body: JSON.stringify({}) }) || [];
  } catch(e) {
    console.warn('Could not load login roster:', e.message);
  }
  const eligible = roster.filter(u => u.role === 'strategist' || u.role === 'super');
  sel.innerHTML = '<option value="">— Select your name —</option>' +
    eligible.map(u => `<option value="${esc(u.name)}">${esc(u.name)}</option>`).join('');
}

function promptStrategistLogin() {
  document.getElementById('strategist-login-modal').style.display = 'flex';
  document.getElementById('strategist-name-select').value = '';
  document.getElementById('strategist-pw-input').value = '';
  document.getElementById('strategist-pw-error').style.display = 'none';
}

// Pulled out of checkStrategistPw() (2026-08-04) so the same real login check can
// also be used by the silent admin->strategist handoff below, not just the modal's
// own submit button. Returns {ok, role, email} on success or {ok:false, error} —
// never throws, so both callers can just check `.ok`.
async function attemptStrategistLogin(name, pw) {
  if (!name) return { ok: false, error: 'Please select your name.' };
  let row;
  try {
    const res = await sb('rpc/admin_login', { method:'POST', body: JSON.stringify({ p_name: name, p_pw: pw }) });
    row = Array.isArray(res) ? res[0] : res;
  } catch(e) {
    return { ok: false, error: 'Could not reach the login service. Check your connection and try again.' };
  }
  if (!row || !row.role) return { ok: false, error: 'Incorrect password. Please try again.' };
  if (row.role !== 'strategist' && row.role !== 'super') {
    return { ok: false, error: 'This account isn\'t set up for the Strategist portal.' };
  }
  return { ok: true, role: row.role, email: row.email || '' };
}

async function checkStrategistPw() {
  const name = document.getElementById('strategist-name-select').value;
  const pw = document.getElementById('strategist-pw-input').value;
  const errEl = document.getElementById('strategist-pw-error');
  const result = await attemptStrategistLogin(name, pw);
  if (result.ok) {
    currentStrategistUser = { name, email: result.email, role: result.role, pw };
    document.getElementById('strategist-login-modal').style.display = 'none';
    showStrategistPanel(true);
  } else {
    errEl.textContent = result.error;
    errEl.style.display = 'block';
    document.getElementById('strategist-pw-input').value = '';
    if (result.error.includes('select your name')) return;
    document.getElementById('strategist-pw-input').focus();
  }
}

function showStrategistPanel(show) {
  document.getElementById('page-strategist').style.display = show ? 'block' : 'none';
  if (show && currentStrategistUser) {
    // Default scope to "All Strategists" for a super admin (2026-08-07, per Claire) —
    // a super typically has no campaigns of their own assigned, so "My Campaigns"
    // (the module-level default for everyone else) would just start them on an
    // always-empty view. A real strategist still starts on "My Campaigns" as before.
    if (currentStrategistUser.role === 'super') strategistScope = 'all';
    const badge = document.getElementById('strategist-user-badge');
    const roleLabel = currentStrategistUser.role === 'super' ? 'Super Admin' : 'Strategist';
    badge.innerHTML = `<span style="display:inline-flex;align-items:center;gap:6px"><span style="width:8px;height:8px;border-radius:50%;background:#8B5CF6"></span><strong style="color:var(--text)">${esc(currentStrategistUser.name)}</strong> <span style="color:var(--muted)">— ${roleLabel}</span></span>`;
    // Both strategist and super can log into /admin now (2026-08-04) — a strategist
    // sees Orders there, a super sees everything — so this link makes sense either way.
    const adminLink = document.getElementById('strategist-admin-portal-link');
    if (adminLink) adminLink.style.display = 'inline-block';
    loadStrategistDashboard();
  }
}

// Reciprocal handoff to admin/index.html's own tryAdminHandoffLogin() (2026-08-04,
// per Claire, symmetric with the admin->strategist handoff built earlier the same
// day) — same one-time sessionStorage pattern, cleared on the other side right after
// being read, whether it works or not.
function adminPortalHandoff() {
  if (!currentStrategistUser) return;
  try {
    sessionStorage.setItem('admin_handoff_name', currentStrategistUser.name);
    sessionStorage.setItem('admin_handoff_pw', currentStrategistUser.pw);
  } catch(e) { /* sessionStorage blocked -- the link's normal navigation still works, just prompts for login again */ }
}

// ══════════════════════════════════════════════════════════════════════════
// STRATEGIST DASHBOARD (2026-08-03) — v1 framework replacing the concept mockup.
// Every mechanic below matches a decision already confirmed with Claire/the
// strategist team (see io_project_tracking.md's STRATEGIST PORTAL section and
// this session's implementation plan). Not built here, deliberately: platform-
// report API automation, ad-group/keyword breakdown detail, and importing
// pre-existing campaigns — all confirmed as their own later phases.
// ══════════════════════════════════════════════════════════════════════════

let ALL_CAMPAIGN_LINES = [];
let ALL_CAMPAIGN_MONTHS = [];
let ALL_OPTIMIZE_LOG = [];
let ALL_STATUS_HISTORY = [];
let ALL_STRATEGIST_CLIENTS = []; // {id, name, group_id, group_name} — for the "+ New Campaign" import picker
let PLATFORM_CPM_RATES = { base: {}, group: {}, pairing: {} }; // service_id -> $CPM, group_id|service_id -> $CPM, and (offline-visits/addl-targeting pairing) service_id -> $CPM
// Same base+group-override shape as PLATFORM_CPM_RATES, for the two new rate
// fields added 2026-08-10 to plug SEM's missing In-Platform Budget/Goal
// formula (services.retail_cpm is null for SEM -- there was no formula at
// all, just a manual override every month).
let IN_PLATFORM_PCT_RATES = { base: {}, group: {} }; // % of Gross Budget, used when a service has no retail_cpm
let IN_PLATFORM_TIERS = {}; // service_id -> [{ max, in_platform_pct }, ...] sorted ascending -- e.g. SEM (2026-08-13, mirrors ACCOUNTING_CUT_TIERS' shape but kept as its own column since it must never carry cut_pct, which stays accounting/admin-only)
let IN_PLATFORM_PCT_FORCE = { group: {} }; // group|service_id -> true when that group's in_platform_pct is flagged to beat the spend tier outright (2026-08-25, MS Farm Bureau)
let CPC_RATES = { base: {}, group: {} }; // { low, high } $ CPC, used for a clicks-based service's Goal range
let PLATFORM_REPORT_CACHE = {}; // platform -> { report_month, rows: [{title, data}], updated_at } -- last paste per platform, overwritten each time
// The 4 platforms Claire currently pastes manual reports for (2026-08-17, per
// Claire: "the only ones I update currently are Google, Facebook, Simpli.fi, and
// The Trade Desk"). Fixed, ordered list rather than "whatever's in the cache" --
// the freshness banner always shows all 4 in the same order, including any that
// haven't been pasted at all yet (a strategist should see "not yet uploaded" for
// one of these, not have it silently missing from the banner).
const PLATFORM_REPORT_FRESHNESS_PLATFORMS = ['Google Ads', 'Facebook Ads', 'Simpli.fi', 'The Trade Desk'];
let strategistScope = 'mine';               // 'mine' | 'all'
let strategistGroupFilter = '';              // '' = all groups, else a group_name
let strategistPacingFilter = '';             // '' = all, else 'good' | 'warn' | 'risk' -- worse of spend/perf pacing
let strategistStatusTab = 'pending';        // pending | active | paused | complete
let strategistCurrentMonth = null;          // Date, always day 1
let strategistSelectedLineId = null;

const PACING_THRESHOLDS = { good: 90, warn: 70 }; // >=90 good, 70-89.99 warn, <70 risk — Claire's confirmed spreadsheet rule

// The real platform set confirmed for this project (report-automation priority order:
// Facebook → Simpli.fi → Google Ads → The Trade Desk → StackAdapt). A dropdown instead
// of free text (2026-08-04, per Claire) — but "Other…" keeps this from being a hard
// wall if a campaign genuinely runs somewhere else.
const PLATFORM_OPTIONS = ['Amazon DSP', 'Disney+ / HULU', 'Facebook Ads', 'Frequence', 'GBP', 'Google Ads', 'Grade.us', 'LinkedIn Ads', 'Local Incite', 'Simpli.fi', 'Snapchat Ads', 'StackAdapt', 'The Trade Desk', 'Yext'];

// "This month's numbers" tiles, one set per platform (2026-08-06, per Claire: "these
// are the column headers that I currently have for each platform in my pacing
// spreadsheet") -- each platform reports a genuinely different set of metrics, so
// showing the same generic 4 tiles for every platform either hid real data (Simpli.fi's
// pacing %s) or showed fields a platform never reports at all. Falls back to the
// original generic set for StackAdapt/Other/no platform selected yet.
const STRATEGIST_PLATFORM_METRIC_TILES = {
  'Simpli.fi': [
    ['actual_impressions', 'Month To Date Impr.'],
    ['yesterday_impr_pct', 'Yesterday Impr. %'],
    ['actual_spend', 'Month To Date Spend'],
    ['mtd_budget_pacing_pct', 'Month To Date Budget Pacing'],
    ['yesterday_spend', 'Yesterday Spend'],
    ['yesterday_spend_pct', 'Yesterday Spend %'],
    ['campaign_to_date_impr_pacing_pct', 'Campaign To Date Impr. Pacing'],
    ['campaign_to_date_budget_pacing_pct', 'Campaign To Date Budget Pacing'],
  ],
  'Google Ads': [
    ['actual_clicks', 'Clicks'],
    ['actual_impressions', 'Impr.'],
    ['ctr', 'CTR'],
    ['avg_cpm', 'Avg. CPM'],
    ['avg_cpc', 'Avg. CPC'],
    ['actual_spend', 'Cost'],
  ],
  'Facebook Ads': [
    ['actual_impressions', 'Impr.'],
    ['actual_spend', 'Cost $'],
  ],
  'The Trade Desk': [
    ['actual_impressions', 'Impr.'],
    ['actual_spend', 'Cost $'],
  ],
};
const STRATEGIST_DEFAULT_METRIC_TILES = [
  ['actual_clicks', 'Clicks'], ['actual_impressions', 'Impressions'],
  ['actual_conversions', 'Conversions'], ['actual_total_visits', 'Total Visits'],
];

// Renders a platform <select> + a hidden "Other" text input that reveals itself when
// either "Other…" is picked or the current value isn't one of the known platforms (so
// an existing custom value already saved on a campaign is never silently dropped).
// `baseId` becomes both the select's id and, with "-other" appended, the fallback
// text input's id — strategistReadPlatformValue(baseId) below resolves whichever one
// is actually in effect.
function strategistPlatformSelectHtml(baseId, currentValue, selectWidth) {
  const isKnown = PLATFORM_OPTIONS.includes(currentValue);
  const isOther = currentValue && !isKnown;
  return `<select id="${baseId}" onchange="strategistPlatformSelectChanged('${baseId}')" style="width:${selectWidth};padding:6px 8px;border-radius:999px;border:1.5px solid var(--accent-dark);color:var(--accent-dark);font-size:12.5px">
    <option value="">— Select —</option>
    ${PLATFORM_OPTIONS.map(p => `<option value="${esc(p)}" ${p === currentValue ? 'selected' : ''}>${esc(p)}</option>`).join('')}
    <option value="__other__" ${isOther ? 'selected' : ''}>Other…</option>
  </select>

}

function strategistPlatformSelectChanged(baseId) {
  const sel = document.getElementById(baseId);
  const other = document.getElementById(baseId + '-other');
  if (!sel || !other) return;
  other.style.display = sel.value === '__other__' ? 'inline-block' : 'none';
  if (sel.value === '__other__') other.focus();
}

function strategistReadPlatformValue(baseId) {
  const sel = document.getElementById(baseId);
  if (!sel) return '';
  if (sel.value === '__other__') return (document.getElementById(baseId + '-other')?.value || '').trim();
  return sel.value;
}

function strategistMonthKey(d) {
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
}
function strategistMonthLabel(d) {
  return d.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
}
function strategistShiftMonth(delta) {
  strategistCurrentMonth.setMonth(strategistCurrentMonth.getMonth() + delta);
  renderStrategistDashboard();
}
function strategistFormatFlightDate(dateStr) {
  if (!dateStr) return null;
  // 2-digit year (2026-08-06, per Claire: rows are getting too tall once there are
  // a few hundred campaigns) -- "Jun 1, 26" instead of "Jun 1, 2026". Spaces within
  // ONE date are non-breaking (found live the same day, per Claire: the year was
  // wrapping onto its own third line whenever the second date was long) -- the
  // narrow Flight column can still wrap the range between the two dates (at the
  // "–"), it just can't wrap in the middle of a single date anymore.
  return new Date(dateStr + 'T00:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: '2-digit' }).replace(/ /g, ' ');
}
// Returns HTML, not plain text -- callers must NOT wrap this in esc() (safe: s/e
// only ever come from Date.toLocaleDateString on our own flight_start/flight_end
// values, never free-typed text, so there's nothing here to escape).
function strategistFormatFlightRange(start, end) {
  const s = strategistFormatFlightDate(start), e = strategistFormatFlightDate(end);
  if (!s && !e) return '—';
  // "Ongoing" for a null end date (2026-08-12, per Claire: "update the
  // strategist portal to match the accounting portal for ongoing campaigns")
  // -- Accounting's own accountingFormatFlightRange already says "Ongoing"
  // explicitly; this used to fall back to a bare dash with nothing after it.
  // Real bug found live (2026-08-10, Claire): once a range is long enough to wrap,
  // the dash itself could end up alone on its own line -- the space BEFORE it was
  // breakable, so the browser had two valid wrap points ("date1 / – date2" and
  // "date1 – / date2") and sometimes picked the one that strands the dash. A
  // non-breaking space after the dash was meant to fix this by gluing it to the
  // end date, but that alone wasn't enough (found live again, 2026-08-11, Claire
  // -- screenshots showing 3-line wraps): an en dash carries its OWN line-break
  // opportunity in the Unicode line-breaking algorithm, independent of the
  // whitespace around it, so browsers can still break immediately after "–" even
  // though a non-breaking space follows it. Wrapping "– end-date" in its own
  // white-space:nowrap span removes every break point inside that chunk
  // (including the dash's own), leaving exactly one valid break -- right after
  // the start date, in the normal (breakable) space between the two chunks.
  return `${s || '—'} <span style="white-space:nowrap">– ${e || 'Ongoing'}</span>`;
}
function strategistSetScope(scope) {
  strategistScope = scope;
  strategistSelectedLineId = null;
  renderStrategistDashboard();
}
// Closes any open detail panel too (2026-08-11, per Claire) -- same reasoning as
// strategistSetStatusTab just below: changing the filter changes what's even in
// the table, so a stale-open panel for a now-filtered-out line is confusing.
function strategistSetGroupFilter(groupName) {
  strategistGroupFilter = groupName;
  strategistSelectedLineId = null;
  renderStrategistDashboard();
}
function strategistSetPacingFilter(segment) {
  strategistPacingFilter = segment;
  strategistSelectedLineId = null;
  renderStrategistDashboard();
}
function strategistSetStatusTab(tab) {
  strategistStatusTab = tab;
  strategistSelectedLineId = null;
  renderStrategistDashboard();
}

  const filtered = search ? ALL_STRATEGIST_CLIENTS.filter(c => c.name.toLowerCase().includes(search)) : ALL_STRATEGIST_CLIENTS;
  sel.innerHTML = '<option value="">— Select —</option>' +

  if (filtered.some(c => c.id === currentValue)) sel.value = currentValue;

// Agent/County backfill for a multi-agent client (2026-08-20, per Claire).
// Not scoped by "submitting AE" the way the real IO form's own picker is --
// a strategist backfilling old business already knows which agent/county
// they mean, so this shows every registered one for the client rather than
// cascading county -> agent the way an AE's live submission does.
async function strategistImportClientChanged() {
  const sel = document.getElementById('import-client');
  const wrap = document.getElementById('import-agent-county-wrap');
  const isMultiAgent = sel.selectedOptions[0]?.dataset.multiAgent === '1';
  if (!isMultiAgent) { wrap.style.display = 'none'; return; }
  const clientId = sel.value;
  const countySel = document.getElementById('import-county');
  const agentSel = document.getElementById('import-agent');
  countySel.innerHTML = '<option value="">Loading…</option>';
  agentSel.innerHTML = '<option value="">Loading…</option>';
  wrap.style.display = 'block';
  try {
    const [counties, agents] = await Promise.all([
      sb('rpc/get_client_counties', { method: 'POST', body: JSON.stringify({ p_client_id: clientId }) }),
      sb('rpc/get_client_agents', { method: 'POST', body: JSON.stringify({ p_client_id: clientId }) }),
    ]);
    countySel.innerHTML = '<option value="">— Select —</option>' + (counties || []).map(c => `<option value="${esc(c.name)}">${esc(c.name)}</option>`).join('');
    agentSel.innerHTML = '<option value="">— Select —</option>' + (agents || []).map(a => `<option value="${esc(a.name)}">${esc(a.name)}</option>`).join('');
  } catch (e) {
    countySel.innerHTML = '<option value="">Error loading</option>';
    agentSel.innerHTML = '<option value="">Error loading</option>';
    console.warn('Could not load agents/counties for this client:', e.message);
  }
}

async function strategistSubmitImport() {
  const clientSel = document.getElementById('import-client');
  const clientId = clientSel.value;
  const groupId = clientSel.selectedOptions[0]?.dataset.groupId || null;
  const serviceSel = document.getElementById('import-service');
  const seoTrackMatch = /^__seo_track_(\d+)__$/.exec(serviceSel.value);
  const seoTrack = seoTrackMatch ? getSeoTrackingOnlyTactics()[Number(seoTrackMatch[1])] : null;
  const serviceId = seoTrack ? seoTrack.serviceId : serviceSel.value;
  const serviceLabel = seoTrack ? seoTrack.tacticLabel : (serviceSel.selectedOptions[0]?.textContent || '');
  const variantEl = document.getElementById('import-tactic-variant');
  const tacticLabel = seoTrack ? seoTrack.tacticLabel : ((variantEl && variantEl.value) ? variantEl.value : serviceLabel);
  const platform = strategistReadPlatformValue('import-platform');
  const status = document.getElementById('import-status').value;
  const flightStart = document.getElementById('import-flight-start').value || null;
  const flightEnd = document.getElementById('import-flight-end').value || null;
  const grossBudget = document.getElementById('import-gross-budget').value;
  const platformCampaignName = document.getElementById('import-platform-campaign-name').value.trim();
  const hasOfflineVisits = document.getElementById('import-has-offline-visits').checked;
  const hasAddlTargeting = document.getElementById('import-has-addl-targeting').checked;
  const isSplit = document.getElementById('import-split-toggle').checked;
  // Only meaningful (and only shown) while Status is Pending -- same
  // strategistReadSetupBlockers() reading pattern the real Setup panel uses,
  // just against #import-setup-blocker instead of a real line id's own container.
  const setupBlockers = [...document.querySelectorAll('#import-setup-blocker .setup-blocker-cb:checked')].map(el => el.value);
  const setupNotes = document.getElementById('import-setup-notes').value.trim();
  const isMultiAgent = document.getElementById('import-agent-county-wrap').style.display !== 'none';
  const agentName = isMultiAgent ? document.getElementById('import-agent').value : null;
  const county = isMultiAgent ? document.getElementById('import-county').value : null;

  if (!clientId || !serviceId) { showToast('Pick a client and a tactic.', 'error'); return; }
  if (isMultiAgent && (!agentName || !county)) { showToast('This is a multi-agent client — pick both an Agent and a County.', 'error'); return; }

  // Same real scenario as the Setup panel's own split form: one price sold across
  // several regions/segments. Read+validate BEFORE creating anything, same as
  // strategistSaveSplit() does, so a bad split never leaves a half-created campaign
  // behind.
  let splits = null;
  if (isSplit) {
    const labels = [...document.querySelectorAll('.split-label-import')].map(el => el.value.trim());
    const amounts = [...document.querySelectorAll('.split-amount-import')].map(el => el.value);
    const titles = [...document.querySelectorAll('.split-title-import')].map(el => el.value.trim());
    splits = labels.map((label, i) => ({ label, amount: amounts[i], title: titles[i] })).filter(s => s.label && s.amount !== '');
    if (splits.length < 2) { showToast('Enter a label and amount for at least 2 splits.', 'error'); return; }
  }

  try {
    const newId = await sb('rpc/strategist_save_campaign_line', { method: 'POST', body: JSON.stringify({
      p_name: currentStrategistUser.name, p_pw: currentStrategistUser.pw, p_id: null,
      p_data: {
        client_id: clientId, group_id: groupId, service_id: serviceId, tactic_label: tacticLabel,
        platform: platform || null, platform_campaign_name: isSplit ? null : (platformCampaignName || null),
        flight_start: flightStart, flight_end: flightEnd,
        status, assigned_strategist: currentStrategistUser.name, has_offline_visits: hasOfflineVisits,
        has_addl_targeting: hasAddlTargeting,
        agent_name: agentName, county,
        ...(status === 'pending' ? { setup_blocker: setupBlockers.length ? setupBlockers : null, setup_notes: setupNotes || null } : {})
      }
    }) });
    if (isSplit) {
      // Seed one budget row (required before strategist_split_campaign_line can run,
      // same "earliest row" convention it already uses) with the FIRST split's own
      // amount -- the split RPC below overwrites this line with that exact same
      // value anyway, so seeding it directly rather than the generic grossBudget
      // field avoids one pointless intermediate write.
      await sb('rpc/strategist_save_campaign_month', { method: 'POST', body: JSON.stringify({
        p_name: currentStrategistUser.name, p_pw: currentStrategistUser.pw,
        p_campaign_line_id: newId, p_month: new Date().toISOString().slice(0,10),
        p_data: { gross_budget: parseFloat(splits[0].amount) }
      }) });
      await sb('rpc/strategist_split_campaign_line', { method: 'POST', body: JSON.stringify({
        p_name: currentStrategistUser.name, p_pw: currentStrategistUser.pw,
        p_line_id: newId, p_splits: splits.map(s => ({ label: s.label, amount: parseFloat(s.amount), platform_campaign_name: s.title || null }))
      }) });
    } else if (grossBudget) {
      await sb('rpc/strategist_save_campaign_month', { method: 'POST', body: JSON.stringify({
        p_name: currentStrategistUser.name, p_pw: currentStrategistUser.pw,
        p_campaign_line_id: newId, p_month: new Date().toISOString().slice(0,10),

    }
    document.getElementById('strategist-import-form').style.display = 'none';
    document.getElementById('strategist-import-form').innerHTML = '';
    strategistStatusTab = status;
    await fetchStrategistData();
    await strategistApplyCachedReportIfMatch(newId);
    renderStrategistDashboard();
    showToast(isSplit ? `Campaign imported and split into ${splits.length}.` : 'Campaign imported!');
  } catch(e) { showToast('Error importing campaign: ' + e.message, 'error'); }
}

// Claire: "Having to go into each campaign is not realistic. Right now my spreadsheet
// looks for the unique campaign title to pull the necessary information." Her real
// workflow pastes an entire platform export at once and matches EVERY row to the right
// campaign by its title (a VLOOKUP against the Layout tab) — not one campaign at a
// time. This mirrors that exact mechanic: paste a block of rows (Campaign Name, Spend,
// Clicks, Impressions — tab- or comma-separated, one campaign per line, matching the
// generic shape every platform's export ultimately reduces to for this dashboard's
// purposes), match each row's title against campaign_lines.platform_campaign_name
// (case/whitespace-insensitive), and update the CURRENT month's actuals for every
// match in one pass — no need to click into each row individually.
// Per-platform header synonyms (2026-08-04, per Claire: "I will need a way to do
// each individually because their formats are different. Simpli.fi. Google.
// Facebook. The TradeDesk"). Rather than hardcode each platform's EXACT real export
// column order (risky to get wrong, and it can change), this reads whatever header
// row is actually pasted and matches each column NAME against known synonyms —
// works with the real export as-is, no manual reformatting, regardless of which
// platform or which order that platform happens to put its columns in.
// Platform-specific metrics added 2026-08-06 (Claire: "all the data is included in
// the reports that I import for each platform already") -- more specific synonyms
// listed alongside the generic ones so a verbose header (Simpli.fi's own real
// export has "spend"/"impr" appearing in several different columns) still resolves
// to the RIGHT one; see detectReportColumnMap()'s longest-match-wins rule below.
const REPORT_COLUMN_SYNONYMS = {
  actual_spend: ['month to date spend', 'spend', 'cost', 'amount spent', 'cost ($)'],
  actual_clicks: ['clicks', 'link clicks'],
  actual_impressions: ['month to date impressions', 'impr', 'impressions', 'impr.'],
  actual_conversions: ['conversions', 'results', 'weighted actions'],
  ctr: ['ctr'],
  avg_cpm: ['avg. cpm', 'avg cpm'],
  avg_cpc: ['avg. cpc', 'avg cpc'],
  yesterday_spend_pct: ['yesterday spend percentage', 'yesterday spend %'],
  yesterday_spend: ['yesterday spend'],
  yesterday_impr_pct: ['yesterday impression percentage', 'yesterday impr. %', 'yesterday impr %'],
  mtd_budget_pacing_pct: ['month-to-date budget pacing', 'month to date budget pacing'],
  campaign_to_date_impr_pacing_pct: ['campaign to date impressions pacing', 'campaign to date impr. pacing'],
  campaign_to_date_budget_pacing_pct: ['campaign to date budget pacing'],
};

function parsePastedReportRows(text) {
  return text.trim().split(/\r?\n/).filter(line => line.trim()).map(line =>
    (line.includes('\t') ? line.split('\t') : line.split(',')).map(c => c.trim())
  );
}

// Maps a header row's column names to the metric fields they represent, using
// REPORT_COLUMN_SYNONYMS above. Returns null if the first row doesn't look like a
// header at all (its 2nd column parses as a real number) — falls back to the
// original fixed Spend/Clicks/Impressions column order in that case.
function detectReportColumnMap(headerRow) {
  if (!headerRow || headerRow.length < 2 || !isNaN(parseFloat(headerRow[1]))) return null;
  const map = {};
  headerRow.forEach((label, i) => {
    if (i === 0) return; // column 0 is always the campaign title
    const lower = label.toLowerCase();
    // Two disambiguation rules, both found live against real exports 2026-08-06:
    // (1) within THIS column, if more than one field's synonym matches its text
    // (e.g. "Yesterday Spend Percentage" contains both "yesterday spend" and
    // "yesterday spend percentage"), the LONGEST/most-specific synonym wins, not
    // just whichever field happened to be checked first.
    let bestField = null, bestSynonymLength = 0;
    for (const [field, synonyms] of Object.entries(REPORT_COLUMN_SYNONYMS)) {
      for (const synonym of synonyms) {
        if (lower.includes(synonym) && synonym.length > bestSynonymLength) {
          bestField = field; bestSynonymLength = synonym.length;
        }
      }
    }
    // (2) across columns, the FIRST matching column wins a field, not the last --
    // "Month To Date Spend" must win over "Yesterday Spend" for actual_spend since
    // it comes first in a real Simpli.fi export.
    if (bestField && map[bestField] === undefined) map[bestField] = i;
  });
  return map;
}

async function strategistMatchPastedReport() {
  const raw = document.getElementById('paste-report-text').value;
  if (!raw.trim()) { showToast('Paste a report first.', 'error'); return; }
  const platform = strategistReadPlatformValue('paste-report-platform');
  if (!platform) { showToast('Pick which platform this report is from.', 'error'); return; }
  const reportMonthValue = document.getElementById('paste-report-month').value; // "YYYY-MM"
  if (!reportMonthValue) { showToast('Pick which month this report is for.', 'error'); return; }

  let rows = parsePastedReportRows(raw);
  const columnMap = detectReportColumnMap(rows[0]);
  // A real header row (matched above) never itself represents a campaign -- drop it.
  if (columnMap) rows = rows.slice(1);
  // No header detected -- fall back to the original fixed order.
  const fallbackMap = { actual_spend: 1, actual_clicks: 2, actual_impressions: 3 };
  const effectiveMap = columnMap && Object.keys(columnMap).length ? columnMap : fallbackMap;

  // Only match against THIS platform's own campaigns -- a title that happens to
  // match on the wrong platform would silently overwrite the wrong campaign's numbers.
  const byTitle = {};
  ALL_CAMPAIGN_LINES.forEach(l => {
    if (l.platform_campaign_name && l.platform === platform) byTitle[l.platform_campaign_name.trim().toLowerCase()] = l;
  });

  // The report's OWN chosen month, not whatever month happens to be selected in the
  // top bar (2026-08-04, per Claire: "we need a way to indicate what the date range
  // is for the report so it applies to the correct month") -- avoids silently filing
  // a report against the wrong month just because the top bar wasn't switched first.
  const monthStr = reportMonthValue + '-01';
  const matched = [], unmatched = [];
  // Every row with a title gets cached, whether or not it matches an EXISTING
  // campaign right now (2026-08-06, per Claire: "keeps the data until it is
  // updated... the autofill should start when there is a campaign title to
  // reference") -- a title that doesn't match anything today might belong to a
  // campaign added tomorrow, and that campaign should pick up these actuals the
  // moment it's given this same title, not wait for the next paste.
  const cacheRows = [];
  for (const cols of rows) {
    const title = (cols[0] || '').trim();
    if (!title) continue;
    const data = {};
    Object.entries(effectiveMap).forEach(([field, idx]) => {
      // Real exports use thousands-comma ("1,291"), dollar-sign ("$1.81"), and
      // percent-sign ("10.2%", Google Ads' own CTR column) formatting -- Postgres
      // rejects all three as invalid numeric syntax (22P02), found live 2026-08-06
      // against real Trade Desk/Simpli.fi/Google Ads reports. Strip before saving.
      if (cols[idx] !== undefined && cols[idx] !== '') data[field] = cols[idx].replace(/[$,%]/g, '').trim();
    });
    cacheRows.push({ title, data });
    const line = byTitle[title.toLowerCase()];
    if (!line) { unmatched.push(title); continue; }
    try {
      await sb('rpc/strategist_save_campaign_month', { method: 'POST', body: JSON.stringify({
        p_name: currentStrategistUser.name, p_pw: currentStrategistUser.pw,
        p_campaign_line_id: line.id, p_month: monthStr, p_data: data
      }) });
      matched.push(`${line.client_name || ''} / ${line.tactic_label || line.service_id}`.trim());
    } catch(e) {
      unmatched.push(title + ' (save failed: ' + e.message + ')');
    }
  }

  // Overwrite whatever was cached for this platform before -- Claire doesn't keep
  // report history, just the latest paste per platform, same as her own workflow
  // (pastes twice a week, never needs to look back further than that).
  try {
    await sb('rpc/strategist_save_platform_report_cache', { method: 'POST', body: JSON.stringify({
      p_name: currentStrategistUser.name, p_pw: currentStrategistUser.pw,
      p_platform: platform, p_month: monthStr, p_rows: cacheRows
    }) });
  } catch(e) {
    console.warn('Could not cache platform report for auto-fill:', e.message);
  }

  await fetchStrategistData();
  renderStrategistDashboard();

  const resultsEl = document.getElementById('paste-report-results');
  if (resultsEl) {
    resultsEl.innerHTML = `
      <p style="font-size:12px;color:#166534;font-weight:600;margin:0 0 4px">${matched.length} campaign${matched.length === 1 ? '' : 's'} updated${matched.length ? ': ' + matched.map(esc).join(', ') : ''}</p>
      ${unmatched.length ? `<p style="font-size:12px;color:#B91C1C;font-weight:600;margin:0">${unmatched.length} row${unmatched.length === 1 ? '' : 's'} didn't match any ${esc(platform)} campaign — check the exact title on the campaign itself: ${unmatched.map(esc).join(', ')}</p>` : ''}
    `;
  }
  showToast(matched.length ? `${matched.length} campaign(s) updated` : 'No matches found');
}
