  return ` <span title="Retail CPM overridden to $${Number(line.retail_cpm_override).toFixed(2)}" style="display:inline-block;padding:1px 6px;margin-left:2px;border-radius:999px;background:var(--light);border:1px solid var(--accent);color:var(--accent-dark);font-size:9.5px;font-weight:700;vertical-align:middle;white-space:nowrap">CPM $${Number(line.retail_cpm_override).toFixed(2)}</span>`;
}

// Retail CPM Override field, shared by the Setup panel and the Detail panel
// (2026-08-25, per Claire -- "can we also add it to the campaign setup?" --
// it was Detail-panel-only at first). `afterSaveFn` is called by name (a
// plain string, not a function reference) since this markup is generated
// inside a template literal well before it's inserted into the DOM --
// pass 'renderStrategistDetailPanel' from the Detail panel,
// 'renderStrategistDashboard' from the Setup panel (which has no single
// line-scoped re-render of its own to call instead).
function retailCpmOverrideFieldHtml(l, afterSaveFn) {
  if (l.service_id === 'sem-bp') return '';
  const standardCpm = strategistEffectiveRetailCpm(l.service_id, l.client_id, l.group_id, null);
  const helpText = `The AE's actual sold rate, if different from the standard ${standardCpm != null ? '$' + Number(standardCpm).toFixed(2) : 'rate'} -- changes Goal and In-Platform Budget to match.`;
  // JS-string-escape (NOT esc()) for use inside an inline onclick's own JS
  // string literal -- the browser HTML-decodes an attribute's value BEFORE
  // handing it to the JS engine, so an esc()'d apostrophe (&#39;) would
  // decode right back into a raw ' and still break out of the string early.
  const helpTextJs = helpText.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
  return `<div style="margin:-6px 0 14px;font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:8px">
    <span>Retail CPM Override
      <button type="button" onclick="event.stopPropagation();showToast('${helpTextJs}', 'info')" title="${esc(helpText)}" aria-label="What is Retail CPM Override?" style="display:inline-flex;cursor:help;border:none;background:none;padding:0;margin:0;font-size:12px;color:var(--muted);vertical-align:middle">ⓘ</button>:</span>
    <input type="number" step="0.01" min="0" value="${l.retail_cpm_override ?? ''}"
      placeholder="${standardCpm != null ? 'Standard: $' + Number(standardCpm).toFixed(2) : 'No standard rate set'}"
      onchange="event.stopPropagation();strategistSaveLine('${l.id}', {retail_cpm_override: this.value}, false).then(${afterSaveFn})"
      aria-label="Retail CPM override"
      style="width:110px;padding:3px 6px;border-radius:6px;border:1px ${l.retail_cpm_override != null ? 'solid var(--accent)' : 'dashed var(--border)'};font-size:11.5px"/>
  </div>`;
}

// A handful of catalog services are actually 2-3 different tactics sharing one
// price/catalog row (e.g. "Geofencing or 1st Party Addressable" covers both
// Geofencing and Addressable: 1st Party) -- which one a given campaign is is
// only ever noted in the IO's free-text notes, so it can't be auto-detected.
// A fixed dropdown (services.tactic_variants) lets the strategist record the
// exact answer without free-typing/typos. Returns null for every other service.
function strategistTacticVariantOptions(line) {
  const svc = CATALOG_ROWS[line.service_id];
  return (svc && Array.isArray(svc.tactic_variants) && svc.tactic_variants.length) ? svc.tactic_variants : null;
}

// Goal override moved from campaign_lines to campaign_months (2026-08-06, per
// Claire: "It should be clear month by month what the strategists are planning to
// do... it can still do the auto calculation based on the gross budget but have it
// by month") -- every month starts from the plain auto-calculation off that
// month's own Gross Budget, and a strategist can override just THAT month without
// it silently carrying over to every other month the way the old campaign-level
// override did. Range support (SEM) applies the same way per month, per Claire:
// "it should support SEM too so it is constant."
function computeGoal(line, monthRow) {
  const row = CATALOG_ROWS[line.service_id];
  const isClicksBased = line.service_id === 'sem-bp' || !row || row.retail_cpm == null;
  const unit = isClicksBased ? 'clicks' : 'impr.';
  const parsed = parseGoalOverride(monthRow?.goal_override, line.service_id === 'sem-bp');
  if (parsed) return { value: parsed.value, unit, manual: true, overridden: true, isRange: parsed.isRange, display: parsed.display };
  if (isClicksBased) {
    // Fallback (2026-08-10): a $ CPC range (Admin -> Accounting Map) auto-computes
    // a Goal range the same shape a manual SEM range already takes ("83-250"),
    // instead of leaving every month fully manual with no starting point at all.
    const cpc = effectiveCpcRange(line.service_id, line.client_id, line.group_id);
    const gross = monthRow?.gross_budget;
    if (cpc && gross != null) {
      const low = Number(gross) / cpc.high, high = Number(gross) / cpc.low;
      return { value: (low + high) / 2, unit, manual: false, isRange: true, display: `${Math.round(low).toLocaleString()}–${Math.round(high).toLocaleString()}` };
    }
    return { value: null, unit, manual: true };
  }
  const auto = budgetedImpressions(monthRow?.gross_budget, line.service_id, line.client_id, line.group_id, line.retail_cpm_override);
  return { value: auto, unit, manual: false, display: auto != null ? Math.round(auto).toLocaleString() : null };
}

function strategistDaysBetweenInclusive(a, b) {
  const utcA = Date.UTC(a.getFullYear(), a.getMonth(), a.getDate());
  const utcB = Date.UTC(b.getFullYear(), b.getMonth(), b.getDate());
  return Math.round((utcB - utcA) / 86400000) + 1;
}

// The expected fraction of a month's flight window that should have delivered by
// today -- confirmed against Claire's real spreadsheet formula 2026-08-06. The window
// is the OVERLAP between the campaign's flight dates and the REAL current calendar
// month (not the full flight, and not just the calendar month alone); "today" clamps
// to the flight's own end date if the flight already finished mid-month.
function strategistExpectedPacingFraction(flightStart, flightEnd, today) {
  const monthStart = new Date(today.getFullYear(), today.getMonth(), 1);
  const monthEnd = new Date(today.getFullYear(), today.getMonth() + 1, 0);
  const fs = flightStart ? new Date(flightStart + 'T00:00:00') : null;
  const fe = flightEnd ? new Date(flightEnd + 'T00:00:00') : null;
  const windowStart = fs && fs > monthStart ? fs : monthStart;
  const windowEnd = fe && fe < monthEnd ? fe : monthEnd;
  if (windowEnd < windowStart) return null; // flight doesn't overlap this month at all
  const elapsedEnd = fe && fe < today ? fe : today;
  if (elapsedEnd < windowStart) return 0;
  const elapsedDays = strategistDaysBetweenInclusive(windowStart, elapsedEnd);
  const totalDays = strategistDaysBetweenInclusive(windowStart, windowEnd);
  return elapsedDays / totalDays;
}

// Spend/Perf Pacing -- confirmed against Claire's real spreadsheet formula
// 2026-08-06: a COMPLETED past month shows a plain final Actual ÷ Goal (that month
// already fully happened, nothing left to project); a month that hasn't started yet
// shows nothing (no actuals to pace); the REAL CURRENT month prorates Goal down to
// "what should have been spent by today," using the overlap between the campaign's
// flight and this calendar month, exactly as in that formula. Deliberately anchored
// to real today's date, not to whichever month is selected in the top-bar picker --
// only WHICH branch applies (past/current/future) depends on the viewed month.
function pacingPct(actual, goal, flightStart, flightEnd, viewedMonth) {
  if (actual == null || goal == null || goal === 0) return null;
  const now = new Date();
  const viewedKey = strategistMonthKey(viewedMonth);
  const nowKey = strategistMonthKey(now);
  if (viewedKey < nowKey) return (Number(actual) / Number(goal)) * 100;
  if (viewedKey > nowKey) return null;
  const frac = strategistExpectedPacingFraction(flightStart, flightEnd, now);
  if (frac == null || frac <= 0) return null;
  return (Number(actual) / (Number(goal) * frac)) * 100;
}
function pacingClass(pct) {
  if (pct == null) return '';
  if (pct >= PACING_THRESHOLDS.good) return 'good';
  if (pct >= PACING_THRESHOLDS.warn) return 'warn';
  return 'risk';
}
function pacingPillHtml(pct) {
  if (pct == null) return '<span style="color:var(--muted);font-size:11px">—</span>';
  const cls = pacingClass(pct);
  const colors = { good: ['#DDF2DE', '#2E7D42'], warn: ['#FBF3C7', '#8A6D12'], risk: ['#FBDBD6', '#A23B2E'] }[cls];
  return `<span style="display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap;background:${colors[0]};color:${colors[1]}">${Math.round(pct)}%</span>`;
}

// The Pacing filter (2026-08-11, per Claire: the Active list is getting long for
// both an individual strategist and everyone combined -- needs a way to surface
// which campaigns actually need a look) uses the exact same good/warn/risk
// segments already shown on every row's spend/performance pacing pills, just as
// a filter instead of only a color. A line can be off on spend but fine on
// performance (or vice versa) -- the filter uses the WORSE of the two, since a
// campaign that's fine on one metric but at risk on the other still needs review.
// Returns null (matches nothing but "All Pacing") when neither metric is
// computable yet -- e.g. a campaign with no actuals entered this month.
function strategistLinePacingSegment(l) {
  const monthRow = monthRowFor(l.id, strategistCurrentMonth) || {};
  const inPlatform = effectiveInPlatformBudget(monthRow, l.service_id, l.client_id, l.group_id, l.has_offline_visits || l.has_addl_targeting, l.retail_cpm_override);
  const goal = computeGoal(l, monthRow);
  const spendPacing = pacingPct(monthRow.actual_spend, inPlatform, l.flight_start, l.flight_end, strategistCurrentMonth);
  const actualPerf = goal.unit === 'clicks' ? monthRow.actual_clicks : monthRow.actual_impressions;
  const perfPacing = pacingPct(actualPerf, goal.value, l.flight_start, l.flight_end, strategistCurrentMonth);
  const classes = [pacingClass(spendPacing), pacingClass(perfPacing)].filter(Boolean);
  if (!classes.length) return null;
  const rank = { risk: 3, warn: 2, good: 1 };
  return classes.reduce((worst, c) => rank[c] > rank[worst] ? c : worst);
}

// Finds this line's row for a specific month, carrying the prior month's Gross Budget
// forward when the campaign's budget doesn't vary month to month and no explicit row
// exists yet for the requested month — so a flat-budget campaign never needs its
// number re-entered every month, only a genuinely-varying one does.
function monthRowFor(lineId, monthDate) {
  const key = strategistMonthKey(monthDate);
  const rows = ALL_CAMPAIGN_MONTHS.filter(m => m.campaign_line_id === lineId).sort((a,b) => a.month.localeCompare(b.month));
  const exact = rows.find(m => strategistMonthKey(new Date(m.month + 'T00:00:00')) === key);
  const line = ALL_CAMPAIGN_LINES.find(l => l.id === lineId);
  const priorRow = () => rows.filter(m => m.month < monthDate.toISOString().slice(0,10)).pop();

  if (exact) {
    // Pasting a platform report (or adding a past month manually) can create/update
    // a month's ACTUALS before that month ever got a real Gross Budget entered —
    // found live 2026-08-05, checking Claire's own question about testing a past
    // month. Without this, that exact row's own gross_budget (null) would win over
    // carry-forward entirely, silently blanking In-Platform Budget for a month that
    // otherwise has real numbers on it. If the campaign doesn't vary month to month,
    // still carry the budget forward from the most recent PRIOR month while keeping
    // this row's own real actuals.
    if (exact.gross_budget == null && line && !line.budget_varies_by_month) {
      const prior = priorRow();
      if (prior) return { ...exact, gross_budget: prior.gross_budget, _carried: true };
    }
    return exact;
  }
  if (line && line.budget_varies_by_month) return null;
  // Carry forward the most recent PRIOR month's gross_budget as a synthetic row --
  // ONLY gross_budget, never the whole row. Found live 2026-08-06, per Claire: a
  // FUTURE month with no campaign_months row of its own was showing the prior
  // (current) month's real actuals/pasted-report numbers as if they belonged to
  // that future month -- spreading `...prior` here pulled in actual_spend,
  // actual_clicks, every platform-metric-tile field, and goal_override right along
  // with gross_budget, none of which should ever carry forward (a month with no
  // real data on it should show nothing for those, not last month's numbers).
  const prior = priorRow();
  return prior ? { campaign_line_id: lineId, month: monthDate.toISOString().slice(0,10), gross_budget: prior.gross_budget, _carried: true } : null;
}

// FIXED (2026-08-07, found live via Claire — the Campaign Setup queue's Gross
// Budget summary read blank while viewing a month before the campaign's own flight
// start, even though the real starting budget already existed from the signed IO):
// monthRowFor() is tied to whichever month the top-bar picker happens to be on —
// correct for an ACTIVE campaign (you're genuinely asking "what was budgeted for
// THIS specific month"), but wrong for a still-pending setup, which hasn't started
// yet and has nothing to do with today's calendar month. Used only by
// renderSetupPanels() below — the main pacing table (Active/Paused/Complete) keeps
// using monthRowFor() + the real top-bar month, unchanged.
function setupBudgetRowFor(lineId) {
  const rows = ALL_CAMPAIGN_MONTHS.filter(m => m.campaign_line_id === lineId).sort((a,b) => a.month.localeCompare(b.month));
  return rows[0] || null;
}

function strategistLineActiveInMonth(line, monthDate) {
  const monthKey = strategistMonthKey(monthDate);
  if (line.flight_start && monthKey < strategistMonthKey(new Date(line.flight_start + 'T00:00:00'))) return false;
  if (line.flight_end && monthKey > strategistMonthKey(new Date(line.flight_end + 'T00:00:00'))) return false;
  return true;
}

// Scheduled pause (2026-08-10, per Claire -- so a strategist doesn't have to
// remember to flip a campaign's status on/off for a seasonal pause). Checks
// the EXACT month only -- deliberately no carry-forward from a prior month
// the way Gross Budget does, since a pause scheduled for July shouldn't leak
// into August just because nobody entered an August row yet.
function strategistMonthPaused(lineId, monthDate) {
  const key = strategistMonthKey(monthDate);
  const row = ALL_CAMPAIGN_MONTHS.find(m => m.campaign_line_id === lineId && strategistMonthKey(new Date(m.month + 'T00:00:00')) === key);
  return !!row?.paused;
}

// Reconstructs what a line's status actually WAS as of `monthDate`, from its real
// status-change history (2026-08-18, per Claire -- found live: pausing a campaign
// today made it show as Paused for past months too, when it was genuinely Active
// back then). Uses the most recent status_history entry on or before the end of
// that month; falls back to the current status if there's no recorded change yet
// on or before it (nothing to reconstruct from -- e.g. a campaign that's never had
// a status change logged).
function strategistHistoricalStatus(line, monthDate) {
  const monthEnd = new Date(monthDate.getFullYear(), monthDate.getMonth() + 1, 0, 23, 59, 59, 999);
  const lineHistory = ALL_STATUS_HISTORY.filter(h => h.campaign_line_id === line.id);
  if (!lineHistory.length) return line.status;

  let latestOnOrBefore = null;
  let earliest = null;
  lineHistory.forEach(h => {
    const changedAt = new Date(h.changed_at);
    if (!earliest || changedAt < new Date(earliest.changed_at)) earliest = h;
    if (changedAt <= monthEnd && (!latestOnOrBefore || changedAt > new Date(latestOnOrBefore.changed_at))) latestOnOrBefore = h;
  });
  if (latestOnOrBefore) return latestOnOrBefore.new_status;
  // The viewed month is before ANY recorded change -- use what it was transitioning
  // FROM at the earliest known change, since that's the last confirmed status before
  // history starts.
  return earliest.old_status || line.status;
}

// The campaign's HISTORICAL status (as of the viewed month, not necessarily its
// current one -- see strategistHistoricalStatus() above) still wins outright
// whenever it's anything other than 'active' -- paused-indefinitely, complete,
// and pending are all real manual states the schedule should never override.
// Only an 'active' month can be knocked down to effectively-paused for a
// specific scheduled month.
function strategistEffectiveStatus(line, monthDate) {
  const historicalStatus = strategistHistoricalStatus(line, monthDate);
  if (historicalStatus !== 'active') return historicalStatus;
  return strategistMonthPaused(line.id, monthDate) ? 'paused' : 'active';
}

// A campaign line's assigned_strategist field is set to whoever
// created/imported/set it up -- not necessarily who actually owns the
// client (2026-08-11, per Claire: if Strategist A is out and Strategist B
// sets up or otherwise touches the campaign, it's still A's campaign -- B
// was just helping out). So for scoping purposes (My Campaigns/All
// Strategists), EVERY status -- pending, active, paused, complete -- uses
// the CLIENT's effective Digital Strategist (client override, else group
// default) instead of assigned_strategist. A client that's still
// unassigned in Admin resolves to null here -- it simply won't match
// anyone's "My Campaigns", so it still surfaces under "All Strategists"
// rather than silently vanishing. assigned_strategist itself is left alone
// (still written on create) -- it's just no longer what scoping reads.
function strategistLineScopeName(l) {
  const client = ALL_STRATEGIST_CLIENTS.find(c => c.id === l.client_id);
  return client?.digital_strategist_name || null;
}

function visibleCampaignLines() {
  return ALL_CAMPAIGN_LINES.filter(l => {
    if (strategistEffectiveStatus(l, strategistCurrentMonth) !== strategistStatusTab) return false;
    // Campaign Setup (pending) used to be entirely exempt from the "My Campaigns"
    // scope toggle (2026-08-07) since assigned_strategist wasn't a reliable owner
    // yet. Superseded 2026-08-11: now scoped via strategistLineScopeName() above,
    // same as every other tab -- the Setup queue was getting too long as one
    // shared list once every client had a real owner assigned in Admin.
    if (strategistScope === 'mine' && strategistLineScopeName(l) !== currentStrategistUser.name) return false;
    if (strategistGroupFilter && l.group_name !== strategistGroupFilter) return false;
    if (strategistPacingFilter && strategistLinePacingSegment(l) !== strategistPacingFilter) return false;
    if (l.status !== 'pending' && !strategistLineActiveInMonth(l, strategistCurrentMonth)) return false;
    return true;
  });
}

function renderStrategistDashboard() {
  document.getElementById('strategist-month-label').textContent = strategistMonthLabel(strategistCurrentMonth);
  // Navy for My Campaigns, green for All Strategists (2026-08-12, per Claire:
  // "update the 'my campaigns' and 'all strategists' to a navy and green and
  // make them round and react like the other pill buttons") -- each option in
  // this 2-way toggle gets its own brand color; solid fill when active, a
  // matching outline when not, same active/inactive pattern the old
  // --accent/--light version used, just recolored.
  document.getElementById('strategist-scope-mine').style.background = strategistScope === 'mine' ? 'var(--accent-dark)' : '#fff';
  document.getElementById('strategist-scope-mine').style.color = strategistScope === 'mine' ? '#fff' : 'var(--accent-dark)';
  // Inactive state uses --accent-green-text (a darkened variant), not --accent-green
  // itself (2026-08-18, accessibility audit) -- the pale --accent-green measures
  // only 1.72:1 as text/border on white. Active state is unaffected: --accent-dark
  // text on the pale --accent-green fill already passes at 5.53:1.
  document.getElementById('strategist-scope-all').style.background = strategistScope === 'all' ? 'var(--accent-green)' : '#fff';
  document.getElementById('strategist-scope-all').style.color = strategistScope === 'all' ? 'var(--accent-dark)' : 'var(--accent-green-text)';
  document.getElementById('strategist-scope-all').style.borderColor = strategistScope === 'all' ? 'var(--accent-green)' : 'var(--accent-green-text)';

  // Same scoping as visibleCampaignLines() above, so the tab's own count badge
  // always matches what actually renders when you click into it.
  const counts = { pending: 0, active: 0, paused: 0, complete: 0 };
  ALL_CAMPAIGN_LINES.forEach(l => {
    if (strategistScope === 'mine' && strategistLineScopeName(l) !== currentStrategistUser.name) return;
    if (strategistGroupFilter && l.group_name !== strategistGroupFilter) return;
    if (strategistPacingFilter && strategistLinePacingSegment(l) !== strategistPacingFilter) return;
    if (l.status !== 'pending' && !strategistLineActiveInMonth(l, strategistCurrentMonth)) return;
    const eff = strategistEffectiveStatus(l, strategistCurrentMonth);
    if (counts[eff] != null) counts[eff]++;
  });

  // Populate the group filter's own options -- every group with at least one
  // campaign, alphabetical, same ordering as the main table's own group bands.
  // Rebuilt on every render (rather than once) so a brand-new group with its first
  // campaign shows up here without a page reload; preserves the current selection
  // if it's still valid, otherwise resets to "All Groups" instead of silently
  // holding a filter value for a group that's no longer in view.
  const groupFilterEl = document.getElementById('strategist-group-filter');
  if (groupFilterEl) {
    const groupNames = [...new Set(ALL_CAMPAIGN_LINES.map(l => l.group_name).filter(Boolean))].sort((a, b) => a.localeCompare(b));
    if (strategistGroupFilter && !groupNames.includes(strategistGroupFilter)) strategistGroupFilter = '';
    groupFilterEl.innerHTML = '<option value="">All Groups</option>' +
      groupNames.map(g => `<option value="${esc(g)}" ${g === strategistGroupFilter ? 'selected' : ''}>${esc(g)}</option>`).join('');
  }
  const tabs = [
    ['pending', 'Campaign Setup'], ['active', 'Active'], ['paused', 'Paused'], ['complete', 'Complete']
  ];
  document.getElementById('strategist-status-tabs').innerHTML = tabs.map(([key, label]) => {
    const active = strategistStatusTab === key;
    const panelId = key === 'pending' ? 'strategist-setup-panel' : 'strategist-table-wrap';
    // Pill shape (2026-08-18, per Claire -- "a full pill would match better with
    // everything else"), same active/inactive pattern as the My Campaigns/All
    // Strategists toggle just above this bar -- was the one tab bar in the app still
    // using the old underline style.
    return `<button id="strategist-status-tab-${key}" role="tab" aria-selected="${active}" aria-controls="${panelId}" onclick="strategistSetStatusTab('${key}')" style="font:inherit;font-size:12.5px;font-weight:600;color:${active ? '#fff' : 'var(--accent-dark)'};background:${active ? 'var(--accent-dark)' : '#fff'};border:1.5px solid var(--accent-dark);border-radius:999px;padding:7px 14px;cursor:pointer">${label} <span style="font-family:monospace;font-size:11px">${counts[key]}</span></button>`;
  }).join('');

  const lines = visibleCampaignLines();
  document.getElementById('strategist-setup-panel').innerHTML = strategistStatusTab === 'pending' ? renderSetupPanels(lines) : '';
  document.getElementById('strategist-table-wrap').innerHTML = strategistStatusTab === 'pending' ? '' : renderMainTable(lines);
  applyStickyGroupOffset('strategist-table-wrap');
  // renderStrategistDetailPanel() MUST run before fitStrategistScrollBoxes() (2026-08-17,
  // per Claire -- "when I open a campaign detail and then close it the page becomes
  // condensed"): the detail panel sits above #strategist-table-wrap, so its own height
  // is part of what fitStrategistScrollBoxes() measures as "everything before the box."
  // Fitting first (the original order) meant closing the panel shrank the table box
  // based on the panel's stale, about-to-be-cleared (still "open") height -- and with
  // nothing else re-triggering a refit afterward, it stayed wrongly condensed.
  renderStrategistDetailPanel();
  fitStrategistScrollBoxes();
}

// Sizes #strategist-table-wrap/#strategist-setup-panel's max-height to whatever
// vertical room is actually left in the viewport (2026-08-17, per Claire -- both
// boxes had a flat max-height:70vh, which left the page a few px taller than most
// windows: enough content above the box here [header bar, freshness banner, month/
// scope bar, status tabs] varies by what's shown, so a fixed 70vh guess couldn't
// account for it and the whole page ended up needing its own tiny scrollbar even
// though nothing inside it needed to move). Measures each box's live position
// (getBoundingClientRect + scrollY, so it's correct regardless of current scroll
// position) rather than hardcoding, same live-measurement approach as
// applyStickyGroupOffset()/admin's applyAdminStickyOffsets(). The 44px reserved
// below the box is #strategist-card's own padding-bottom (20px) + its bottom
// margin (24px) -- the space still needed after the box for the card to end
// cleanly instead of the box touching the very bottom of the viewport.
function fitStrategistScrollBoxes() {
  ['strategist-table-wrap', 'strategist-setup-panel'].forEach(id => {
    const box = document.getElementById(id);
    if (!box || box.offsetParent === null) return;
    const top = box.getBoundingClientRect().top + window.scrollY;
    const fit = Math.max(200, window.innerHeight - top - 44);
    box.style.maxHeight = Math.min(fit, window.innerHeight * 0.7) + 'px';
  });
  // --strategist-sticky-offset feeds the scroll-margin-top rule below (2026-08-17,
  // per Claire -- same bug and fix as /admin's identical scrollIntoView issue found
  // the same day): opening the detail panel via strategistSelectLine()'s
  // scrollIntoView({block:'start'}) aligned its top edge with the page's literal
  // top, which the sticky header bar now permanently covers, hiding the panel's
  // own title/first fields until scrolled up manually.
  const header = document.getElementById('strategist-header-bar');
  if (header) document.getElementById('strategist-card').style.setProperty('--strategist-sticky-offset', header.getBoundingClientRect().height + 'px');
}
window.addEventListener('resize', () => {
  if (currentStrategistUser) fitStrategistScrollBoxes();
});
// Catches every other way the content above the table/setup boxes can change
// height without going through renderStrategistDashboard() -- opening/closing
// the Import Campaign, Paste Platform Report, or Bulk Import forms (2026-08-17,
// found auditing for other instances of the same bug as the detail-panel fix
// above: none of those three toggle functions called fitStrategistScrollBoxes()
// either, so opening one could overflow the page again and closing one could
// leave a box wrongly condensed, same shape as the bug just fixed, just via a
// different trigger). Same "observe the container, don't hunt every call site"
// approach as admin's identical ResizeObserver on #admin-content-area.
new ResizeObserver(() => { if (currentStrategistUser) fitStrategistScrollBoxes(); }).observe(document.getElementById('strategist-content-area'));

// ── SPLIT INTO MULTIPLE CAMPAIGNS (2026-08-10) ───────────────────
// Real scenario Claire found: one IO tactic sold at one total price, but the client
// splits it themselves across several regions/segments (noted only as free text on
// the IO today). Turns one pending line into N fully independent campaign_lines rows
// -- each tracked separately from here on (own budget/pacing/status), per Claire's
// explicit call over keeping it as one line with an internal breakdown. Amounts are
// manually entered, not auto-divided -- real splits are uneven (confirmed via her
// $2,000/$2,000/$1,000 example). The label is free text, not a fixed region list --
// per Claire, this isn't always going to be a region specifically.
function strategistOpenSplitForm(lineId) {
  const el = document.getElementById('split-form-' + lineId);
  if (!el) return;
  // The overall "Exact campaign title" field above gets disabled while this is
  // open -- each split has its own title below, so leaving the shared field
  // editable at the same time would just be a second, ambiguous place to type
  // one (same reasoning already applied to the import form's version of this).
  const titleInput = document.getElementById('setup-platform-campaign-name-' + lineId);
  const showing = el.style.display !== 'none';
  if (showing) {
    el.style.display = 'none'; el.innerHTML = '';
    if (titleInput) { titleInput.disabled = false; titleInput.title = ''; }
    return;
  }
  const line = ALL_CAMPAIGN_LINES.find(l => l.id === lineId);
  const monthRow = setupBudgetRowFor(lineId) || {};
  const fullAmount = monthRow.gross_budget != null ? Number(monthRow.gross_budget) : '';
  el.style.display = 'block';
  el.innerHTML = `<div style="border:1px solid var(--accent);border-radius:8px;padding:12px 14px;background:#fff">
    <p style="font-size:12px;color:var(--muted);margin-bottom:10px">Splits this ${esc(line ? strategistTacticDisplay(line) : 'campaign')} line into separate campaigns, each tracked independently from here on. Label each one (a region, an audience segment — whatever distinguishes it), its own dollar amount, and its own exact campaign title in the ad platform — each split runs as its own campaign there, so reports can only be matched by title if every split has its own.</p>
    <div id="split-rows-${lineId}">
      ${strategistSplitRowHtml(lineId, 0, '', fullAmount, line?.platform_campaign_name || '')}
      ${strategistSplitRowHtml(lineId, 1, '', '', '')}
    </div>
    <button onclick="strategistAddSplitRow('${lineId}')" style="margin:6px 0 12px;padding:4px 10px;border-radius:6px;border:1px solid var(--border);background:var(--light);font-size:11px;cursor:pointer">+ Add split</button>
    <div style="display:flex;gap:10px">

async function strategistSaveSplit(lineId) {
  const labels = [...document.querySelectorAll('.split-label-' + lineId)].map(el => el.value.trim());
  const amounts = [...document.querySelectorAll('.split-amount-' + lineId)].map(el => el.value);
  const titles = [...document.querySelectorAll('.split-title-' + lineId)].map(el => el.value.trim());
  const splits = labels.map((label, i) => ({ label, amount: amounts[i], title: titles[i] })).filter(s => s.label && s.amount !== '');
  if (splits.length < 2) { showToast('Enter a label and amount for at least 2 splits.', 'error'); return; }
  try {
    const result = await sb('rpc/strategist_split_campaign_line', { method: 'POST', body: JSON.stringify({
      p_name: currentStrategistUser.name, p_pw: currentStrategistUser.pw,
      p_line_id: lineId, p_splits: splits.map(s => ({ label: s.label, amount: parseFloat(s.amount), platform_campaign_name: s.title || null }))
    }) });
    await fetchStrategistData();
    // Setup panels start collapsed by default (2026-08-10) -- found live, Claire:
    // "it said it saved but it didn't hold." It had; the resulting splits just
    // rendered collapsed, easy to miss/scroll past, so it looked like nothing
    // happened until leaving and re-entering Campaign Setup. Expand every
    // resulting split immediately using the ids the RPC already returns.
    (result?.line_ids || []).forEach(id => STRATEGIST_EXPANDED_SETUP_LINES.add(id));
    renderStrategistDashboard();
    showToast(`Split into ${splits.length} campaigns.`);
  } catch(e) { showToast('Error splitting: ' + e.message, 'error'); }
}

function strategistToggleVaries(lineId, checked) {
  document.getElementById('setup-months-' + lineId).style.display = checked ? '' : 'none';
  strategistSaveLine(lineId, { budget_varies_by_month: checked }, false);
  if (checked) strategistPrefillMonths(lineId);
}

// Pre-fills Gross Budget rows for a flight's FULL length the moment "Budget is
// different by month" gets checked (2026-08-07, per Claire — having to click
// "+ Add month" one at a time to build out a flight's whole schedule before you
// can even start correcting the specific months that actually differ was real
// friction; extended 2026-08-11, also per Claire, after a real multi-year flight
// — 2026 through 2029 — silently stopped showing past its old 12-month cutoff:
// "the reason for only doing the first 12 months was for them to be able to
// adjust the spend if needed. If the spend isn't adjusted it should go by the
// default monthly spend in the IO"). Copies the SAME base budget already on
// file (setupBudgetRowFor()'s row — the flight's earliest month, seeded from
// the signed IO) into every month from there through flight_end that doesn't
// already have its own row — however many months that is, not capped at 12
// anymore. A genuinely open-ended flight (no flight_end at all) has no defined
// length to fill, so it still falls back to the original 12-month rolling
// window; "+ Add month" still covers anything beyond that. No-op if 2+ real
// month rows already exist (someone's already building this out by hand —
// don't second-guess it), or if there's no base budget yet to copy from.
async function strategistPrefillMonths(lineId) {
  const existingRows = ALL_CAMPAIGN_MONTHS.filter(m => m.campaign_line_id === lineId);
  if (existingRows.length > 1) return;
  const baseRow = setupBudgetRowFor(lineId);
  if (!baseRow || baseRow.gross_budget == null) return;
  const line = ALL_CAMPAIGN_LINES.find(l => l.id === lineId);
  const existingMonths = new Set(existingRows.map(m => m.month));
  const start = new Date(baseRow.month + 'T00:00:00');
  let monthCount = 12;
  if (line?.flight_end) {
    const end = new Date(line.flight_end + 'T00:00:00');
    monthCount = (end.getFullYear() - start.getFullYear()) * 12 + (end.getMonth() - start.getMonth()) + 1;
    if (monthCount < 1) monthCount = 1;
  }
  const saves = [];
  for (let i = 0; i < monthCount; i++) {
    const d = new Date(start.getFullYear(), start.getMonth() + i, 1);
    const monthStr = d.toISOString().slice(0, 10);
    if (!existingMonths.has(monthStr)) {
      saves.push(sb('rpc/strategist_save_campaign_month', { method: 'POST', body: JSON.stringify({
        p_name: currentStrategistUser.name, p_pw: currentStrategistUser.pw,
        p_campaign_line_id: lineId, p_month: monthStr, p_data: { gross_budget: baseRow.gross_budget }
      }) }));
    }
  }
  if (!saves.length) return;
  await Promise.all(saves);
  await fetchStrategistData();
  renderStrategistDashboard();
}

async function strategistAddSetupMonth(lineId) {
  const rows = ALL_CAMPAIGN_MONTHS.filter(m => m.campaign_line_id === lineId).sort((a,b) => a.month.localeCompare(b.month));
  const last = rows[rows.length - 1];
  const next = last ? new Date(last.month + 'T00:00:00') : new Date();
  next.setMonth(next.getMonth() + 1);
  // Never carry a prior month's real number forward for a line flagged
  // budget_varies_by_month (2026-08-20, found live while making the new
  // varying-budget IO feature consistent everywhere it's read) -- doing so
  // would silently commit a guessed figure as if it were a real entry for
  // a line whose whole point is that each month is genuinely different.
  const line = ALL_CAMPAIGN_LINES.find(l => l.id === lineId);
  const carryForward = last && !line?.budget_varies_by_month;
  await strategistSaveMonth(lineId, next.toISOString().slice(0,10), { gross_budget: carryForward ? last.gross_budget : null });
}

// Backfilling a specific past month from the detail panel's history editor (2026-08-04)
// — unlike strategistAddSetupMonth() above (which just adds "the next month" for an
// ongoing campaign), an imported campaign needs to jump straight to a specific past
// month, however far back makes sense for that one — no fixed amount of history is
// assumed or required.
// Renamed from "+ Add a past month" and moved off a raw prompt() (2026-08-06, per
// Claire: it can add a future month too now, not just past, and typing "YYYY-MM"
// into a browser prompt was clunky) -- a real <input type="month"> next to the
// button is both a clearer affordance and lets the browser's own picker UI do the
// work instead of asking the strategist to remember an exact text format.
async function strategistAddHistoryMonth(lineId) {
  const input = document.getElementById('add-month-' + lineId).value; // "YYYY-MM" from the native month picker
  if (!input) { showToast('Pick a month first.', 'error'); return; }
  const match = /^(\d{4})-(\d{2})$/.exec(input);
  if (!match) { showToast('Enter a month as YYYY-MM, e.g. 2026-03', 'error'); return; }
  const monthStr = `${match[1]}-${match[2]}-01`;
  await strategistSaveMonth(lineId, monthStr, {});
}

// One-time backfill for a campaign that already got truncated by the old
// 12-month prefill cap before strategistPrefillMonths() was extended to
// cover a flight's full length (2026-08-11, per Claire — a real campaign
// running through 2029 had silently stopped at ~2027). Fills every month
// from the LAST existing month row through flight_end, using that last
// month's own Gross Budget as the default for each new one ("if the spend
// isn't adjusted it should go by the default monthly spend in the IO").
// No-op if the flight is open-ended (no flight_end to fill toward) or
// already fully covered.
// Pure computation, no network/reload side effects -- shared by the single-
// campaign button and the bulk "fill every campaign" pass below, so the bulk
// pass can batch every line's saves into one Promise.all + one reload instead
// of doing a full data refetch per campaign (2026-08-11, per Claire).
function strategistComputeFillSaves(lineId) {
  const l = ALL_CAMPAIGN_LINES.find(x => x.id === lineId);
  if (!l?.flight_end) return [];
  // Skip entirely for a varying-budget line (2026-08-20, found live while
  // making the new varying-budget IO feature consistent everywhere) -- this
  // fill exists to copy one flat, unchanging monthly rate forward, which is
  // exactly wrong for a line whose real point is that the rate differs by
  // month; a strategist needs to enter each of those months by hand.
  if (l.budget_varies_by_month) return [];
  const rows = ALL_CAMPAIGN_MONTHS.filter(m => m.campaign_line_id === lineId).sort((a,b) => a.month.localeCompare(b.month));
  if (!rows.length) return [];
  const last = rows[rows.length - 1];
  const existingMonths = new Set(rows.map(m => m.month));
  const start = new Date(last.month + 'T00:00:00');
  const end = new Date(l.flight_end + 'T00:00:00');
  const monthCount = (end.getFullYear() - start.getFullYear()) * 12 + (end.getMonth() - start.getMonth());
  if (monthCount < 1) return [];
  const saves = [];
  for (let i = 1; i <= monthCount; i++) {
    const d = new Date(start.getFullYear(), start.getMonth() + i, 1);
    const monthStr = d.toISOString().slice(0, 10);
    if (!existingMonths.has(monthStr)) {
      saves.push({ lineId, monthStr, gross_budget: last.gross_budget });
    }
  }
  return saves;
}

function strategistSaveFillEntry(entry) {
  return sb('rpc/strategist_save_campaign_month', { method: 'POST', body: JSON.stringify({
    p_name: currentStrategistUser.name, p_pw: currentStrategistUser.pw,
    p_campaign_line_id: entry.lineId, p_month: entry.monthStr, p_data: { gross_budget: entry.gross_budget }
  }) });
}

async function strategistFillMonthsToFlightEnd(lineId) {
  const l = ALL_CAMPAIGN_LINES.find(x => x.id === lineId);
  if (!l?.flight_end) { showToast('This campaign has no flight end date to fill toward.', 'error'); return; }
  if (l.budget_varies_by_month) { showToast('This campaign\'s budget varies by month — fill in each remaining month by hand.', 'error'); return; }
  const rows = ALL_CAMPAIGN_MONTHS.filter(m => m.campaign_line_id === lineId);
  if (!rows.length) { showToast('No existing months to base the fill on yet.', 'error'); return; }
  const saves = strategistComputeFillSaves(lineId);
  if (!saves.length) { showToast('Already covers the full flight.', 'error'); return; }
  await Promise.all(saves.map(strategistSaveFillEntry));
  await fetchStrategistData();
  renderStrategistDashboard();
  showToast(`Filled ${saves.length} month(s) through flight end.`);
}

// Auto-fills a campaign's actuals from the last pasted platform report the moment it
// has both a platform and an exact title to reference (2026-08-06, per Claire: "the
// autofill should start when there is a campaign title to reference") -- rather than
// waiting for her next twice-weekly paste. No-op if the platform has nothing cached,
// or nothing in that cache matches this exact title yet.
// Pure lookup, no DB call -- split out so bulk import (2026-08-10) can reuse the
// exact same matching rule without also inheriting strategistSaveMonth()'s
// refetch+rerender, which would be a full dashboard reload PER campaign across
// 100+ bulk-imported rows.
function findCachedReportMatch(platform, platformCampaignName) {
  if (!platform || !platformCampaignName) return null;
  const cache = PLATFORM_REPORT_CACHE[platform];
  if (!cache) return null;
  const wanted = platformCampaignName.trim().toLowerCase();
  const match = cache.rows.find(r => (r.title || '').trim().toLowerCase() === wanted);
  return match ? { report_month: cache.report_month, data: match.data } : null;
}

async function strategistApplyCachedReportIfMatch(lineId) {
  const line = ALL_CAMPAIGN_LINES.find(l => l.id === lineId);
  if (!line) return;
  const found = findCachedReportMatch(line.platform, line.platform_campaign_name);
  if (!found) return;
  await strategistSaveMonth(lineId, found.report_month, found.data);
}

// "Re-check Cached Reports" button (2026-08-10, per Claire) -- a one-off backfill
// for campaigns created BEFORE bulk import started checking the cache (the 119
// she'd already imported when that bug was fixed), and a standing safety net for
// any future case where a report gets pasted before the campaign it belongs to
// exists yet. Same non-refetching raw RPC pattern as the bulk import loop -- one
// refetch+rerender at the end, not one per campaign.
async function strategistRecheckCachedReports() {
  const candidates = ALL_CAMPAIGN_LINES.filter(l => l.platform && l.platform_campaign_name);
  let appliedCount = 0;
  const errors = [];
  for (const line of candidates) {
    const found = findCachedReportMatch(line.platform, line.platform_campaign_name);
    if (!found) continue;
    try {
      await sb('rpc/strategist_save_campaign_month', { method: 'POST', body: JSON.stringify({
        p_name: currentStrategistUser.name, p_pw: currentStrategistUser.pw,
        p_campaign_line_id: line.id, p_month: found.report_month, p_data: found.data
      }) });
      appliedCount++;
    } catch(e) { errors.push(`${line.tactic_label || line.service_id} (${line.platform_campaign_name}): ${e.message}`); }
  }
  await fetchStrategistData();
  renderStrategistDashboard();
  showToast(appliedCount || errors.length
    ? `Applied ${appliedCount} cached report(s)${errors.length ? `, ${errors.length} issue(s)` : ''}.`
    : 'No matches found in the cached reports.');
}

async function strategistSaveLine(lineId, data, reload) {
  try {
    const cleanData = Object.fromEntries(Object.entries(data).map(([k,v]) => [k, v === '' ? null : v]));
    await sb('rpc/strategist_save_campaign_line', { method: 'POST', body: JSON.stringify({
      p_name: currentStrategistUser.name, p_pw: currentStrategistUser.pw, p_id: lineId, p_data: cleanData
    }) });
    // Real bug found live (2026-08-10, Claire): a reload:false save (e.g. the main
    // table's inline Platform dropdown) wrote to the database correctly, but never
    // touched the in-memory ALL_CAMPAIGN_LINES cache -- the NEXT render for any
    // unrelated reason (switching tabs, selecting a different row) then rendered
    // from that stale cache and looked like the save had silently reverted. Patch
    // the local object directly so it stays correct without needing a full
    // refetch+rerender for a one-field edit.
    const line = ALL_CAMPAIGN_LINES.find(l => l.id === lineId);
    if (line) Object.assign(line, cleanData);
    if (reload !== false) { await fetchStrategistData(); renderStrategistDashboard(); }
    else showToast('Saved');
  } catch(e) { showToast('Error saving: ' + e.message, 'error'); }
}

// ── MAIN PACING TABLE ────────────────────────────────────────────
// Picks readable text (near-black or near-white) against an arbitrary hex background.
// Rewritten 2026-08-18 (accessibility audit) -- the original used uncorrected
// "perceived brightness" ((0.299r+0.587g+0.114b)/255 > 0.6 ? dark : white), not real
// WCAG relative luminance, so its 0.6 cutoff wasn't calibrated to any actual contrast
// ratio. A plausible mid-blue group color like #4F86C6 scored 0.49 there (picks white)
// but only reaches 3.78:1 real contrast, failing AA. This version tries both real
// candidates and returns whichever actually clears 4.5:1 (same approach as the client
// form's pickReadableTextColor()), falling back to whichever is closer for the rare
// color where neither can.
function strategistContrastTextColor(hex) {
  if (!hex || !/^#[0-9a-fA-F]{6}$/.test(hex)) return '#0E5D82';
  const relLuminance = (h) => {
    const c = [1,3,5].map(i => parseInt(h.slice(i,i+2),16) / 255);
    const [r,g,b] = c.map(v => v <= 0.03928 ? v/12.92 : Math.pow((v+0.055)/1.055, 2.4));
    return 0.2126*r + 0.7152*g + 0.0722*b;
  };
  const contrast = (l1,l2) => (Math.max(l1,l2)+0.05) / (Math.min(l1,l2)+0.05);
  const bgLum = relLuminance(hex);
  const white = 1.0, dark = relLuminance('#1F2937');
  const whiteContrast = contrast(bgLum, white);
  const darkContrast = contrast(bgLum, dark);
  if (whiteContrast >= 4.5 && whiteContrast >= darkContrast) return '#FFFFFF';
  if (darkContrast >= 4.5) return '#1F2937';
  return whiteContrast > darkContrast ? '#FFFFFF' : '#1F2937';
}

// Sticky header row + sticky "current group" banner while scrolling a long
// table (2026-08-11, per Claire). The group banner's sticky offset has to sit
// right below the header row, but the header's own height isn't fixed (it
// wraps onto 1-2 lines depending on column width), so it's measured from the
// live DOM after each render rather than hardcoded.
function applyStickyGroupOffset(wrapId) {
  const wrap = document.getElementById(wrapId);
  if (!wrap) return;
  const thead = wrap.querySelector('thead');
  if (!thead) return;
  const top = thead.getBoundingClientRect().height;
  wrap.querySelectorAll('.sticky-group-td').forEach(td => { td.style.top = top + 'px'; });
}

function renderMainTable(lines) {
  if (!lines.length) return '<p style="color:var(--muted);font-size:13px;padding:20px 0">No campaigns in this tab.</p>';
  const byGroup = {};
  lines.forEach(l => {
    const key = l.group_name || '(no group)';
    if (!byGroup[key]) byGroup[key] = { color: l.group_color, rows: [] };
    byGroup[key].rows.push(l);
  });

  // Headers wrap onto two lines (2026-08-06, per Claire: forcing every header onto
  // one line was the actual thing keeping columns wide, wider than the data inside
  // them ever needed) -- a per-column max-width instead of the old white-space:nowrap.
  const MAIN_TABLE_COLUMNS = [
    ['Client', 130], ['Tactic', 150], ['Platform', 140], ['Flight', 95],
    ['Gross Budget', 80], ['In-Platform Budget', 85], ['Actual Spend', 80],
    ['Spend Pacing', 70], ['Goal', 75], ['Actual Perf.', 75], ['Perf. Pacing', 70],
    ['Optimize Log', 75], ['Notes', 50],
  ];
  let html = `<table style="width:100%;border-collapse:collapse;font-size:12.5px;min-width:1250px">
    <thead><tr style="background:var(--light)">
      ${MAIN_TABLE_COLUMNS.map(([h, w]) =>
        `<th style="position:sticky;top:0;z-index:3;background:var(--light);padding:8px 8px;text-align:left;font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;max-width:${w}px;vertical-align:bottom">${h}</th>`).join('')}
    </tr></thead><tbody>`;

  Object.keys(byGroup).sort((a, b) => a.localeCompare(b)).forEach(groupName => {
    // Matches this group's own brand color (Groups tab, admin/index.html) rather than
    // one flat color for every group (2026-08-04, per Claire) — falls back to the
    // catalog's default accent if a group has no brand_color set.
    const bg = byGroup[groupName].color || '#EFF6FF';
    const fg = strategistContrastTextColor(bg);
    html += `<tr style="background:${esc(bg)}"><td class="sticky-group-td" colspan="13" style="position:sticky;z-index:2;background:${esc(bg)};padding:6px 10px;font-size:10.5px;font-weight:700;text-transform:uppercase;color:${fg}">${esc(groupName)}</td></tr>`;
    byGroup[groupName].rows.forEach(l => {
      const monthRow = monthRowFor(l.id, strategistCurrentMonth) || {};
      const inPlatform = effectiveInPlatformBudget(monthRow, l.service_id, l.client_id, l.group_id, l.has_offline_visits || l.has_addl_targeting, l.retail_cpm_override);
      const goal = computeGoal(l, monthRow);
      const spendPacing = pacingPct(monthRow.actual_spend, inPlatform, l.flight_start, l.flight_end, strategistCurrentMonth);
      const actualPerf = goal.unit === 'clicks' ? monthRow.actual_clicks : monthRow.actual_impressions;
      const perfPacing = pacingPct(actualPerf, goal.value, l.flight_start, l.flight_end, strategistCurrentMonth);
      const logCount = ALL_OPTIMIZE_LOG.filter(o => o.campaign_line_id === l.id).length;
      const selected = strategistSelectedLineId === l.id;
      // Flat-fee tactics (LLO, Reputation Mgmt., LLO (SEO), Rep Monitoring (SEO))
      // carry no platform, budget, or performance numbers at all (2026-08-17, per
      // Claire -- "there isn't anything to really track... update their lines so
      // it looks a little cleaner"): a real Platform picker plus 7 columns of
      // "—" every single time was just noise for these. Platform collapses to a
      // plain dash (nothing to pick), and Gross Budget through Perf. Pacing
      // collapse into one explanatory cell instead of 7 empty ones. Flight stays
      // a real column (still meaningful — when this tactic started/ended), and
      // Optimize Log/Notes stay fully real and untouched, since strategists
      // genuinely use both for these tactics.
      const noMetrics = isFlatFeeNoMetricsLine(l);
      const platformCellHtml = noMetrics
        ? `<td style="padding:9px 10px;color:var(--muted)">—</td>`
        : `<td style="padding:9px 10px" onclick="event.stopPropagation()">
          <select onclick="event.stopPropagation()" onchange="if(this.value==='__other__'){this.nextElementSibling.style.display='inline-block';this.nextElementSibling.focus();}else{this.nextElementSibling.style.display='none';strategistSaveLine('${l.id}', {platform: this.value}, false);}" style="width:100%;min-width:132px;padding:4px 6px;border-radius:5px;border:1px dashed var(--accent);font-size:11px">
            <option value="">— Select —</option>
            ${PLATFORM_OPTIONS.map(p => `<option value="${esc(p)}" ${p === l.platform ? 'selected' : ''}>${esc(p)}</option>`).join('')}
            <option value="__other__" ${l.platform && !PLATFORM_OPTIONS.includes(l.platform) ? 'selected' : ''}>Other…</option>
          </select>
          <input type="text" value="${l.platform && !PLATFORM_OPTIONS.includes(l.platform) ? esc(l.platform) : ''}" placeholder="Platform" onclick="event.stopPropagation()" onchange="strategistSaveLine('${l.id}', {platform: this.value}, false)" style="display:${l.platform && !PLATFORM_OPTIONS.includes(l.platform) ? 'inline-block' : 'none'};width:100%;min-width:132px;padding:4px 6px;border-radius:5px;border:1px dashed var(--accent);font-size:11px;margin-top:2px"/>
        </td>`;
      const metricsCellsHtml = noMetrics
        ? `<td colspan="7" style="padding:9px 10px;color:var(--muted);font-style:italic;text-align:center">Flat-fee tracking only — no platform spend to track</td>`
        : `<td style="padding:9px 10px">${monthRow.gross_budget != null ? '$' + Number(monthRow.gross_budget).toLocaleString() + '/mo' : '—'}</td>
        <td style="padding:9px 10px">${inPlatform != null ? '$' + inPlatform.toLocaleString(undefined,{maximumFractionDigits:0}) + '/mo' : '—'}</td>
        <td style="padding:9px 10px">${monthRow.actual_spend != null ? '$' + Number(monthRow.actual_spend).toLocaleString() : '—'}</td>
        <td style="padding:9px 10px">${pacingPillHtml(spendPacing)}</td>
        <td style="padding:9px 10px">${goal.value != null ? goal.display + ' ' + goal.unit : (goal.manual ? '— (enter manually)' : '—')}</td>
        <td style="padding:9px 10px">${actualPerf != null ? Number(actualPerf).toLocaleString() + ' ' + goal.unit : '—'}</td>
        <td style="padding:9px 10px">${pacingPillHtml(perfPacing)}</td>`;
      html += `<tr onclick="strategistSelectLine('${l.id}')" role="button" tabindex="0" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();strategistSelectLine('${l.id}')}" style="cursor:pointer;border-bottom:1px solid var(--border);${selected ? 'background:var(--light)' : ''}">
        <td style="padding:9px 10px"><strong>${esc(strategistDisplayClientName(l))}</strong></td>
        <td style="padding:9px 10px">${esc(strategistTacticDisplay(l))}${cpmOverrideBadgeHtml(l)}</td>
        ${platformCellHtml}
        <td style="padding:9px 10px;max-width:110px">${strategistFormatFlightRange(l.flight_start, l.flight_end)}</td>
        ${metricsCellsHtml}
        <td style="padding:9px 10px">${logCount} ${logCount === 1 ? 'entry' : 'entries'}</td>
        <td style="padding:9px 10px;text-align:center" title="${esc(l.setup_notes || '')}">${l.setup_notes ? '<span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--accent-dark)"></span>' : '<span style="color:var(--muted)">—</span>'}</td>
      </tr>`;
    });
  });
  html += '</tbody></table>';
  return html;
}

function strategistSelectLine(lineId) {
  const opening = strategistSelectedLineId !== lineId;
  strategistSelectedLineId = opening ? lineId : null;
  renderStrategistDashboard();
  // Scroll to the panel on open (2026-08-06, per Claire: it rendered below the
  // whole table, so opening it meant scrolling down to find it herself every
  // time) -- same smooth-scroll-to-editor convention admin/index.html already
  // uses for every one of its own edit forms.
  if (opening) document.getElementById('strategist-detail-panel').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

// Every field in the detail panel already saves on its own onchange -- this button
// exists purely to collapse the panel back closed (2026-08-06, per Claire: without
// it, the only way to close it was clicking the campaign row again, which wasn't
// obvious since nothing in the panel itself hinted that was how to dismiss it).
function strategistCloseDetailPanel() {
  strategistSelectedLineId = null;

}

// Fetches and shows the read-only order-detail modal (2026-08-13) --
// scoped to a single order via strategist_get_order_detail, not the bulk
// admin order list. Rendering itself lives in shared.js
// (renderOrderDetailModal) since it's identical to Accounting's own copy.
// Section id -> human label, own copy of admin's SECTIONS/sectionLabel() pattern
// (per this project's "each portal keeps its own copy" convention, same as
// Accounting's ACCOUNTING_SECTIONS) -- loaded lazily here since strategist/index.html
// otherwise has no reason to fetch the sections table at all.
let STRATEGIST_SECTIONS = [];

// Trello card link (2026-08-27, per Samantha via Claire -- a strategist
// wants to jump straight to a campaign's Trello card from the portal
// instead of hunting for it on the board). No new data to collect for
// this -- index.html already stamps every tactic card's real Trello id
// onto orders.trello_card_ids (keyed by the service's own `workflow`,
// same key admin/index.html already uses to resolve a card for the same
// order) the moment an order is submitted, so this is a pure display
// lookup against data that's been there all along. `trello_card_ids` is
// added to strategist_get_campaign_lines's own jsonb, not fetched here.
//
// campaign_lines.trello_card_url (2026-08-27, per Claire -- a manually-
// uploaded campaign, e.g. added through Accounting's "+ Add Service"
// instead of the real IO form, never went through submitIO() and so has
// no order-level trello_card_ids to resolve at all) is a plain manual
// fallback a strategist can paste in themselves -- checked FIRST, same
// "specific beats generic" precedence as every other override in this
// project, since a human explicitly pasting a link is more certain than
// an auto-resolved one.
function strategistTrelloCardUrl(line) {
  if (line.trello_card_url) return line.trello_card_url;
  const workflow = CATALOG_ROWS[line.service_id]?.workflow;
  const cardId = workflow ? line.trello_card_ids?.[workflow] : null;
  return cardId ? `https://trello.com/c/${cardId}` : null;
}

// Budget entry mode pill (2026-08-28, per Claire: "I want it to be clear
// what was ordered" -- a whole-campaign-total split evenly across months
// can look identical to a flat monthly rate in the raw numbers, and
// month_budgets alone can't tell 'total' and 'custom' apart downstream
// either). 'monthly' is the unchanged default and gets no pill, matching
// every campaign before this feature existed.
function strategistBudgetModePillHtml(line) {
  if (line.budget_entry_mode === 'total') return ` <span style="font-size:10px;font-weight:700;padding:3px 9px;border-radius:20px;background:var(--light);color:var(--accent-dark);border:1px solid var(--accent);white-space:nowrap">Whole Campaign Total</span>`;
  if (line.budget_entry_mode === 'custom') return ` <span style="font-size:10px;font-weight:700;padding:3px 9px;border-radius:20px;background:var(--light);color:var(--accent-dark);border:1px solid var(--accent);white-space:nowrap">Custom by Month</span>`;
  return '';
}

async function strategistViewOrder(orderId) {
  if (!orderId) return;
  try {
    if (!STRATEGIST_SECTIONS.length) STRATEGIST_SECTIONS = await sb('sections?order=sort_order&select=*') || [];
    const order = await sb('rpc/strategist_get_order_detail', {
      method: 'POST',
      body: JSON.stringify({ p_name: currentStrategistUser.name, p_pw: currentStrategistUser.pw, p_order_id: orderId })
    });
    renderOrderDetailModal(order, STRATEGIST_SECTIONS);
  } catch (e) {
    showToast('Could not load order: ' + e.message, 'error');
  }
}

        <div style="padding:8px 12px;border-radius:8px;background:var(--light);border:1px solid var(--border);min-width:100px">
          <div style="font-size:9.5px;font-weight:700;text-transform:uppercase;color:var(--muted);margin-bottom:3px">${esc(label)}</div>
          <input type="number" step="any" value="${monthRow[field] ?? ''}" onchange="strategistSaveMonth('${l.id}', '${strategistCurrentMonth.toISOString().slice(0,10)}', {${field}: this.value})" aria-label="${esc(label)}" style="width:90px;padding:3px 5px;border:none;background:transparent;font-family:monospace;font-size:14px;font-weight:700"/>
        </div>`).join('')}
    </div>

    <h4 style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:0 0 4px">Monthly history</h4>
    <p style="font-size:10.5px;color:var(--muted);margin:0 0 8px">In-Platform and Goal are normally computed automatically from that month's Gross Budget — the override next to each is there for a specific month that needs to diverge from the plan; leave it blank to keep using the auto-calculated value.${l.service_id === 'sem-bp' ? ' A range like "150-200" is OK for SEM\'s Goal; pacing uses the midpoint.' : ''} Check <strong>Paused</strong> on a month (e.g. a seasonal off-month) to have this campaign show up under Paused for just that month automatically — no need to remember to flip the Status dropdown above and back. Only applies while overall Status is Active; add a future month below to schedule one ahead of time.</p>
    <div style="border:1px solid var(--border);border-radius:8px;padding:4px 12px;margin-bottom:16px;background:var(--light)">
      <div style="display:flex;align-items:center;gap:8px;font-size:10px;font-weight:700;text-transform:uppercase;color:var(--muted);letter-spacing:.04em;padding:6px 0">
        <span style="width:90px">Month</span>
        <span style="width:60px">Paused</span>
        <span style="width:90px">Gross</span>
        <span style="width:130px">In-Platform</span>
        <span style="width:130px">Goal</span>
        <span style="width:90px">Actual Spend</span>
        <span style="width:75px">Clicks</span>
        <span style="width:85px">Impr.</span>
      </div>
      ${ALL_CAMPAIGN_MONTHS.filter(m => m.campaign_line_id === l.id).sort((a,b) => a.month.localeCompare(b.month)).map(m => {
        const autoInPlatform = computeInPlatformBudget(m.gross_budget, l.service_id, l.client_id, l.group_id, l.has_offline_visits || l.has_addl_targeting, l.retail_cpm_override);
        const autoGoal = computeGoal(l, { ...m, goal_override: null });
        return `
        <div style="display:flex;align-items:center;gap:8px;font-size:12.5px;padding:6px 0;border-bottom:1px solid var(--border)">
          <span style="width:90px;color:var(--muted);font-weight:600">${esc(strategistMonthLabel(new Date(m.month + 'T00:00:00')))}</span>
          <span style="width:60px;text-align:center"><input type="checkbox" ${m.paused ? 'checked' : ''} onchange="strategistSaveMonth('${l.id}', '${m.month}', {paused: this.checked})" aria-label="Paused for ${esc(strategistMonthLabel(new Date(m.month + 'T00:00:00')))}" title="Scheduled paused this month -- overrides Active down to effectively-Paused for this month only, without touching the campaign's overall status"/></span>
          <input type="number" value="${m.gross_budget ?? ''}" onchange="strategistSaveMonth('${l.id}', '${m.month}', {gross_budget: this.value, paused: this.value !== '' && Number(this.value) === 0})" placeholder="Gross" aria-label="Gross budget for ${esc(strategistMonthLabel(new Date(m.month + 'T00:00:00')))}" style="width:90px;padding:5px 6px;border-radius:6px;border:1px solid var(--border);font-size:11.5px"/>
          <input type="number" value="${m.in_platform_override ?? ''}" onchange="strategistSaveMonth('${l.id}', '${m.month}', {in_platform_override: this.value})" placeholder="${autoInPlatform != null ? 'Auto: ' + Math.round(autoInPlatform) : 'In-Platform override'}" aria-label="In-Platform override for ${esc(strategistMonthLabel(new Date(m.month + 'T00:00:00')))}" title="${m.in_platform_override != null ? 'Overridden — auto-calculated value is ' + (autoInPlatform != null ? '$' + Math.round(autoInPlatform) : 'unavailable') : ''}" style="width:130px;padding:5px 6px;border-radius:6px;border:1px ${m.in_platform_override != null ? 'solid var(--accent)' : 'dashed var(--border)'};font-size:11.5px"/>
          <input type="${l.service_id === 'sem-bp' ? 'text' : 'number'}" value="${esc(m.goal_override ?? '')}" onchange="strategistSaveMonth('${l.id}', '${m.month}', {goal_override: this.value})" placeholder="${l.service_id === 'sem-bp' ? (autoGoal.value != null ? 'Auto: ' + autoGoal.display : 'e.g. 150 or 150-200') : (autoGoal.value != null ? 'Auto: ' + autoGoal.display : 'Goal')}" aria-label="Goal for ${esc(strategistMonthLabel(new Date(m.month + 'T00:00:00')))}" title="${m.goal_override != null && m.goal_override !== '' ? 'Overridden — auto-calculated value is ' + (autoGoal.value != null ? autoGoal.display + ' ' + autoGoal.unit : 'unavailable') : ''}" style="width:130px;padding:5px 6px;border-radius:6px;border:1px ${m.goal_override != null && m.goal_override !== '' ? 'solid var(--accent)' : 'dashed var(--border)'};font-size:11.5px"/>
          <input type="number" value="${m.actual_spend ?? ''}" onchange="strategistSaveMonth('${l.id}', '${m.month}', {actual_spend: this.value})" placeholder="Actual spend" aria-label="Actual spend for ${esc(strategistMonthLabel(new Date(m.month + 'T00:00:00')))}" style="width:90px;padding:5px 6px;border-radius:6px;border:1px solid var(--border);font-size:11.5px"/>
          <input type="number" value="${m.actual_clicks ?? ''}" onchange="strategistSaveMonth('${l.id}', '${m.month}', {actual_clicks: this.value})" placeholder="Clicks" aria-label="Clicks for ${esc(strategistMonthLabel(new Date(m.month + 'T00:00:00')))}" style="width:75px;padding:5px 6px;border-radius:6px;border:1px solid var(--border);font-size:11.5px"/>
          <input type="number" value="${m.actual_impressions ?? ''}" onchange="strategistSaveMonth('${l.id}', '${m.month}', {actual_impressions: this.value})" placeholder="Impr." aria-label="Impressions for ${esc(strategistMonthLabel(new Date(m.month + 'T00:00:00')))}" style="width:85px;padding:5px 6px;border-radius:6px;border:1px solid var(--border);font-size:11.5px"/>
        </div>`;
      }).join('') || '<p style="font-size:11px;color:var(--muted);padding:6px 0">No months on record yet.</p>'}
      <div style="display:flex;align-items:center;gap:8px;margin:8px 0">
        <input type="month" id="add-month-${l.id}" style="padding:4px 8px;border-radius:6px;border:1px solid var(--border);font-size:11px"/>
        <button onclick="strategistAddHistoryMonth('${l.id}')" style="padding:4px 10px;border-radius:6px;border:1px solid var(--border);background:#fff;font-size:11px;cursor:pointer">+ Add another month</button>
        ${l.flight_end ? `<button onclick="strategistFillMonthsToFlightEnd('${l.id}')" style="padding:4px 10px;border-radius:6px;border:1px solid var(--border);background:#fff;font-size:11px;cursor:pointer" title="Fills every remaining month through the flight end date using the last month's own Gross Budget as the default">Fill remaining months to flight end</button>` : ''}
      </div>
    </div>

    <h4 style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:0 0 8px">Optimize log</h4>
    ${log.map(o => `<div style="display:flex;align-items:flex-start;gap:14px;padding:8px 0;border-bottom:1px solid var(--border)">
      <span style="font-family:monospace;font-size:11px;color:var(--muted);width:80px;flex:none">${esc(o.entry_date)}</span>
      <span style="font-size:12.5px;flex:1">${esc(o.note)}</span>
      <span style="flex:none;display:flex;gap:8px">
        <a href="#" onclick="event.preventDefault();strategistEditLogEntry('${l.id}','${o.id}')" style="font-size:11px;font-weight:600;color:var(--accent-dark);cursor:pointer">Edit</a>
        <a href="#" onclick="event.preventDefault();strategistDeleteLogEntry('${o.id}')" style="font-size:11px;font-weight:600;color:#B3261E;cursor:pointer">Delete</a>
      </span>
    </div>`).join('') || '<p style="font-size:12px;color:var(--muted)">No entries yet.</p>'}

    <div id="log-entry-form-${l.id}" style="margin-top:12px;display:flex;gap:8px;align-items:flex-end">
      <div>
        <label class="lbl" for="log-date-${l.id}">Date</label>
        <input type="date" id="log-date-${l.id}" value="${new Date().toISOString().slice(0,10)}" style="padding:6px 8px;border-radius:6px;border:1px solid var(--border);font-size:12px"/>
      </div>
      <div style="flex:1">
        <label class="lbl" for="log-note-${l.id}">What was changed</label>
        <input type="text" id="log-note-${l.id}" style="width:100%;padding:6px 8px;border-radius:6px;border:1px solid var(--border);font-size:12px"/>
      </div>
      <input type="hidden" id="log-edit-id-${l.id}"/>
      <button onclick="strategistSaveLogEntry('${l.id}')" style="padding:7px 14px;border-radius:6px;background:var(--accent-dark);color:#fff;border:none;font-size:12px;font-weight:600;cursor:pointer">Add</button>
    </div>
  </div>`;
}

function strategistEditLogEntry(lineId, logId) {
  const entry = ALL_OPTIMIZE_LOG.find(o => o.id === logId);
  if (!entry) return;
  document.getElementById('log-date-' + lineId).value = entry.entry_date;
  document.getElementById('log-note-' + lineId).value = entry.note;
  document.getElementById('log-edit-id-' + lineId).value = entry.id;
}

async function strategistSaveLogEntry(lineId) {
  const date = document.getElementById('log-date-' + lineId).value;
  const note = document.getElementById('log-note-' + lineId).value.trim();
  const editId = document.getElementById('log-edit-id-' + lineId).value || null;
  if (!note) { showToast('Enter what was changed.', 'error'); return; }
  try {
    await sb('rpc/strategist_save_optimize_log', { method: 'POST', body: JSON.stringify({
      p_name: currentStrategistUser.name, p_pw: currentStrategistUser.pw,
      p_id: editId, p_campaign_line_id: lineId, p_entry_date: date, p_note: note
    }) });
    await fetchStrategistData();
    strategistSelectedLineId = lineId;
    renderStrategistDashboard();
    showToast('Optimize log saved');
  } catch(e) { showToast('Error saving log entry: ' + e.message, 'error'); }
}

async function strategistDeleteLogEntry(logId) {
  try {
    await sb('rpc/strategist_delete_optimize_log', { method: 'POST', body: JSON.stringify({
      p_name: currentStrategistUser.name, p_pw: currentStrategistUser.pw, p_id: logId
    }) });
    await fetchStrategistData();
    renderStrategistDashboard();
    showToast('Entry deleted');
  } catch(e) { showToast('Error deleting entry: ' + e.message, 'error'); }
}

function strategistLogout() {
  currentStrategistUser = null;
  showStrategistPanel(false);
  promptStrategistLogin();
}

// Silent handoff from the admin portal's "Go to Strategist Portal" link (2026-08-04,
// per Claire: "When I click the strategist link from the admin portal I have to log
// in again"). admin/index.html stashes the already-authenticated name/password into
// sessionStorage right before navigating; picked up here ONCE (cleared immediately,
// whether it works or not) so it can never be replayed by, say, opening this page
// again later in the same tab. Same plaintext-in-memory trust model this whole app
// already uses everywhere (no tokens/cookies anywhere in this project) — sessionStorage
// just carries that same value across the one page hop, cleared right after reading.
async function tryStrategistHandoffLogin() {
  let name, pw;
  try {
    name = sessionStorage.getItem('strategist_handoff_name');
    pw = sessionStorage.getItem('strategist_handoff_pw');
    sessionStorage.removeItem('strategist_handoff_name');
    sessionStorage.removeItem('strategist_handoff_pw');
  } catch(e) { return false; } // e.g. sessionStorage blocked entirely (privacy mode, unusual origin)
  if (!name || !pw) return false;
  const result = await attemptStrategistLogin(name, pw);
  if (!result.ok) return false;
  currentStrategistUser = { name, email: result.email, role: result.role, pw };
  showStrategistPanel(true);
  return true;
}

document.addEventListener('DOMContentLoaded', async () => {
  await loadStrategistRoster();
  if (await tryStrategistHandoffLogin()) return;
  promptStrategistLogin();
});
</script>
</body>
</html>
