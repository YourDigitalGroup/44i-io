      tacticLabel,
      serviceId,
      displayLabel: `${tacticLabel} — ${CATALOG_ROWS[serviceId].accounting_label || CATALOG_ROWS[serviceId].label}`,
    }))
  );
}

// These same 4 tactics (2026-08-17, per Claire: "there isn't anything to really
// track [for LLO, LLO (SEO), Reputation Mgmt., Rep Monitoring (SEO)]... update
// their lines so it looks a little cleaner") have no platform, budget, or
// performance numbers at all -- carrying no spend/budget of their own is exactly
// why they're in TRACKABLE_FLAT_SERVICE_IDS/getSeoTrackingOnlyTactics() above.
// renderMainTable() uses this to collapse the Gross Budget/In-Platform Budget/
// Actual Spend/Spend Pacing/Goal/Actual Perf./Perf. Pacing columns (which would
// otherwise just be 7 "—"s in a row) into one plain explanatory cell, and to
// swap the editable Platform dropdown for a plain dash -- Optimize Log and Notes
// stay fully real and untouched, since strategists genuinely use both for these.
// Matched by service_id for the two catalog-backed tactics (llo-bp/rep-bp) and by
// tactic_label for the two SEO-trigger-only ones (2026-08-21: now anchored to
// whichever real SEO tier was actually picked, not always seo-bp -- see
// getSeoTrackingOnlyTactics()'s own comment -- so service_id alone still can't
// tell a SEO tracking line apart from a real SEO campaign, but for a different
// reason than before: it's a real tier id, just one of these placeholder rows).
const FLAT_FEE_NO_METRICS_TACTIC_LABELS = ['LLO (SEO)', 'Rep Monitoring (SEO)'];
function isFlatFeeNoMetricsLine(line) {
  return TRACKABLE_FLAT_SERVICE_IDS.includes(line.service_id) ||
    FLAT_FEE_NO_METRICS_TACTIC_LABELS.includes(line.tactic_label);
}

// Returns { service, tacticLabel } or null. Checks the catalog's own combined
// label first, then falls back to searching every spend service's
// tactic_variants -- the 5 "which one is it" services (e.g. "Event or
// Lookback") don't match on their combined label at all; a strategist pastes
// the SPECIFIC variant name ("Event Targeting", "Lookback Targeting") instead,
// so tacticLabel comes back as that exact variant text, not the combined one.
function resolveBulkTactic(name) {
  const norm = (name || '').trim().toLowerCase();
  if (!norm) return null;
  if (CATALOG_ROWS[name]) { // literal service_id typed directly
    const r = CATALOG_ROWS[name];
    return { service: r, tacticLabel: r.accounting_label || r.label };
  }
  const direct = Object.values(CATALOG_ROWS).find(r => (r.pricing_mode === 'spend' || TRACKABLE_FLAT_SERVICE_IDS.includes(r.id)) &&
    ((r.accounting_label || r.label || '').trim().toLowerCase() === norm));
  if (direct) return { service: direct, tacticLabel: direct.accounting_label || direct.label };
  // "LLO (SEO)"/"Rep Monitoring (SEO)" text alone (2026-08-21, per Claire -- the audit
  // was showing Pro for every client regardless of real tier) can't be auto-matched to
  // one of the 3 real SEO tiers now that the tier actually matters (Trello card-name
  // audit resolves its expected template off this exact service_id) -- deliberately left
  // unresolved here so it falls through to the fix-it override flow below, where the
  // real tier gets picked explicitly from getSeoTrackingOnlyTactics()'s 6 options
  // instead of silently defaulting to Pro (seo-bp) like it used to.
  for (const r of Object.values(CATALOG_ROWS)) {
    if (r.pricing_mode !== 'spend' || !Array.isArray(r.tactic_variants)) continue;
    const variant = r.tactic_variants.find(v => v.trim().toLowerCase() === norm);
    if (variant) return { service: r, tacticLabel: variant };
  }
  return null;
}

// Pure parse: paste text in, a plan out. Never touches the database -- callers
// decide what to do with the result. Returns { error } for a hard stop (missing
// required columns), or { groups, errors } where groups is a Map of identityKey ->
// campaign fields + monthRows, and errors is a list of unresolved/invalid rows.
//
// `overrides` (keyed by rowNum, 2026-08-10 per Claire -- "could the preview call
// out the things that don't match and I can update them exactly or remove them,"
// rather than having to fix the paste and start over) lets a specific row's
// client/tactic be forced to a real id picked from a dropdown, or the row dropped
// entirely, WITHOUT touching the pasted text at all -- re-parsing with the same
// raw text plus an override is how a correction actually takes effect.
function strategistParseBulkImport(raw, overrides = {}) {
  const rows = parsePastedReportRows(raw);
  if (rows.length < 2) return { error: 'Need a header row plus at least one data row.' };

  const header = rows[0].map(normalizeHeaderName);
  const colIndex = {};
  BULK_IMPORT_COLUMNS.forEach(({ key, names }) => {
    const idx = header.findIndex(h => names.includes(h));
    if (idx !== -1) colIndex[key] = idx;
  });
  const missingRequired = ['client', 'tactic'].filter(k => colIndex[k] === undefined);
  if (missingRequired.length) {
    return { error: 'Header row is missing required column(s): ' + missingRequired.join(', ') };
  }

  const errors = []; // { rowNum, field: 'client'|'tactic', clientName, tacticName }
  // Group data rows by the campaign identity they belong to, so several months for
  // the SAME campaign share one campaign_lines row instead of creating a duplicate
  // per row.
  const groups = new Map(); // identityKey -> { fields, monthRows: [] }
  rows.slice(1).forEach((cols, i) => {
    const rowNum = i + 2; // 1-based, header is row 1
    if (overrides[rowNum]?.excluded) return; // removed from the import, per Claire's own review
    const get = (key) => colIndex[key] !== undefined ? (cols[colIndex[key]] || '').trim() : '';
    const clientName = get('client'), tacticName = get('tactic');
    if (!clientName && !tacticName) return; // blank line
    const clientOverrideId = overrides[rowNum]?.clientId;
    const serviceOverrideId = overrides[rowNum]?.serviceId;
    const client = clientOverrideId ? ALL_STRATEGIST_CLIENTS.find(c => c.id === clientOverrideId) : resolveBulkClient(clientName);
    const seoTrackOverrideMatch = serviceOverrideId ? /^__seo_track_(\d+)__$/.exec(serviceOverrideId) : null;
    const tacticMatch = seoTrackOverrideMatch
      ? { service: CATALOG_ROWS[getSeoTrackingOnlyTactics()[Number(seoTrackOverrideMatch[1])].serviceId], tacticLabel: getSeoTrackingOnlyTactics()[Number(seoTrackOverrideMatch[1])].tacticLabel }
      : serviceOverrideId
      ? { service: CATALOG_ROWS[serviceOverrideId], tacticLabel: CATALOG_ROWS[serviceOverrideId]?.accounting_label || CATALOG_ROWS[serviceOverrideId]?.label }
      : resolveBulkTactic(tacticName);
    const service = tacticMatch?.service || null;
    if (!client) { errors.push({ rowNum, field: 'client', clientName, tacticName }); return; }
    if (!service) { errors.push({ rowNum, field: 'tactic', clientName, tacticName }); return; }
    // Normalized to lowercase and validated against the 4 real statuses this
    // portal actually knows about -- found live 2026-08-10 (Claire): a CSV's
    // Status column typed as "Active" (capitalized) saved exactly as typed and
    // then matched NONE of the lowercase-only status tabs anywhere, making 238
    // real campaigns invisible on every tab, in every month, regardless of scope.
    const statusOverride = overrides[rowNum]?.status;
    const statusRaw = get('status');
    const status = statusOverride || (statusRaw ? statusRaw.toLowerCase() : 'active');
    if (!BULK_IMPORT_VALID_STATUSES.includes(status)) {
      errors.push({ rowNum, field: 'status', clientName, tacticName, statusRaw });
      return;
    }
    // A Pending campaign can genuinely be waiting on more than one thing at once
    // (Claire: "Need creative AND access to FB page") -- semicolon-separated in
    // the cell (e.g. "Creative; Platform Access"), each part matched against the
    // same 3 options the Setup panel itself offers: its key ("creative"), its
    // full label ("Waiting on Creative"), or just the short form ("Creative"),
    // all case-insensitive. Blank is always fine (just means "nothing specific
    // yet"); any unrecognized part is a typo worth catching, not silently
    // dropping -- the WHOLE row is flagged rather than dropping just that part,
    // since a fix-it override here can only replace the full list anyway.
    const blockerOverride = overrides[rowNum]?.setupBlocker;
    const blockerRaw = get('setup_blocker');
    let setupBlocker = null;
    if (blockerOverride) {
      setupBlocker = Array.isArray(blockerOverride) ? blockerOverride : [blockerOverride];
    } else if (blockerRaw) {
      const parts = blockerRaw.split(';').map(s => s.trim()).filter(Boolean);
      const resolved = [];
      for (const part of parts) {
        const wanted = part.toLowerCase();
        const found = Object.entries(SETUP_BLOCKER_LABELS).find(([key, label]) =>
          key === wanted || label.toLowerCase() === wanted || label.toLowerCase().replace(/^waiting on /, '') === wanted);
        if (found) { resolved.push(found[0]); continue; }
        errors.push({ rowNum, field: 'setup_blocker', clientName, tacticName, blockerRaw: part });
        return;
      }
      setupBlocker = resolved;
    }
    const platform = get('platform');
    const platformCampaignName = get('platform_campaign_name');
    const agentName = get('agent_name') || null;
    const county = get('county') || null;
    // Includes tacticLabel, not just service.id -- otherwise LLO (SEO) and Rep
    // Monitoring (SEO) (same anchor service_id, and typically no distinct
    // platform/title of their own) would collide into ONE group instead of two
    // separate campaigns. Safe for every other case too: multiple month rows
    // for the same real campaign always carry the same tactic text already.
    // Also includes agent_name/county (2026-08-21) -- a multi-agent client (MS Farm
    // Bureau) sells the SAME tactic to several different agents at once; without
    // this, every agent's row for "Geofencing" would collapse into ONE group instead
    // of one per agent, matching the same identity rule the real order trigger's own
    // agent-split fan-out already uses (client + service + agent + county).
    const identityKey = [client.id, service.id, tacticMatch.tacticLabel, platform, platformCampaignName, agentName, county].join('|');
    const rowFlightStart = get('flight_start') || null;
    const rowFlightEnd = get('flight_end') || null;
    if (!groups.has(identityKey)) {
      groups.set(identityKey, {
        client_id: client.id, group_id: client.group_id, service_id: service.id,
        tactic_label: tacticMatch.tacticLabel, platform: platform || null,
        platform_campaign_name: platformCampaignName || null, split_label: get('split_label') || null,
        status, flight_start: rowFlightStart, flight_end: rowFlightEnd,
        setup_notes: get('setup_notes') || null, setup_blocker: setupBlocker,
        agent_name: agentName, county,
        monthRows: [],
      });
    } else {
      // Real bug found live (2026-08-10, Claire): a later row for the SAME campaign
      // (e.g. a second recurring wave with its own, later dates) had its
      // flight_start/flight_end silently dropped -- only the very first row's dates
      // were ever kept. Now extends to the earliest start / latest end seen across
      // every row for this campaign, instead of freezing on the first one.
      const g = groups.get(identityKey);
      if (rowFlightStart && (!g.flight_start || rowFlightStart < g.flight_start)) g.flight_start = rowFlightStart;
      if (rowFlightEnd && (!g.flight_end || rowFlightEnd > g.flight_end)) g.flight_end = rowFlightEnd;
    }
    const month = get('month');
    // Same fix as the paste-report tool (2026-08-06): a real spreadsheet's Gross
    // Budget column can be "$1,500"-formatted -- strip $ and , before it ever reaches
    // a numeric column, or the save throws Postgres error 22P02.
    const grossBudget = get('gross_budget').replace(/[$,]/g, '').trim();
    // Same $/, stripping for In-Platform Override (also always numeric); Goal is
    // deliberately left alone -- SEM's own goal can be a text range ("150-200"),
    // which a blanket strip would mangle.
    const inPlatformOverride = get('in_platform_override').replace(/[$,]/g, '').trim();
    const goalOverride = get('goal_override').trim();
    if (month) groups.get(identityKey).monthRows.push({ month, grossBudget, inPlatformOverride, goalOverride, rowNum });
  });

  // Splits: rows sharing the same client+tactic+platform that were given a Split
  // Label become siblings -- same mechanism as the Setup panel's own split feature
  // (split_label + split_order), but each is created directly as its own line here
  // rather than exploding out of one existing line, since bulk import creates
  // brand-new campaigns rather than splitting an already-existing one. Order is
  // purely "first seen in the paste," same convention as everywhere else split
  // ordering matters in this project.
  const splitGroupOrder = new Map(); // splitGroupKey -> [identityKey, ...] in first-seen order
  for (const [identityKey, g] of groups) {
    if (!g.split_label) continue;
    const splitGroupKey = [g.client_id, g.service_id, g.platform].join('|');
    if (!splitGroupOrder.has(splitGroupKey)) splitGroupOrder.set(splitGroupKey, []);
    splitGroupOrder.get(splitGroupKey).push(identityKey);
  }
  for (const identityKeys of splitGroupOrder.values()) {
    identityKeys.forEach((identityKey, idx) => { groups.get(identityKey).split_order = idx; });
  }

  // Existing campaigns are matched the same way the paste-report tool does -- by
  // platform_campaign_name -- so re-running an import (e.g. to add a newer month)
  // updates the SAME campaign instead of creating a duplicate.
  const existingByTitle = {};
  ALL_CAMPAIGN_LINES.forEach(l => {
    if (l.platform_campaign_name) existingByTitle[l.platform_campaign_name.trim().toLowerCase()] = l;
  });
  // Agent rows rarely carry a platform_campaign_name (2026-08-21) -- falls back to
  // the SAME (client, service, agent, county) identity the order trigger's own
  // agent-split fan-out uses for dedup, so re-importing an agent already on record
  // updates their existing line instead of creating a duplicate.
  const existingByAgent = {};
  ALL_CAMPAIGN_LINES.forEach(l => {
    if (l.agent_name && l.county) existingByAgent[[l.client_id, l.service_id, l.agent_name, l.county].join('|').toLowerCase()] = l;
  });
  for (const g of groups.values()) {
    g.existingLineId = g.platform_campaign_name
      ? existingByTitle[g.platform_campaign_name.trim().toLowerCase()]?.id
      : (g.agent_name && g.county ? existingByAgent[[g.client_id, g.service_id, g.agent_name, g.county].join('|').toLowerCase()]?.id : null);
  }

  return { groups, errors };
}

// Per-rowNum corrections applied on top of the raw paste, without editing the
// textarea itself -- 2026-08-10, per Claire: fixing a mismatch shouldn't require
// re-pasting the whole thing. Cleared whenever the form opens/closes.
let BULK_IMPORT_OVERRIDES = {};

// Parses and shows what WOULD happen -- nothing is saved yet. Claire (2026-08-10):
// wanted a chance to catch a bad row before anything actually gets created, same
// review-before-import pattern used elsewhere in this project. Also the single
// re-render path for every correction made below -- a dropdown pick or a "Remove
// this row" click both just record an override and call this again.
function strategistRenderBulkPreview() {
  const raw = document.getElementById('bulk-import-text').value;
  if (!raw.trim()) { showToast('Paste something first.', 'error'); return; }
  const plan = strategistParseBulkImport(raw, BULK_IMPORT_OVERRIDES);
  if (plan.error) { showToast(plan.error, 'error'); return; }
  BULK_IMPORT_PLAN = plan;

  const rowsHtml = [...plan.groups.values()].map(g => {
    const monthsSummary = g.monthRows.length
      ? g.monthRows.map(m => {
          const extras = [m.inPlatformOverride ? `IP $${m.inPlatformOverride}` : null, m.goalOverride ? `Goal ${m.goalOverride}` : null].filter(Boolean);
          return `${m.month} ($${m.grossBudget || '—'}${extras.length ? ', ' + extras.join(', ') : ''})`;
        }).join(', ')
      : '—';
    const action = g.existingLineId ? '<span style="color:#0F766E;font-weight:600">Match existing</span>' : '<span style="color:var(--accent-dark);font-weight:600">Create new</span>';
    const blockerLabels = Array.isArray(g.setup_blocker) ? g.setup_blocker.map(b => SETUP_BLOCKER_LABELS[b]).filter(Boolean) : [];
    const waitingOn = [blockerLabels.join(', ') || null, g.setup_notes].filter(Boolean).join(' — ');
    return `<tr style="border-bottom:1px solid var(--border)">
      <td style="padding:9px 10px">${esc(g.tactic_label)}${g.split_label ? ' <span style="color:var(--muted)">— ' + esc(g.split_label) + '</span>' : ''}</td>
      <td style="padding:9px 10px">${g.agent_name || g.county ? esc([g.agent_name, g.county ? g.county + ' County' : null].filter(Boolean).join(' — ')) : '—'}</td>
      <td style="padding:9px 10px">${esc(g.platform || '—')}</td>
      <td style="padding:9px 10px">${esc(g.platform_campaign_name || '—')}</td>
      <td style="padding:9px 10px">${esc(g.status)}</td>
      <td style="padding:9px 10px;font-size:11px;color:var(--muted)">${esc(waitingOn || '—')}</td>
      <td style="padding:9px 10px;font-size:11px;color:var(--muted)">${esc(monthsSummary)}</td>
      <td style="padding:9px 10px">${action}</td>
    </tr>`;
  }).join('');

  // Each unresolved row gets a fix-it block right in the preview -- a dropdown of
  // the REAL clients/tactics to pick the right one, or a button to drop the row
  // entirely -- rather than a plain error string that sends you back to the paste.
  const clientOptions = [...ALL_STRATEGIST_CLIENTS].sort((a, b) => a.name.localeCompare(b.name))
    .map(c => `<option value="${esc(c.id)}">${esc(c.name)}${c.group_name ? ' (' + esc(c.group_name) + ')' : ''}</option>`).join('');
  const tacticOptions = Object.values(CATALOG_ROWS).filter(s => s.pricing_mode === 'spend' || TRACKABLE_FLAT_SERVICE_IDS.includes(s.id))
    .sort((a, b) => (a.accounting_label || a.label).localeCompare(b.accounting_label || b.label))
    .map(s => `<option value="${esc(s.id)}">${esc(s.accounting_label || s.label)}</option>`).join('') +
    getSeoTrackingOnlyTactics().map((t, i) => `<option value="__seo_track_${i}__">${esc(t.displayLabel)}</option>`).join('');
  const statusOptions = BULK_IMPORT_VALID_STATUSES.map(s => `<option value="${esc(s)}">${esc(s)}</option>`).join('');
  const blockerOptions = Object.entries(SETUP_BLOCKER_LABELS).map(([key, label]) => `<option value="${esc(key)}">${esc(label)}</option>`).join('');
  const errorsHtml = plan.errors.map(e => {
    let message, fixSelect;
    if (e.field === 'client') {
      message = `no client matches "${esc(e.clientName)}"`;
      fixSelect = `<select onchange="strategistApplyBulkOverride(${e.rowNum}, 'clientId', this.value)" style="padding:5px 8px;border-radius:6px;border:1.5px solid var(--accent-dark);color:var(--accent-dark);font-size:11.5px"><option value="">— Pick the right client —</option>${clientOptions}</select>`;
    } else if (e.field === 'tactic') {
      message = `no tactic matches "${esc(e.tacticName)}"`;
      fixSelect = `<select onchange="strategistApplyBulkOverride(${e.rowNum}, 'serviceId', this.value)" style="padding:5px 8px;border-radius:6px;border:1.5px solid var(--accent-dark);color:var(--accent-dark);font-size:11.5px"><option value="">— Pick the right tactic —</option>${tacticOptions}</select>`;
    } else if (e.field === 'setup_blocker') {
      message = `"${esc(e.blockerRaw)}" isn't a real setup blocker`;
      fixSelect = `<select onchange="strategistApplyBulkOverride(${e.rowNum}, 'setupBlocker', this.value)" style="padding:5px 8px;border-radius:6px;border:1.5px solid var(--accent-dark);color:var(--accent-dark);font-size:11.5px"><option value="">— Pick the right blocker —</option>${blockerOptions}</select>`;
    } else {
      // status -- only pending/active/paused/complete are recognized anywhere in
      // this portal; anything else (a typo, wrong capitalization) saves fine but
      // is then invisible on every tab, so it's caught here instead.
      message = `"${esc(e.statusRaw)}" isn't a real status`;
      fixSelect = `<select onchange="strategistApplyBulkOverride(${e.rowNum}, 'status', this.value)" style="padding:5px 8px;border-radius:6px;border:1.5px solid var(--accent-dark);color:var(--accent-dark);font-size:11.5px"><option value="">— Pick the right status —</option>${statusOptions}</select>`;
    }
    return `<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:6px 0;border-bottom:1px solid var(--border)">
      <span style="font-size:11.5px;color:#B91C1C">Row ${e.rowNum}: ${message}</span>
      ${fixSelect}
      <button onclick="strategistApplyBulkOverride(${e.rowNum}, 'excluded', true)" style="padding:5px 10px;border-radius:6px;border:1px solid var(--border);background:var(--light);font-size:11px;cursor:pointer">Remove this row</button>
    </div>`;
  }).join('');

  const resultsEl = document.getElementById('bulk-import-results');
  if (!resultsEl) return;
  resultsEl.innerHTML = `
    <p style="font-size:12px;font-weight:600;margin:0 0 6px">Preview — nothing saved yet. ${plan.groups.size} campaign(s) found${plan.errors.length ? `, ${plan.errors.length} row issue(s)` : ''}.</p>
    ${plan.groups.size ? `<div style="overflow-x:auto;margin-bottom:10px"><table style="width:100%;border-collapse:collapse;font-size:12.5px">
      <thead><tr style="background:var(--light);text-align:left"><th style="font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding:9px 10px">Tactic</th><th style="font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding:9px 10px">Agent / County</th><th style="font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding:9px 10px">Platform</th><th style="font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding:9px 10px">Title</th><th style="font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding:9px 10px">Status</th><th style="font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding:9px 10px">Waiting on</th><th style="font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding:9px 10px">Months</th><th style="font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding:9px 10px">Action</th></tr></thead>
      <tbody>${rowsHtml}</tbody>
    </table></div>` : ''}
    ${plan.errors.length ? `<p style="font-size:12px;color:#B91C1C;font-weight:600;margin:4px 0 4px">${plan.errors.length} row(s) need a fix before they'll import:</p><div style="margin-bottom:10px">${errorsHtml}</div>` : ''}
    ${plan.groups.size ? `<div style="display:flex;gap:10px"><button id="bulk-import-confirm-btn" onclick="strategistConfirmBulkImport()" style="padding:7px 16px;border-radius:6px;background:var(--accent-dark);color:#fff;border:none;font-size:12.5px;font-weight:600;cursor:pointer">Confirm Import</button></div>` : ''}
  `;
}

// Button-triggered entry point -- same rendering as every override-driven refresh
// below, just the first pass over freshly pasted text.
function strategistPreviewBulkImport() {
  BULK_IMPORT_OVERRIDES = {};
  strategistRenderBulkPreview();
}

// Records one row's correction (a picked client/tactic id, or "remove this row")
// and immediately re-renders the preview against the SAME pasted text -- the
// fixed/removed row either joins the real campaign table above or disappears from
// the issues list, without ever touching the textarea.
function strategistApplyBulkOverride(rowNum, field, value) {
  BULK_IMPORT_OVERRIDES[rowNum] = { ...BULK_IMPORT_OVERRIDES[rowNum], [field]: value };
  strategistRenderBulkPreview();
}

// Guards against a real bug Claire hit live (2026-08-10): 119 campaigns took long
// enough (each needs its own sequential RPC round trip) that clicking Confirm gave
// no visible feedback at all, so she clicked it again -- which ran the whole save
// loop a SECOND time against the same not-yet-cleared plan, creating a duplicate
// for every campaign that didn't already exist. This flag blocks a second
// invocation outright, and disabling+relabeling the button below gives the
// immediate feedback that was actually missing in the first place.
let BULK_IMPORT_CONFIRMING = false;

// Actually saves whatever strategistPreviewBulkImport() already parsed and showed.
async function strategistConfirmBulkImport() {
  if (BULK_IMPORT_CONFIRMING) { showToast('Already saving — one moment.', 'error'); return; }
  const plan = BULK_IMPORT_PLAN;
  if (!plan) { showToast('Nothing to import — preview first.', 'error'); return; }
  BULK_IMPORT_CONFIRMING = true;
  const confirmBtn = document.getElementById('bulk-import-confirm-btn');
  if (confirmBtn) { confirmBtn.disabled = true; confirmBtn.textContent = 'Saving…'; confirmBtn.style.cursor = 'default'; confirmBtn.style.opacity = '.6'; }
  try {
  // plan.errors are the structured {rowNum, field, ...} objects the preview's
  // fix-it UI reads directly -- flatten to plain strings here since everything
  // pushed onto `errors` from this point on (a bad month, a failed save) is a
  // fully-resolved sentence for the final results list, not something with its
  // own correction UI.
  const errors = plan.errors.map(e => {
    if (e.field === 'status') return `Row ${e.rowNum}: "${e.statusRaw}" isn't a real status`;
    if (e.field === 'setup_blocker') return `Row ${e.rowNum}: "${e.blockerRaw}" isn't a real setup blocker`;
    return `Row ${e.rowNum}: no ${e.field} matches "${e.field === 'client' ? e.clientName : e.tacticName}"`;
  });

  let createdCount = 0, matchedExistingCount = 0, monthsSavedCount = 0, reportsAppliedCount = 0;
  for (const g of plan.groups.values()) {
    let lineId = g.existingLineId;
    if (lineId) {
      matchedExistingCount++;
    } else {
      try {
        lineId = await sb('rpc/strategist_save_campaign_line', { method: 'POST', body: JSON.stringify({
          p_name: currentStrategistUser.name, p_pw: currentStrategistUser.pw, p_id: null,
          p_data: {
            client_id: g.client_id, group_id: g.group_id, service_id: g.service_id, tactic_label: g.tactic_label,
            platform: g.platform, platform_campaign_name: g.platform_campaign_name,
            split_label: g.split_label, split_order: g.split_order ?? null,
            flight_start: g.flight_start, flight_end: g.flight_end,
            status: g.status, assigned_strategist: currentStrategistUser.name,
            setup_notes: g.setup_notes, setup_blocker: g.setup_blocker,
            agent_name: g.agent_name, county: g.county,
          }
        }) });
        createdCount++;
      } catch(e) { errors.push(`Couldn't create campaign for "${g.tactic_label}" (${g.platform_campaign_name || 'no title'}): ${e.message}`); continue; }
    }
    for (const mr of g.monthRows) {
      const match = /^(\d{4})-(\d{2})$/.exec(mr.month);
      if (!match) { errors.push(`Row ${mr.rowNum}: "${mr.month}" isn't a valid month (use YYYY-MM)`); continue; }
      const monthData = {};
      if (mr.grossBudget) monthData.gross_budget = mr.grossBudget;
      if (mr.inPlatformOverride) monthData.in_platform_override = mr.inPlatformOverride;
      if (mr.goalOverride) monthData.goal_override = mr.goalOverride;
      try {
        await sb('rpc/strategist_save_campaign_month', { method: 'POST', body: JSON.stringify({
          p_name: currentStrategistUser.name, p_pw: currentStrategistUser.pw,
          p_campaign_line_id: lineId, p_month: `${match[1]}-${match[2]}-01`,
          p_data: monthData
        }) });
        monthsSavedCount++;
      } catch(e) { errors.push(`Row ${mr.rowNum}: couldn't save month: ${e.message}`); }
    }
    // Real gap found live (2026-08-10, Claire): every OTHER way a campaign gets
    // created or edited in this portal checks the cached platform report for a
    // title match and auto-fills actuals -- bulk import never did. Same lookup,
    // no refetch/rerender per row (see findCachedReportMatch's own comment).
    const cachedMatch = findCachedReportMatch(g.platform, g.platform_campaign_name);
    if (cachedMatch) {
      try {
        await sb('rpc/strategist_save_campaign_month', { method: 'POST', body: JSON.stringify({
          p_name: currentStrategistUser.name, p_pw: currentStrategistUser.pw,
          p_campaign_line_id: lineId, p_month: cachedMatch.report_month, p_data: cachedMatch.data
        }) });
        reportsAppliedCount++;
      } catch(e) { errors.push(`Couldn't apply the cached platform report for "${g.tactic_label}" (${g.platform_campaign_name}): ${e.message}`); }
    }
  }

  BULK_IMPORT_PLAN = null;
  await fetchStrategistData();
  renderStrategistDashboard();

  const resultsEl = document.getElementById('bulk-import-results');
  if (resultsEl) {
    resultsEl.innerHTML = `
      <p style="font-size:12px;color:#166534;font-weight:600;margin:0 0 4px">${createdCount} campaign(s) created, ${matchedExistingCount} matched to an existing campaign, ${monthsSavedCount} month(s) saved${reportsAppliedCount ? `, ${reportsAppliedCount} filled in from an already-pasted platform report` : ''}.</p>
      ${errors.length ? `<p style="font-size:12px;color:#B91C1C;font-weight:600;margin:4px 0 0">${errors.length} issue(s):</p><ul style="font-size:11.5px;color:#B91C1C;margin:4px 0 0;padding-left:18px">${errors.map(e => `<li>${esc(e)}</li>`).join('')}</ul>` : ''}
    `;
  }
  showToast(`Import done: ${createdCount} created, ${matchedExistingCount} matched, ${reportsAppliedCount} report(s) applied, ${errors.length} issue(s)`);
  } finally {
    BULK_IMPORT_CONFIRMING = false;
  }
}

// Fetches the four datasets fresh, WITHOUT touching any view state (current month,
// scope, status tab, selected row) — used both by the initial load and by every save
// handler afterward. Kept separate from loadStrategistDashboard() below on purpose:
// re-fetching after saving one field shouldn't reset which month a strategist happens
// to be looking at.
async function fetchStrategistData() {
  if (!Object.keys(CATALOG_ROWS).length) await loadCatalog();
  const [lines, months, log, rates, clients, reportCache, statusHistory] = await Promise.all([
    sb('rpc/strategist_get_campaign_lines', { method: 'POST', body: JSON.stringify({ p_name: currentStrategistUser.name, p_pw: currentStrategistUser.pw }) }),
    // sbAll -- campaign_months, optimize_log, and status_history all now accept
    // real p_limit/p_offset (paginated-rpc-functions-2026-08-12.sql, run 2026-08-12)
    // so sbAll's own limit/offset loop in shared.js can paginate past Supabase's
    // API row cap without depending on any HTTP-level pagination semantics.
    sbAll('rpc/strategist_get_campaign_months', { method: 'POST', body: JSON.stringify({ p_name: currentStrategistUser.name, p_pw: currentStrategistUser.pw }) }),
    sbAll('rpc/strategist_get_optimize_log', { method: 'POST', body: JSON.stringify({ p_name: currentStrategistUser.name, p_pw: currentStrategistUser.pw }) }),
    sb('rpc/strategist_get_budgeted_spend_rates', { method: 'POST', body: JSON.stringify({ p_name: currentStrategistUser.name, p_pw: currentStrategistUser.pw }) }),
    sb('rpc/strategist_get_clients', { method: 'POST', body: JSON.stringify({ p_name: currentStrategistUser.name, p_pw: currentStrategistUser.pw }) }),
    sb('rpc/strategist_get_platform_report_cache', { method: 'POST', body: JSON.stringify({ p_name: currentStrategistUser.name, p_pw: currentStrategistUser.pw }) }),
    sbAll('rpc/strategist_get_status_history', { method: 'POST', body: JSON.stringify({ p_name: currentStrategistUser.name, p_pw: currentStrategistUser.pw }) }),
  ]);
  ALL_CAMPAIGN_LINES = lines || [];
  ALL_CAMPAIGN_MONTHS = months || [];
  ALL_OPTIMIZE_LOG = log || [];
  ALL_STRATEGIST_CLIENTS = clients || [];
  ALL_STATUS_HISTORY = statusHistory || [];
  PLATFORM_CPM_RATES = { base: {}, group: {}, pairing: {} };
  IN_PLATFORM_PCT_RATES = { base: {}, group: {} };
  // Which group|service_id keys are flagged to beat the spend tier outright
  // (2026-08-25) -- see effectiveInPlatformPct()'s own comment.
  IN_PLATFORM_PCT_FORCE = { group: {} };
  IN_PLATFORM_TIERS = {};
  CPC_RATES = { base: {}, group: {} };
  (rates || []).forEach(r => {
    const cpc = (r.cpc_low != null || r.cpc_high != null) ? { low: r.cpc_low, high: r.cpc_high } : null;
    if (r.scope === 'base') {
      PLATFORM_CPM_RATES.base[r.service_id] = r.platform_cpm;
      IN_PLATFORM_PCT_RATES.base[r.service_id] = r.in_platform_pct;
      if (Array.isArray(r.in_platform_tiers) && r.in_platform_tiers.length) IN_PLATFORM_TIERS[r.service_id] = r.in_platform_tiers;
      if (cpc) CPC_RATES.base[r.service_id] = cpc;
    } else if (r.scope === 'pairing') {
      if (r.platform_cpm != null) PLATFORM_CPM_RATES.pairing[r.service_id] = r.platform_cpm;
    } else {
      PLATFORM_CPM_RATES.group[r.group_id + '|' + r.service_id] = r.platform_cpm;
      IN_PLATFORM_PCT_RATES.group[r.group_id + '|' + r.service_id] = r.in_platform_pct;
      if (r.in_platform_pct_force) IN_PLATFORM_PCT_FORCE.group[r.group_id + '|' + r.service_id] = true;
      if (cpc) CPC_RATES.group[r.group_id + '|' + r.service_id] = cpc;
    }
  });
  PLATFORM_REPORT_CACHE = {};
  (reportCache || []).forEach(r => { PLATFORM_REPORT_CACHE[r.platform] = { report_month: r.report_month, rows: r.rows || [], updated_at: r.updated_at || null }; });
  renderPlatformReportFreshnessBanner();
  await strategistSweepFlightEndedCampaigns();
}

// Auto-completes a campaign once its flight has ended, so a strategist doesn't
// have to remember to switch Status manually (2026-08-10, per Claire -- same
// "don't make me remember" motivation as the per-month pause schedule). Runs
// on every fetchStrategistData() call (i.e. every normal page load or save),
// so whichever campaign just crossed its flight_end since the last fetch gets
// caught promptly without needing a server-side cron job. Deliberately
// restricted to status === 'active' only -- a campaign a strategist manually
// paused stays exactly as they left it; an open-ended campaign (no flight_end
// at all) is never touched. Self-limiting: once a line is 'complete' it no
// longer matches the filter, so this never re-fires for the same campaign.
// Reuses the existing status-change-log RPC directly (no new SQL) -- logged
// under whichever strategist's session happened to trigger the sweep, same as
// every other action in this system (there's no true "system" user), but the
// reason text makes it clear this wasn't a manual click.
async function strategistSweepFlightEndedCampaigns() {
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const ended = ALL_CAMPAIGN_LINES.filter(l => l.status === 'active' && l.flight_end && new Date(l.flight_end + 'T00:00:00') < today);
  for (const l of ended) {
    try {
      await sb('rpc/strategist_log_status_change', { method: 'POST', body: JSON.stringify({
        p_name: currentStrategistUser.name, p_pw: currentStrategistUser.pw,
        p_campaign_line_id: l.id, p_old_status: 'active', p_new_status: 'complete',
        p_reason: 'Automatically completed — past flight end date'
      }) });
      await sb('rpc/strategist_save_campaign_line', { method: 'POST', body: JSON.stringify({
        p_name: currentStrategistUser.name, p_pw: currentStrategistUser.pw, p_id: l.id,
        p_data: { status: 'complete' }
      }) });
      l.status = 'complete';
      // Patched locally so the detail panel's Status history immediately explains
      // the change if opened right after this same load, rather than waiting on
      // the next unrelated refetch to pick up the row just inserted above.
      ALL_STATUS_HISTORY.push({
        id: `local-${l.id}-${Date.now()}`, campaign_line_id: l.id, old_status: 'active', new_status: 'complete',
        reason: 'Automatically completed — past flight end date', changed_by: currentStrategistUser.name, changed_at: new Date().toISOString()
      });
    } catch(e) { console.warn(`Couldn't auto-complete "${l.tactic_label || l.service_id}" (${l.client_name}):`, e.message); }
  }
}

async function loadStrategistDashboard() {
  strategistCurrentMonth = new Date(new Date().getFullYear(), new Date().getMonth(), 1);
  // Found live 2026-08-12 (Claire, right after the sbAll pagination fix): fetching
  // now takes several sequential requests instead of one, and with zero loading
  // state anywhere on this page it just looked frozen the whole time. Only wired
  // into the INITIAL load, not every save's fetchStrategistData() call -- this is
  // the one that visibly stalls with an otherwise-empty page; a save already has
  // real content on screen underneath it.
  const wrap = document.getElementById('strategist-table-wrap');
  if (wrap) wrap.innerHTML = '<p style="padding:24px;text-align:center;color:var(--muted);font-size:13px">Loading…</p>';
  try {
    await fetchStrategistData();
  } catch(e) {
    showToast('Error loading dashboard: ' + e.message, 'error');
    return;
  }
  renderStrategistDashboard();
}

// Effective Platform CPM for a service, honoring a group-specific override — same
// resolution order as the admin Accounting Overrides tab (group override wins, else
// the base accounting_map rate). Never exposes 44i Cut %/Fixed Cut/Setup Fee Split —
// this dashboard only ever needs Platform CPM.
// hasModifier -- true when EITHER Offline Visits Tracking OR YouTube TV's Addl.
// Targeting is checked (2026-08-13, per Claire: "we will also need to update
// the CPM if offline tracking is added" -- Admin's Accounting Map has
// supported a per-pairing Platform CPM override since the pairing mechanism
// itself was built [2026-07-31, for 44i Cut %], but Platform CPM's OWN
// pairing value was never actually looked up anywhere until now, same real
// gap already fixed for 44i Cut % via accountingEffectiveCutPct's own
// pairing check). Pairing wins outright over group/base, same precedence as
// the cut % pairing rate.
// clientId (2026-08-20, Phase B of the MS Farm Bureau pricing work) -- checked
// right after the pairing rate and before the group override, same precedence
// as everywhere else client-level now beats group-level. Sourced straight from
// the client's own accounting_overrides (ALL_STRATEGIST_CLIENTS), NOT from the
// base/group/pairing `rates` dataset -- that RPC has no client scope at all.
// Same documented gap as the existing group-override pairing case: a client
// override of a PAIRING rate isn't supported here either, since hasModifier is
// only ever a plain boolean, not the specific modifier's id.
function effectivePlatformCpm(serviceId, clientId, groupId, hasModifier) {
  if (hasModifier) {
    const pairingRate = PLATFORM_CPM_RATES.pairing[serviceId];
    if (pairingRate != null) return Number(pairingRate);
  }
  const client = clientId != null ? ALL_STRATEGIST_CLIENTS.find(c => c.id === clientId) : null;
  const clientRate = client?.accounting_overrides?.[serviceId]?.platform_cpm;
  if (clientRate != null) return Number(clientRate);
  const groupKey = groupId + '|' + serviceId;
  if (PLATFORM_CPM_RATES.group[groupKey] != null) return Number(PLATFORM_CPM_RATES.group[groupKey]);
  return PLATFORM_CPM_RATES.base[serviceId] != null ? Number(PLATFORM_CPM_RATES.base[serviceId]) : null;
}

// A spend-tiered rate (2026-08-13: SEM, 50% under $5,000 / 70% at $5,000+)
// looked up against the month's own Gross Budget -- same tier shape/lookup
// pattern as accountingEffectiveCutPctTier() in the Accounting Portal, just
// kept in its own IN_PLATFORM_TIERS cache/column since this one has to be
// safe to expose here (no cut_pct anywhere in it).
function effectiveInPlatformPctTier(serviceId, grossBudget) {
  const tiers = IN_PLATFORM_TIERS[serviceId];
  if (!tiers || !tiers.length || grossBudget == null) return null;
  const tier = tiers.find(t => t.max == null || Number(grossBudget) <= Number(t.max));
  return tier ? Number(tier.in_platform_pct) : null;
}
// Same resolution order as effectivePlatformCpm -- fills the gap for a service
// with no Retail CPM (2026-08-10: SEM), where In-Platform Budget otherwise has
// no formula to compute from at all. A tiered rate (when configured) REPLACES
// the flat base/group rate entirely, same "tiers win outright" rule already
// used for 44i Cut % -- a group override becomes moot once tiers exist for
// that service, UNLESS that specific override carries in_platform_pct_force
// (2026-08-25, found live -- Bronson: MS Farm Bureau's per-agent SEM lines
// each sit under $5,000 on their own, so the catalog-wide tier was silently
// beating STMM Digital's already-configured 70% group override every time.
// Claire: scope the fix to MS Farm Bureau only, not a global priority flip --
// so a group/client override only beats the tier when explicitly flagged to,
// leaving every other tiered service's existing behavior untouched).
function effectiveInPlatformPct(serviceId, clientId, groupId, grossBudget) {
  const client = clientId != null ? ALL_STRATEGIST_CLIENTS.find(c => c.id === clientId) : null;
  const clientOverride = client?.accounting_overrides?.[serviceId];
  if (clientOverride?.in_platform_pct_force && clientOverride.in_platform_pct != null) {
    return Number(clientOverride.in_platform_pct);
  }
  const groupKey = groupId + '|' + serviceId;
  if (IN_PLATFORM_PCT_FORCE.group[groupKey] && IN_PLATFORM_PCT_RATES.group[groupKey] != null) {
    return Number(IN_PLATFORM_PCT_RATES.group[groupKey]);
  }
  const tierRate = effectiveInPlatformPctTier(serviceId, grossBudget);
  if (tierRate != null) return tierRate;
  const clientRate = clientOverride?.in_platform_pct;
  if (clientRate != null) return Number(clientRate);
  if (IN_PLATFORM_PCT_RATES.group[groupKey] != null) return Number(IN_PLATFORM_PCT_RATES.group[groupKey]);
  return IN_PLATFORM_PCT_RATES.base[serviceId] != null ? Number(IN_PLATFORM_PCT_RATES.base[serviceId]) : null;
}

// Same resolution order again -- the $ CPC range (e.g. SEM's $4-$12) a
// clicks-based service's Goal is computed from. Returns null unless BOTH
// ends are set for whichever scope wins (group override is all-or-nothing,
// same as every other override here -- a half-set group override would be a
// silent, confusing partial fallback to the base rate on just one end).
function effectiveCpcRange(serviceId, clientId, groupId) {
  const client = clientId != null ? ALL_STRATEGIST_CLIENTS.find(c => c.id === clientId) : null;
  const co = client?.accounting_overrides?.[serviceId];
  if (co && co.cpc_low != null && co.cpc_high != null) return { low: Number(co.cpc_low), high: Number(co.cpc_high) };
  const groupKey = groupId + '|' + serviceId;
  const group = CPC_RATES.group[groupKey];
  if (group && group.low != null && group.high != null) return { low: Number(group.low), high: Number(group.high) };
  const base = CPC_RATES.base[serviceId];
  if (base && base.low != null && base.high != null) return { low: Number(base.low), high: Number(base.high) };
  return null;
}

// Budgeted Impressions = Gross Budget ÷ Retail CPM × 1000 -- what was actually sold
// to the client, independent of platform cost efficiency. Confirmed against real
// strategist spreadsheets 2026-08-05 (Galaxy, Prairie Flower Casino, Fisher & Son,
// Auto Bank of KC) after Claire flagged In-Platform Budget/Goal numbers not matching
// what strategists were using: every example traced back to a clean Retail CPM here,
// while the old flat "Gross × Budgeted Spend %" model for In-Platform Budget produced
// a non-round % every time -- confirming this, not that, is the real source of truth.
// This is also now the direct basis for Goal (see computeGoal below) -- Goal never
// derives from In-Platform Budget, since what's promised to the client doesn't move
// just because the platform ends up more or less efficient than planned.
// A group's Retail CPM override lives in the SAME io_pricing JSONB the public
// form's applyCustomPricing() and Accounting's own accountingGroupRetailCpm()
// already read (2026-08-19 -- Claire: "I just updated the Retail CPM for one
// of the groups but it didn't update the in platform spend or goal") -- not a
// separate per-group Strategist field, since it's the same real-world number
// the client sees on the catalog. Requires `strategist_get_clients` to return
// `group_io_pricing` the same way `accounting_get_clients` already does --
// give this SQL to Claire to confirm/add if this still doesn't pick up a
// change live: alter the RPC's jsonb output to include
// 'group_io_pricing', g.io_pricing alongside id/name/group_id/group_name.
// Client-level Retail CPM (2026-08-20, Phase B) wins over the group's -- same
// clients.io_pricing a client can now set in Admin's own Client editor, checked
// before falling through to the group's copy of the same JSONB shape.
// lineOverride (2026-08-25, per Claire -- a specific AE within a group, e.g.
// Kingfish, sometimes sells at a real CPM different from the group/catalog
// standard; strategists record what the AE's setup notes say). Checked BEFORE
// the client/group rate -- a specific campaign's actual sold rate always wins
// over any general default, same "specific beats generic" rule as every other
// override in this project. Fixed for the whole campaign's life (per Claire),
// so it lives on campaign_lines itself, not per-month.
function strategistEffectiveRetailCpm(serviceId, clientId, groupId, lineOverride) {
  if (lineOverride != null) return Number(lineOverride);
  const client = clientId != null ? ALL_STRATEGIST_CLIENTS.find(c => c.id === clientId) : null;
  if (client?.io_pricing?.[serviceId] != null) return Number(client.io_pricing[serviceId]);
  if (!groupId) return null;
  const groupClient = ALL_STRATEGIST_CLIENTS.find(c => c.group_id === groupId && c.group_io_pricing && c.group_io_pricing[serviceId] != null);
  return groupClient ? Number(groupClient.group_io_pricing[serviceId]) : null;
}
function budgetedImpressions(grossBudget, serviceId, clientId, groupId, lineOverride) {
  const row = CATALOG_ROWS[serviceId];
  if (grossBudget == null || !row) return null;
  const retailCpmOverride = strategistEffectiveRetailCpm(serviceId, clientId, groupId, lineOverride);
  const retailCpm = retailCpmOverride != null ? retailCpmOverride : (row.retail_cpm != null ? Number(row.retail_cpm) : null);
  if (retailCpm == null) return null;
  return (Number(grossBudget) / retailCpm) * 1000;
}

// In-Platform Budget = Budgeted Impressions × Platform CPM ÷ 1000 -- always computed
// live, never stored, same derived-vs-stored principle as everywhere else in this
// project. Platform CPM is a real number entered per service/group (Admin →
// Accounting Map / Accounting Overrides), not derived from a flat %.
function computeInPlatformBudget(grossBudget, serviceId, clientId, groupId, hasModifier, retailCpmOverride) {
  const impressions = budgetedImpressions(grossBudget, serviceId, clientId, groupId, retailCpmOverride);
  const platformCpm = effectivePlatformCpm(serviceId, clientId, groupId, hasModifier);
  if (impressions == null || platformCpm == null) {
    // Fallback for a service with no Retail CPM at all (2026-08-10: SEM) --
    // otherwise there's no formula to compute from, and every month needs a
    // fully manual override. In-Platform % (Admin -> Accounting Map) fills
    // that gap directly off Gross Budget instead of going through impressions.
    const pct = effectiveInPlatformPct(serviceId, clientId, groupId, grossBudget);
    if (grossBudget != null && pct != null) return Number(grossBudget) * pct / 100;
    return null;
  }
  return impressions * platformCpm / 1000;
}

// campaign_months.in_platform_override — an explicit override always wins over the
// computed value, same "override wins" pattern as Goal (2026-08-04, per Claire:
// "we will also need to be able to override the in platform spend while we confirm
// all of our logic is working correctly"). Per-MONTH, not per-campaign, since
// In-Platform Budget (like Gross Budget) is itself a per-month figure — lives on
// campaign_months, not campaign_lines. Every call site that used to call
// computeInPlatformBudget() directly on a monthRow now goes through this instead.
function effectiveInPlatformBudget(monthRow, serviceId, clientId, groupId, hasModifier, retailCpmOverride) {
  if (!monthRow) return null;
  if (monthRow.in_platform_override != null) return Number(monthRow.in_platform_override);
  return computeInPlatformBudget(monthRow.gross_budget, serviceId, clientId, groupId, hasModifier, retailCpmOverride);
}

// Goal: impressions for every platform except SEM (Goal = Budgeted Impressions =
// Gross Budget ÷ Retail CPM × 1000 -- see budgetedImpressions() above). Deliberately
// NOT derived from In-Platform Budget (changed 2026-08-05, per Claire's real-campaign
// testing): what's promised to the client is fixed by the Retail CPM they were sold
// on, not by how efficiently the platform happens to deliver that spend. SEM is a
// known v1 gap — the catalog only stores a CPC RANGE string ("$4-$12"), not a single
// rate, so an automatic clicks number isn't actually computable yet; falls back to
// campaign_lines.goal_override (manual entry, same trust level as Platform/monthly
// budgets) until a real single CPC rate is decided. goal_override is a general escape
// hatch, not just SEM's -- found live 2026-08-04, per Claire: a bulk-imported campaign
// that skips entering In-Platform spend (or whose auto-calculated Goal is simply
// wrong for some other reason) still needs a way to correct it, same as SEM already
// had. An explicit override always wins, regardless of whether an auto-calculated
// number is also available.
// SEM's manual Goal is sometimes a range (e.g. "150-200"), not a single number --
// per Claire, the clicks estimate varies with CPC and she doesn't always have one
// clean number to enter. Confirmed with her: range support is SEM-only (every other
// tactic's goal_override stays a single number), and Perf. Pacing against a range
// uses the MIDPOINT -- the range itself is shown as text in the Goal column/detail
// panel, the midpoint just drives the pacing math underneath it.
function parseGoalOverride(raw, allowRange) {
  if (raw == null || raw === '') return null;
  const rangeMatch = allowRange && String(raw).match(/^\s*([\d.]+)\s*-\s*([\d.]+)\s*$/);
  if (rangeMatch) {
    const low = Number(rangeMatch[1]), high = Number(rangeMatch[2]);
    if (isNaN(low) || isNaN(high)) return null;
    return { value: (low + high) / 2, isRange: true, display: `${low.toLocaleString()}–${high.toLocaleString()}` };
  }
  const num = Number(raw);
  if (isNaN(num)) return null;
  return { value: num, isRange: false, display: Math.round(num).toLocaleString() };
}

// Offline Visits Tracking is a $0 modifier add-on -- never its own campaign_lines
// row (no spend, nothing to buy media against), but a strategist still needs to see
// at a glance that a tactic like Targeted Display was sold WITH it, same as the
// Accounting Map already shows "(w/ Offline Visits Tracking)" pairings. Tracked as
// a plain boolean on the base tactic's own campaign_lines row rather than parsing
// it in/out of tactic_label text.
// Setup queue "at a glance" pill (2026-08-10, per the strategist team's own
// answer: it helps to see WHAT's actually blocking a Pending campaign -- waiting
// on creative, platform access, the intake form, or simply the start date --
// rather than just a plain notes field everyone has to open and read one at a
// time). "Waiting on start date" is deliberately auto-detected from the flight
// dates already on file, not a 4th manual option -- it's objectively knowable,
// no reason to make a strategist set it by hand. Returns null (no pill at all)
// when nothing distinguishes a line -- a newly-arrived, not-yet-reviewed
// campaign should look plain, not alarming.
const SETUP_BLOCKER_LABELS = {
  creative: 'Waiting on Creative',
  platform_access: 'Waiting on Platform Access',
  intake_form: 'Waiting on Intake Form',
  pending_website: 'Pending Website',
};
// Setup panel checkbox display is generated FROM the object above (2026-08-10 --
// found live: a new blocker had to be added in two separate places, the source
// object AND a hardcoded checkbox list that had drifted out of sync with it).
// Only used for a short display form that differs from the full "Waiting on X"
// label, or an extra parenthetical hint -- every other key needs neither.
const SETUP_BLOCKER_CHECKBOX_HINTS = {
  platform_access: { hint: ' (e.g. Facebook)' },
};
function strategistSetupBlockerPill(line) {
  // setup_blocker is a text[] (2026-08-10, per Claire -- a campaign can genuinely
  // be waiting on more than one thing at once, e.g. creative AND platform access)
  // -- one pill per recognized blocker, wrapped so multiple ones space evenly.
  const blockers = Array.isArray(line.setup_blocker) ? line.setup_blocker.filter(b => SETUP_BLOCKER_LABELS[b]) : [];
  if (blockers.length) {

  }
  // The narrower "Starts X" fallback that used to live here (shown only when
  // unblocked, start-date-only) was removed 2026-08-27 -- superseded by the
  // Campaign Setup panel header's own always-visible Flight range badge
  // (renderSetupPanel), which shows for every pending campaign regardless of
  // blocker state, per a teammate's request relayed by Claire: "add the
  // flight column to campaigns that are in Campaign Setup... so they can all
  // be viewed at a glance" -- the old conditional version defeated that,
  // since a blocked campaign never showed a date at all.
  return '';
}

// MS Farm Bureau fan-out (2026-08-20): a line with both agent_name and county
// belongs to a consolidated multi-agent client (one real client record per

// display_group_label (2026-08-21, per Claire -- MS Farm Bureau's agent clients

function strategistDisplayClientName(line) {

function strategistTacticDisplay(line) {

// Marks a campaign at a glance wherever it appears in a table, not just its
// own Detail panel, so a retail_cpm_override doesn't quietly only show up

// Same badge markup shared with the Accounting Portal's copy of this line.
function cpmOverrideBadgeHtml(line) {
