<!-- STRATEGIST PANEL — scaffold only (2026-07-18). No real strategist features yet;
     this is just the same login-gated shell pattern as /admin, sharing shared.js/
     shared.css per the plan in CLAUDE.md ("Future /strategist/accounting role-based

<div id="page-strategist" style="display:none">
  <div class="card" style="max-width:1500px;margin:24px auto;padding-bottom:20px">
    <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 16px;border-bottom:1px solid var(--border);background:#FAFCFE">

      <button onclick="strategistLogout()" style="background:var(--light);border:1px solid var(--border);color:var(--muted);padding:5px 14px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:600">✕ Close</button>

    <div style="padding:16px 20px 0">
      <!-- Top bar: month picker + My Campaigns/All Strategists scope toggle -->

          <button onclick="strategistShiftMonth(1)" style="padding:6px 10px;border-radius:6px;border:1px solid var(--border);background:var(--light);cursor:pointer;font-size:13px">›</button>
        </div>
        <div style="display:flex;gap:10px;align-items:center;font-size:12px">
          <span id="strategist-scope-mine" onclick="strategistSetScope('mine')" style="padding:6px 12px;border-radius:7px;border:1px solid var(--border);cursor:pointer;font-weight:600">My Campaigns</span>
          <span id="strategist-scope-all" onclick="strategistSetScope('all')" style="padding:6px 12px;border-radius:7px;border:1px solid var(--border);cursor:pointer;font-weight:600">All Strategists</span>

      <!-- Status tabs -->
      <div id="strategist-status-tabs" style="display:flex;gap:18px;border-bottom:1px solid var(--border);margin-bottom:16px"></div>

      <!-- Campaign Setup review panel (only rendered when the Campaign Setup tab is active) -->
      <div id="strategist-setup-panel"></div>

      <!-- Main pacing table -->

      <!-- Row detail panel -->
      <div id="strategist-detail-panel" style="margin-top:16px"></div>

<!-- STRATEGIST LOGIN MODAL — same shape as /admin's, scoped to strategist/super roles

  <div style="background:#fff;border-radius:14px;padding:36px 32px;width:340px;box-shadow:0 24px 64px rgba(0,0,0,.2);text-align:center">
    <div style="font-size:32px;margin-bottom:12px">🔒</div>
    <h3 style="font-size:16px;font-weight:700;margin-bottom:6px;color:var(--text)">Strategist Access</h3>
    <p style="font-size:12px;color:var(--muted);margin-bottom:20px">Select your name and enter your password</p>
    <select id="strategist-name-select" style="width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--border);font-size:14px;text-align:center;margin-bottom:10px;font-family:inherit;background:#fff">
      <option value="">— Select your name —</option>
    </select>
    <input type="password" id="strategist-pw-input" placeholder="Password" onkeydown="if(event.key==='Enter')checkStrategistPw()" style="width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--border);font-size:14px;text-align:center;letter-spacing:.2em;margin-bottom:12px"/>
    <div id="strategist-pw-error" style="display:none;color:#EF4444;font-size:12px;margin-bottom:10px">Incorrect password. Please try again.</div>
    <div style="display:flex;gap:9px">
      <button onclick="checkStrategistPw()" style="flex:1;padding:10px;border-radius:8px;background:var(--accent);color:#fff;border:none;font-size:13px;font-weight:600;cursor:pointer">Enter</button>
    </div>

<script src="../shared.js"></script>
<script>
// Same "don't hardcode a roster" pattern as /admin's login (see that file's 2026-07-18
// note on LOGIN_ROSTER) — populated from the shared get_login_roster RPC, filtered
// client-side to the roles that belong on this specific portal.
let currentStrategistUser = null; // {name, email, role, pw}

async function loadStrategistRoster() {
  const sel = document.getElementById('strategist-name-select');
  let roster = [];
  try {
    roster = await sb('rpc/get_login_roster', { method: 'POST', body: JSON.stringify({}) }) || [];
  } catch(e) {
    console.warn('Could not load login roster:', e.message);
  }
  const eligible = roster.filter(u => u.role === 'strategist' || u.role === 'super');
  sel.innerHTML = '<option value="">— Select your name —</option>' +
    eligible.map(u => `<option value="${esc(u.name)}">${esc(u.name)}</option>`).join('');
}

function promptStrategistLogin() {
  document.getElementById('strategist-login-modal').style.display = 'flex';
  document.getElementById('strategist-name-select').value = '';
  document.getElementById('strategist-pw-input').value = '';
  document.getElementById('strategist-pw-error').style.display = 'none';
}

async function checkStrategistPw() {
  const name = document.getElementById('strategist-name-select').value;
  const pw = document.getElementById('strategist-pw-input').value;
  const errEl = document.getElementById('strategist-pw-error');
  if (!name) {
    errEl.textContent = 'Please select your name.';
    errEl.style.display = 'block';
    return;
  }
  let ok = false, role = null, email = '';
  try {
    const res = await sb('rpc/admin_login', { method:'POST', body: JSON.stringify({ p_name: name, p_pw: pw }) });
    const row = Array.isArray(res) ? res[0] : res;
    if (row && row.role) { ok = true; role = row.role; email = row.email || ''; }
  } catch(e) {
    errEl.textContent = 'Could not reach the login service. Check your connection and try again.';
    errEl.style.display = 'block';
    document.getElementById('strategist-pw-input').value = '';
    return;
  }
  if (ok && role !== 'strategist' && role !== 'super') {
    errEl.textContent = 'This account isn\'t set up for the Strategist portal.';
    errEl.style.display = 'block';
    document.getElementById('strategist-pw-input').value = '';
    return;
  }
  if (ok) {
    currentStrategistUser = { name, email, role, pw };
    document.getElementById('strategist-login-modal').style.display = 'none';
    showStrategistPanel(true);
  } else {
    errEl.textContent = 'Incorrect password. Please try again.';
    errEl.style.display = 'block';
    document.getElementById('strategist-pw-input').value = '';
  }
}

function showStrategistPanel(show) {
  document.getElementById('page-strategist').style.display = show ? 'block' : 'none';
  if (show && currentStrategistUser) {
    const badge = document.getElementById('strategist-user-badge');
    const roleLabel = currentStrategistUser.role === 'super' ? 'Super Admin' : 'Strategist';
    badge.innerHTML = `<span style="display:inline-flex;align-items:center;gap:6px"><span style="width:8px;height:8px;border-radius:50%;background:#8B5CF6"></span><strong style="color:var(--text)">${esc(currentStrategistUser.name)}</strong> <span style="color:var(--muted)">— ${roleLabel}</span></span>`;
    loadStrategistDashboard();
  }
}

// ══════════════════════════════════════════════════════════════════════════
// STRATEGIST DASHBOARD (2026-08-03) — v1 framework replacing the concept mockup.
// Every mechanic below matches a decision already confirmed with Claire/the
// strategist team (see io_project_tracking.md's STRATEGIST PORTAL section and
// this session's implementation plan). Not built here, deliberately: platform-
// report API automation, ad-group/keyword breakdown detail, and importing
// pre-existing campaigns — all confirmed as their own later phases.
// ══════════════════════════════════════════════════════════════════════════

let ALL_CAMPAIGN_LINES = [];
let ALL_CAMPAIGN_MONTHS = [];
let ALL_OPTIMIZE_LOG = [];
let ALL_STRATEGIST_CLIENTS = []; // {id, name, group_id, group_name} — for the "+ New Campaign" import picker
let BUDGETED_SPEND_RATES = { base: {}, group: {} }; // service_id -> pct, and group_id|service_id -> pct
let strategistScope = 'mine';               // 'mine' | 'all'
let strategistStatusTab = 'pending';        // pending | active | paused | complete
let strategistCurrentMonth = null;          // Date, always day 1
let strategistSelectedLineId = null;

const PACING_THRESHOLDS = { good: 90, warn: 70 }; // >=90 good, 70-89.99 warn, <70 risk — Claire's confirmed spreadsheet rule

function strategistMonthKey(d) {
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
}
function strategistMonthLabel(d) {
  return d.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
}
function strategistShiftMonth(delta) {
  strategistCurrentMonth.setMonth(strategistCurrentMonth.getMonth() + delta);
  renderStrategistDashboard();
}
function strategistSetScope(scope) {
  strategistScope = scope;
  renderStrategistDashboard();
}
function strategistSetStatusTab(tab) {
  strategistStatusTab = tab;
  strategistSelectedLineId = null;
  renderStrategistDashboard();
}

// ── "+ NEW CAMPAIGN" MANUAL IMPORT (2026-08-04) ──────────────────
// For campaigns already running from the OLD IO system, ordered before this platform
// existed, so they aren't sitting on an order for the create_campaign_lines_from_order
// trigger to fan out from. Skips the Campaign Setup queue entirely — an imported
// campaign is already running, so it's created straight into whichever status is
// picked (Active by default). How much history to bring in per campaign is left
// entirely up to whoever's importing it — this form creates the line, then the row
// detail panel's month-by-month history editor (see below) can backfill as many past
// months as make sense for that specific campaign, one at a time.
function strategistOpenImportForm() {
  const el = document.getElementById('strategist-import-form');
  const isOpen = el.style.display !== 'none';
  if (isOpen) { el.style.display = 'none'; el.innerHTML = ''; return; }

  const spendServices = Object.values(CATALOG_ROWS).filter(r => r.pricing_mode === 'spend');
  el.style.display = 'block';
  el.innerHTML = `<div style="border:1px solid var(--accent);border-radius:10px;padding:16px 18px;margin-bottom:16px;background:#F0F9FF">
    <strong style="font-size:13px;display:block;margin-bottom:10px">Import a campaign already running from the old IO system</strong>
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:10px">
      <div>
        <label class="lbl">Client</label>
        <select id="import-client" style="width:100%;padding:7px 8px;border-radius:6px;border:1px solid var(--border);font-size:12.5px">
          <option value="">— Select —</option>
          ${ALL_STRATEGIST_CLIENTS.map(c => `<option value="${esc(c.id)}" data-group-id="${esc(c.group_id || '')}">${esc(c.name)}${c.group_name ? ' (' + esc(c.group_name) + ')' : ''}</option>`).join('')}
        </select>
      </div>
      <div>
        <label class="lbl">Tactic</label>
        <select id="import-service" style="width:100%;padding:7px 8px;border-radius:6px;border:1px solid var(--border);font-size:12.5px">
          <option value="">— Select —</option>
          ${spendServices.map(s => `<option value="${esc(s.id)}">${esc(s.accounting_label || s.label)}</option>`).join('')}
        </select>
      </div>
      <div>
        <label class="lbl">Platform</label>
        <input id="import-platform" style="width:100%;padding:7px 8px;border-radius:6px;border:1px solid var(--border);font-size:12.5px"/>
      </div>
      <div>
        <label class="lbl">Status</label>
        <select id="import-status" style="width:100%;padding:7px 8px;border-radius:6px;border:1px solid var(--border);font-size:12.5px">
          <option value="active" selected>Active</option>
          <option value="paused">Paused</option>
          <option value="complete">Complete</option>
        </select>
      </div>
      <div>
        <label class="lbl">Flight Start</label>
        <input type="date" id="import-flight-start" style="width:100%;padding:7px 8px;border-radius:6px;border:1px solid var(--border);font-size:12.5px"/>
      </div>
      <div>
        <label class="lbl">Flight End</label>
        <input type="date" id="import-flight-end" style="width:100%;padding:7px 8px;border-radius:6px;border:1px solid var(--border);font-size:12.5px"/>
      </div>
      <div>
        <label class="lbl">Current Gross Budget</label>
        <input type="number" id="import-gross-budget" placeholder="$/mo" style="width:100%;padding:7px 8px;border-radius:6px;border:1px solid var(--border);font-size:12.5px"/>
      </div>
      <div style="grid-column:span 2">
        <label class="lbl">Exact campaign title in the ad platform <span style="font-weight:400;text-transform:none;letter-spacing:0;color:var(--muted)">— used to match this campaign when you paste a platform report below</span></label>
        <input id="import-platform-campaign-name" style="width:100%;padding:7px 8px;border-radius:6px;border:1px solid var(--border);font-size:12.5px"/>
      </div>
    </div>
    <p style="font-size:11px;color:var(--muted);margin:0 0 12px">This creates the campaign as of the current month. Once it's in the list, click into it to add any past months' budgets/actuals you want on record — as far back as makes sense for this one.</p>
    <div style="display:flex;gap:10px">
      <button onclick="strategistSubmitImport()" style="padding:7px 16px;border-radius:6px;background:var(--accent);color:#fff;border:none;font-size:12.5px;font-weight:600;cursor:pointer">Add Campaign</button>
      <button onclick="strategistOpenImportForm()" style="padding:7px 16px;border-radius:6px;background:var(--light);border:1px solid var(--border);font-size:12.5px;font-weight:600;cursor:pointer">Cancel</button>
    </div>
  </div>`;
}

async function strategistSubmitImport() {
  const clientSel = document.getElementById('import-client');
  const clientId = clientSel.value;
  const groupId = clientSel.selectedOptions[0]?.dataset.groupId || null;
  const serviceSel = document.getElementById('import-service');
  const serviceId = serviceSel.value;
  const serviceLabel = serviceSel.selectedOptions[0]?.textContent || '';
  const platform = document.getElementById('import-platform').value.trim();
  const status = document.getElementById('import-status').value;
  const flightStart = document.getElementById('import-flight-start').value || null;
  const flightEnd = document.getElementById('import-flight-end').value || null;
  const grossBudget = document.getElementById('import-gross-budget').value;
  const platformCampaignName = document.getElementById('import-platform-campaign-name').value.trim();

  if (!clientId || !serviceId) { showToast('Pick a client and a tactic.', 'error'); return; }

  try {
    const newId = await sb('rpc/strategist_save_campaign_line', { method: 'POST', body: JSON.stringify({
      p_name: currentStrategistUser.name, p_pw: currentStrategistUser.pw, p_id: null,
      p_data: {
        client_id: clientId, group_id: groupId, service_id: serviceId, tactic_label: serviceLabel,
        platform: platform || null, platform_campaign_name: platformCampaignName || null,
        flight_start: flightStart, flight_end: flightEnd,
        status, assigned_strategist: currentStrategistUser.name
      }
    }) });
    if (grossBudget) {
      await sb('rpc/strategist_save_campaign_month', { method: 'POST', body: JSON.stringify({
        p_name: currentStrategistUser.name, p_pw: currentStrategistUser.pw,
        p_campaign_line_id: newId, p_month: new Date().toISOString().slice(0,10),
        p_data: { gross_budget: grossBudget }
      }) });
    }
    document.getElementById('strategist-import-form').style.display = 'none';
    document.getElementById('strategist-import-form').innerHTML = '';
    strategistStatusTab = status;
    await fetchStrategistData();
    renderStrategistDashboard();
    showToast('Campaign imported!');
  } catch(e) { showToast('Error importing campaign: ' + e.message, 'error'); }
}

// ── "PASTE PLATFORM REPORT" BULK MATCH (2026-08-04) ──────────────
// Claire: "Having to go into each campaign is not realistic. Right now my spreadsheet
// looks for the unique campaign title to pull the necessary information." Her real
// workflow pastes an entire platform export at once and matches EVERY row to the right
// campaign by its title (a VLOOKUP against the Layout tab) — not one campaign at a
// time. This mirrors that exact mechanic: paste a block of rows (Campaign Name, Spend,
// Clicks, Impressions — tab- or comma-separated, one campaign per line, matching the
// generic shape every platform's export ultimately reduces to for this dashboard's
// purposes), match each row's title against campaign_lines.platform_campaign_name
// (case/whitespace-insensitive), and update the CURRENT month's actuals for every
// match in one pass — no need to click into each row individually.
function strategistOpenPasteReportForm() {
  const el = document.getElementById('strategist-paste-report-form');
  const isOpen = el.style.display !== 'none';
  if (isOpen) { el.style.display = 'none'; el.innerHTML = ''; return; }

  el.style.display = 'block';
  el.innerHTML = `<div style="border:1px solid var(--accent);border-radius:10px;padding:16px 18px;margin-bottom:16px;background:#F0F9FF">
    <strong style="font-size:13px;display:block;margin-bottom:6px">Paste a platform report for ${esc(strategistMonthLabel(strategistCurrentMonth))}</strong>
    <p style="font-size:11px;color:var(--muted);margin:0 0 10px">One campaign per line, columns in this order: <strong>Campaign Name, Spend, Clicks, Impressions</strong> — tab- or comma-separated, the same way you'd copy it straight out of a spreadsheet. Only campaigns whose "exact campaign title in the ad platform" (set on the campaign itself) matches a row here will update — anything that doesn't match gets listed below so nothing silently gets skipped.</p>
    <textarea id="paste-report-text" rows="8" style="width:100%;padding:10px;border-radius:7px;border:1px solid var(--border);font-size:12px;font-family:monospace;margin-bottom:10px" placeholder="Ridgeline Dental - SEM - July	1540	350	92000
Northside Auto - Prospecting	560	0	150000"></textarea>
    <div style="display:flex;gap:10px;margin-bottom:10px">
      <button onclick="strategistMatchPastedReport()" style="padding:7px 16px;border-radius:6px;background:var(--accent);color:#fff;border:none;font-size:12.5px;font-weight:600;cursor:pointer">Match &amp; Update</button>
      <button onclick="strategistOpenPasteReportForm()" style="padding:7px 16px;border-radius:6px;background:var(--light);border:1px solid var(--border);font-size:12.5px;font-weight:600;cursor:pointer">Cancel</button>
    </div>
    <div id="paste-report-results"></div>
  </div>`;
}

function parsePastedReportRows(text) {
  return text.trim().split(/\r?\n/).filter(line => line.trim()).map(line =>
    (line.includes('\t') ? line.split('\t') : line.split(',')).map(c => c.trim())
  );
}

async function strategistMatchPastedReport() {
  const raw = document.getElementById('paste-report-text').value;
  if (!raw.trim()) { showToast('Paste a report first.', 'error'); return; }
  let rows = parsePastedReportRows(raw);
  // Skip a header row if its Spend column isn't actually a number (e.g. "Campaign Name, Spend, Clicks, Impressions").
  if (rows.length && isNaN(parseFloat(rows[0][1]))) rows = rows.slice(1);

  const byTitle = {};
  ALL_CAMPAIGN_LINES.forEach(l => {
    if (l.platform_campaign_name) byTitle[l.platform_campaign_name.trim().toLowerCase()] = l;
  });

  const monthStr = strategistCurrentMonth.toISOString().slice(0,10);
  const matched = [], unmatched = [];
  for (const cols of rows) {
    const title = (cols[0] || '').trim();
    if (!title) continue;
    const line = byTitle[title.toLowerCase()];
    if (!line) { unmatched.push(title); continue; }
    const data = {};
    if (cols[1] !== undefined && cols[1] !== '') data.actual_spend = cols[1];
    if (cols[2] !== undefined && cols[2] !== '') data.actual_clicks = cols[2];
    if (cols[3] !== undefined && cols[3] !== '') data.actual_impressions = cols[3];
    try {
      await sb('rpc/strategist_save_campaign_month', { method: 'POST', body: JSON.stringify({
        p_name: currentStrategistUser.name, p_pw: currentStrategistUser.pw,
        p_campaign_line_id: line.id, p_month: monthStr, p_data: data
      }) });
      matched.push(`${line.client_name || ''} / ${line.tactic_label || line.service_id}`.trim());
    } catch(e) {
      unmatched.push(title + ' (save failed: ' + e.message + ')');
    }
  }

  await fetchStrategistData();
  renderStrategistDashboard();

  const resultsEl = document.getElementById('paste-report-results');
  if (resultsEl) {
    resultsEl.innerHTML = `
      <p style="font-size:12px;color:#166534;font-weight:600;margin:0 0 4px">${matched.length} campaign${matched.length === 1 ? '' : 's'} updated${matched.length ? ': ' + matched.map(esc).join(', ') : ''}</p>
      ${unmatched.length ? `<p style="font-size:12px;color:#B91C1C;font-weight:600;margin:0">${unmatched.length} row${unmatched.length === 1 ? '' : 's'} didn't match any campaign — check the exact title on the campaign itself: ${unmatched.map(esc).join(', ')}</p>` : ''}
    `;
  }
  showToast(matched.length ? `${matched.length} campaign(s) updated` : 'No matches found');
}

// Fetches the four datasets fresh, WITHOUT touching any view state (current month,
// scope, status tab, selected row) — used both by the initial load and by every save
// handler afterward. Kept separate from loadStrategistDashboard() below on purpose:
// re-fetching after saving one field shouldn't reset which month a strategist happens
// to be looking at.
async function fetchStrategistData() {
  if (!Object.keys(CATALOG_ROWS).length) await loadCatalog();
  const [lines, months, log, rates, clients] = await Promise.all([
    sb('rpc/strategist_get_campaign_lines', { method: 'POST', body: JSON.stringify({ p_name: currentStrategistUser.name, p_pw: currentStrategistUser.pw }) }),
    sb('rpc/strategist_get_campaign_months', { method: 'POST', body: JSON.stringify({ p_name: currentStrategistUser.name, p_pw: currentStrategistUser.pw }) }),

    sb('rpc/strategist_get_clients', { method: 'POST', body: JSON.stringify({ p_name: currentStrategistUser.name, p_pw: currentStrategistUser.pw }) }),
  ]);
  ALL_CAMPAIGN_LINES = lines || [];
  ALL_CAMPAIGN_MONTHS = months || [];
  ALL_OPTIMIZE_LOG = log || [];
  ALL_STRATEGIST_CLIENTS = clients || [];
  BUDGETED_SPEND_RATES = { base: {}, group: {} };
  (rates || []).forEach(r => {
    if (r.scope === 'base') BUDGETED_SPEND_RATES.base[r.service_id] = r.budgeted_spend_pct;
    else BUDGETED_SPEND_RATES.group[r.group_id + '|' + r.service_id] = r.budgeted_spend_pct;
  });
}

// Effective Budgeted Spend % for a service, honoring a group-specific override —
// same resolution order as the admin Accounting Overrides tab (group override wins,
// else the base accounting_map rate). Never exposes 44i Cut %/Fixed Cut/Setup Fee
// Split — this dashboard only ever needs Budgeted Spend %.
function effectiveBudgetedSpendPct(serviceId, groupId) {
  const groupKey = groupId + '|' + serviceId;
  if (BUDGETED_SPEND_RATES.group[groupKey] != null) return Number(BUDGETED_SPEND_RATES.group[groupKey]);
  return BUDGETED_SPEND_RATES.base[serviceId] != null ? Number(BUDGETED_SPEND_RATES.base[serviceId]) : null;
}

// In-Platform Budget is always computed live, never stored — same derived-vs-stored
// principle as Retail CPM/44i CPM/Platform CPM elsewhere in this project.
function computeInPlatformBudget(grossBudget, serviceId, groupId) {
  if (grossBudget == null) return null;
  const pct = effectiveBudgetedSpendPct(serviceId, groupId);
  return pct != null ? Number(grossBudget) * pct / 100 : null;
}

// Goal: impressions for every platform except SEM (Goal = In-Platform Budget ÷ Retail
// CPM × 1000). SEM is a known v1 gap — the catalog only stores a CPC RANGE string
// ("$4-$12"), not a single rate, so an automatic clicks number isn't actually
// computable yet; falls back to campaign_lines.goal_override (manual entry, same
// trust level as Platform/monthly budgets) until a real single CPC rate is decided.
function computeGoal(line, inPlatformBudget) {
  const row = CATALOG_ROWS[line.service_id];
  if (line.service_id === 'sem-bp' || !row || row.retail_cpm == null) {
    return line.goal_override != null ? { value: Number(line.goal_override), unit: 'clicks', manual: true } : { value: null, unit: 'clicks', manual: true };
  }
  if (inPlatformBudget == null) return { value: null, unit: 'impr.', manual: false };
  return { value: (inPlatformBudget / Number(row.retail_cpm)) * 1000, unit: 'impr.', manual: false };
}

function pacingPct(actual, goal) {
  if (actual == null || goal == null || goal === 0) return null;
  return (Number(actual) / Number(goal)) * 100;
}
function pacingClass(pct) {
  if (pct == null) return '';
  if (pct >= PACING_THRESHOLDS.good) return 'good';
  if (pct >= PACING_THRESHOLDS.warn) return 'warn';
  return 'risk';
}
function pacingPillHtml(pct) {
  if (pct == null) return '<span style="color:var(--muted);font-size:11px">—</span>';
  const cls = pacingClass(pct);
  const colors = { good: ['#DDF2DE', '#2E7D42'], warn: ['#FBF3C7', '#8A6D12'], risk: ['#FBDBD6', '#A23B2E'] }[cls];
  return `<span style="display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap;background:${colors[0]};color:${colors[1]}">${Math.round(pct)}%</span>`;
}

// Finds this line's row for a specific month, carrying the prior month's Gross Budget
// forward when the campaign's budget doesn't vary month to month and no explicit row
// exists yet for the requested month — so a flat-budget campaign never needs its
// number re-entered every month, only a genuinely-varying one does.
function monthRowFor(lineId, monthDate) {
  const key = strategistMonthKey(monthDate);
  const rows = ALL_CAMPAIGN_MONTHS.filter(m => m.campaign_line_id === lineId).sort((a,b) => a.month.localeCompare(b.month));
  const exact = rows.find(m => strategistMonthKey(new Date(m.month + 'T00:00:00')) === key);
  if (exact) return exact;
  const line = ALL_CAMPAIGN_LINES.find(l => l.id === lineId);
  if (line && line.budget_varies_by_month) return null;
  // Carry forward the most recent PRIOR month's gross_budget as a synthetic row.
  const prior = rows.filter(m => m.month < monthDate.toISOString().slice(0,10)).pop();
  return prior ? { ...prior, month: monthDate.toISOString().slice(0,10), _carried: true } : null;
}

  return ALL_CAMPAIGN_LINES.filter(l => {

function strategistToggleVaries(lineId, checked) {
  document.getElementById('setup-months-' + lineId).style.display = checked ? '' : 'none';
  strategistSaveLine(lineId, { budget_varies_by_month: checked }, false);
}

async function strategistAddSetupMonth(lineId) {
  const rows = ALL_CAMPAIGN_MONTHS.filter(m => m.campaign_line_id === lineId).sort((a,b) => a.month.localeCompare(b.month));
  const last = rows[rows.length - 1];
  const next = last ? new Date(last.month + 'T00:00:00') : new Date();
  next.setMonth(next.getMonth() + 1);
  await strategistSaveMonth(lineId, next.toISOString().slice(0,10), { gross_budget: last ? last.gross_budget : null });
}

// Backfilling a specific past month from the detail panel's history editor (2026-08-04)
// — unlike strategistAddSetupMonth() above (which just adds "the next month" for an
// ongoing campaign), an imported campaign needs to jump straight to a specific past
// month, however far back makes sense for that one — no fixed amount of history is
// assumed or required.
async function strategistAddHistoryMonth(lineId) {
  const input = prompt('Which month? (YYYY-MM)');
  if (!input) return;
  const match = /^(\d{4})-(\d{2})$/.exec(input.trim());
  if (!match) { showToast('Enter a month as YYYY-MM, e.g. 2026-03', 'error'); return; }
  const monthStr = `${match[1]}-${match[2]}-01`;
  await strategistSaveMonth(lineId, monthStr, {});
}

async function strategistSaveMonth(lineId, monthStr, data) {
  try {
    await sb('rpc/strategist_save_campaign_month', { method: 'POST', body: JSON.stringify({
      p_name: currentStrategistUser.name, p_pw: currentStrategistUser.pw,
      p_campaign_line_id: lineId, p_month: monthStr,
      p_data: Object.fromEntries(Object.entries(data).map(([k,v]) => [k, v === '' ? null : v]))
    }) });
    await fetchStrategistData();
    renderStrategistDashboard();
  } catch(e) { showToast('Error saving month: ' + e.message, 'error'); }
}

async function strategistSaveLine(lineId, data, reload) {
  try {
    await sb('rpc/strategist_save_campaign_line', { method: 'POST', body: JSON.stringify({
      p_name: currentStrategistUser.name, p_pw: currentStrategistUser.pw, p_id: lineId, p_data: data
    }) });
    if (reload !== false) { await fetchStrategistData(); renderStrategistDashboard(); }
    else showToast('Saved');
  } catch(e) { showToast('Error saving: ' + e.message, 'error'); }
}

async function strategistConfirmActivate(lineId) {

function renderMainTable(lines) {
  if (!lines.length) return '<p style="color:var(--muted);font-size:13px;padding:20px 0">No campaigns in this tab.</p>';
  const byGroup = {};
  lines.forEach(l => { (byGroup[l.group_name || '(no group)'] = byGroup[l.group_name || '(no group)'] || []).push(l); });

  let html = `<table style="width:100%;border-collapse:collapse;font-size:12.5px;min-width:1400px">
    <thead><tr style="background:var(--light)">
      ${['Client','Tactic','Platform','Flight','Gross Budget','In-Platform Budget','Actual Spend','Spend Pacing','Goal','Actual Perf.','Perf. Pacing','Optimize Log','Notes'].map(h =>
        `<th style="padding:8px 10px;text-align:left;font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap">${h}</th>`).join('')}
    </tr></thead><tbody>`;

  Object.keys(byGroup).forEach(groupName => {
    html += `<tr style="background:#EFF6FF"><td colspan="13" style="padding:6px 10px;font-size:10.5px;font-weight:700;text-transform:uppercase;color:var(--accent)">${esc(groupName)}</td></tr>`;
    byGroup[groupName].forEach(l => {
      const monthRow = monthRowFor(l.id, strategistCurrentMonth) || {};
      const inPlatform = computeInPlatformBudget(monthRow.gross_budget, l.service_id, l.group_id);
      const goal = computeGoal(l, inPlatform);
      const spendPacing = pacingPct(monthRow.actual_spend, inPlatform);
      const actualPerf = goal.unit === 'clicks' ? monthRow.actual_clicks : monthRow.actual_impressions;
      const perfPacing = pacingPct(actualPerf, goal.value);
      const logCount = ALL_OPTIMIZE_LOG.filter(o => o.campaign_line_id === l.id).length;
      const selected = strategistSelectedLineId === l.id;
      html += `<tr onclick="strategistSelectLine('${l.id}')" style="cursor:pointer;border-bottom:1px solid var(--border);${selected ? 'background:var(--light)' : ''}">
        <td style="padding:9px 10px"><strong>${esc(l.client_name || '(unknown)')}</strong></td>
        <td style="padding:9px 10px">${esc(l.tactic_label || l.service_id)}</td>
        <td style="padding:9px 10px"><input value="${esc(l.platform || '')}" onclick="event.stopPropagation()" onchange="strategistSaveLine('${l.id}', {platform: this.value}, false)" style="width:110px;padding:4px 6px;border-radius:5px;border:1px dashed var(--accent);font-size:11.5px"/></td>
        <td style="padding:9px 10px;white-space:nowrap">${esc(l.flight_start || '—')} – ${esc(l.flight_end || '—')}</td>
        <td style="padding:9px 10px">${monthRow.gross_budget != null ? '$' + Number(monthRow.gross_budget).toLocaleString() + '/mo' : '—'}</td>
        <td style="padding:9px 10px">${inPlatform != null ? '$' + inPlatform.toLocaleString(undefined,{maximumFractionDigits:0}) + '/mo' : '—'}</td>
        <td style="padding:9px 10px">${monthRow.actual_spend != null ? '$' + Number(monthRow.actual_spend).toLocaleString() : '—'}</td>
        <td style="padding:9px 10px">${pacingPillHtml(spendPacing)}</td>
        <td style="padding:9px 10px">${goal.value != null ? Math.round(goal.value).toLocaleString() + ' ' + goal.unit : (goal.manual ? '— (enter manually)' : '—')}</td>
        <td style="padding:9px 10px">${actualPerf != null ? Number(actualPerf).toLocaleString() + ' ' + goal.unit : '—'}</td>
        <td style="padding:9px 10px">${pacingPillHtml(perfPacing)}</td>
        <td style="padding:9px 10px">${logCount} ${logCount === 1 ? 'entry' : 'entries'}</td>
        <td style="padding:9px 10px;color:var(--muted);max-width:160px">${esc(l.setup_notes || '—')}</td>
      </tr>`;
    });
  });
  html += '</tbody></table>';
  return html;
}

    </div>

    <p style="font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:0 0 8px">Monthly history</p>
    <div style="border:1px solid var(--border);border-radius:8px;padding:4px 12px;margin-bottom:16px;background:var(--light)">
      ${ALL_CAMPAIGN_MONTHS.filter(m => m.campaign_line_id === l.id).sort((a,b) => a.month.localeCompare(b.month)).map(m => `
        <div style="display:flex;align-items:center;gap:8px;font-size:12px;padding:6px 0;border-top:1px solid var(--border)">
          <span style="width:90px;color:var(--muted);font-weight:600">${esc(strategistMonthLabel(new Date(m.month + 'T00:00:00')))}</span>
          <input type="number" value="${m.gross_budget ?? ''}" onchange="strategistSaveMonth('${l.id}', '${m.month}', {gross_budget: this.value})" placeholder="Gross" style="width:90px;padding:5px 6px;border-radius:6px;border:1px solid var(--border);font-size:11.5px"/>
          <input type="number" value="${m.actual_spend ?? ''}" onchange="strategistSaveMonth('${l.id}', '${m.month}', {actual_spend: this.value})" placeholder="Actual spend" style="width:90px;padding:5px 6px;border-radius:6px;border:1px solid var(--border);font-size:11.5px"/>
          <input type="number" value="${m.actual_clicks ?? ''}" onchange="strategistSaveMonth('${l.id}', '${m.month}', {actual_clicks: this.value})" placeholder="Clicks" style="width:75px;padding:5px 6px;border-radius:6px;border:1px solid var(--border);font-size:11.5px"/>
          <input type="number" value="${m.actual_impressions ?? ''}" onchange="strategistSaveMonth('${l.id}', '${m.month}', {actual_impressions: this.value})" placeholder="Impr." style="width:85px;padding:5px 6px;border-radius:6px;border:1px solid var(--border);font-size:11.5px"/>
        </div>`).join('') || '<p style="font-size:11px;color:var(--muted);padding:6px 0">No months on record yet.</p>'}
      <button onclick="strategistAddHistoryMonth('${l.id}')" style="margin:8px 0;padding:4px 10px;border-radius:6px;border:1px solid var(--border);background:#fff;font-size:11px;cursor:pointer">+ Add a past month</button>
    </div>

    ${l.service_id === 'sem-bp' || !CATALOG_ROWS[l.service_id]?.retail_cpm ? `
    <p style="font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:0 0 6px">Goal (manual — no single rate on file yet)</p>
    <input type="number" value="${l.goal_override ?? ''}" onchange="strategistSaveLine('${l.id}', {goal_override: this.value}, false)" placeholder="Clicks goal" style="width:120px;padding:6px 8px;border-radius:6px;border:1px solid var(--border);font-size:12.5px;margin-bottom:16px"/>
    ` : ''}

    <p style="font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:0 0 8px">Optimize log</p>
    ${log.map(o => `<div style="display:flex;align-items:flex-start;gap:14px;padding:8px 0;border-top:1px solid var(--border)">
      <span style="font-family:monospace;font-size:11px;color:var(--muted);width:80px;flex:none">${esc(o.entry_date)}</span>
      <span style="font-size:12.5px;flex:1">${esc(o.note)}</span>
      <span style="flex:none;display:flex;gap:8px">
        <a onclick="strategistEditLogEntry('${l.id}','${o.id}')" style="font-size:11px;font-weight:600;color:var(--accent);cursor:pointer">Edit</a>
        <a onclick="strategistDeleteLogEntry('${o.id}')" style="font-size:11px;font-weight:600;color:#EF4444;cursor:pointer">Delete</a>
      </span>
    </div>`).join('') || '<p style="font-size:12px;color:var(--muted)">No entries yet.</p>'}

    <div id="log-entry-form-${l.id}" style="margin-top:12px;display:flex;gap:8px;align-items:flex-end">
      <div>
        <label class="lbl">Date</label>
        <input type="date" id="log-date-${l.id}" value="${new Date().toISOString().slice(0,10)}" style="padding:6px 8px;border-radius:6px;border:1px solid var(--border);font-size:12px"/>
      </div>
      <div style="flex:1">
        <label class="lbl">What was changed</label>
        <input type="text" id="log-note-${l.id}" style="width:100%;padding:6px 8px;border-radius:6px;border:1px solid var(--border);font-size:12px"/>
      </div>
      <input type="hidden" id="log-edit-id-${l.id}"/>
      <button onclick="strategistSaveLogEntry('${l.id}')" style="padding:7px 14px;border-radius:6px;background:var(--accent);color:#fff;border:none;font-size:12px;font-weight:600;cursor:pointer">Add</button>
    </div>
  </div>`;
}

function strategistEditLogEntry(lineId, logId) {
  const entry = ALL_OPTIMIZE_LOG.find(o => o.id === logId);
  if (!entry) return;
  document.getElementById('log-date-' + lineId).value = entry.entry_date;
  document.getElementById('log-note-' + lineId).value = entry.note;
  document.getElementById('log-edit-id-' + lineId).value = entry.id;
}

async function strategistSaveLogEntry(lineId) {
  const date = document.getElementById('log-date-' + lineId).value;
  const note = document.getElementById('log-note-' + lineId).value.trim();
  const editId = document.getElementById('log-edit-id-' + lineId).value || null;
  if (!note) { showToast('Enter what was changed.', 'error'); return; }
  try {
    await sb('rpc/strategist_save_optimize_log', { method: 'POST', body: JSON.stringify({
      p_name: currentStrategistUser.name, p_pw: currentStrategistUser.pw,
      p_id: editId, p_campaign_line_id: lineId, p_entry_date: date, p_note: note
    }) });
    await fetchStrategistData();
    strategistSelectedLineId = lineId;
    renderStrategistDashboard();
    showToast('Optimize log saved');
  } catch(e) { showToast('Error saving log entry: ' + e.message, 'error'); }
}

async function strategistDeleteLogEntry(logId) {
  try {
    await sb('rpc/strategist_delete_optimize_log', { method: 'POST', body: JSON.stringify({
      p_name: currentStrategistUser.name, p_pw: currentStrategistUser.pw, p_id: logId
    }) });
    await fetchStrategistData();
    renderStrategistDashboard();
    showToast('Entry deleted');
  } catch(e) { showToast('Error deleting entry: ' + e.message, 'error'); }
}

function strategistLogout() {
  currentStrategistUser = null;
  showStrategistPanel(false);
  promptStrategistLogin();
}

document.addEventListener('DOMContentLoaded', async () => {
  await loadStrategistRoster();
  promptStrategistLogin();
});
</script>
</body>
</html>
