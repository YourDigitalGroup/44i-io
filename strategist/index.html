function normalizeHeaderName(s) {
  return s.trim().toLowerCase().replace(/[_-]+/g, ' ').replace(/\s+/g, ' ');
}

// Resolves a typed Client/Tactic cell against real data -- exact, case-insensitive.
// Returns null (not a guess) if nothing matches, so an unresolved row is reported
// back rather than silently imported against the wrong client or tactic.
function resolveBulkClient(name) {
  const norm = (name || '').trim().toLowerCase();
  return ALL_STRATEGIST_CLIENTS.find(c => c.name.trim().toLowerCase() === norm) || null;
}
function resolveBulkService(name) {
  const norm = (name || '').trim().toLowerCase();
  if (CATALOG_ROWS[name]) return CATALOG_ROWS[name]; // literal service_id typed directly
  return Object.values(CATALOG_ROWS).find(r => r.pricing_mode === 'spend' &&
    ((r.accounting_label || r.label || '').trim().toLowerCase() === norm)) || null;
}

// Pure parse: paste text in, a plan out. Never touches the database -- callers
// decide what to do with the result. Returns { error } for a hard stop (missing
// required columns), or { groups, errors } where groups is a Map of identityKey ->
// campaign fields + monthRows, and errors is a list of unresolved/invalid rows.
//
// `overrides` (keyed by rowNum, 2026-08-10 per Claire -- "could the preview call
// out the things that don't match and I can update them exactly or remove them,"
// rather than having to fix the paste and start over) lets a specific row's
// client/tactic be forced to a real id picked from a dropdown, or the row dropped
// entirely, WITHOUT touching the pasted text at all -- re-parsing with the same
// raw text plus an override is how a correction actually takes effect.
function strategistParseBulkImport(raw, overrides = {}) {
  const rows = parsePastedReportRows(raw);
  if (rows.length < 2) return { error: 'Need a header row plus at least one data row.' };

  const header = rows[0].map(normalizeHeaderName);
  const colIndex = {};
  BULK_IMPORT_COLUMNS.forEach(({ key, names }) => {
    const idx = header.findIndex(h => names.includes(h));
    if (idx !== -1) colIndex[key] = idx;
  });
  const missingRequired = ['client', 'tactic'].filter(k => colIndex[k] === undefined);
  if (missingRequired.length) {
    return { error: 'Header row is missing required column(s): ' + missingRequired.join(', ') };
  }

  const errors = []; // { rowNum, field: 'client'|'tactic', clientName, tacticName }
  // Group data rows by the campaign identity they belong to, so several months for
  // the SAME campaign share one campaign_lines row instead of creating a duplicate
  // per row.
  const groups = new Map(); // identityKey -> { fields, monthRows: [] }
  rows.slice(1).forEach((cols, i) => {
    const rowNum = i + 2; // 1-based, header is row 1
    if (overrides[rowNum]?.excluded) return; // removed from the import, per Claire's own review
    const get = (key) => colIndex[key] !== undefined ? (cols[colIndex[key]] || '').trim() : '';
    const clientName = get('client'), tacticName = get('tactic');
    if (!clientName && !tacticName) return; // blank line
    const clientOverrideId = overrides[rowNum]?.clientId;
    const serviceOverrideId = overrides[rowNum]?.serviceId;
    const client = clientOverrideId ? ALL_STRATEGIST_CLIENTS.find(c => c.id === clientOverrideId) : resolveBulkClient(clientName);
    const service = serviceOverrideId ? CATALOG_ROWS[serviceOverrideId] : resolveBulkService(tacticName);
    if (!client) { errors.push({ rowNum, field: 'client', clientName, tacticName }); return; }
    if (!service) { errors.push({ rowNum, field: 'tactic', clientName, tacticName }); return; }
    // Normalized to lowercase and validated against the 4 real statuses this
    // portal actually knows about -- found live 2026-08-10 (Claire): a CSV's
    // Status column typed as "Active" (capitalized) saved exactly as typed and
    // then matched NONE of the lowercase-only status tabs anywhere, making 238
    // real campaigns invisible on every tab, in every month, regardless of scope.
    const statusOverride = overrides[rowNum]?.status;
    const statusRaw = get('status');
    const status = statusOverride || (statusRaw ? statusRaw.toLowerCase() : 'active');
    if (!BULK_IMPORT_VALID_STATUSES.includes(status)) {
      errors.push({ rowNum, field: 'status', clientName, tacticName, statusRaw });
      return;
    }
    const platform = get('platform');
    const platformCampaignName = get('platform_campaign_name');
    const identityKey = [client.id, service.id, platform, platformCampaignName].join('|');
    if (!groups.has(identityKey)) {
      groups.set(identityKey, {
        client_id: client.id, group_id: client.group_id, service_id: service.id,
        tactic_label: service.accounting_label || service.label, platform: platform || null,
        platform_campaign_name: platformCampaignName || null, split_label: get('split_label') || null,
        status, flight_start: get('flight_start') || null, flight_end: get('flight_end') || null,
        monthRows: [],
      });
    }
    const month = get('month');
    // Same fix as the paste-report tool (2026-08-06): a real spreadsheet's Gross
    // Budget column can be "$1,500"-formatted -- strip $ and , before it ever reaches
    // a numeric column, or the save throws Postgres error 22P02.
    const grossBudget = get('gross_budget').replace(/[$,]/g, '').trim();
    if (month) groups.get(identityKey).monthRows.push({ month, grossBudget, rowNum });
  });

  // Splits: rows sharing the same client+tactic+platform that were given a Split
  // Label become siblings -- same mechanism as the Setup panel's own split feature
  // (split_label + split_order), but each is created directly as its own line here
  // rather than exploding out of one existing line, since bulk import creates
  // brand-new campaigns rather than splitting an already-existing one. Order is
  // purely "first seen in the paste," same convention as everywhere else split
  // ordering matters in this project.
  const splitGroupOrder = new Map(); // splitGroupKey -> [identityKey, ...] in first-seen order
  for (const [identityKey, g] of groups) {
    if (!g.split_label) continue;
    const splitGroupKey = [g.client_id, g.service_id, g.platform].join('|');
    if (!splitGroupOrder.has(splitGroupKey)) splitGroupOrder.set(splitGroupKey, []);
    splitGroupOrder.get(splitGroupKey).push(identityKey);
  }
  for (const identityKeys of splitGroupOrder.values()) {
    identityKeys.forEach((identityKey, idx) => { groups.get(identityKey).split_order = idx; });
  }

  // Existing campaigns are matched the same way the paste-report tool does -- by
  // platform_campaign_name -- so re-running an import (e.g. to add a newer month)
  // updates the SAME campaign instead of creating a duplicate.
  const existingByTitle = {};
  ALL_CAMPAIGN_LINES.forEach(l => {
    if (l.platform_campaign_name) existingByTitle[l.platform_campaign_name.trim().toLowerCase()] = l;
  });
  for (const g of groups.values()) {
    g.existingLineId = g.platform_campaign_name ? existingByTitle[g.platform_campaign_name.trim().toLowerCase()]?.id : null;
  }

  return { groups, errors };
}

// Per-rowNum corrections applied on top of the raw paste, without editing the
// textarea itself -- 2026-08-10, per Claire: fixing a mismatch shouldn't require
// re-pasting the whole thing. Cleared whenever the form opens/closes.
let BULK_IMPORT_OVERRIDES = {};

// Parses and shows what WOULD happen -- nothing is saved yet. Claire (2026-08-10):
// wanted a chance to catch a bad row before anything actually gets created, same
// review-before-import pattern used elsewhere in this project. Also the single
// re-render path for every correction made below -- a dropdown pick or a "Remove
// this row" click both just record an override and call this again.
function strategistRenderBulkPreview() {
  const raw = document.getElementById('bulk-import-text').value;
  if (!raw.trim()) { showToast('Paste something first.', 'error'); return; }
  const plan = strategistParseBulkImport(raw, BULK_IMPORT_OVERRIDES);
  if (plan.error) { showToast(plan.error, 'error'); return; }
  BULK_IMPORT_PLAN = plan;

  const rowsHtml = [...plan.groups.values()].map(g => {
    const monthsSummary = g.monthRows.length
      ? g.monthRows.map(m => `${m.month} ($${m.grossBudget || '—'})`).join(', ')
      : '—';
    const action = g.existingLineId ? '<span style="color:#0F766E;font-weight:600">Match existing</span>' : '<span style="color:var(--accent);font-weight:600">Create new</span>';
    return `<tr style="border-bottom:1px solid var(--border)">
      <td style="padding:6px 8px">${esc(g.tactic_label)}${g.split_label ? ' <span style="color:var(--muted)">— ' + esc(g.split_label) + '</span>' : ''}</td>
      <td style="padding:6px 8px">${esc(g.platform || '—')}</td>
      <td style="padding:6px 8px">${esc(g.platform_campaign_name || '—')}</td>
      <td style="padding:6px 8px">${esc(g.status)}</td>
      <td style="padding:6px 8px;font-size:11px;color:var(--muted)">${esc(monthsSummary)}</td>
      <td style="padding:6px 8px">${action}</td>
    </tr>`;
  }).join('');

  // Each unresolved row gets a fix-it block right in the preview -- a dropdown of
  // the REAL clients/tactics to pick the right one, or a button to drop the row
  // entirely -- rather than a plain error string that sends you back to the paste.
  const clientOptions = [...ALL_STRATEGIST_CLIENTS].sort((a, b) => a.name.localeCompare(b.name))
    .map(c => `<option value="${esc(c.id)}">${esc(c.name)}${c.group_name ? ' (' + esc(c.group_name) + ')' : ''}</option>`).join('');
  const tacticOptions = Object.values(CATALOG_ROWS).filter(s => s.pricing_mode === 'spend')
    .sort((a, b) => (a.accounting_label || a.label).localeCompare(b.accounting_label || b.label))
    .map(s => `<option value="${esc(s.id)}">${esc(s.accounting_label || s.label)}</option>`).join('');
  const statusOptions = BULK_IMPORT_VALID_STATUSES.map(s => `<option value="${esc(s)}">${esc(s)}</option>`).join('');
  const errorsHtml = plan.errors.map(e => {
    let message, fixSelect;
    if (e.field === 'client') {
      message = `no client matches "${esc(e.clientName)}"`;
      fixSelect = `<select onchange="strategistApplyBulkOverride(${e.rowNum}, 'clientId', this.value)" style="padding:5px 8px;border-radius:6px;border:1px solid var(--border);font-size:11.5px"><option value="">— Pick the right client —</option>${clientOptions}</select>`;
    } else if (e.field === 'tactic') {
      message = `no tactic matches "${esc(e.tacticName)}"`;
      fixSelect = `<select onchange="strategistApplyBulkOverride(${e.rowNum}, 'serviceId', this.value)" style="padding:5px 8px;border-radius:6px;border:1px solid var(--border);font-size:11.5px"><option value="">— Pick the right tactic —</option>${tacticOptions}</select>`;
    } else {
      // status -- only pending/active/paused/complete are recognized anywhere in
      // this portal; anything else (a typo, wrong capitalization) saves fine but
      // is then invisible on every tab, so it's caught here instead.
      message = `"${esc(e.statusRaw)}" isn't a real status`;
      fixSelect = `<select onchange="strategistApplyBulkOverride(${e.rowNum}, 'status', this.value)" style="padding:5px 8px;border-radius:6px;border:1px solid var(--border);font-size:11.5px"><option value="">— Pick the right status —</option>${statusOptions}</select>`;
    }
    return `<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:6px 0;border-bottom:1px solid var(--border)">
      <span style="font-size:11.5px;color:#B91C1C">Row ${e.rowNum}: ${message}</span>
      ${fixSelect}
      <button onclick="strategistApplyBulkOverride(${e.rowNum}, 'excluded', true)" style="padding:5px 10px;border-radius:6px;border:1px solid var(--border);background:var(--light);font-size:11px;cursor:pointer">Remove this row</button>
    </div>`;
  }).join('');

  const resultsEl = document.getElementById('bulk-import-results');
  if (!resultsEl) return;
  resultsEl.innerHTML = `
    <p style="font-size:12px;font-weight:600;margin:0 0 6px">Preview — nothing saved yet. ${plan.groups.size} campaign(s) found${plan.errors.length ? `, ${plan.errors.length} row issue(s)` : ''}.</p>
    ${plan.groups.size ? `<div style="overflow-x:auto;margin-bottom:10px"><table style="width:100%;border-collapse:collapse;font-size:12px">
      <thead><tr style="background:var(--light);text-align:left"><th style="padding:6px 8px">Tactic</th><th style="padding:6px 8px">Platform</th><th style="padding:6px 8px">Title</th><th style="padding:6px 8px">Status</th><th style="padding:6px 8px">Months</th><th style="padding:6px 8px">Action</th></tr></thead>
      <tbody>${rowsHtml}</tbody>
    </table></div>` : ''}
    ${plan.errors.length ? `<p style="font-size:12px;color:#B91C1C;font-weight:600;margin:4px 0 4px">${plan.errors.length} row(s) need a fix before they'll import:</p><div style="margin-bottom:10px">${errorsHtml}</div>` : ''}
    ${plan.groups.size ? `<div style="display:flex;gap:10px"><button id="bulk-import-confirm-btn" onclick="strategistConfirmBulkImport()" style="padding:7px 16px;border-radius:6px;background:var(--accent);color:#fff;border:none;font-size:12.5px;font-weight:600;cursor:pointer">Confirm Import</button></div>` : ''}
  `;
}

// Button-triggered entry point -- same rendering as every override-driven refresh
// below, just the first pass over freshly pasted text.
function strategistPreviewBulkImport() {
  BULK_IMPORT_OVERRIDES = {};
  strategistRenderBulkPreview();
}

// Records one row's correction (a picked client/tactic id, or "remove this row")
// and immediately re-renders the preview against the SAME pasted text -- the
// fixed/removed row either joins the real campaign table above or disappears from
// the issues list, without ever touching the textarea.
function strategistApplyBulkOverride(rowNum, field, value) {
  BULK_IMPORT_OVERRIDES[rowNum] = { ...BULK_IMPORT_OVERRIDES[rowNum], [field]: value };
  strategistRenderBulkPreview();
}

// Guards against a real bug Claire hit live (2026-08-10): 119 campaigns took long
// enough (each needs its own sequential RPC round trip) that clicking Confirm gave
// no visible feedback at all, so she clicked it again -- which ran the whole save
// loop a SECOND time against the same not-yet-cleared plan, creating a duplicate
// for every campaign that didn't already exist. This flag blocks a second
// invocation outright, and disabling+relabeling the button below gives the
// immediate feedback that was actually missing in the first place.
let BULK_IMPORT_CONFIRMING = false;

// Actually saves whatever strategistPreviewBulkImport() already parsed and showed.
async function strategistConfirmBulkImport() {
  if (BULK_IMPORT_CONFIRMING) { showToast('Already saving — one moment.', 'error'); return; }
  const plan = BULK_IMPORT_PLAN;
  if (!plan) { showToast('Nothing to import — preview first.', 'error'); return; }
  BULK_IMPORT_CONFIRMING = true;
  const confirmBtn = document.getElementById('bulk-import-confirm-btn');
  if (confirmBtn) { confirmBtn.disabled = true; confirmBtn.textContent = 'Saving…'; confirmBtn.style.cursor = 'default'; confirmBtn.style.opacity = '.6'; }
  try {
  // plan.errors are the structured {rowNum, field, ...} objects the preview's
  // fix-it UI reads directly -- flatten to plain strings here since everything
  // pushed onto `errors` from this point on (a bad month, a failed save) is a
  // fully-resolved sentence for the final results list, not something with its
  // own correction UI.
  const errors = plan.errors.map(e => {
    if (e.field === 'status') return `Row ${e.rowNum}: "${e.statusRaw}" isn't a real status`;
    return `Row ${e.rowNum}: no ${e.field} matches "${e.field === 'client' ? e.clientName : e.tacticName}"`;
  });

  let createdCount = 0, matchedExistingCount = 0, monthsSavedCount = 0, reportsAppliedCount = 0;
  for (const g of plan.groups.values()) {
    let lineId = g.existingLineId;
    if (lineId) {
      matchedExistingCount++;
    } else {
      try {
        lineId = await sb('rpc/strategist_save_campaign_line', { method: 'POST', body: JSON.stringify({
          p_name: currentStrategistUser.name, p_pw: currentStrategistUser.pw, p_id: null,
          p_data: {
            client_id: g.client_id, group_id: g.group_id, service_id: g.service_id, tactic_label: g.tactic_label,
            platform: g.platform, platform_campaign_name: g.platform_campaign_name,
            split_label: g.split_label, split_order: g.split_order ?? null,
            flight_start: g.flight_start, flight_end: g.flight_end,
            status: g.status, assigned_strategist: currentStrategistUser.name,
          }
        }) });
        createdCount++;
      } catch(e) { errors.push(`Couldn't create campaign for "${g.tactic_label}" (${g.platform_campaign_name || 'no title'}): ${e.message}`); continue; }
    }
    for (const mr of g.monthRows) {
      const match = /^(\d{4})-(\d{2})$/.exec(mr.month);
      if (!match) { errors.push(`Row ${mr.rowNum}: "${mr.month}" isn't a valid month (use YYYY-MM)`); continue; }
      try {
        await sb('rpc/strategist_save_campaign_month', { method: 'POST', body: JSON.stringify({
          p_name: currentStrategistUser.name, p_pw: currentStrategistUser.pw,
          p_campaign_line_id: lineId, p_month: `${match[1]}-${match[2]}-01`,
          p_data: mr.grossBudget ? { gross_budget: mr.grossBudget } : {}
        }) });
        monthsSavedCount++;
      } catch(e) { errors.push(`Row ${mr.rowNum}: couldn't save month: ${e.message}`); }
    }
    // Real gap found live (2026-08-10, Claire): every OTHER way a campaign gets
    // created or edited in this portal checks the cached platform report for a
    // title match and auto-fills actuals -- bulk import never did. Same lookup,
    // no refetch/rerender per row (see findCachedReportMatch's own comment).
    const cachedMatch = findCachedReportMatch(g.platform, g.platform_campaign_name);
    if (cachedMatch) {
      try {
        await sb('rpc/strategist_save_campaign_month', { method: 'POST', body: JSON.stringify({
          p_name: currentStrategistUser.name, p_pw: currentStrategistUser.pw,
          p_campaign_line_id: lineId, p_month: cachedMatch.report_month, p_data: cachedMatch.data
        }) });
        reportsAppliedCount++;
      } catch(e) { errors.push(`Couldn't apply the cached platform report for "${g.tactic_label}" (${g.platform_campaign_name}): ${e.message}`); }
    }
  }

  BULK_IMPORT_PLAN = null;
  await fetchStrategistData();
  renderStrategistDashboard();

  const resultsEl = document.getElementById('bulk-import-results');
  if (resultsEl) {
    resultsEl.innerHTML = `
      <p style="font-size:12px;color:#166534;font-weight:600;margin:0 0 4px">${createdCount} campaign(s) created, ${matchedExistingCount} matched to an existing campaign, ${monthsSavedCount} month(s) saved${reportsAppliedCount ? `, ${reportsAppliedCount} filled in from an already-pasted platform report` : ''}.</p>
      ${errors.length ? `<p style="font-size:12px;color:#B91C1C;font-weight:600;margin:4px 0 0">${errors.length} issue(s):</p><ul style="font-size:11.5px;color:#B91C1C;margin:4px 0 0;padding-left:18px">${errors.map(e => `<li>${esc(e)}</li>`).join('')}</ul>` : ''}
    `;
  }
  showToast(`Import done: ${createdCount} created, ${matchedExistingCount} matched, ${reportsAppliedCount} report(s) applied, ${errors.length} issue(s)`);
  } finally {
    BULK_IMPORT_CONFIRMING = false;
  }
}

// Fetches the four datasets fresh, WITHOUT touching any view state (current month,
// scope, status tab, selected row) — used both by the initial load and by every save
// handler afterward. Kept separate from loadStrategistDashboard() below on purpose:
// re-fetching after saving one field shouldn't reset which month a strategist happens
// to be looking at.
async function fetchStrategistData() {
  if (!Object.keys(CATALOG_ROWS).length) await loadCatalog();
  const [lines, months, log, rates, clients, reportCache, statusHistory] = await Promise.all([
    sb('rpc/strategist_get_campaign_lines', { method: 'POST', body: JSON.stringify({ p_name: currentStrategistUser.name, p_pw: currentStrategistUser.pw }) }),
    sb('rpc/strategist_get_campaign_months', { method: 'POST', body: JSON.stringify({ p_name: currentStrategistUser.name, p_pw: currentStrategistUser.pw }) }),
    sb('rpc/strategist_get_optimize_log', { method: 'POST', body: JSON.stringify({ p_name: currentStrategistUser.name, p_pw: currentStrategistUser.pw }) }),
    sb('rpc/strategist_get_budgeted_spend_rates', { method: 'POST', body: JSON.stringify({ p_name: currentStrategistUser.name, p_pw: currentStrategistUser.pw }) }),
    sb('rpc/strategist_get_clients', { method: 'POST', body: JSON.stringify({ p_name: currentStrategistUser.name, p_pw: currentStrategistUser.pw }) }),
    sb('rpc/strategist_get_platform_report_cache', { method: 'POST', body: JSON.stringify({ p_name: currentStrategistUser.name, p_pw: currentStrategistUser.pw }) }),
    sb('rpc/strategist_get_status_history', { method: 'POST', body: JSON.stringify({ p_name: currentStrategistUser.name, p_pw: currentStrategistUser.pw }) }),
  ]);
  ALL_CAMPAIGN_LINES = lines || [];
  ALL_CAMPAIGN_MONTHS = months || [];
  ALL_OPTIMIZE_LOG = log || [];
  ALL_STRATEGIST_CLIENTS = clients || [];
  ALL_STATUS_HISTORY = statusHistory || [];
  PLATFORM_CPM_RATES = { base: {}, group: {} };
  (rates || []).forEach(r => {
    if (r.scope === 'base') PLATFORM_CPM_RATES.base[r.service_id] = r.platform_cpm;
    else PLATFORM_CPM_RATES.group[r.group_id + '|' + r.service_id] = r.platform_cpm;
  });
  PLATFORM_REPORT_CACHE = {};
  (reportCache || []).forEach(r => { PLATFORM_REPORT_CACHE[r.platform] = { report_month: r.report_month, rows: r.rows || [] }; });
}

async function loadStrategistDashboard() {
  strategistCurrentMonth = new Date(new Date().getFullYear(), new Date().getMonth(), 1);
  try {
    await fetchStrategistData();
  } catch(e) {
    showToast('Error loading dashboard: ' + e.message, 'error');
    return;
  }
  renderStrategistDashboard();
}

// Effective Platform CPM for a service, honoring a group-specific override — same
// resolution order as the admin Accounting Overrides tab (group override wins, else
// the base accounting_map rate). Never exposes 44i Cut %/Fixed Cut/Setup Fee Split —
// this dashboard only ever needs Platform CPM.
function effectivePlatformCpm(serviceId, groupId) {
  const groupKey = groupId + '|' + serviceId;
  if (PLATFORM_CPM_RATES.group[groupKey] != null) return Number(PLATFORM_CPM_RATES.group[groupKey]);
  return PLATFORM_CPM_RATES.base[serviceId] != null ? Number(PLATFORM_CPM_RATES.base[serviceId]) : null;
}

// Budgeted Impressions = Gross Budget ÷ Retail CPM × 1000 -- what was actually sold
// to the client, independent of platform cost efficiency. Confirmed against real
// strategist spreadsheets 2026-08-05 (Galaxy, Prairie Flower Casino, Fisher & Son,
// Auto Bank of KC) after Claire flagged In-Platform Budget/Goal numbers not matching
// what strategists were using: every example traced back to a clean Retail CPM here,
// while the old flat "Gross × Budgeted Spend %" model for In-Platform Budget produced
// a non-round % every time -- confirming this, not that, is the real source of truth.
// This is also now the direct basis for Goal (see computeGoal below) -- Goal never
// derives from In-Platform Budget, since what's promised to the client doesn't move
// just because the platform ends up more or less efficient than planned.
function budgetedImpressions(grossBudget, serviceId) {
  const row = CATALOG_ROWS[serviceId];
  if (grossBudget == null || !row || row.retail_cpm == null) return null;
  return (Number(grossBudget) / Number(row.retail_cpm)) * 1000;
}

// In-Platform Budget = Budgeted Impressions × Platform CPM ÷ 1000 -- always computed
// live, never stored, same derived-vs-stored principle as everywhere else in this
// project. Platform CPM is a real number entered per service/group (Admin →
// Accounting Map / Accounting Overrides), not derived from a flat %.
function computeInPlatformBudget(grossBudget, serviceId, groupId) {
  const impressions = budgetedImpressions(grossBudget, serviceId);
  const platformCpm = effectivePlatformCpm(serviceId, groupId);
  if (impressions == null || platformCpm == null) return null;
  return impressions * platformCpm / 1000;
}

// campaign_months.in_platform_override — an explicit override always wins over the
// computed value, same "override wins" pattern as Goal (2026-08-04, per Claire:
// "we will also need to be able to override the in platform spend while we confirm
// all of our logic is working correctly"). Per-MONTH, not per-campaign, since
// In-Platform Budget (like Gross Budget) is itself a per-month figure — lives on
// campaign_months, not campaign_lines. Every call site that used to call
// computeInPlatformBudget() directly on a monthRow now goes through this instead.
function effectiveInPlatformBudget(monthRow, serviceId, groupId) {
  if (!monthRow) return null;
  if (monthRow.in_platform_override != null) return Number(monthRow.in_platform_override);
  return computeInPlatformBudget(monthRow.gross_budget, serviceId, groupId);
}

// Goal: impressions for every platform except SEM (Goal = Budgeted Impressions =
// Gross Budget ÷ Retail CPM × 1000 -- see budgetedImpressions() above). Deliberately
// NOT derived from In-Platform Budget (changed 2026-08-05, per Claire's real-campaign
// testing): what's promised to the client is fixed by the Retail CPM they were sold
// on, not by how efficiently the platform happens to deliver that spend. SEM is a
// known v1 gap — the catalog only stores a CPC RANGE string ("$4-$12"), not a single
// rate, so an automatic clicks number isn't actually computable yet; falls back to
// campaign_lines.goal_override (manual entry, same trust level as Platform/monthly
// budgets) until a real single CPC rate is decided. goal_override is a general escape
// hatch, not just SEM's -- found live 2026-08-04, per Claire: a bulk-imported campaign
// that skips entering In-Platform spend (or whose auto-calculated Goal is simply
// wrong for some other reason) still needs a way to correct it, same as SEM already
// had. An explicit override always wins, regardless of whether an auto-calculated
// number is also available.
// SEM's manual Goal is sometimes a range (e.g. "150-200"), not a single number --
// per Claire, the clicks estimate varies with CPC and she doesn't always have one
// clean number to enter. Confirmed with her: range support is SEM-only (every other
// tactic's goal_override stays a single number), and Perf. Pacing against a range
// uses the MIDPOINT -- the range itself is shown as text in the Goal column/detail
// panel, the midpoint just drives the pacing math underneath it.
function parseGoalOverride(raw, allowRange) {
  if (raw == null || raw === '') return null;
  const rangeMatch = allowRange && String(raw).match(/^\s*([\d.]+)\s*-\s*([\d.]+)\s*$/);
  if (rangeMatch) {
    const low = Number(rangeMatch[1]), high = Number(rangeMatch[2]);
    if (isNaN(low) || isNaN(high)) return null;
    return { value: (low + high) / 2, isRange: true, display: `${low.toLocaleString()}–${high.toLocaleString()}` };
  }
  const num = Number(raw);
  if (isNaN(num)) return null;
  return { value: num, isRange: false, display: Math.round(num).toLocaleString() };
}

// Offline Visits Tracking is a $0 modifier add-on -- never its own campaign_lines
// row (no spend, nothing to buy media against), but a strategist still needs to see
// at a glance that a tactic like Targeted Display was sold WITH it, same as the
// Accounting Map already shows "(w/ Offline Visits Tracking)" pairings. Tracked as
// a plain boolean on the base tactic's own campaign_lines row rather than parsing
// it in/out of tactic_label text.
// Setup queue "at a glance" pill (2026-08-10, per the strategist team's own
// answer: it helps to see WHAT's actually blocking a Pending campaign -- waiting
// on creative, platform access, the intake form, or simply the start date --
// rather than just a plain notes field everyone has to open and read one at a
// time). "Waiting on start date" is deliberately auto-detected from the flight
// dates already on file, not a 4th manual option -- it's objectively knowable,
// no reason to make a strategist set it by hand. Returns null (no pill at all)
// when nothing distinguishes a line -- a newly-arrived, not-yet-reviewed
// campaign should look plain, not alarming.
const SETUP_BLOCKER_LABELS = {
  creative: 'Waiting on Creative',
  platform_access: 'Waiting on Platform Access',
  intake_form: 'Waiting on Intake Form',
};
function strategistSetupBlockerPill(line) {
  if (line.setup_blocker && SETUP_BLOCKER_LABELS[line.setup_blocker]) {
    return `<span style="font-size:10px;font-weight:700;padding:3px 9px;border-radius:20px;background:#FEF3C7;color:#92400E">${esc(SETUP_BLOCKER_LABELS[line.setup_blocker])}</span>`;
  }
  if (line.flight_start && new Date(line.flight_start + 'T00:00:00') > new Date()) {
    return `<span style="font-size:10px;font-weight:700;padding:3px 9px;border-radius:20px;background:#DBEAFE;color:#1E40AF">Starts ${esc(strategistFormatFlightDate(line.flight_start))}</span>`;
  }
  return '';
}

function strategistTacticDisplay(line) {
  let base = line.tactic_label || line.service_id;
  if (line.split_label) base += ' — ' + line.split_label;
  return line.has_offline_visits ? base + ' + Offline Visits Tracking' : base;
}

// Goal override moved from campaign_lines to campaign_months (2026-08-06, per
// Claire: "It should be clear month by month what the strategists are planning to
// do... it can still do the auto calculation based on the gross budget but have it
// by month") -- every month starts from the plain auto-calculation off that
// month's own Gross Budget, and a strategist can override just THAT month without
// it silently carrying over to every other month the way the old campaign-level
// override did. Range support (SEM) applies the same way per month, per Claire:
// "it should support SEM too so it is constant."
function computeGoal(line, monthRow) {
  const row = CATALOG_ROWS[line.service_id];
  const isClicksBased = line.service_id === 'sem-bp' || !row || row.retail_cpm == null;
  const unit = isClicksBased ? 'clicks' : 'impr.';
  const parsed = parseGoalOverride(monthRow?.goal_override, line.service_id === 'sem-bp');
  if (parsed) return { value: parsed.value, unit, manual: true, overridden: true, isRange: parsed.isRange, display: parsed.display };
  if (isClicksBased) return { value: null, unit, manual: true };
  const auto = budgetedImpressions(monthRow?.gross_budget, line.service_id);
  return { value: auto, unit, manual: false, display: auto != null ? Math.round(auto).toLocaleString() : null };
}

function strategistDaysBetweenInclusive(a, b) {
  const utcA = Date.UTC(a.getFullYear(), a.getMonth(), a.getDate());
  const utcB = Date.UTC(b.getFullYear(), b.getMonth(), b.getDate());
  return Math.round((utcB - utcA) / 86400000) + 1;
}

// The expected fraction of a month's flight window that should have delivered by
// today -- confirmed against Claire's real spreadsheet formula 2026-08-06. The window
// is the OVERLAP between the campaign's flight dates and the REAL current calendar
// month (not the full flight, and not just the calendar month alone); "today" clamps
// to the flight's own end date if the flight already finished mid-month.
function strategistExpectedPacingFraction(flightStart, flightEnd, today) {
  const monthStart = new Date(today.getFullYear(), today.getMonth(), 1);
  const monthEnd = new Date(today.getFullYear(), today.getMonth() + 1, 0);
  const fs = flightStart ? new Date(flightStart + 'T00:00:00') : null;
  const fe = flightEnd ? new Date(flightEnd + 'T00:00:00') : null;
  const windowStart = fs && fs > monthStart ? fs : monthStart;
  const windowEnd = fe && fe < monthEnd ? fe : monthEnd;
  if (windowEnd < windowStart) return null; // flight doesn't overlap this month at all
  const elapsedEnd = fe && fe < today ? fe : today;
  if (elapsedEnd < windowStart) return 0;
  const elapsedDays = strategistDaysBetweenInclusive(windowStart, elapsedEnd);
  const totalDays = strategistDaysBetweenInclusive(windowStart, windowEnd);
  return elapsedDays / totalDays;
}

// Spend/Perf Pacing -- confirmed against Claire's real spreadsheet formula
// 2026-08-06: a COMPLETED past month shows a plain final Actual ÷ Goal (that month
// already fully happened, nothing left to project); a month that hasn't started yet
// shows nothing (no actuals to pace); the REAL CURRENT month prorates Goal down to
// "what should have been spent by today," using the overlap between the campaign's
// flight and this calendar month, exactly as in that formula. Deliberately anchored
// to real today's date, not to whichever month is selected in the top-bar picker --
// only WHICH branch applies (past/current/future) depends on the viewed month.
function pacingPct(actual, goal, flightStart, flightEnd, viewedMonth) {
  if (actual == null || goal == null || goal === 0) return null;
  const now = new Date();
  const viewedKey = strategistMonthKey(viewedMonth);
  const nowKey = strategistMonthKey(now);
  if (viewedKey < nowKey) return (Number(actual) / Number(goal)) * 100;
  if (viewedKey > nowKey) return null;
  const frac = strategistExpectedPacingFraction(flightStart, flightEnd, now);
  if (frac == null || frac <= 0) return null;
  return (Number(actual) / (Number(goal) * frac)) * 100;
}
function pacingClass(pct) {
  if (pct == null) return '';
  if (pct >= PACING_THRESHOLDS.good) return 'good';
  if (pct >= PACING_THRESHOLDS.warn) return 'warn';
  return 'risk';
}
function pacingPillHtml(pct) {
  if (pct == null) return '<span style="color:var(--muted);font-size:11px">—</span>';
  const cls = pacingClass(pct);
  const colors = { good: ['#DDF2DE', '#2E7D42'], warn: ['#FBF3C7', '#8A6D12'], risk: ['#FBDBD6', '#A23B2E'] }[cls];
  return `<span style="display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap;background:${colors[0]};color:${colors[1]}">${Math.round(pct)}%</span>`;
}

// Finds this line's row for a specific month, carrying the prior month's Gross Budget
// forward when the campaign's budget doesn't vary month to month and no explicit row
// exists yet for the requested month — so a flat-budget campaign never needs its
// number re-entered every month, only a genuinely-varying one does.
function monthRowFor(lineId, monthDate) {
  const key = strategistMonthKey(monthDate);
  const rows = ALL_CAMPAIGN_MONTHS.filter(m => m.campaign_line_id === lineId).sort((a,b) => a.month.localeCompare(b.month));
  const exact = rows.find(m => strategistMonthKey(new Date(m.month + 'T00:00:00')) === key);
  const line = ALL_CAMPAIGN_LINES.find(l => l.id === lineId);
  const priorRow = () => rows.filter(m => m.month < monthDate.toISOString().slice(0,10)).pop();

  if (exact) {
    // Pasting a platform report (or adding a past month manually) can create/update
    // a month's ACTUALS before that month ever got a real Gross Budget entered —
    // found live 2026-08-05, checking Claire's own question about testing a past
    // month. Without this, that exact row's own gross_budget (null) would win over
    // carry-forward entirely, silently blanking In-Platform Budget for a month that
    // otherwise has real numbers on it. If the campaign doesn't vary month to month,
    // still carry the budget forward from the most recent PRIOR month while keeping
    // this row's own real actuals.
    if (exact.gross_budget == null && line && !line.budget_varies_by_month) {
      const prior = priorRow();
      if (prior) return { ...exact, gross_budget: prior.gross_budget, _carried: true };
    }
    return exact;
  }
  if (line && line.budget_varies_by_month) return null;
  // Carry forward the most recent PRIOR month's gross_budget as a synthetic row --
  // ONLY gross_budget, never the whole row. Found live 2026-08-06, per Claire: a
  // FUTURE month with no campaign_months row of its own was showing the prior
  // (current) month's real actuals/pasted-report numbers as if they belonged to
  // that future month -- spreading `...prior` here pulled in actual_spend,
  // actual_clicks, every platform-metric-tile field, and goal_override right along
  // with gross_budget, none of which should ever carry forward (a month with no
  // real data on it should show nothing for those, not last month's numbers).
  const prior = priorRow();
  return prior ? { campaign_line_id: lineId, month: monthDate.toISOString().slice(0,10), gross_budget: prior.gross_budget, _carried: true } : null;
}

// FIXED (2026-08-07, found live via Claire — the Campaign Setup queue's Gross
// Budget summary read blank while viewing a month before the campaign's own flight
// start, even though the real starting budget already existed from the signed IO):
// monthRowFor() is tied to whichever month the top-bar picker happens to be on —
// correct for an ACTIVE campaign (you're genuinely asking "what was budgeted for
// THIS specific month"), but wrong for a still-pending setup, which hasn't started
// yet and has nothing to do with today's calendar month. Used only by
// renderSetupPanels() below — the main pacing table (Active/Paused/Complete) keeps
// using monthRowFor() + the real top-bar month, unchanged.
function setupBudgetRowFor(lineId) {
  const rows = ALL_CAMPAIGN_MONTHS.filter(m => m.campaign_line_id === lineId).sort((a,b) => a.month.localeCompare(b.month));
  return rows[0] || null;
}

function strategistLineActiveInMonth(line, monthDate) {
  const monthKey = strategistMonthKey(monthDate);
  if (line.flight_start && monthKey < strategistMonthKey(new Date(line.flight_start + 'T00:00:00'))) return false;
  if (line.flight_end && monthKey > strategistMonthKey(new Date(line.flight_end + 'T00:00:00'))) return false;
  return true;
}

function visibleCampaignLines() {
  return ALL_CAMPAIGN_LINES.filter(l => {
    if (l.status !== strategistStatusTab) return false;
    // Pending (Campaign Setup) is a shared to-do queue, not personal/monthly work in
    // progress yet -- exempted from BOTH the "My Campaigns" scope (2026-08-07, per
    // Claire, found live: a brand-new line's assigned_strategist may not match
    // whoever happens to be reviewing setups, so gating on scope could hide new work
    // from everyone until someone thinks to switch to "All Strategists") and the
    // month picker (already exempted below, for the same "still needs doing now
    // regardless of when it's flighted" reason).
    if (l.status !== 'pending' && strategistScope === 'mine' && l.assigned_strategist !== currentStrategistUser.name) return false;
    if (strategistGroupFilter && l.group_name !== strategistGroupFilter) return false;
    if (l.status !== 'pending' && !strategistLineActiveInMonth(l, strategistCurrentMonth)) return false;
    return true;
  });
}

function renderStrategistDashboard() {
  document.getElementById('strategist-month-label').textContent = strategistMonthLabel(strategistCurrentMonth);
  document.getElementById('strategist-scope-mine').style.background = strategistScope === 'mine' ? 'var(--accent)' : 'var(--light)';
  document.getElementById('strategist-scope-mine').style.color = strategistScope === 'mine' ? '#fff' : 'var(--text)';
  document.getElementById('strategist-scope-all').style.background = strategistScope === 'all' ? 'var(--accent)' : 'var(--light)';
  document.getElementById('strategist-scope-all').style.color = strategistScope === 'all' ? '#fff' : 'var(--text)';

  // Same pending-status exemptions as visibleCampaignLines() below, so the tab's own
  // count badge always matches what actually renders when you click into it.
  const counts = { pending: 0, active: 0, paused: 0, complete: 0 };
  ALL_CAMPAIGN_LINES.forEach(l => {
    if (l.status !== 'pending' && strategistScope === 'mine' && l.assigned_strategist !== currentStrategistUser.name) return;
    if (strategistGroupFilter && l.group_name !== strategistGroupFilter) return;
    if (l.status !== 'pending' && !strategistLineActiveInMonth(l, strategistCurrentMonth)) return;
    if (counts[l.status] != null) counts[l.status]++;
  });

  // Populate the group filter's own options -- every group with at least one
  // campaign, alphabetical, same ordering as the main table's own group bands.
  // Rebuilt on every render (rather than once) so a brand-new group with its first
  // campaign shows up here without a page reload; preserves the current selection
  // if it's still valid, otherwise resets to "All Groups" instead of silently
  // holding a filter value for a group that's no longer in view.
  const groupFilterEl = document.getElementById('strategist-group-filter');
  if (groupFilterEl) {
    const groupNames = [...new Set(ALL_CAMPAIGN_LINES.map(l => l.group_name).filter(Boolean))].sort((a, b) => a.localeCompare(b));
    if (strategistGroupFilter && !groupNames.includes(strategistGroupFilter)) strategistGroupFilter = '';
    groupFilterEl.innerHTML = '<option value="">All Groups</option>' +
      groupNames.map(g => `<option value="${esc(g)}" ${g === strategistGroupFilter ? 'selected' : ''}>${esc(g)}</option>`).join('');
  }
  const tabs = [
    ['pending', 'Campaign Setup'], ['active', 'Active'], ['paused', 'Paused'], ['complete', 'Complete']
  ];
  document.getElementById('strategist-status-tabs').innerHTML = tabs.map(([key, label]) => {
    const active = strategistStatusTab === key;
    return `<button onclick="strategistSetStatusTab('${key}')" style="font:inherit;font-size:12.5px;font-weight:600;color:${active ? 'var(--text)' : 'var(--muted)'};background:none;border:none;border-bottom:2px solid ${active ? 'var(--accent)' : 'transparent'};padding:9px 2px;cursor:pointer">${label} <span style="font-family:monospace;font-size:11px">${counts[key]}</span></button>`;
  }).join('');

  const lines = visibleCampaignLines();
  document.getElementById('strategist-setup-panel').innerHTML = strategistStatusTab === 'pending' ? renderSetupPanels(lines) : '';
  document.getElementById('strategist-table-wrap').innerHTML = strategistStatusTab === 'pending' ? '' : renderMainTable(lines);
  renderStrategistDetailPanel();
}

        <div><label class="lbl">Gross Budget</label><div>$${monthRow.gross_budget != null ? Number(monthRow.gross_budget).toLocaleString() : '—'}/mo</div></div>
        <div><label class="lbl">In-Platform Budget</label><div>${inPlatform != null ? '$' + inPlatform.toLocaleString(undefined,{maximumFractionDigits:0}) + '/mo' : '—'}</div></div>

          <span style="font-size:10px;color:var(--muted)">Gross</span>

// ── SPLIT INTO MULTIPLE CAMPAIGNS (2026-08-10) ───────────────────
// Real scenario Claire found: one IO tactic sold at one total price, but the client
// splits it themselves across several regions/segments (noted only as free text on
// the IO today). Turns one pending line into N fully independent campaign_lines rows
// -- each tracked separately from here on (own budget/pacing/status), per Claire's
// explicit call over keeping it as one line with an internal breakdown. Amounts are
// manually entered, not auto-divided -- real splits are uneven (confirmed via her
// $2,000/$2,000/$1,000 example). The label is free text, not a fixed region list --
// per Claire, this isn't always going to be a region specifically.
function strategistOpenSplitForm(lineId) {
  const el = document.getElementById('split-form-' + lineId);
  if (!el) return;
  // The overall "Exact campaign title" field above gets disabled while this is
  // open -- each split has its own title below, so leaving the shared field
  // editable at the same time would just be a second, ambiguous place to type
  // one (same reasoning already applied to the import form's version of this).
  const titleInput = document.getElementById('setup-platform-campaign-name-' + lineId);
  const showing = el.style.display !== 'none';
  if (showing) {
    el.style.display = 'none'; el.innerHTML = '';
    if (titleInput) { titleInput.disabled = false; titleInput.title = ''; }
    return;
  }
  const line = ALL_CAMPAIGN_LINES.find(l => l.id === lineId);
  const monthRow = setupBudgetRowFor(lineId) || {};
  const fullAmount = monthRow.gross_budget != null ? Number(monthRow.gross_budget) : '';

// Pre-fills up to 12 months' worth of Gross Budget rows the moment "Budget is
// different by month" gets checked (2026-08-07, per Claire — having to click
// "+ Add month" one at a time to build out a flight's whole schedule before you
// can even start correcting the specific months that actually differ was real
// friction). Copies the SAME base budget already on file (setupBudgetRowFor()'s
// row — the flight's earliest month, seeded from the signed IO) into every month
// from there that doesn't already have its own row, capped at 12 — a flight
// running years or genuinely open-ended ("Ongoing", no end date) only gets its
// first 12 months pre-filled; "+ Add month" still works for anything beyond that.
// No-op if 2+ real month rows already exist (someone's already building this out
// by hand — don't second-guess it), or if there's no base budget yet to copy from.
async function strategistPrefillMonths(lineId) {
  const existingRows = ALL_CAMPAIGN_MONTHS.filter(m => m.campaign_line_id === lineId);
  if (existingRows.length > 1) return;
  const baseRow = setupBudgetRowFor(lineId);
  if (!baseRow || baseRow.gross_budget == null) return;
  const existingMonths = new Set(existingRows.map(m => m.month));
  const start = new Date(baseRow.month + 'T00:00:00');
  const saves = [];
  for (let i = 0; i < 12; i++) {
    const d = new Date(start.getFullYear(), start.getMonth() + i, 1);
    const monthStr = d.toISOString().slice(0, 10);
    if (!existingMonths.has(monthStr)) {
      saves.push(sb('rpc/strategist_save_campaign_month', { method: 'POST', body: JSON.stringify({
        p_name: currentStrategistUser.name, p_pw: currentStrategistUser.pw,
        p_campaign_line_id: lineId, p_month: monthStr, p_data: { gross_budget: baseRow.gross_budget }
      }) }));
    }
  }
  if (!saves.length) return;
  await Promise.all(saves);
  await fetchStrategistData();
  renderStrategistDashboard();
}

async function strategistAddSetupMonth(lineId) {
  const rows = ALL_CAMPAIGN_MONTHS.filter(m => m.campaign_line_id === lineId).sort((a,b) => a.month.localeCompare(b.month));
  const last = rows[rows.length - 1];
  const next = last ? new Date(last.month + 'T00:00:00') : new Date();
  next.setMonth(next.getMonth() + 1);
  await strategistSaveMonth(lineId, next.toISOString().slice(0,10), { gross_budget: last ? last.gross_budget : null });
}

// Backfilling a specific past month from the detail panel's history editor (2026-08-04)
// — unlike strategistAddSetupMonth() above (which just adds "the next month" for an
// ongoing campaign), an imported campaign needs to jump straight to a specific past
// month, however far back makes sense for that one — no fixed amount of history is
// assumed or required.
// Renamed from "+ Add a past month" and moved off a raw prompt() (2026-08-06, per
// Claire: it can add a future month too now, not just past, and typing "YYYY-MM"
// into a browser prompt was clunky) -- a real <input type="month"> next to the
// button is both a clearer affordance and lets the browser's own picker UI do the
// work instead of asking the strategist to remember an exact text format.
async function strategistAddHistoryMonth(lineId) {
  const input = document.getElementById('add-month-' + lineId).value; // "YYYY-MM" from the native month picker
  if (!input) { showToast('Pick a month first.', 'error'); return; }
  const match = /^(\d{4})-(\d{2})$/.exec(input);
  if (!match) { showToast('Enter a month as YYYY-MM, e.g. 2026-03', 'error'); return; }
  const monthStr = `${match[1]}-${match[2]}-01`;
  await strategistSaveMonth(lineId, monthStr, {});
}

// Auto-fills a campaign's actuals from the last pasted platform report the moment it
// has both a platform and an exact title to reference (2026-08-06, per Claire: "the
// autofill should start when there is a campaign title to reference") -- rather than
// waiting for her next twice-weekly paste. No-op if the platform has nothing cached,
// or nothing in that cache matches this exact title yet.
// Pure lookup, no DB call -- split out so bulk import (2026-08-10) can reuse the
// exact same matching rule without also inheriting strategistSaveMonth()'s
// refetch+rerender, which would be a full dashboard reload PER campaign across
// 100+ bulk-imported rows.
function findCachedReportMatch(platform, platformCampaignName) {
  if (!platform || !platformCampaignName) return null;
  const cache = PLATFORM_REPORT_CACHE[platform];
  if (!cache) return null;
  const wanted = platformCampaignName.trim().toLowerCase();
  const match = cache.rows.find(r => (r.title || '').trim().toLowerCase() === wanted);
  return match ? { report_month: cache.report_month, data: match.data } : null;
}

async function strategistApplyCachedReportIfMatch(lineId) {
  const line = ALL_CAMPAIGN_LINES.find(l => l.id === lineId);
  if (!line) return;
  const found = findCachedReportMatch(line.platform, line.platform_campaign_name);
  if (!found) return;
  await strategistSaveMonth(lineId, found.report_month, found.data);
}

// "Re-check Cached Reports" button (2026-08-10, per Claire) -- a one-off backfill
// for campaigns created BEFORE bulk import started checking the cache (the 119
// she'd already imported when that bug was fixed), and a standing safety net for
// any future case where a report gets pasted before the campaign it belongs to
// exists yet. Same non-refetching raw RPC pattern as the bulk import loop -- one
// refetch+rerender at the end, not one per campaign.
async function strategistRecheckCachedReports() {
  const candidates = ALL_CAMPAIGN_LINES.filter(l => l.platform && l.platform_campaign_name);
  let appliedCount = 0;
  const errors = [];
  for (const line of candidates) {
    const found = findCachedReportMatch(line.platform, line.platform_campaign_name);
    if (!found) continue;
    try {
      await sb('rpc/strategist_save_campaign_month', { method: 'POST', body: JSON.stringify({
        p_name: currentStrategistUser.name, p_pw: currentStrategistUser.pw,
        p_campaign_line_id: line.id, p_month: found.report_month, p_data: found.data
      }) });
      appliedCount++;
    } catch(e) { errors.push(`${line.tactic_label || line.service_id} (${line.platform_campaign_name}): ${e.message}`); }
  }
  await fetchStrategistData();
  renderStrategistDashboard();
  showToast(appliedCount || errors.length
    ? `Applied ${appliedCount} cached report(s)${errors.length ? `, ${errors.length} issue(s)` : ''}.`
    : 'No matches found in the cached reports.');
}

// The detail panel's title field used reload:false (a plain "Saved" toast, no

async function strategistSaveLine(lineId, data, reload) {
  try {
    const cleanData = Object.fromEntries(Object.entries(data).map(([k,v]) => [k, v === '' ? null : v]));
    await sb('rpc/strategist_save_campaign_line', { method: 'POST', body: JSON.stringify({
      p_name: currentStrategistUser.name, p_pw: currentStrategistUser.pw, p_id: lineId, p_data: cleanData
    }) });
    // Real bug found live (2026-08-10, Claire): a reload:false save (e.g. the main
    // table's inline Platform dropdown) wrote to the database correctly, but never
    // touched the in-memory ALL_CAMPAIGN_LINES cache -- the NEXT render for any
    // unrelated reason (switching tabs, selecting a different row) then rendered
    // from that stale cache and looked like the save had silently reverted. Patch
    // the local object directly so it stays correct without needing a full
    // refetch+rerender for a one-field edit.
    const line = ALL_CAMPAIGN_LINES.find(l => l.id === lineId);
    if (line) Object.assign(line, cleanData);
    if (reload !== false) { await fetchStrategistData(); renderStrategistDashboard(); }
    else showToast('Saved');
  } catch(e) { showToast('Error saving: ' + e.message, 'error'); }
}

// ── MAIN PACING TABLE ────────────────────────────────────────────
// Picks readable text (near-black or near-white) against an arbitrary hex background
// — the same relative-luminance approach browsers/design tools use for contrast, so a
// group's own brand color (which can be light or dark) never renders unreadable text.
function strategistContrastTextColor(hex) {
  if (!hex || !/^#[0-9a-fA-F]{6}$/.test(hex)) return '#0E5D82';
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  const luminance = (0.299*r + 0.587*g + 0.114*b) / 255;
  return luminance > 0.6 ? '#1F2937' : '#FFFFFF';
}

function renderMainTable(lines) {
  if (!lines.length) return '<p style="color:var(--muted);font-size:13px;padding:20px 0">No campaigns in this tab.</p>';
  const byGroup = {};
  lines.forEach(l => {
    const key = l.group_name || '(no group)';
    if (!byGroup[key]) byGroup[key] = { color: l.group_color, rows: [] };
    byGroup[key].rows.push(l);
  });

  // Headers wrap onto two lines (2026-08-06, per Claire: forcing every header onto
  // one line was the actual thing keeping columns wide, wider than the data inside
  // them ever needed) -- a per-column max-width instead of the old white-space:nowrap.
  const MAIN_TABLE_COLUMNS = [
    ['Client', 130], ['Tactic', 150], ['Platform', 140], ['Flight', 95],
    ['Gross Budget', 80], ['In-Platform Budget', 85], ['Actual Spend', 80],
    ['Spend Pacing', 70], ['Goal', 75], ['Actual Perf.', 75], ['Perf. Pacing', 70],
    ['Optimize Log', 75], ['Notes', 100],
  ];
  let html = `<table style="width:100%;border-collapse:collapse;font-size:12.5px;min-width:1250px">
    <thead><tr style="background:var(--light)">
      ${MAIN_TABLE_COLUMNS.map(([h, w]) =>
        `<th style="padding:8px 8px;text-align:left;font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;max-width:${w}px;vertical-align:bottom">${h}</th>`).join('')}
    </tr></thead><tbody>`;

  Object.keys(byGroup).sort((a, b) => a.localeCompare(b)).forEach(groupName => {
    // Matches this group's own brand color (Groups tab, admin/index.html) rather than
    // one flat color for every group (2026-08-04, per Claire) — falls back to the
    // catalog's default accent if a group has no brand_color set.
    const bg = byGroup[groupName].color || '#EFF6FF';
    const fg = strategistContrastTextColor(bg);
    html += `<tr style="background:${esc(bg)}"><td colspan="13" style="padding:6px 10px;font-size:10.5px;font-weight:700;text-transform:uppercase;color:${fg}">${esc(groupName)}</td></tr>`;
    byGroup[groupName].rows.forEach(l => {
      const monthRow = monthRowFor(l.id, strategistCurrentMonth) || {};
      const inPlatform = effectiveInPlatformBudget(monthRow, l.service_id, l.group_id);
      const goal = computeGoal(l, monthRow);
      const spendPacing = pacingPct(monthRow.actual_spend, inPlatform, l.flight_start, l.flight_end, strategistCurrentMonth);
      const actualPerf = goal.unit === 'clicks' ? monthRow.actual_clicks : monthRow.actual_impressions;
      const perfPacing = pacingPct(actualPerf, goal.value, l.flight_start, l.flight_end, strategistCurrentMonth);
      const logCount = ALL_OPTIMIZE_LOG.filter(o => o.campaign_line_id === l.id).length;
      const selected = strategistSelectedLineId === l.id;
      html += `<tr onclick="strategistSelectLine('${l.id}')" style="cursor:pointer;border-bottom:1px solid var(--border);${selected ? 'background:var(--light)' : ''}">
        <td style="padding:9px 10px"><strong>${esc(l.client_name || '(unknown)')}</strong></td>
        <td style="padding:9px 10px">${esc(strategistTacticDisplay(l))}</td>
        <td style="padding:9px 10px" onclick="event.stopPropagation()">
          <select onclick="event.stopPropagation()" onchange="if(this.value==='__other__'){this.nextElementSibling.style.display='inline-block';this.nextElementSibling.focus();}else{this.nextElementSibling.style.display='none';strategistSaveLine('${l.id}', {platform: this.value}, false);}" style="width:100%;min-width:132px;padding:4px 6px;border-radius:5px;border:1px dashed var(--accent);font-size:11px">
            <option value="">— Select —</option>
            ${PLATFORM_OPTIONS.map(p => `<option value="${esc(p)}" ${p === l.platform ? 'selected' : ''}>${esc(p)}</option>`).join('')}
            <option value="__other__" ${l.platform && !PLATFORM_OPTIONS.includes(l.platform) ? 'selected' : ''}>Other…</option>
          </select>
          <input type="text" value="${l.platform && !PLATFORM_OPTIONS.includes(l.platform) ? esc(l.platform) : ''}" placeholder="Platform" onclick="event.stopPropagation()" onchange="strategistSaveLine('${l.id}', {platform: this.value}, false)" style="display:${l.platform && !PLATFORM_OPTIONS.includes(l.platform) ? 'inline-block' : 'none'};width:100%;min-width:132px;padding:4px 6px;border-radius:5px;border:1px dashed var(--accent);font-size:11px;margin-top:2px"/>
        </td>
        <td style="padding:9px 10px;max-width:110px">${esc(strategistFormatFlightRange(l.flight_start, l.flight_end))}</td>
        <td style="padding:9px 10px">${monthRow.gross_budget != null ? '$' + Number(monthRow.gross_budget).toLocaleString() + '/mo' : '—'}</td>
        <td style="padding:9px 10px">${inPlatform != null ? '$' + inPlatform.toLocaleString(undefined,{maximumFractionDigits:0}) + '/mo' : '—'}</td>
        <td style="padding:9px 10px">${monthRow.actual_spend != null ? '$' + Number(monthRow.actual_spend).toLocaleString() : '—'}</td>
        <td style="padding:9px 10px">${pacingPillHtml(spendPacing)}</td>
        <td style="padding:9px 10px">${goal.value != null ? goal.display + ' ' + goal.unit : (goal.manual ? '— (enter manually)' : '—')}</td>
        <td style="padding:9px 10px">${actualPerf != null ? Number(actualPerf).toLocaleString() + ' ' + goal.unit : '—'}</td>
        <td style="padding:9px 10px">${pacingPillHtml(perfPacing)}</td>
        <td style="padding:9px 10px">${logCount} ${logCount === 1 ? 'entry' : 'entries'}</td>
        <td style="padding:9px 10px;color:var(--muted);max-width:160px;overflow-wrap:break-word">${esc(l.setup_notes || '—')}</td>
      </tr>`;
    });
  });
  html += '</tbody></table>';
  return html;
}

function renderStrategistDetailPanel() {

  const statusHistory = ALL_STATUS_HISTORY.filter(h => h.campaign_line_id === l.id);
  const inPlatform = effectiveInPlatformBudget(monthRow, l.service_id, l.group_id);
  const goal = computeGoal(l, monthRow);

  panel.innerHTML = `<div style="border:1px solid var(--border);border-radius:10px;padding:16px 18px;background:#fff">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:10px">
      <strong style="font-size:13px">${esc(l.client_name || '(unknown)')} / ${esc(strategistTacticDisplay(l))}</strong>
      <div style="display:flex;align-items:center;gap:8px">
        <input id="detail-platform-campaign-name-${l.id}" value="${esc(l.platform_campaign_name || '')}" placeholder="Exact title in the ad platform (for report matching)" onchange="strategistSavePlatformCampaignName('${l.id}', this.value)" style="width:240px;padding:5px 8px;border-radius:6px;border:1px dashed var(--border);font-size:11px"/>
        <input id="detail-platform-url-${l.id}" value="${esc(l.platform_url || '')}" placeholder="Reference link to the live campaign" onchange="strategistSaveLine('${l.id}', {platform_url: this.value}, false)" style="width:220px;padding:5px 8px;border-radius:6px;border:1px dashed var(--border);font-size:11px"/>
        ${l.platform_url ? `<a href="${esc(l.platform_url)}" target="_blank" style="font-size:11px;font-weight:600;color:var(--accent)">View in ${esc(l.platform || 'platform')} ↗</a>` : ''}
        <button onclick="strategistCloseDetailPanel()" style="padding:6px 14px;border-radius:6px;border:1px solid var(--border);background:#fff;font-size:12px;cursor:pointer">✕ Close</button>
      </div>
    </div>

    <div style="display:flex;align-items:center;gap:8px;margin-bottom:14px">
      <label style="display:flex;align-items:center;gap:5px;font-size:12px;cursor:pointer;margin-right:8px">
        <input type="checkbox" ${l.has_offline_visits ? 'checked' : ''} onchange="strategistSaveLine('${l.id}', {has_offline_visits: this.checked})"/> + Offline Visits Tracking
      </label>
      <label class="lbl" style="margin:0">Status</label>
      <select id="status-select-${l.id}" onchange="strategistOpenStatusChangeReason('${l.id}', this.value, '${l.status}')" style="padding:5px 8px;border-radius:6px;border:1px solid var(--border);font-size:12.5px;font-weight:600">
        <option value="active" ${l.status === 'active' ? 'selected' : ''}>Active</option>
        <option value="paused" ${l.status === 'paused' ? 'selected' : ''}>Paused</option>
        <option value="complete" ${l.status === 'complete' ? 'selected' : ''}>Complete</option>
      </select>
      <span style="font-size:11px;color:var(--muted)">Pausing moves this campaign to the Paused tab; switch it back to Active to pick up where you left off.</span>
    </div>
    <div id="status-reason-${l.id}" style="display:none;margin:-6px 0 14px"></div>

    ${statusHistory.length ? `<div style="margin-bottom:14px">
      <p style="font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:0 0 6px">Status history</p>
      ${statusHistory.map(h => `<div style="display:flex;align-items:baseline;gap:10px;padding:4px 0;font-size:12px">
        <span style="font-family:monospace;font-size:10.5px;color:var(--muted);width:130px;flex:none">${esc(new Date(h.changed_at).toLocaleString('en-US', {month:'short',day:'numeric',year:'2-digit',hour:'numeric',minute:'2-digit'}))}</span>
        <span><strong>${esc(h.old_status || '—')} → ${esc(h.new_status)}</strong> <span style="color:var(--muted)">— ${esc(h.changed_by || 'unknown')}</span>${h.reason ? `: ${esc(h.reason)}` : ''}</span>
      </div>`).join('')}
    </div>` : ''}

    <p style="font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:0 0 8px">This month's numbers</p>
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px">
      ${(STRATEGIST_PLATFORM_METRIC_TILES[l.platform] || STRATEGIST_DEFAULT_METRIC_TILES).map(([field, label]) => `
        <div style="padding:8px 12px;border-radius:8px;background:var(--light);border:1px solid var(--border);min-width:100px">
          <div style="font-size:9.5px;font-weight:700;text-transform:uppercase;color:var(--muted);margin-bottom:3px">${esc(label)}</div>
          <input type="number" step="any" value="${monthRow[field] ?? ''}" onchange="strategistSaveMonth('${l.id}', '${strategistCurrentMonth.toISOString().slice(0,10)}', {${field}: this.value})" style="width:90px;padding:3px 5px;border:none;background:transparent;font-family:monospace;font-size:14px;font-weight:700"/>
        </div>`).join('')}
    </div>

    <p style="font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:0 0 4px">Monthly history</p>
    <p style="font-size:10.5px;color:var(--muted);margin:0 0 8px">In-Platform and Goal are normally computed automatically from that month's Gross Budget — the override next to each is there for a specific month that needs to diverge from the plan; leave it blank to keep using the auto-calculated value.${l.service_id === 'sem-bp' ? ' A range like "150-200" is OK for SEM\'s Goal; pacing uses the midpoint.' : ''}</p>
    <div style="border:1px solid var(--border);border-radius:8px;padding:4px 12px;margin-bottom:16px;background:var(--light)">
      <div style="display:flex;align-items:center;gap:8px;font-size:9.5px;font-weight:700;text-transform:uppercase;color:var(--muted);padding:6px 0">
        <span style="width:90px">Month</span>
        <span style="width:90px">Gross</span>
        <span style="width:130px">In-Platform</span>
        <span style="width:130px">Goal</span>
        <span style="width:90px">Actual Spend</span>
        <span style="width:75px">Clicks</span>
        <span style="width:85px">Impr.</span>
      </div>
      ${ALL_CAMPAIGN_MONTHS.filter(m => m.campaign_line_id === l.id).sort((a,b) => a.month.localeCompare(b.month)).map(m => {
        const autoInPlatform = computeInPlatformBudget(m.gross_budget, l.service_id, l.group_id);
        const autoGoal = computeGoal(l, { ...m, goal_override: null });
        return `
        <div style="display:flex;align-items:center;gap:8px;font-size:12px;padding:6px 0;border-top:1px solid var(--border)">
          <span style="width:90px;color:var(--muted);font-weight:600">${esc(strategistMonthLabel(new Date(m.month + 'T00:00:00')))}</span>
          <input type="number" value="${m.gross_budget ?? ''}" onchange="strategistSaveMonth('${l.id}', '${m.month}', {gross_budget: this.value})" placeholder="Gross" style="width:90px;padding:5px 6px;border-radius:6px;border:1px solid var(--border);font-size:11.5px"/>
          <input type="number" value="${m.in_platform_override ?? ''}" onchange="strategistSaveMonth('${l.id}', '${m.month}', {in_platform_override: this.value})" placeholder="${autoInPlatform != null ? 'Auto: ' + Math.round(autoInPlatform) : 'In-Platform override'}" title="${m.in_platform_override != null ? 'Overridden — auto-calculated value is ' + (autoInPlatform != null ? '$' + Math.round(autoInPlatform) : 'unavailable') : ''}" style="width:${autoInPlatform != null ? '110px' : '130px'};padding:5px 6px;border-radius:6px;border:1px ${m.in_platform_override != null ? 'solid var(--accent)' : 'dashed var(--border)'};font-size:11.5px"/>
          <input type="${l.service_id === 'sem-bp' ? 'text' : 'number'}" value="${esc(m.goal_override ?? '')}" onchange="strategistSaveMonth('${l.id}', '${m.month}', {goal_override: this.value})" placeholder="${l.service_id === 'sem-bp' ? (autoGoal.value != null ? 'Auto: ' + autoGoal.display : 'e.g. 150 or 150-200') : (autoGoal.value != null ? 'Auto: ' + autoGoal.display : 'Goal')}" title="${m.goal_override != null && m.goal_override !== '' ? 'Overridden — auto-calculated value is ' + (autoGoal.value != null ? autoGoal.display + ' ' + autoGoal.unit : 'unavailable') : ''}" style="width:${autoGoal.value != null ? '110px' : '130px'};padding:5px 6px;border-radius:6px;border:1px ${m.goal_override != null && m.goal_override !== '' ? 'solid var(--accent)' : 'dashed var(--border)'};font-size:11.5px"/>
          <input type="number" value="${m.actual_spend ?? ''}" onchange="strategistSaveMonth('${l.id}', '${m.month}', {actual_spend: this.value})" placeholder="Actual spend" style="width:90px;padding:5px 6px;border-radius:6px;border:1px solid var(--border);font-size:11.5px"/>
          <input type="number" value="${m.actual_clicks ?? ''}" onchange="strategistSaveMonth('${l.id}', '${m.month}', {actual_clicks: this.value})" placeholder="Clicks" style="width:75px;padding:5px 6px;border-radius:6px;border:1px solid var(--border);font-size:11.5px"/>
          <input type="number" value="${m.actual_impressions ?? ''}" onchange="strategistSaveMonth('${l.id}', '${m.month}', {actual_impressions: this.value})" placeholder="Impr." style="width:85px;padding:5px 6px;border-radius:6px;border:1px solid var(--border);font-size:11.5px"/>
        </div>`;
      }).join('') || '<p style="font-size:11px;color:var(--muted);padding:6px 0">No months on record yet.</p>'}
      <div style="display:flex;align-items:center;gap:8px;margin:8px 0">
        <input type="month" id="add-month-${l.id}" style="padding:4px 8px;border-radius:6px;border:1px solid var(--border);font-size:11px"/>
        <button onclick="strategistAddHistoryMonth('${l.id}')" style="padding:4px 10px;border-radius:6px;border:1px solid var(--border);background:#fff;font-size:11px;cursor:pointer">+ Add another month</button>
      </div>
    </div>

    <p style="font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:0 0 8px">Optimize log</p>
    ${log.map(o => `<div style="display:flex;align-items:flex-start;gap:14px;padding:8px 0;border-top:1px solid var(--border)">
      <span style="font-family:monospace;font-size:11px;color:var(--muted);width:80px;flex:none">${esc(o.entry_date)}</span>
      <span style="font-size:12.5px;flex:1">${esc(o.note)}</span>
      <span style="flex:none;display:flex;gap:8px">
        <a onclick="strategistEditLogEntry('${l.id}','${o.id}')" style="font-size:11px;font-weight:600;color:var(--accent);cursor:pointer">Edit</a>
        <a onclick="strategistDeleteLogEntry('${o.id}')" style="font-size:11px;font-weight:600;color:#EF4444;cursor:pointer">Delete</a>
      </span>
    </div>`).join('') || '<p style="font-size:12px;color:var(--muted)">No entries yet.</p>'}

    <div id="log-entry-form-${l.id}" style="margin-top:12px;display:flex;gap:8px;align-items:flex-end">
      <div>
        <label class="lbl">Date</label>
        <input type="date" id="log-date-${l.id}" value="${new Date().toISOString().slice(0,10)}" style="padding:6px 8px;border-radius:6px;border:1px solid var(--border);font-size:12px"/>
      </div>
      <div style="flex:1">
        <label class="lbl">What was changed</label>
        <input type="text" id="log-note-${l.id}" style="width:100%;padding:6px 8px;border-radius:6px;border:1px solid var(--border);font-size:12px"/>
      </div>
      <input type="hidden" id="log-edit-id-${l.id}"/>
      <button onclick="strategistSaveLogEntry('${l.id}')" style="padding:7px 14px;border-radius:6px;background:var(--accent);color:#fff;border:none;font-size:12px;font-weight:600;cursor:pointer">Add</button>
    </div>
  </div>`;
}

function strategistEditLogEntry(lineId, logId) {
  const entry = ALL_OPTIMIZE_LOG.find(o => o.id === logId);
  if (!entry) return;
  document.getElementById('log-date-' + lineId).value = entry.entry_date;
  document.getElementById('log-note-' + lineId).value = entry.note;
  document.getElementById('log-edit-id-' + lineId).value = entry.id;
}

async function strategistSaveLogEntry(lineId) {
  const date = document.getElementById('log-date-' + lineId).value;
  const note = document.getElementById('log-note-' + lineId).value.trim();
  const editId = document.getElementById('log-edit-id-' + lineId).value || null;
  if (!note) { showToast('Enter what was changed.', 'error'); return; }
  try {
    await sb('rpc/strategist_save_optimize_log', { method: 'POST', body: JSON.stringify({
      p_name: currentStrategistUser.name, p_pw: currentStrategistUser.pw,
      p_id: editId, p_campaign_line_id: lineId, p_entry_date: date, p_note: note
    }) });
    await fetchStrategistData();
    strategistSelectedLineId = lineId;
    renderStrategistDashboard();
    showToast('Optimize log saved');
  } catch(e) { showToast('Error saving log entry: ' + e.message, 'error'); }
}

async function strategistDeleteLogEntry(logId) {
  try {
    await sb('rpc/strategist_delete_optimize_log', { method: 'POST', body: JSON.stringify({
      p_name: currentStrategistUser.name, p_pw: currentStrategistUser.pw, p_id: logId
    }) });
    await fetchStrategistData();
    renderStrategistDashboard();
    showToast('Entry deleted');
  } catch(e) { showToast('Error deleting entry: ' + e.message, 'error'); }
}

function strategistLogout() {
  currentStrategistUser = null;
  showStrategistPanel(false);
  promptStrategistLogin();
}

// Silent handoff from the admin portal's "Go to Strategist Portal" link (2026-08-04,
// per Claire: "When I click the strategist link from the admin portal I have to log
// in again"). admin/index.html stashes the already-authenticated name/password into
// sessionStorage right before navigating; picked up here ONCE (cleared immediately,
// whether it works or not) so it can never be replayed by, say, opening this page
// again later in the same tab. Same plaintext-in-memory trust model this whole app
// already uses everywhere (no tokens/cookies anywhere in this project) — sessionStorage
// just carries that same value across the one page hop, cleared right after reading.
async function tryStrategistHandoffLogin() {
  let name, pw;
  try {
    name = sessionStorage.getItem('strategist_handoff_name');
    pw = sessionStorage.getItem('strategist_handoff_pw');
    sessionStorage.removeItem('strategist_handoff_name');
    sessionStorage.removeItem('strategist_handoff_pw');
  } catch(e) { return false; } // e.g. sessionStorage blocked entirely (privacy mode, unusual origin)
  if (!name || !pw) return false;
  const result = await attemptStrategistLogin(name, pw);
  if (!result.ok) return false;
  currentStrategistUser = { name, email: result.email, role: result.role, pw };
  showStrategistPanel(true);
  return true;
}

document.addEventListener('DOMContentLoaded', async () => {
  await loadStrategistRoster();
  if (await tryStrategistHandoffLogin()) return;
  promptStrategistLogin();
});
</script>
</body>
</html>
