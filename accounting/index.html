// Real gap found live (2026-08-11, Claire cross-checking against her revenue
// spreadsheet): every "w/Visits" tactic came out wrong -- e.g. Geofencing is
// 45% normally but 45.59% with Offline Visits Tracking. This isn't a new
// rate concept -- Admin's Accounting Map has supported a per-(tactic,
// modifier)-pairing override for this since 2026-07-31 (Offline Visits
// Tracking is modeled as its own is_cpm_adjustment service, paired with the
// tactic) -- this portal just never fetched or applied it. When a line has
// Offline Visits Tracking, the pairing rate wins outright if one's been set
// for that tactic; otherwise falls through to the normal group-then-base
// resolution below (so a tactic with no pairing override configured yet
// doesn't silently show as "not set" just because visits tracking is on --
// only the DIFFERENCE from the plain rate needs its own override, same as
// Admin's own UI: the base entry stays authoritative until someone
// overrides the pairing specifically).
//
// Known gap, not silently invented: a per-GROUP override of a pairing rate
// isn't supported here, because Admin's own per-group override table isn't
// pairing-aware either -- matching existing behavior, not a new limitation.
// SEM's 44i Revenue isn't a flat cut % -- it's tiered by how much is being
// spent (2026-08-11, Claire: "SEM < $1,000... 75%, SEM $5,000+... 85%").
// Looked up against the month's own Gross Budget, same figure the flat rate
// already multiplies against. When a service has tiers configured, they
// REPLACE the flat rate entirely -- a group override of the flat rate is
// irrelevant once tiers exist (documented gap, not silently invented, same
// as the Offline Visits pairing rate's own group-override gap).
function accountingEffectiveCutPctTier(serviceId, grossBudget) {
  const tiers = ACCOUNTING_CUT_TIERS[serviceId];
  if (!tiers || !tiers.length || grossBudget == null) return null;
  const tier = tiers.find(t => t.max == null || Number(grossBudget) <= Number(t.max));
  return tier ? Number(tier.cut_pct) : null;
}
function accountingEffectiveCutPct(serviceId, groupId, hasOfflineVisits, grossBudget) {
  if (hasOfflineVisits) {
    const pairingRate = ACCOUNTING_CUT_RATES.pairing[serviceId];
    if (pairingRate != null) return pairingRate;
  }
  const tierRate = accountingEffectiveCutPctTier(serviceId, grossBudget);
  if (tierRate != null) return tierRate;
  const groupRate = groupId ? ACCOUNTING_CUT_RATES.group[`${groupId}|${serviceId}`] : undefined;
  if (groupRate != null) return groupRate;
  const baseRate = ACCOUNTING_CUT_RATES.base[serviceId];
  return baseRate != null ? baseRate : null;
}

// 44i's $ = Gross Budget x Cut % ; Group's $ (YDA) = the remainder of Gross --
// confirmed rule (100 - Cut % is always the Group's share, per Admin's own
// "Group's cut (YDA) is always 100% minus this" note). Returns nulls (not 0s)
// when Gross Budget or Cut % isn't available, so a missing rate is visibly
// missing in the table rather than rendering as $0.
function accountingSplitRevenue(grossBudget, cutPct) {
  if (grossBudget == null || cutPct == null) return { fortyfouri: null, group: null };
  const fortyfouri = Number(grossBudget) * (Number(cutPct) / 100);
  return { fortyfouri, group: Number(grossBudget) - fortyfouri };
}

// Splits a row's (already-computed) 44i Revenue into what's actually
// invoiceable by 44i vs. what's Billed Externally and needs to be excluded
// (2026-08-12, per Claire: "if a service is billed externally it should
// not be included in the 44i revenue, because that is the number we should
// be invoicing"). Only affects TOTALS (stat tiles, the Total row) -- the
// per-row table cell keeps showing the calculated split either way, since
// that number is still useful as a reference even for a billed-externally
// line. A rollup can have some regions billed externally and others not,
// so this checks each CHILD individually rather than the rollup as a
// whole.
function accountingSplitInvoiceable(r) {
  if (r.isRollup) {
    let invoiceable = 0, excluded = 0;
    r.children.forEach(c => {
      if (c.split.fortyfouri == null) return;
      if (c.line.billed_externally) excluded += c.split.fortyfouri;
      else invoiceable += c.split.fortyfouri;
    });
    return { invoiceable, excluded };
  }
  if (r.split.fortyfouri == null) return { invoiceable: 0, excluded: 0 };
  return r.line.billed_externally ? { invoiceable: 0, excluded: r.split.fortyfouri } : { invoiceable: r.split.fortyfouri, excluded: 0 };
}

// A row is "fully pending" when every real campaign it represents is still
// sitting in Strategist's Setup queue (2026-08-12, per Claire: "their
// revenues shouldn't be included in the stat tiles until they are active
// and have spend") -- a rollup only counts as pending when EVERY region is,
// same all-or-nothing convention already used for Paused/Billed Externally
// rollup summaries.
function accountingRowIsPending(r) {
  return r.isRollup ? r.children.every(c => c.line.status === 'pending') : r.line.status === 'pending';
}

// "Expected Spend" (2026-08-11, per Claire: it's a genuinely different number
// from Actual Spend, needs its own column) -- exactly the Strategist Portal's
// own In-Platform Budget formula: Budgeted Impressions (Gross ÷ Retail CPM ×
// 1000) × Platform CPM ÷ 1000, or Gross × In-Platform % for a service with no
// Retail CPM at all (e.g. SEM). Retail CPM comes from the public services
// catalog (CATALOG_ROWS, loaded via shared.js's loadCatalog() -- same data
// source the Strategist Portal reads, no separate accounting RPC needed for
// it). A per-month manual override (campaign_months.in_platform_override --
// the same column the Strategist Portal writes to) always wins, same
// "override wins" rule used everywhere else in this project.
function accountingEffectivePlatformCpm(serviceId, groupId) {
  const groupRate = groupId ? ACCOUNTING_PLATFORM_CPM_RATES.group[`${groupId}|${serviceId}`] : undefined;
  if (groupRate != null) return groupRate;
  const baseRate = ACCOUNTING_PLATFORM_CPM_RATES.base[serviceId];
  return baseRate != null ? baseRate : null;
}
function accountingEffectiveInPlatformPct(serviceId, groupId) {
  const groupRate = groupId ? ACCOUNTING_IN_PLATFORM_PCT_RATES.group[`${groupId}|${serviceId}`] : undefined;
  if (groupRate != null) return groupRate;
  const baseRate = ACCOUNTING_IN_PLATFORM_PCT_RATES.base[serviceId];
  return baseRate != null ? baseRate : null;
}
function accountingComputeExpectedSpend(grossBudget, serviceId, groupId, inPlatformOverride) {
  if (inPlatformOverride != null) return Number(inPlatformOverride);
  if (grossBudget == null) return null;
  const retailCpm = CATALOG_ROWS[serviceId]?.retail_cpm != null ? Number(CATALOG_ROWS[serviceId].retail_cpm) : null;
  const platformCpm = accountingEffectivePlatformCpm(serviceId, groupId);
  if (retailCpm != null && platformCpm != null) {
    const impressions = (Number(grossBudget) / retailCpm) * 1000;
    return impressions * platformCpm / 1000;
  }
  const pct = accountingEffectiveInPlatformPct(serviceId, groupId);
  return pct != null ? Number(grossBudget) * pct / 100 : null;
}

// Same relative-luminance contrast pick as the Strategist Portal's own
// strategistContrastTextColor -- an arbitrary group brand color (light or
// dark) always gets readable text against it, and the same visual language
// as that other table's group banners (2026-08-11, per Claire: "use the
// group color for their header like the strategists").
function accountingContrastTextColor(hex) {
  if (!hex || !/^#[0-9a-fA-F]{6}$/.test(hex)) return '#0E5D82';
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  const luminance = (0.299*r + 0.587*g + 0.114*b) / 255;
  return luminance > 0.6 ? '#1F2937' : '#FFFFFF';
}
// Light tint of a brand color for the stat-tile bar's background (2026-08-11,
// per Claire: "I am talking about the stat tiles" -- when filtered to one
// Group, the summary bar should carry that group's brand color too, not just
// the table's own banner rows). Mixed heavily toward white so the tile text
// (dark, unconditionally) stays comfortably readable regardless of how
// saturated the source brand color is.
function accountingTintColor(hex, amount) {
  if (!hex || !/^#[0-9a-fA-F]{6}$/.test(hex)) return null;
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  const mix = c => Math.round(c + (255 - c) * amount);
  return `#${[mix(r), mix(g), mix(b)].map(v => v.toString(16).padStart(2, '0')).join('')}`;
}

// Section id -> human label (e.g. 'seo' -> 'SEO'), for the Add Service
// dropdown's optgroups below -- own copy of admin's own SECTIONS/
// sectionLabel() pattern (per this project's "each portal keeps its own
// copy" convention), since accounting/index.html doesn't otherwise need the
// sections table at all.
let ACCOUNTING_SECTIONS = [];
function accountingSectionLabel(id) {
  return ACCOUNTING_SECTIONS.find(s => s.id === id)?.label || id;
}

async function fetchAccountingData() {
  if (!Object.keys(CATALOG_ROWS).length) await loadCatalog();
  if (!ACCOUNTING_SECTIONS.length) ACCOUNTING_SECTIONS = await sb('sections?order=sort_order&select=*') || [];
  const [lines, months, rates, clients] = await Promise.all([
    sb('rpc/accounting_get_campaign_lines', { method: 'POST', body: JSON.stringify({ p_name: currentAccountingUser.name, p_pw: currentAccountingUser.pw }) }),
    // sbAll -- accounting_get_campaign_months now accepts real p_limit/p_offset
    // (paginated-rpc-functions-2026-08-12.sql, run 2026-08-12), so sbAll's own
    // limit/offset loop in shared.js can paginate past Supabase's API row cap.
    sbAll('rpc/accounting_get_campaign_months', { method: 'POST', body: JSON.stringify({ p_name: currentAccountingUser.name, p_pw: currentAccountingUser.pw }) }),
    sb('rpc/accounting_get_rates', { method: 'POST', body: JSON.stringify({ p_name: currentAccountingUser.name, p_pw: currentAccountingUser.pw }) }),
    sb('rpc/accounting_get_clients', { method: 'POST', body: JSON.stringify({ p_name: currentAccountingUser.name, p_pw: currentAccountingUser.pw }) }),
  ]);
  ALL_ACCOUNTING_LINES = lines || [];
  ALL_ACCOUNTING_MONTHS = months || [];
  ALL_ACCOUNTING_CLIENTS = clients || [];
  ACCOUNTING_CUT_RATES = { base: {}, group: {}, pairing: {} };
  ACCOUNTING_CUT_TIERS = {};
  ACCOUNTING_PLATFORM_CPM_RATES = { base: {}, group: {} };
  ACCOUNTING_IN_PLATFORM_PCT_RATES = { base: {}, group: {} };
  (rates || []).forEach(r => {
    if (r.scope === 'base') {
      ACCOUNTING_CUT_RATES.base[r.service_id] = r.fortyfouri_cut_pct != null ? Number(r.fortyfouri_cut_pct) : null;
      if (r.platform_cpm != null) ACCOUNTING_PLATFORM_CPM_RATES.base[r.service_id] = Number(r.platform_cpm);
      if (r.in_platform_pct != null) ACCOUNTING_IN_PLATFORM_PCT_RATES.base[r.service_id] = Number(r.in_platform_pct);
      if (Array.isArray(r.spend_tiers) && r.spend_tiers.length) ACCOUNTING_CUT_TIERS[r.service_id] = r.spend_tiers;
    } else if (r.scope === 'group') {
      const key = `${r.group_id}|${r.service_id}`;
      ACCOUNTING_CUT_RATES.group[key] = r.fortyfouri_cut_pct != null ? Number(r.fortyfouri_cut_pct) : null;
      if (r.platform_cpm != null) ACCOUNTING_PLATFORM_CPM_RATES.group[key] = Number(r.platform_cpm);
      if (r.in_platform_pct != null) ACCOUNTING_IN_PLATFORM_PCT_RATES.group[key] = Number(r.in_platform_pct);
    } else if (r.scope === 'pairing') {
      ACCOUNTING_CUT_RATES.pairing[r.service_id] = r.fortyfouri_cut_pct != null ? Number(r.fortyfouri_cut_pct) : null;
    }
  });
}

// Carries a Gross Budget forward for a 'recurring' accounting-only line
// (2026-08-12, per Claire: "track all services ordered, not just tactics
// with spend") -- a flat monthly service like Website Hosting never gets
// touched by Strategist at all (accounting-only, on purpose), so nothing
// proactively inserts its NEXT month's campaign_months row the way
// Strategist's own prefill mechanism does for spend campaigns. Rather than
// building an equivalent prefill job, this carries the last known month's
// Gross Budget forward live -- same "hasn't changed, so it's still $X"
// convention the Strategist Portal's own monthRowFor() already uses for a
// flat/non-varying spend budget. Deliberately does NOT carry forward for
// 'one_time' fees (billing_type other than 'recurring') -- those only ever
// happened in the one month they were billed, and for ordinary spend-
// tracked lines Strategist's real prefilled rows already cover this, so
// the fallback rarely even applies to them.
// Carries forward for any line that's NOT flagged "varies by month" -- an
// ORDINARY flat-budget ad-spend campaign included, not just this session's
// new 'recurring' flat-fee lines (2026-08-12, per Claire: "when a service
// is ordered will every month in the flight automatically be filled in?").
// Real gap found answering that: Strategist's own monthRowFor() already
// carries a flat campaign's Gross Budget forward live -- that's WHY a
// standard campaign only ever needs its first campaign_months row, never
// an explicit one every month. Accounting never had the equivalent, so an
// ordinary flat-budget campaign would eventually vanish from Accounting
// after its first month too, once Strategist's own real prefilled rows
// ran out -- same class of bug as the flat-fee one, just a different set
// of lines. 'one_time' fees are the one deliberate exception -- they never
// carry forward regardless of budget_varies_by_month, since they only
// ever happened in the one month they were billed.
function accountingMonthRowFor(lineId, monthDate) {
  const key = accountingMonthKey(monthDate);
  const exact = ALL_ACCOUNTING_MONTHS.find(m => m.campaign_line_id === lineId && m.month.slice(0, 7) === key);
  const line = ALL_ACCOUNTING_LINES.find(l => l.id === lineId);
  const carriesForward = line && line.billing_type !== 'one_time' && !line.budget_varies_by_month;

  // Same edge case Strategist's own monthRowFor() already handles: a real
  // row can exist for this exact month with actual_spend/confirmed_by set
  // but gross_budget still null (e.g. a platform report got pasted before
  // anyone entered a budget) -- without this, that null would win outright
  // and blank the whole row instead of carrying just the budget forward
  // while keeping this month's own real actuals.
  if (exact) {
    if (exact.gross_budget == null && carriesForward) {
      const prior = accountingMostRecentPriorMonth(lineId, key);
      if (prior) return { ...exact, gross_budget: prior.gross_budget };
    }
    return exact;
  }

  if (!carriesForward) return null;
  const prior = accountingMostRecentPriorMonth(lineId, key);
  if (!prior) return null;
  // Synthetic row -- carries ONLY the Gross Budget forward, never actual
  // spend/confirmed/paused state from the prior month (that would make the
  // current month look confirmed/paused just because a past one was).
  return { campaign_line_id: lineId, month: key + '-01', gross_budget: prior.gross_budget, actual_spend: null, confirmed_by: null, confirmed_at: null, in_platform_override: null, paused: false };
}
function accountingMostRecentPriorMonth(lineId, key) {
  const priorRows = ALL_ACCOUNTING_MONTHS
    .filter(m => m.campaign_line_id === lineId && m.month.slice(0, 7) < key)
    .sort((a, b) => a.month.localeCompare(b.month));
  return priorRows.length ? priorRows[priorRows.length - 1] : null;
}

async function loadAccountingDashboard() {
  // Same loading-indicator gap as Strategist's own loadStrategistDashboard()
  // (found live 2026-08-12, right after the sbAll pagination fix -- fetching now
  // takes several sequential requests instead of one, and the page looked frozen
  // with zero feedback). Only wired into the initial load, not every save.
  const wrap = document.getElementById('accounting-table-wrap');
  if (wrap) wrap.innerHTML = '<p style="padding:24px;text-align:center;color:var(--muted);font-size:13px">Loading…</p>';
  await fetchAccountingData();
  renderAccountingDashboard();
}

// Builds one row per (client, tactic) -- rolling multiple campaign_lines that
// share the same client+service+tactic into ONE row (a real scenario: a
// client splits one IO tactic across several regions, each tracked as its
// own campaign_line in the Strategist Portal via split_label, per the
// "Split into Multiple Campaigns" feature). A group of 1 renders plain; a
// group of >1 renders as an expandable rollup, aggregate first.
// Same rule as the Strategist Portal's own strategistLineActiveInMonth --
// is the currently-viewed month even within this line's flight at all.
// REAL bug found live (2026-08-12, right after the flat-budget carry-
// forward fix above): Accounting never had this check, and used to get
// away without one because a line's real campaign_months rows simply ran
// out once its flight ended -- once carry-forward started covering
// ORDINARY flat campaigns too, a line with no month row past its own
// flight_end kept showing up anyway (the carried Gross Budget doesn't know
// or care whether the flight's actually over). This is a separate
// visibility check from accountingMonthRowFor's own budget math, same
// separation Strategist's own architecture already has -- a line outside
// its flight for this month is excluded here, full stop, regardless of
// what accountingMonthRowFor would have computed for it.
function accountingLineActiveInMonth(line, monthDate) {
  const monthKey = accountingMonthKey(monthDate);
  if (line.flight_start && monthKey < accountingMonthKey(new Date(line.flight_start + 'T00:00:00'))) return false;
  if (line.flight_end && monthKey > accountingMonthKey(new Date(line.flight_end + 'T00:00:00'))) return false;
  return true;
}
// LLO (SEO) and Rep Monitoring (SEO) aren't their own billed service -- they're
// auto-created by create_campaign_lines_from_order() (2026-08-10) purely so
// Strategist can pace them separately, anchored to a placeholder seo-bp
// service_id with no real pricing/budget of their own. Claire, 2026-08-12:
// they sit within the parent SEO service, not their own accounting line, so
// they shouldn't show in Accounting at all -- only the parent SEO tactic's
// own line (a real catalog row with a real budget) belongs here. Same literal
// tactic_label strings as Strategist's own SEO_TRACKING_ONLY_TACTICS, kept as
// its own copy per this project's "each portal keeps its own copy" convention
// (no shared constant file between the two portals).
const ACCOUNTING_EXCLUDED_TACTIC_LABELS = ['LLO (SEO)', 'Rep Monitoring (SEO)'];
function accountingBuildRows() {
  const filtered = ALL_ACCOUNTING_LINES.filter(l => {
    if (ACCOUNTING_EXCLUDED_TACTIC_LABELS.includes(l.tactic_label)) return false;
    if (accountingGroupFilter && l.group_name !== accountingGroupFilter) return false;
    if (accountingStatusFilter && l.status !== accountingStatusFilter) return false;
    if (!accountingLineActiveInMonth(l, accountingCurrentMonth)) return false;
    return true;
  });

  const monthStr = accountingMonthKey(accountingCurrentMonth) + '-01';
  const perLine = filtered.map(l => {
    const monthRow = accountingMonthRowFor(l.id, accountingCurrentMonth);
    const gross = monthRow?.gross_budget != null ? Number(monthRow.gross_budget) : null;
    const actualSpend = monthRow?.actual_spend != null ? Number(monthRow.actual_spend) : null;
    const expectedSpend = accountingComputeExpectedSpend(gross, l.service_id, l.group_id, monthRow?.in_platform_override);
    const cutPct = accountingEffectiveCutPct(l.service_id, l.group_id, l.has_offline_visits, gross);
    const split = accountingSplitRevenue(gross, cutPct);
    // Confirmed = real actual-spend entered for the month (automatic), OR a
    // manual confirm from the detail card (for tactics the Strategist Portal
    // never tracks actuals for at all -- 2026-08-11, Claire). No checkbox in
    // the main table either way -- this is just the resolved boolean.
    const confirmed = actualSpend != null || !!monthRow?.confirmed_by;
    const paused = !!monthRow?.paused;
    return { line: l, gross, actualSpend, expectedSpend, cutPct, split, monthStr, confirmed, paused };
  }).filter(r => r.gross != null || r.line.status === 'pending');
  // A pending campaign still shows as a line item for every month in its
  // own flight (2026-08-12, per Claire: "I would like there to be line
  // items for the pending campaigns in whatever months are in their
  // flight") even with no Gross Budget entered yet -- Strategist hasn't
  // set it up, so there's often nothing to show numerically, but the ROW
  // itself (with its own "Pending -- blocked on X" status) shouldn't be
  // invisible just because the number is missing. Every other status
  // still requires a real Gross Budget row -- nothing to show otherwise.

  const groups = new Map();
  perLine.forEach(r => {
    const key = `${r.line.client_id}|${r.line.service_id}|${r.line.tactic_label}`;
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(r);
  });

  const rows = [...groups.entries()].map(([key, children]) => {
    if (children.length === 1) return { key, isRollup: false, ...children[0] };
    const gross = children.reduce((s, c) => s + (c.gross || 0), 0);
    const spends = children.map(c => c.actualSpend).filter(v => v != null);
    const actualSpend = spends.length ? spends.reduce((s, v) => s + v, 0) : null;
    const expected = children.map(c => c.expectedSpend).filter(v => v != null);
    const expectedSpend = expected.length ? expected.reduce((s, v) => s + v, 0) : null;
    const allHaveRate = children.every(c => c.split.fortyfouri != null);
    const fortyfouri = allHaveRate ? children.reduce((s, c) => s + c.split.fortyfouri, 0) : null;
    const groupShare = allHaveRate ? children.reduce((s, c) => s + c.split.group, 0) : null;
    const starts = children.map(c => c.line.flight_start).filter(Boolean).sort();
    // Ongoing (no end date) on ANY child means the rollup as a whole is still
    // ongoing -- at least one region hasn't wrapped up yet.
    const anyOngoing = children.some(c => !c.line.flight_end);
    const ends = children.map(c => c.line.flight_end).filter(Boolean).sort();
    const confirmedCount = children.filter(c => c.confirmed).length;
    return {
      key, isRollup: true, children, line: children[0].line, gross, actualSpend, expectedSpend,
      split: { fortyfouri, group: groupShare },
      flightStart: starts[0] || null, flightEnd: anyOngoing ? null : (ends[ends.length - 1] || null),
      confirmedCount, totalCount: children.length,
    };
  });

  return rows.sort((a, b) => (a.line.client_name || '').localeCompare(b.line.client_name || ''));
}

// Column order matches Claire's spec exactly (2026-08-11): Client, Tactic,
// Flight, Revenue, 44i Revenue, Expected Spend, Actual Spend, Status. 44i Cut
// % and Group's $ (YDA) were dropped as their own columns per that same ask
// -- the cut % is still used internally to compute 44i Revenue, just no
// longer shown as its own column.
// Tags a line created straight from an order's flat fee/recurring amount
// (2026-08-12, per Claire: "track all services ordered, not just tactics
// with spend") -- these never go through Strategist's Setup queue at all
// (accounting_only), so this is the only place Claire can tell one apart
// from a normal Strategist-tracked tactic at a glance. No tag at all for
// ordinary spend-tracked lines (accounting_only false/undefined).
function accountingBillingTypeTag(line) {
  if (!line.accounting_only) return '';
  const label = line.billing_type === 'one_time' ? 'one-time fee' : 'flat fee';
  return ` <span style="font-size:10px;color:var(--muted)">(${label} — accounting only)</span>`;
}
// Shows which catalog section a line's tactic belongs to, next to the tactic
// name itself (2026-08-12, per Claire: "we need it to show up that way in the
// accounting portal list of services for the month so it is clear what
// service was ordered. Not just when we add the service") -- several
// sections reuse the same tier names (Business Builder/Starter/Pro under
// both SEO and Social Media, etc.), so a bare tactic_label alone can be
// ambiguous when scanning the month's services. Shown on every row, not just
// ambiguous ones, for consistency -- no logic to detect which names actually
// collide, and an always-present section tag reads better than one that
// appears on some rows and not others with no visible reason why.
function accountingLineSectionTag(line) {
  const section = CATALOG_ROWS[line.service_id]?.section;
  if (!section) return '';
  return ` <span style="font-size:10px;color:var(--muted)">(${esc(accountingSectionLabel(section))})</span>`;
}
function accountingRenderRow(r) {
  if (r.isRollup) {
    const expanded = ACCOUNTING_EXPANDED_SPLITS.has(r.key);
    let html = `<tr class="acct-row" onclick="accountingToggleSplit('${r.key}')">
      <td><strong>${esc(r.line.client_name || '(unknown)')}</strong></td>
      <td><span style="display:inline-block;width:14px;color:var(--muted)">${expanded ? '▾' : '▸'}</span>${esc(r.line.tactic_label || r.line.service_id || '—')}${accountingLineSectionTag(r.line)} <span style="color:var(--muted);font-size:11px">(${r.totalCount} regions)</span>${accountingBillingTypeTag(r.line)}</td>
      <td>${accountingFormatFlightRange(r.flightStart, r.flightEnd)}</td>
      <td class="num">$${r.gross.toLocaleString(undefined,{maximumFractionDigits:2})}</td>
      <td class="num">${r.split.fortyfouri != null ? '$' + r.split.fortyfouri.toLocaleString(undefined,{maximumFractionDigits:2}) : '—'}</td>
      <td class="num">${r.expectedSpend != null ? '$' + r.expectedSpend.toLocaleString(undefined,{maximumFractionDigits:2}) : '—'}</td>
      <td class="num">${r.actualSpend != null ? '$' + r.actualSpend.toLocaleString(undefined,{maximumFractionDigits:2}) : '—'}</td>
      <td>${accountingRollupStatusPill(r)}</td>
    </tr>`;
    if (expanded) {
      // Region rows tint with the group's own brand color, same "mix toward
      // white" treatment as the stat tiles use, instead of a flat gray
      // (2026-08-11, per Claire) -- falls back to the same flat gray when
      // the group has no brand_color set, via the CSS var's own default.
      const childTint = accountingTintColor(r.line.group_color, 0.92);
      r.children.forEach(c => {
        const selected = c.line.id === accountingSelectedLineId;
        html += `<tr class="acct-row acct-child${selected ? ' selected' : ''}"${childTint ? ` style="--child-tint:${esc(childTint)}"` : ''} onclick="event.stopPropagation();accountingSelectLine('${c.line.id}')">
          <td></td>
          <td>${esc(c.line.split_label || '(unlabeled split)')}</td>
          <td>${accountingFormatFlightRange(c.line.flight_start, c.line.flight_end)}</td>
          <td class="num">${c.gross != null ? '$' + c.gross.toLocaleString(undefined,{maximumFractionDigits:2}) : '—'}</td>
          <td class="num">${c.split.fortyfouri != null ? '$' + c.split.fortyfouri.toLocaleString(undefined,{maximumFractionDigits:2}) : '—'}</td>
          <td class="num">${c.expectedSpend != null ? '$' + c.expectedSpend.toLocaleString(undefined,{maximumFractionDigits:2}) : '—'}</td>
          <td class="num">${c.actualSpend != null ? '$' + c.actualSpend.toLocaleString(undefined,{maximumFractionDigits:2}) : '—'}</td>
          <td>${accountingLineStatusPill(c)}</td>
        </tr>`;
      });
    }
    return html;
  }
  const selected = r.line.id === accountingSelectedLineId;
  return `<tr class="acct-row${selected ? ' selected' : ''}" onclick="accountingSelectLine('${r.line.id}')">
    <td><strong>${esc(r.line.client_name || '(unknown)')}</strong></td>
    <td>${esc(r.line.tactic_label || r.line.service_id || '—')}${accountingLineSectionTag(r.line)}${r.line.has_offline_visits ? ' <span style="font-size:10px;color:var(--muted)">+Visits</span>' : ''}${accountingBillingTypeTag(r.line)}</td>
    <td>${accountingFormatFlightRange(r.line.flight_start, r.line.flight_end)}</td>
    <td class="num">${r.gross != null ? '$' + r.gross.toLocaleString(undefined,{maximumFractionDigits:2}) : '—'}</td>
    <td class="num">${r.split.fortyfouri != null ? '$' + r.split.fortyfouri.toLocaleString(undefined,{maximumFractionDigits:2}) : '—'}</td>
    <td class="num">${r.expectedSpend != null ? '$' + r.expectedSpend.toLocaleString(undefined,{maximumFractionDigits:2}) : '—'}</td>
    <td class="num">${r.actualSpend != null ? '$' + r.actualSpend.toLocaleString(undefined,{maximumFractionDigits:2}) : '—'}</td>
    <td>${accountingLineStatusPill(r)}</td>
  </tr>`;
}

function renderAccountingDashboard() {
  document.getElementById('accounting-month-label').textContent = accountingMonthLabel(accountingCurrentMonth);

  const groupFilterEl = document.getElementById('accounting-group-filter');
  const groupNames = [...new Set(ALL_ACCOUNTING_LINES.map(l => l.group_name).filter(Boolean))].sort((a, b) => a.localeCompare(b));
  if (accountingGroupFilter && !groupNames.includes(accountingGroupFilter)) accountingGroupFilter = '';
  groupFilterEl.innerHTML = '<option value="">All Groups</option>' +
    groupNames.map(g => `<option value="${esc(g)}" ${g === accountingGroupFilter ? 'selected' : ''}>${esc(g)}</option>`).join('');

  const rows = accountingBuildRows();

  // Stat tiles (mockup's summary bar) -- computed from the SAME filtered rows
  // the table itself renders, so the tiles and the table total row can never
  // silently disagree. "Expected Spend" here is the COMPUTED figure (Retail
  // CPM/Platform CPM formula), not Actual Spend -- the two are genuinely
  // different numbers now that both have their own table column.
  //
  // 44i Revenue excludes anything Billed Externally (2026-08-12, per Claire:
  // "that is the number we should be invoicing" -- a billed-externally line
  // is invoiced by the group directly, not by 44i, so it was never really
  // 44i's revenue to begin with even though the per-row cell still shows the
  // calculated split for reference). Tracked separately as its own tile so
  // the excluded amount doesn't just silently vanish from the summary bar.
  // Pending campaigns are excluded from every stat tile entirely (2026-08-12,
  // per Claire: "their revenues shouldn't be included in the stat tiles
  // until they are active and have spend") -- unlike Billed Externally
  // (which still counts Gross/Expected Spend, only excludes the 44i cut),
  // a still-pending campaign hasn't started at all, so NONE of its
  // projected numbers should count yet. The row itself still shows its own
  // figures if any exist (informational, same as Billed Externally) -- only
  // the aggregate totals skip it.
  let totalGross = 0, totalExpectedSpend = 0, totalActualSpend = 0, totalFortyfouri = 0, totalBilledExternally = 0, awaiting = 0, nonPendingCount = 0;
  rows.forEach(r => {
    if (accountingRowIsPending(r)) return;
    nonPendingCount++;
    totalGross += r.gross || 0;
    if (r.expectedSpend != null) totalExpectedSpend += r.expectedSpend;
    if (r.actualSpend != null) totalActualSpend += r.actualSpend;
    const { invoiceable, excluded } = accountingSplitInvoiceable(r);
    totalFortyfouri += invoiceable;
    totalBilledExternally += excluded;
    if (accountingRowNeedsConfirmation(r)) awaiting++;
  });
  const stat = (label, value, cls) => `<div class="acct-stat"><div class="acct-stat-label">${esc(label)}</div><div class="acct-stat-value${cls ? ' ' + cls : ''}">${value}</div></div>`;
  const statsEl = document.getElementById('accounting-stats');
  statsEl.innerHTML =
    stat('Expected Revenue', '$' + totalGross.toLocaleString(undefined, {maximumFractionDigits:2})) +
    stat('Expected Spend', '$' + totalExpectedSpend.toLocaleString(undefined, {maximumFractionDigits:2})) +
    stat('Actual Spend', '$' + totalActualSpend.toLocaleString(undefined, {maximumFractionDigits:2})) +
    stat('44i Revenue', '$' + totalFortyfouri.toLocaleString(undefined, {maximumFractionDigits:2})) +
    stat('Billed Externally (excl.)', '$' + totalBilledExternally.toLocaleString(undefined, {maximumFractionDigits:2})) +
    stat('Awaiting Confirmation', `${awaiting} of ${nonPendingCount}`, awaiting > 0 ? 'warn' : '');
  // Tint the stat bar with the filtered Group's own brand color -- viewing
  // "All Groups" (mixed data, no single brand color applies) keeps the
  // plain white/border default.
  const filteredGroupColor = accountingGroupFilter
    ? ALL_ACCOUNTING_LINES.find(l => l.group_name === accountingGroupFilter)?.group_color
    : null;
  statsEl.style.background = accountingTintColor(filteredGroupColor, 0.88) || '#fff';
  statsEl.style.borderColor = filteredGroupColor || 'var(--border)';

  accountingRenderDetailCard();

  const wrap = document.getElementById('accounting-table-wrap');
  if (!rows.length) {
    wrap.innerHTML = '<p style="text-align:center;padding:30px;color:var(--muted);font-size:13px">No campaigns with a budget entered for this month yet.</p>';
    return;
  }

  // Grouped by Group as its own full-width banner row (mockup layout) rather
  // than a plain column -- Group itself is still filterable via the dropdown
  // above, this is purely a display grouping. Colored with that group's own
  // brand color (Admin -> Groups), same as the Strategist Portal's main
  // table (2026-08-11, per Claire) -- falls back to the light neutral band
  // if a group has no brand_color set.
  const byGroup = new Map();
  rows.forEach(r => {
    const g = r.line.group_name || '(No Group)';
    if (!byGroup.has(g)) byGroup.set(g, { color: r.line.group_color, rows: [] });
    byGroup.get(g).rows.push(r);
  });
  const groupOrder = [...byGroup.keys()].sort((a, b) => a.localeCompare(b));

  let bodyRows = '';
  groupOrder.forEach(groupName => {
    const bg = byGroup.get(groupName).color || '#EBF4FB';
    const fg = accountingContrastTextColor(bg);
    bodyRows += `<tr><td class="sticky-group-td" colspan="8" style="position:sticky;z-index:2;padding:8px 12px;font-weight:700;font-size:11px;letter-spacing:.04em;text-transform:uppercase;background:${esc(bg)};color:${fg}">${esc(groupName)}</td></tr>`;
    byGroup.get(groupName).rows.forEach(r => { bodyRows += accountingRenderRow(r); });
  });

  const th = (label, num) => `<th${num ? ' class="num"' : ''}>${label}</th>`;
  // Total row uses one literal <td> per column (no colspan) so it can never
  // drift out of alignment with the header/body columns above it (2026-08-11,
  // per Claire: "the total column is way too small and doesn't line up with
  // the columns" -- a colspan-merged label cell sizes differently than a
  // plain cell under certain content-width combinations; this removes that
  // possibility entirely by keeping the same 8 real cells every row has).
  wrap.innerHTML = `<table>
    <thead class="acct-sticky-thead">
      <tr>
        ${th('Client')}${th('Tactic')}${th('Flight')}${th('Revenue', true)}${th('44i Revenue', true)}${th('Expected Spend', true)}${th('Actual Spend', true)}${th('Status')}
      </tr>
    </thead>
    <tbody>${bodyRows}</tbody>
    <tfoot>
      <tr style="font-weight:700;border-top:2px solid var(--border)">
        <td>Total</td>
        <td></td>
        <td></td>
        <td class="num">$${totalGross.toLocaleString(undefined,{maximumFractionDigits:2})}</td>
        <td class="num">$${totalFortyfouri.toLocaleString(undefined,{maximumFractionDigits:2})}</td>
        <td class="num">$${totalExpectedSpend.toLocaleString(undefined,{maximumFractionDigits:2})}</td>
        <td class="num">$${totalActualSpend.toLocaleString(undefined,{maximumFractionDigits:2})}</td>
        <td></td>
      </tr>
    </tfoot>
  </table>`;
  applyStickyGroupOffset('accounting-table-wrap');
}

// Sticky header row + sticky "current group" banner while scrolling a long
// table (2026-08-11, per Claire). The group banner's sticky offset has to sit
// right below the header row, but the header's height isn't hardcoded here
// (it can change with font/zoom), so it's measured from the live DOM after
// each render rather than assumed. Same helper duplicated in the Strategist
// Portal -- kept local rather than moved to shared.js since shared.js's own
// convention is code both index.html and admin.html call, not every portal.
function applyStickyGroupOffset(wrapId) {
  const wrap = document.getElementById(wrapId);
  if (!wrap) return;
  const thead = wrap.querySelector('thead');
  if (!thead) return;
  const top = thead.getBoundingClientRect().height;
  wrap.querySelectorAll('.sticky-group-td').forEach(td => { td.style.top = top + 'px'; });
}

document.addEventListener('DOMContentLoaded', async () => {
  await loadAccountingRoster();
  if (await tryAccountingHandoffLogin()) return;
  promptAccountingLogin();
});
</script>
