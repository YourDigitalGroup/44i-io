<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>44i Accounting Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="../shared.css?v=20260813b"/>
<!-- Layout additions scoped to #page-accounting (2026-08-11) -- same light
     palette as /admin and /strategist (shared.css's --border/--muted/--text/
     --accent/--light: Claire confirmed the dark look in her screenshot was
     just her OS being in dark mode triggering the mockup doc's own
     prefers-color-scheme block, not an intended design -- "keep the coloring
     the same as admin and strategists"). Only new here: the stat-tile
     summary row, the top filter-pill buttons, and the click-a-row detail
     card -- structural pieces from the mockup that v2 didn't have yet. -->
<style>
  #page-accounting .acct-wrap{margin:24px 0 0;padding:0 16px 40px}
  /* Sticky header bar (2026-08-17) -- same "Logout button disappears while scrolling"
     bug found and fixed the same day in /admin and /strategist. This page has no
     `.card` wrapper (no shared overflow:hidden to fight, unlike those two), so it
     only needs position:sticky here plus an explicit background -- otherwise table
     rows scrolling underneath would show through a transparent sticky header. */
  #page-accounting .acct-header{display:flex;justify-content:space-between;align-items:center;padding-bottom:14px;margin-bottom:16px;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:11;background:var(--bg)}
  /* scroll-margin-top for the detail card's scrollIntoView() target (2026-08-17) --
     see fitAccountingTableHeight()'s comment for why this is needed. */
  #page-accounting #accounting-detail-card{scroll-margin-top:calc(var(--accounting-sticky-offset, 0px) + 12px)}
  #page-accounting .acct-topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;flex-wrap:wrap;gap:10px}
  #page-accounting .acct-month-nav{display:flex;align-items:center;gap:10px}
  #page-accounting .acct-month-nav button{background:#fff;border:1.5px solid var(--accent-dark);color:var(--accent-dark);padding:5px 11px;cursor:pointer;font-size:14px}
  #page-accounting .acct-month-label{font-weight:700;font-size:15px;min-width:120px;text-align:center;color:var(--text)}
  #page-accounting .acct-filters{display:flex;gap:10px}
  /* Navy border + full pill shape (2026-08-12, per Claire: "the group and status
     drop downs look different than the strategists portal... make those navy") --
     matches the same navy-bordered pill treatment now also applied to Strategist's
     own group/pacing filters below, so both portals' filters finally look the same. */
  /* Separated stat tiles, not one fused strip (2026-08-12, per Claire: "make the
     stat tiles separated instead of attached") -- each tile is now its own rounded
     card with a real gap between them, matching the reference screenshot's distinct
     boxes rather than one bar with divider lines. */
  #page-accounting .acct-stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:18px}
  /* Filled + bordered with brand color (2026-08-12, per Claire: "could we have each
     of them bordered and filled in with the brand color") -- was plain white before,
     same as every other card, so the tiles didn't read as their own distinct thing.
     Light accent-blue tint, not a solid navy fill -- six tiles in a row reads busy at
     full brand-color saturation the way the reference's one big card doesn't. */
  #page-accounting .acct-stat{padding:14px 20px;background:var(--light);border:1.5px solid var(--accent-dark);border-radius:14px}
  #page-accounting .acct-stat-label{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
  #page-accounting .acct-stat-value{font-size:22px;font-weight:700;color:var(--text)}
  #page-accounting .acct-stat-value.warn{color:#B45309}
  /* Smaller "of which $X is awaiting confirmation" sub-line (2026-08-13, per
     Claire -- replacing the old standalone "Awaiting Confirmation" tile, which
     only showed a count, with a dollar sub-total under each of the 3 tiles it
     actually affects). Plain muted gray, not the mustard "needs confirmation"
     status-pill color -- Claire: "I don't like the color... it doesn't look
     clean across the groups" (the mustard read muddy against several groups'
     own tinted tile backgrounds; muted gray stays clean/neutral against any
     of them, same as every other tile's own label text). */
  #page-accounting .acct-stat-sub{font-size:10.5px;font-weight:600;color:var(--muted);margin-top:4px}
  /* Softer, more rounded card (2026-08-12, per Claire, reacting to the first pass'
     gradient stripe: "that makes it look less smooth, the edges look sharp... I would
     like it to be more dynamic like this" -- pointing at 44idigital.com's own hero,
     all soft rounded pill shapes and solid color blocks, no thin gradient lines or hard
     edges). Bigger radius + a deeper, softer shadow instead of a border accent. */
  #page-accounting .acct-detail-card{background:#fff;border:1px solid var(--border);border-radius:18px;padding:18px 20px;margin-bottom:18px;box-shadow:var(--shadow-lg)}
  #page-accounting .acct-detail-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;flex-wrap:wrap;gap:8px}
  #page-accounting .acct-detail-title{font-weight:700;font-size:14px;color:var(--text)}
  #page-accounting .acct-detail-sub{color:var(--muted);font-size:12px}
  #page-accounting .acct-detail-close{background:var(--accent-green);border:1.5px solid var(--accent-green);color:var(--accent-dark);padding:4px 12px;font-size:11px;font-weight:600;cursor:pointer}
  /* max-height (2026-08-12, per Claire: "sticky headers not working") --
     overflow:auto alone makes this div its OWN scroll container for sticky
     purposes, but with no height limit it never actually scrolls internally
     (the page scrolls instead), so the sticky thead/group-row just sat frozen
     at the top of this div and never tracked page scroll at all. Bounding
     the height makes it a real scrolling panel, which is what sticky needs
     to have something to stick against. */
  #page-accounting .acct-table-wrap{border:1px solid var(--border);border-radius:8px;overflow:auto;max-height:70vh;background:#fff}
  #page-accounting table{width:100%;border-collapse:collapse;font-size:12.5px}
  #page-accounting thead th{position:sticky;top:0;z-index:3;background:#fff;text-align:left;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:9px 12px;border-bottom:1px solid var(--border);white-space:nowrap}
  #page-accounting thead th.num, #page-accounting td.num{text-align:right}
  #page-accounting tbody td{padding:9px 12px;border-bottom:1px solid var(--border);font-variant-numeric:tabular-nums;color:var(--text)}
  #page-accounting tfoot td{padding:10px 12px;font-variant-numeric:tabular-nums;color:var(--text);font-size:12.5px}
  #page-accounting tr.acct-row{cursor:pointer}
  #page-accounting tr.acct-row:hover td{background:var(--light)}
  #page-accounting tr.acct-row.selected td{background:var(--light)}
  #page-accounting tr.acct-child td{background:var(--child-tint, #FAFCFE)}
  #page-accounting tr.acct-child td:first-of-type{color:var(--muted);padding-left:26px}
  #page-accounting .acct-status-pill{display:inline-flex;align-items:center;padding:3px 9px;border-radius:20px;font-size:10.5px;font-weight:700;white-space:nowrap}
  /* Darker text (2026-08-18, accessibility audit) -- the original #2E7D42/#8A6D12
     measured 4.32:1 / 4.38:1 on their own pill backgrounds, both just under the
     4.5:1 AA minimum, on every single "Confirmed"/"Needs confirmation" pill. */
  #page-accounting .acct-status-pill.confirmed{background:#DDF2DE;color:#1F5C30}
  #page-accounting .acct-status-pill.needs{background:#FBF3C7;color:#6E5109}
  #page-accounting .acct-status-pill.external{background:#DBEAFE;color:#1E40AF}
  #page-accounting .acct-status-pill.paused{background:#E5E7EB;color:#4B5563}
  #page-accounting .acct-status-pill.pending{background:#EDE9FE;color:#6D28D9}
  #page-accounting .acct-status-pill.cancelled{background:#FEE2E2;color:#991B1B}
  /* Distinct from .paused on purpose (2026-09-10) -- a permanently completed/
     cancelled line reads very differently from a temporary pause for anyone
     doing revenue reconciliation, so it gets its own color rather than
     sharing gray with Paused. */
  #page-accounting .acct-status-pill.complete{background:#FEE2E2;color:#991B1B}
</style>
</head>
<body>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<!-- ACCOUNTING PORTAL — v3 layout (2026-08-11), matching the original
     "Accounting Portal — Concept & Open Questions" dashboard mockup's actual
     structure (stat-tile summary row, a per-campaign detail card with a
     short month lookahead) per Claire's "it still doesn't look like the
     mockup" -- v2 (same day, earlier) matched the mockup's grouping/split-
     rollup/Confirmed/Billed-Externally structure but kept a plain table-only
     layout, missing the summary bar and detail card entirely. First attempt
     at this pass used the mockup DOC's dark-mode CSS (the screenshot Claire
     sent happened to be taken with her OS in dark mode, triggering that
     doc's own prefers-color-scheme block) -- corrected immediately per
     Claire: "keep the coloring the same as admin and strategists," so this
     uses shared.css's normal light palette throughout, same as every other
     portal. Everything from v2 (RPCs, rollup logic, Confirmed/Billed
     Externally mechanics) is unchanged -- this is presentation + the new
     detail-card feature, not a data model change. -->
<div id="page-accounting" style="display:none;padding-top:1px">
  <div class="acct-wrap">
    <div class="acct-header">
      <div id="accounting-user-badge" style="font-size:12px;color:var(--muted)"></div>
      <div style="display:flex;align-items:center;gap:10px">
        <button id="accounting-admin-portal-link" onclick="location.href='../admin/index.html'" style="display:none;padding:6px 14px;border:1.5px solid var(--accent-dark);background:#fff;color:var(--accent-dark);font-weight:600;font-size:12px;cursor:pointer">Go to Admin →</button>
        <button onclick="accountingLogout()" class="btn-quiet-green">Logout</button>
      </div>
    </div>

    <!-- Top bar: month picker + filters -->
    <div class="acct-topbar">
      <div class="acct-month-nav">
        <button onclick="accountingShiftMonth(-1)" aria-label="Previous month">‹</button>
        <span id="accounting-month-label" class="acct-month-label"></span>
        <button onclick="accountingShiftMonth(1)" aria-label="Next month">›</button>
        <span id="accounting-month-close-control"></span>
      </div>
      <div class="acct-filters">
        <select id="accounting-group-filter" onchange="accountingSetGroupFilter(this.value)" aria-label="Filter by group" style="padding:6px 14px;border-radius:999px;border:1.5px solid var(--accent-dark);color:var(--accent-dark);background:#fff;font-size:11.5px;font-weight:600;cursor:pointer">
          <option value="">All Groups</option>
        </select>
        <!-- Client search + Status filter (2026-09-02, per Claire -- "if you
             are looking for something specific like a client... you just
             have to scroll" / "make it quick at the beginning of the month
             to find what needs to be confirmed and what is pending without
             needing to scroll"). Both are pure DISPLAY filters, unlike the
             Group filter above -- they narrow which rows the TABLE shows
             but deliberately never touch the stat tiles (Claire: "I don't
             want it to change any of the totals"), and both default back to
             "show everything" (empty search / All Statuses) -- see
             renderAccountingDashboard()'s own comment for exactly where the
             totals vs. table split happens. -->
        <input type="text" id="accounting-client-search" oninput="accountingSetClientSearch(this.value)" placeholder="Search client…" aria-label="Search by client name" style="padding:6px 14px;border-radius:999px;border:1.5px solid var(--accent-dark);color:var(--text);background:#fff;font-size:11.5px;width:160px"/>
        <select id="accounting-status-filter" onchange="accountingSetStatusFilter(this.value)" aria-label="Filter by status" style="padding:6px 14px;border-radius:999px;border:1.5px solid var(--accent-dark);color:var(--accent-dark);background:#fff;font-size:11.5px;font-weight:600;cursor:pointer">
          <option value="">All Statuses</option>
          <option value="needs">Needs Confirmation</option>
          <option value="pending">Pending</option>
          <option value="confirmed">Confirmed</option>
          <option value="paused">Paused</option>
          <option value="complete">Complete</option>
          <option value="external">SSH Billing</option>
        </select>
        <button onclick="accountingOpenAddServiceForm()" style="padding:6px 14px;border-radius:999px;border:1.5px solid var(--accent-dark);background:#fff;color:var(--accent-dark);cursor:pointer;font-weight:600;font-size:12px">+ Add Service</button>
        <button onclick="accountingOpenBulkMatchForm()" style="padding:6px 14px;border-radius:999px;border:1.5px solid var(--accent-dark);background:#fff;color:var(--accent-dark);cursor:pointer;font-weight:600;font-size:12px">Bulk Match</button>
        <button onclick="accountingOpenBulkImportForm()" style="padding:6px 14px;border-radius:999px;border:1.5px solid var(--accent-dark);background:#fff;color:var(--accent-dark);cursor:pointer;font-weight:600;font-size:12px">Bulk Import (CSV)</button>
      </div>
    </div>

    <!-- "+ Add Service" single-entry form, "Bulk Match" paste tool, and
         "Bulk Import (CSV)" -- all hidden until opened (2026-08-11/12, per
         Claire: a way to manually add a tactic Strategist doesn't track, a
         way to check what's missing from one portal vs. the other without
         pasting real data into chat, and a way to add many rows at once
         ["there are a lot of rows to add"] -- all three run entirely in
         this page, client-side, until Confirm is clicked). -->
    <div id="accounting-add-service-form" style="display:none;margin-bottom:16px"></div>
    <div id="accounting-bulk-match-form" style="display:none;margin-bottom:16px"></div>
    <div id="accounting-bulk-import-form" style="display:none;margin-bottom:16px"></div>

    <!-- Summary stat tiles -->
    <div id="accounting-stats" class="acct-stats"></div>

    <!-- Per-campaign detail card -- only rendered when a row is selected -->
    <div id="accounting-detail-card"></div>

    <div id="accounting-table-wrap" class="acct-table-wrap"></div>
  </div>
</div>

<!-- Read-only order-detail modal (2026-08-13) -- shared markup/render logic
     with Strategist's own copy of this same block, via shared.js's
     renderOrderDetailModal()/closeOrderDetailModal(). -->
<div id="shared-order-modal" role="dialog" aria-modal="true" aria-labelledby="shared-order-modal-title" onkeydown="if(event.key==='Escape')closeOrderDetailModal()" style="position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9000;display:none;align-items:center;justify-content:center">
  <div style="background:#fff;border-radius:18px;padding:24px 28px;width:600px;max-height:80vh;overflow:auto;box-shadow:0 24px 64px rgba(0,0,0,.2)">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <h3 id="shared-order-modal-title" style="margin:0;font-size:14px;font-weight:700;color:var(--text)">Order Detail</h3>
      <button id="shared-order-modal-close" onclick="closeOrderDetailModal()" class="btn-quiet-green">✕ Close</button>
    </div>
    <div id="shared-order-modal-body"></div>
  </div>
</div>

<!-- Login (Supabase Auth). The only way in since 2026-09-28 (Stage 4/5 of AUTH_MIGRATION_PLAN.md). -->
<div id="accounting-new-login-modal" role="dialog" aria-modal="true" aria-labelledby="accounting-new-login-title" style="position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9001;display:none;align-items:center;justify-content:center">
  <div style="background:#fff;border-radius:14px;padding:36px 32px;width:340px;box-shadow:0 24px 64px rgba(0,0,0,.2);text-align:center">
    <div aria-hidden="true" style="font-size:32px;margin-bottom:12px">🔐</div>
    <h3 id="accounting-new-login-title" style="font-size:16px;font-weight:700;margin-bottom:6px;color:var(--text)">Accounting Access</h3>
    <p style="font-size:12px;color:var(--muted);margin-bottom:16px">Sign in with your email and password.</p>
    <input type="email" id="accounting-new-login-email" placeholder="Email" autocomplete="email" style="width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--border);font-size:14px;text-align:center;margin-bottom:10px"/>
    <input type="password" id="accounting-new-login-pw" placeholder="Password" autocomplete="current-password" onkeydown="if(event.key==='Enter')attemptAccountingNewLogin()" style="width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--border);font-size:14px;text-align:center;margin-bottom:12px"/>
    <div id="accounting-new-login-error" role="alert" style="display:none;color:#B3261E;font-size:12px;margin-bottom:10px"></div>
    <div id="accounting-new-login-success" role="status" style="display:none;color:#1E7E34;font-size:12px;margin-bottom:10px"></div>
    <div style="display:flex;gap:9px">
      <button onclick="attemptAccountingNewLogin()" style="flex:1;padding:10px;border-radius:8px;background:var(--accent-dark);color:#fff;border:none;font-size:13px;font-weight:600;cursor:pointer">Sign In</button>
    </div>
    <a href="#" onclick="event.preventDefault();sendAccountingNewLoginResetEmail();" style="display:block;margin-top:14px;font-size:11px;color:var(--muted)">Forgot password?</a>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="../shared.js?v=20260930a"></script>
<script>
let currentAccountingUser = null; // {name, email, role, pw}

// The email login is the only login (2026-09-28, Stage 4/5 of
// AUTH_MIGRATION_PLAN.md, per Claire: everyone is on Supabase Auth). Kept
// under its old name because logout and page-load both call it.
function promptAccountingLogin() { openAccountingNewLogin(); }

function showAccountingPanel(show) {
  document.getElementById('page-accounting').style.display = show ? 'block' : 'none';
  if (show && currentAccountingUser) {
    const badge = document.getElementById('accounting-user-badge');
    const roleLabel = currentAccountingUser.role === 'super' ? 'Super Admin' : 'Accounting';
    badge.innerHTML = `<span style="display:inline-flex;align-items:center;gap:6px"><span style="width:8px;height:8px;border-radius:50%;background:#0EA5E9"></span><strong style="color:var(--text)">${esc(currentAccountingUser.name)}</strong> <span style="color:var(--muted)">— ${roleLabel}</span></span>`;
    // Only a super admin gets a way back to /admin from here -- an accounting-role
    // login is deliberately rejected by /admin (attemptAdminLogin), so showing this
    // link to a real accounting user would just dead-end them (carried over from
    // the original scaffold, 2026-08-07).
    const adminLink = document.getElementById('accounting-admin-portal-link');
    if (adminLink) adminLink.style.display = currentAccountingUser.role === 'super' ? 'inline-block' : 'none';
    loadAccountingDashboard();
  }
}


// Deep link to a specific campaign line's own detail panel in the Strategist
// Portal (2026-09-04, per Claire). The login carries over on its own now: both
// portals share the same Supabase session (2026-09-28, Stage 4/5 -- the old
// name/password handoff is gone). The `?line=` param is read by
// strategist/index.html's strategistOpenDeepLinkedLine(). The detail card hides the
// button for accounting-only lines (2026-10-09, per Claire): Strategist never shows them.
function strategistPortalHandoffToLine(lineId) {
  location.href = '../strategist/index.html?line=' + encodeURIComponent(lineId);
}


function accountingLogout() {
  // If signed in via the new Supabase login, sign out of it too and clear the
  // session so a leftover token can't attach itself to a later login attempt
  // in the same tab (see sbAuthClientAccounting's persistSession:false note below).
  if (currentAccountingUser?.viaSession && sbAuthClientAccounting) {
    sbAuthClientAccounting.auth.signOut();
  }
  currentSupabaseSession = null;
  currentAccountingUser = null;
  showAccountingPanel(false);
  promptAccountingLogin();
}

// ── NEW SUPABASE-AUTH LOGIN (Stage 1+3 of AUTH_MIGRATION_PLAN.md) ────────
// Same pattern as /admin's and /strategist's versions (see io_project_tracking.md
// 2026-09-04) — reuses admin_get_profile_by_auth_uid() since it isn't
// admin-specific. Uses the default persistSession:true — see admin/index.html's
// comment on its own client for the full reasoning (2026-09-04, per Claire: a
// refresh shouldn't require logging back in, and a real Supabase session is
// the mechanism meant to survive one).
const sbAuthClientAccounting = (typeof supabase !== 'undefined')
  ? supabase.createClient(SUPABASE_URL, SUPABASE_KEY)
  : null;

if (sbAuthClientAccounting) {
  sbAuthClientAccounting.auth.onAuthStateChange((event, session) => {
    currentSupabaseSession = session;
  });
}

// Called once on every page load (see DOMContentLoaded below) — restores a
// session that survived from an earlier visit instead of prompting to log
// in again. Same shape as admin/index.html's tryRestoreAdminSession().
async function tryRestoreAccountingSession() {
  if (!sbAuthClientAccounting) return false;
  const { data } = await sbAuthClientAccounting.auth.getSession();
  const session = data?.session;
  if (!session) return false;
  let profile;
  try {
    const res = await fetch(SUPABASE_URL + '/rest/v1/rpc/admin_get_profile_by_auth_uid', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        apikey: SUPABASE_KEY,
        Authorization: 'Bearer ' + session.access_token,
      },
      body: JSON.stringify({}),
    });
    const t = await res.text();
    if (!res.ok) throw new Error(t.slice(0, 200));
    profile = t ? JSON.parse(t) : null;
  } catch (e) {
    await sbAuthClientAccounting.auth.signOut();
    return false;
  }
  if (profile.role !== 'accounting' && profile.role !== 'super') {
    await sbAuthClientAccounting.auth.signOut();
    return false;
  }
  currentSupabaseSession = session;
  currentAccountingUser = { name: profile.name, email: profile.email || '', role: profile.role, pw: '', viaSession: true };
  showAccountingPanel(true);
  return true;
}

function openAccountingNewLogin() {
  const modal = document.getElementById('accounting-new-login-modal');
  modal.style.display = 'flex';
  document.getElementById('accounting-new-login-email').value = '';
  document.getElementById('accounting-new-login-pw').value = '';
  document.getElementById('accounting-new-login-error').style.display = 'none';
  document.getElementById('accounting-new-login-success').style.display = 'none';
}

function closeAccountingNewLogin() {
  document.getElementById('accounting-new-login-modal').style.display = 'none';
}

async function attemptAccountingNewLogin() {
  const email = document.getElementById('accounting-new-login-email').value.trim();
  const pw = document.getElementById('accounting-new-login-pw').value;
  const errEl = document.getElementById('accounting-new-login-error');
  const okEl = document.getElementById('accounting-new-login-success');
  errEl.style.display = 'none';
  okEl.style.display = 'none';
  if (!sbAuthClientAccounting) {
    errEl.textContent = 'Could not load the login library. Check your connection and try again.';
    errEl.style.display = 'block';
    return;
  }
  if (!email || !pw) {
    errEl.textContent = 'Enter your email and password.';
    errEl.style.display = 'block';
    return;
  }
  const { data, error } = await sbAuthClientAccounting.auth.signInWithPassword({ email, password: pw });
  if (error || !data?.session) {
    errEl.textContent = 'Incorrect email or password.';
    errEl.style.display = 'block';
    return;
  }
  let profile;
  try {
    const res = await fetch(SUPABASE_URL + '/rest/v1/rpc/admin_get_profile_by_auth_uid', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        apikey: SUPABASE_KEY,
        Authorization: 'Bearer ' + data.session.access_token,
      },
      body: JSON.stringify({}),
    });
    const t = await res.text();
    if (!res.ok) throw new Error(t.slice(0, 200));
    profile = t ? JSON.parse(t) : null;
  } catch (e) {
    errEl.textContent = 'Signed in, but no admin account is linked to this login yet. Check with a super admin.';
    errEl.style.display = 'block';
    await sbAuthClientAccounting.auth.signOut();
    return;
  }
  if (profile.role !== 'accounting' && profile.role !== 'super') {
    errEl.textContent = 'This account isn\'t set up for the Accounting portal.';
    errEl.style.display = 'block';
    await sbAuthClientAccounting.auth.signOut();
    return;
  }
  currentSupabaseSession = data.session;
  currentAccountingUser = { name: profile.name, email: profile.email || '', role: profile.role, pw: '', viaSession: true };
  closeAccountingNewLogin();
  showAccountingPanel(true);
}

async function sendAccountingNewLoginResetEmail() {
  const email = document.getElementById('accounting-new-login-email').value.trim();
  const errEl = document.getElementById('accounting-new-login-error');
  const okEl = document.getElementById('accounting-new-login-success');
  errEl.style.display = 'none';
  okEl.style.display = 'none';
  if (!sbAuthClientAccounting) return;
  if (!email) {
    errEl.textContent = 'Enter your email first, then click "Forgot password?" again.';
    errEl.style.display = 'block';
    return;
  }
  const { error } = await sbAuthClientAccounting.auth.resetPasswordForEmail(email, {
    redirectTo: window.location.origin + '/reset-password.html',
  });
  if (error) {
    errEl.textContent = 'Could not send a reset email. Check the address and try again.';
    errEl.style.display = 'block';
    return;
  }
  okEl.textContent = 'If that email has an account, a password reset link is on its way.';
  okEl.style.display = 'block';
}

// ══════════════════════════════════════════════════════════════════════════

let ACCOUNTING_CUT_TIERS = {}; // service_id -> [{ max, cut_pct }, ...] sorted ascending, e.g. SEM
let ACCOUNTING_PLATFORM_CPM_RATES = { base: {}, group: {}, pairing: {} }; // for Expected Spend -- same shape as the Strategist Portal's own PLATFORM_CPM_RATES
let ACCOUNTING_IN_PLATFORM_PCT_RATES = { base: {}, group: {} }; // Expected Spend fallback for a service with no Retail CPM (e.g. SEM)

let ACCOUNTING_IN_PLATFORM_PCT_FORCE = { group: {} }; // group_id|service_id -> true when that group's in_platform_pct is flagged to beat the spend tier outright (2026-08-25, MS Farm Bureau)
let ACCOUNTING_SETUP_FEE_CUT_RATES = { base: {}, group: {} }; // service_id -> pct, group_id|service_id -> pct -- the split % for a service's own auto-add setup fee (accounting_map.setup_fee_cut_pct), can differ from that service's regular 44i Cut %

let ACCOUNTING_CLOSED_MONTHS = {};
let accountingCurrentMonth = new Date();
let accountingGroupFilter = '';
// Pure display filters (2026-09-02) -- unlike accountingGroupFilter above,
// these never touch the stat tiles, only which rows the table shows. Both
// default to "show everything" (empty string).
let accountingClientSearch = '';
let accountingStatusFilter = '';
let ACCOUNTING_EXPANDED_SPLITS = new Set(); // rollup keys currently expanded -- always starts empty on load
let accountingSelectedLineId = null; // drives the per-campaign detail card below the stat tiles

// Same wrap-avoidance fix as the Strategist Portal's own strategistFormatFlightDate/
// Range (2026-08-11, found live in that table's narrow Flight column, applies here
// for the same reason -- non-breaking space within a date, plus wrapping "– end" in
// its own nowrap span since an en dash carries its own line-break opportunity that
// a non-breaking space alone doesn't suppress). Returns HTML -- callers must NOT
// wrap this in esc() (safe: only ever built from Date output, never free-typed text).
// Includes the day (2026-08-18, per Claire -- match Strategist's own flight-date
// precision, "Jun 1, 26" not just "Jun '26"), same toLocaleDateString options
// Strategist's strategistFormatFlightDate() already uses.
function accountingFormatFlightDate(dateStr) {
  if (!dateStr) return null;
  const d = new Date(dateStr + 'T00:00:00');
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: '2-digit' }).replace(/ /g, '\xa0');
}
// Stacked start/end instead of one inline "start – end" line (2026-08-19,
// per Claire -- wants the Flight column to always read top-to-bottom the
// same way rather than wrapping mid-range in the narrow column).
// MS Farm Bureau fan-out (2026-08-20): a line with both agent_name and county
// belongs to a consolidated multi-agent client (one real client record per
// AE/county, per Claire's design) -- shown with the same composed name
// strategists/accounting are used to seeing from the old separate-client-per-
// agent setup, so nothing looks different to them even though there's only
// one client record underneath now. Own copy of strategist/index.html's
// identical helper, per this project's "each portal keeps its own copy"
// convention.
// display_group_label (2026-08-21, per Claire -- MS Farm Bureau's agent clients
// sit under the real group "STMM Digital", but the composed name needs to read
// "MS Farm Bureau" instead) -- a per-CLIENT override, separate from the real
// group_name every other filter/lookup still uses unchanged. Falls back to the
// real group name when unset, same as strategist/index.html's own copy.
function accountingDisplayClientName(line) {
  if (line.agent_name && line.county) return `${line.display_group_label || line.group_name || ''}: ${line.agent_name} (${line.county} County)`;
  return line.client_name || '(unknown)';
}

// Same badge markup as the Strategist Portal's copy of this line (2026-08-25,
// per Claire -- a retail_cpm_override needs to be visible at a glance in the
// main table too, not just once someone opens a line's own detail).
function cpmOverrideBadgeHtml(line) {
  if (line.retail_cpm_override == null) return '';
  return ` <span title="Retail CPM overridden to $${Number(line.retail_cpm_override).toFixed(2)}" style="display:inline-block;padding:1px 6px;margin-left:2px;border-radius:999px;background:var(--light);border:1px solid var(--accent);color:var(--accent-dark);font-size:9.5px;font-weight:700;vertical-align:middle;white-space:nowrap">CPM $${Number(line.retail_cpm_override).toFixed(2)}</span>`;
}

// Same shape as cpmOverrideBadgeHtml above (2026-08-27, per Claire -- QUR
// services quote at a varying price, so the 44i Cut % on those lines is a
// manual per-line call, not a fixed tier). Shown wherever a line renders in
// the main table, so an overridden split is visible without opening the
// detail card.
function cutPctOverrideBadgeHtml(line) {
  if (line.cut_pct_override == null) return '';
  return ` <span title="44i Cut % overridden to ${Number(line.cut_pct_override)}%" style="display:inline-block;padding:1px 6px;margin-left:2px;border-radius:999px;background:var(--light);border:1px solid var(--accent);color:var(--accent-dark);font-size:9.5px;font-weight:700;vertical-align:middle;white-space:nowrap">Cut ${Number(line.cut_pct_override)}%</span>`;
}

// See ACCOUNTING_CLOSED_MONTHS' own comment (2026-09-18) -- flags a row that
// showed up (new line) or changed (edited gross/actual for an existing
// month) after the currently-viewed month was already marked billed.
function accountingAfterBillingBadgeHtml(r) {
  if (r.addedAfterBilling) {
    return ` <span title="This campaign was added after this month was marked billed" style="display:inline-block;padding:1px 6px;margin-left:2px;border-radius:999px;background:#FEF3C7;border:1px solid #F59E0B;color:#92400E;font-size:9.5px;font-weight:700;vertical-align:middle;white-space:nowrap">⚠ Added after billing</span>`;
  }
  if (r.changedAfterBilling) {
    return ` <span title="This month's numbers changed after this month was marked billed" style="display:inline-block;padding:1px 6px;margin-left:2px;border-radius:999px;background:#FEF3C7;border:1px solid #F59E0B;color:#92400E;font-size:9.5px;font-weight:700;vertical-align:middle;white-space:nowrap">⚠ Changed after billing</span>`;
  }
  return '';
}

// Budget entry mode pill (2026-08-28, per Claire: "I want it to be clear
// what was ordered" -- a whole-campaign-total split evenly across months
// can look identical to a flat monthly rate in the raw numbers). 'monthly'
// is the unchanged default and gets no pill, matching every campaign
// before this feature existed. Same pattern as strategist's own copy.
function accountingBudgetModePillHtml(line) {

  if (line.budget_entry_mode === 'total') return `<span style="font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;background:var(--accent-dark);color:#fff;white-space:nowrap">Whole Campaign Total</span>`;
  if (line.budget_entry_mode === 'custom') return `<span style="font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;background:var(--accent-dark);color:#fff;white-space:nowrap">Custom by Month</span>`;
  return '';
}

// Editable "44i Cut % Override" field, QUR services only (2026-08-27, per

function accountingCutPctOverrideFieldHtml(line) {

  </label>`;
}

async function accountingSaveCutPctOverride(lineId, value) {
  try {
    await sb('rpc/accounting_set_cut_pct_override', { method: 'POST', body: JSON.stringify({
      p_name: currentAccountingUser.name, p_pw: currentAccountingUser.pw,
      p_campaign_line_id: lineId, p_value: value === '' ? null : Number(value)
    }) });
    await fetchAccountingData();
    renderAccountingDashboard();
  } catch(e) { showToast('Error saving: ' + e.message, 'error'); }
}

// isOneTime (2026-09-02, per Claire: a one-time fee's flight column showed
// "Sep 5, 26 – Ongoing" right next to accountingLineActiveInMonth()'s own
// now-fixed one-billed-month-only behavior -- looked ongoing even after
// that fix, since a one-time fee's real flight_end genuinely is null (it
// was never given a real end date at all, there's no "ongoing" to speak of
// either way) and this function's only fallback for a null end was
// "Ongoing." A one-time line shows just its single billed date instead.
function accountingFormatFlightRange(start, end, isOneTime) {
  const s = accountingFormatFlightDate(start), e = accountingFormatFlightDate(end);
  if (!s && !e) return '—';
  if (isOneTime && !e) return `<div style="white-space:nowrap">${s || '—'}</div>`;
  return `<div style="white-space:nowrap">${s || '—'}</div><div style="white-space:nowrap">– ${e || 'Ongoing'}</div>`;
}
// Fuller "Aug 1, 2026 – Jan 31, 2027" format for the detail card header only --
// the main table stays on the shorter 2-digit-year "Aug 1, 26" form (narrower
// column). Includes the day now too (2026-08-18, per Claire -- "consistency
// across the board" with the main table's own day-level fix and Strategist's
// own flight-date precision), keeping the 4-digit year as this format's own
// distinguishing feature for a header context where space isn't as tight.
function accountingFormatFullFlightDate(dateStr) {
  if (!dateStr) return null;
  const d = new Date(dateStr + 'T00:00:00');
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }).replace(/ /g, '\xa0');
}
// isOneTime -- same reasoning as accountingFormatFlightRange() above.
function accountingFormatFullFlightRange(start, end, isOneTime) {
  const s = accountingFormatFullFlightDate(start), e = accountingFormatFullFlightDate(end);
  if (!s && !e) return '—';
  if (isOneTime && !e) return s || '—';
  return `${s || '—'} <span style="white-space:nowrap">– ${e || 'Ongoing'}</span>`;
}
function accountingToggleSplit(key) {
  if (ACCOUNTING_EXPANDED_SPLITS.has(key)) ACCOUNTING_EXPANDED_SPLITS.delete(key);
  else ACCOUNTING_EXPANDED_SPLITS.add(key);
  renderAccountingDashboard();
}
// Clicking a single campaign's row (not a rollup parent, which toggles its own
// split expansion instead) opens the mockup's per-campaign detail card -- a
// short 3-month lookahead starting at whatever month the top bar is currently
// showing, so Confirmed can be checked off for several upcoming months without
// having to step the month picker back and forth.
function accountingSelectLine(lineId) {
  const opening = accountingSelectedLineId !== lineId;
  accountingSelectedLineId = opening ? lineId : null;
  renderAccountingDashboard();
  // Same scroll-to-editor convention as strategist/admin (2026-08-11, per Claire:
  // the detail card renders above the table, so opening it while scrolled down a
  // long list left it off-screen above the click).
  if (opening) document.getElementById('accounting-detail-card').scrollIntoView({ behavior: 'smooth', block: 'start' });
}
function accountingCloseDetailCard() {
  accountingSelectedLineId = null;
  renderAccountingDashboard();
}

// Fetches and shows the read-only order-detail modal (2026-08-13) --
// scoped to a single order via accounting_get_order_detail, not the bulk
// admin order list. Rendering itself lives in shared.js
// (renderOrderDetailModal) since it's identical to Strategist's own copy.
async function accountingViewOrder(orderId) {
  if (!orderId) return;
  try {
    if (!ACCOUNTING_SECTIONS.length) ACCOUNTING_SECTIONS = await sb('sections?order=sort_order&select=*') || [];
    const order = await sb('rpc/accounting_get_order_detail', {
      method: 'POST',
      body: JSON.stringify({ p_name: currentAccountingUser.name, p_pw: currentAccountingUser.pw, p_order_id: orderId })
    });
    renderOrderDetailModal(order, ACCOUNTING_SECTIONS);
  } catch (e) {
    showToast('Could not load order: ' + e.message, 'error');
  }
}
// A row still needs attention if it isn't fully confirmed and isn't (fully)
// billed externally -- drives both the table's own status pill logic (already
// built) and the "Awaiting Confirmation" stat tile below.
function accountingRowNeedsConfirmation(r) {
  if (r.isRollup) {
    if (r.children.every(c => c.line.billed_externally)) return false;
    return r.confirmedCount < r.totalCount;
  }
  if (r.line.billed_externally) return false;
  return !r.confirmed;
}
function accountingRenderDetailCard() {
  const el = document.getElementById('accounting-detail-card');
  const line = accountingSelectedLineId ? ALL_ACCOUNTING_LINES.find(l => l.id === accountingSelectedLineId) : null;
  if (!line) { el.innerHTML = ''; el.className = ''; accountingSelectedLineId = null; return; }
  el.className = 'acct-detail-card';

  const months = [0, 1, 2].map(offset => {
    const d = new Date(accountingCurrentMonth.getFullYear(), accountingCurrentMonth.getMonth() + offset, 1);
    const monthKey = accountingMonthKey(d);
    const monthStr = monthKey + '-01';
    // Shared helper, not a raw lookup (2026-08-12) -- carries a flat/non-
    // varying line's Gross Budget forward the same way the main table
    // does, so the detail card doesn't show "—" for a future month just
    // because nothing explicitly wrote a row for it yet. Still gated by
    // accountingLineActiveInMonth, though (2026-08-12 fix) -- a month past
    // this line's own flight_end shows nothing, same as the main table,
    // regardless of what the carry-forward would otherwise compute.
    const active = accountingLineActiveInMonth(line, d);
    const monthRow = active ? accountingMonthRowFor(line.id, d) : null;
    const gross = monthRow?.gross_budget != null ? Number(monthRow.gross_budget) : null;
    const actualSpend = monthRow?.actual_spend != null ? Number(monthRow.actual_spend) : null;
    // Setup fee lines split at the Setup Fee Split % instead of the tactic's
    // regular 44i Cut % (2026-08-13) -- they're not spend-tiered or modifier-
    // paired, so the tier/pairing lookups inside accountingEffectiveCutPct
    // don't apply and would just be dead code for this billing_type anyway.
    const cutPct = line.billing_type === 'setup_fee'
      ? accountingEffectiveSetupFeeCutPct(line.service_id, line.client_id, line.group_id)
      : accountingEffectiveCutPct(line.service_id, line.client_id, line.group_id, line.has_offline_visits || line.has_addl_targeting, gross, line.cut_pct_override);
    const expectedSpend = accountingComputeExpectedSpend(gross, line.service_id, line.client_id, line.group_id, monthRow?.in_platform_override, line.has_offline_visits || line.has_addl_targeting, line.retail_cpm_override, cutPct);
    const split = accountingSplitRevenue(gross, cutPct);
    const manuallyConfirmed = !!monthRow?.confirmed_by;
    return {
      label: d.toLocaleString('en-US', { month: 'short' }) + ' \'' + String(d.getFullYear()).slice(-2),
      monthStr, gross, actualSpend, expectedSpend, split, active,
      confirmed: actualSpend != null || manuallyConfirmed, manuallyConfirmed,
      // Folds in the line's own top-level status too (2026-09-10, same fix
      // as accountingBuildRows() -- this detail card has its own SEPARATE
      // month-row construction, so the main table's fix didn't reach here
      // at all: found live via Claire's screenshot, the top summary still
      // showed "Paused" for a Complete/cancelled line's month even after
      // the main table row below it correctly switched to "Complete").
      paused: !!monthRow?.paused || line.status === 'paused' || line.status === 'complete',
    };
  });

  el.innerHTML = `<div class="acct-detail-head">
      <div class="acct-detail-title">${esc(accountingDisplayClientName(line))} — ${esc(line.tactic_label || line.service_id || '—')}</div>
      <div style="display:flex;align-items:center;gap:14px">
        <div class="acct-detail-sub">${esc(line.group_name || '—')} · ${accountingFormatFullFlightRange(line.flight_start, line.flight_end, ACCOUNTING_ONE_TIME_BILLING_TYPES.includes(line.billing_type))}</div>
        <label style="display:flex;align-items:center;gap:5px;cursor:pointer;font-size:11.5px;color:var(--muted)">
          <input type="checkbox" ${line.billed_externally ? 'checked' : ''} onchange="accountingToggleBilledExternally('${line.id}', this.checked)"/> SSH Billing
        </label>
        ${accountingCutPctOverrideFieldHtml(line)}
        ${accountingBudgetModePillHtml(line)}
        ${line.order_id ? `<button onclick="accountingViewOrder('${esc(line.order_id)}')" style="padding:5px 12px;border-radius:999px;border:1.5px solid var(--accent-dark);background:#fff;color:var(--accent-dark);font-size:11px;font-weight:600;cursor:pointer">View Order</button>` : ''}
        ${currentAccountingUser?.role === 'super' && !line.accounting_only ? `<button onclick="strategistPortalHandoffToLine('${esc(line.id)}')" style="padding:5px 12px;border-radius:999px;border:1.5px solid var(--accent-dark);background:#fff;color:var(--accent-dark);font-size:11px;font-weight:600;cursor:pointer">Open in Strategist Portal →</button>` : ''}
        <button class="acct-detail-close" onclick="accountingCloseDetailCard()">✕ Close</button>
      </div>
    </div>
    ${(() => {
      // Setup blocker(s) moved here from the main row's inline pills
      // (2026-08-12, per Claire) -- shown only for a pending line that
      // actually has one or more blockers set.
      const blockers = line.status === 'pending' && Array.isArray(line.setup_blocker)
        ? line.setup_blocker.filter(b => ACCT_SETUP_BLOCKER_LABELS[b]) : [];
      if (!blockers.length) return '';
      return `<div style="border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:12px;background:#FEF3C7">
        <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:#92400E;margin-bottom:4px">Pending — Waiting On</div>
        <div style="display:flex;gap:6px;flex-wrap:wrap">${blockers.map(b =>
          `<span class="acct-status-pill" style="background:#FDE68A;color:#92400E">${esc(ACCT_SETUP_BLOCKER_LABELS[b])}</span>`).join('')}</div>
      </div>`;
    })()}
    ${(line.campaign_notes || line.order_line_notes) ? `<div style="border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:12px;background:#FFFBEB">
      ${line.campaign_notes ? `<div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:#92400E;margin-bottom:2px">IO Campaign Notes</div><div style="font-size:12.5px;color:var(--text);margin-bottom:${line.order_line_notes ? '8px' : '0'}">${esc(line.campaign_notes)}</div>` : ''}
      ${line.order_line_notes ? `<div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:#92400E;margin-bottom:2px">Note on this line</div><div style="font-size:12.5px;color:var(--text)">${esc(line.order_line_notes)}</div>` : ''}
    </div>` : ''}
    <table>
      <thead><tr><th>Month</th><th class="num">Revenue</th><th class="num">44i Revenue</th><th class="num">Expected Spend</th><th class="num">Actual Spend</th><th>Status</th></tr></thead>
      <tbody>${months.map(m => {
          // Paused month's dollar figures gray out (2026-08-12, per Claire) --
          // inline style on the <td> itself, not the <tr>, since #page-accounting
          // tbody td{color:...} is more specific than a color inherited from a
          // styled ancestor <tr> and would otherwise win.
          const dollarStyle = (m.paused || !m.active) ? ' style="color:var(--muted)"' : '';
          // A month the line isn't even active in (2026-09-02, found live by
          // Claire: a one-time fee's Sep/Oct/Nov detail-card rows still all
          // showed an editable amount + a "Needs confirmation"/"Manually
          // confirm" checkbox, even after accountingLineActiveInMonth()
          // itself was fixed to exclude it from the main table -- this fixed
          // 3-month [0,1,2] view never checked that flag at the RENDER
          // level, only when computing which figures to show, so the row
          // stayed fully interactive regardless) renders as a plain, non-
          // editable "—" row with no status pill and no confirm checkbox at
          // all, instead of a blank-but-actionable one.
          if (!m.active) {
            return `<tr>
            <td${dollarStyle}><strong>${esc(m.label)}</strong></td>
            <td class="num"${dollarStyle}>—</td>
            <td class="num"${dollarStyle}>—</td>
            <td class="num"${dollarStyle}>—</td>
            <td class="num"${dollarStyle}>—</td>
            <td${dollarStyle}>—</td>
          </tr>`;
          }
          return `<tr>
          <td${dollarStyle}><strong>${esc(m.label)}</strong></td>
          <td class="num"${dollarStyle}>
            <div style="display:flex;align-items:center;justify-content:flex-end;gap:2px">
              <span>$</span>
              <input type="number" step="0.01" min="0" value="${m.gross ?? ''}" placeholder="0.00"
                onchange="accountingSaveMonth('${line.id}', '${m.monthStr}', {gross_budget: this.value})"
                aria-label="Gross Budget for ${esc(m.label)}"
                style="width:90px;padding:3px 5px;border-radius:5px;border:1px solid var(--border);font-size:12.5px;text-align:right;font-family:inherit;color:inherit;background:transparent"/>
            </div>
          </td>
          <td class="num"${dollarStyle}>${m.split.fortyfouri != null ? '$' + m.split.fortyfouri.toLocaleString(undefined,{minimumFractionDigits:2, maximumFractionDigits:2}) : '—'}</td>
          <td class="num"${dollarStyle}>${m.expectedSpend != null ? '$' + m.expectedSpend.toLocaleString(undefined,{minimumFractionDigits:2, maximumFractionDigits:2}) : '—'}</td>
          <td class="num"${dollarStyle}>${m.actualSpend != null ? '$' + m.actualSpend.toLocaleString(undefined,{minimumFractionDigits:2, maximumFractionDigits:2}) : '—'}</td>
          <td>
            <div style="display:flex;align-items:center;gap:8px">
              ${line.billed_externally ? accountingStatusPill('external', 'SSH Billing')
                : line.status === 'complete' ? accountingStatusPill('complete', 'Complete')
                : m.paused ? accountingStatusPill('paused', 'Paused')
                : (m.confirmed ? accountingStatusPill('confirmed', 'Confirmed') : accountingStatusPill('needs', 'Needs confirmation'))}
              ${!line.billed_externally && !m.paused ? `<label style="display:flex;align-items:center;gap:5px;font-size:10px;color:var(--muted);cursor:${m.actualSpend != null ? 'default' : 'pointer'};white-space:nowrap">
                <input type="checkbox" ${m.manuallyConfirmed ? 'checked' : ''} ${m.actualSpend != null ? 'disabled title="Already confirmed automatically -- real spend is entered for this month"' : ''} onchange="accountingConfirmMonth('${line.id}','${m.monthStr}', this.checked, ${m.gross != null ? m.gross : 'null'})"/> Manually confirm
              </label>` : ''}
            </div>
          </td>
        </tr>`;
        }).join('')}</tbody>
    </table>`;
}

async function accountingConfirmMonth(lineId, monthStr, confirmed, grossBudget) {

      p_name: currentAccountingUser.name, p_pw: currentAccountingUser.pw,

// Gross Budget, editable directly from the detail card (2026-08-25, per
// Claire -- correcting/backfilling a month's Gross Budget while importing
// the remaining accounting lines, without a full Bulk Import re-run for a
// one-off fix). Deliberately Gross Budget ONLY -- Claire: "Actual spend
// should always reference the platform uploads. We don't need to ever edit
// that." Reuses the same accounting_save_campaign_month RPC the Bulk Import
// flow already calls, just exposed here for a single existing month too.
async function accountingSaveMonth(lineId, monthStr, data) {
  try {
    const cleanData = Object.fromEntries(Object.entries(data).map(([k, v]) => [k, v === '' ? null : v]));
    await sb('rpc/accounting_save_campaign_month', { method: 'POST', body: JSON.stringify({
      p_name: currentAccountingUser.name, p_pw: currentAccountingUser.pw,
      p_campaign_line_id: lineId, p_month: monthStr, p_data: cleanData
    }) });
    await fetchAccountingData();
    renderAccountingDashboard();
  } catch(e) { showToast('Error saving: ' + e.message, 'error'); }
}

// ── "+ ADD SERVICE" MANUAL ADD (2026-08-11; extended 2026-08-12) ─────
// Mirrors the Strategist Portal's own "+ New Campaign" import, for a tactic
// Accounting knows is real (e.g. it's on the client's invoice) but Strategist
// never entered -- per Claire: "a way to manually add services, similar to
// the strategists for services that they don't track." The deliberate
// difference from Strategist's version (which defaults straight to Active):
// a SPEND-trackable tactic added here defaults to status='pending', so it
// lands in Strategist's existing Campaign Setup queue automatically -- that
// queue IS the "make sure Strategist knows about this" mechanism, nothing
// new to build there.
//
// 2026-08-12, per Claire ("I don't see all of the services... just the ones
// from the strategist portal"): the Tactic dropdown originally used the SAME
// spend-trackable-only filter as Strategist's own import form -- which made
// sense for the ORIGINAL "Strategist doesn't know about this yet" use case,
// but froze out every flat/recurring/one-time service (Website Hosting, a
// retainer, a one-time fee) -- exactly the category "track all ordered
// services" (same session) was built to cover. Now lists every active
// service; picking a non-spend-trackable one reveals a Billing choice
// (Recurring monthly / One-time fee) and creates the line the SAME way the
// order trigger does for one of those -- accounting_only=true, status=
// 'active', skipping Strategist's queue entirely, since there's no setup
// step for a flat hosting fee.
const ACCT_TRACKABLE_FLAT_SERVICE_IDS = ['llo-bp', 'rep-bp'];

// YouTube TV's own +$10 CPM modifier -- own copy of Strategist's
// ADDL_TARGETING_SERVICE_IDS (per this project's per-portal-copy
// convention), tracked the same way as Offline Visits Tracking (changes the
// CPM basis for accounting purposes, no charge to the client), but only ever
// relevant to this one tactic, unlike Offline Visits Tracking which spans
// many sections (2026-08-12, per Claire: "Youtube just has the Addl
// targeting").
const ACCT_ADDL_TARGETING_SERVICE_IDS = ['yttv-bp'];

function accountingIsSpendTrackable(serviceId) {
  const r = CATALOG_ROWS[serviceId];
  return !!r && (r.pricing_mode === 'spend' || ACCT_TRACKABLE_FLAT_SERVICE_IDS.includes(serviceId));
}
// The catalog's own services.billing_type already says whether a tactic is
// one-time or ongoing -- no need to ask again (2026-08-12, per Claire: "you
// shouldn't need to mark if it is a recurring or one time cost, it should
// already know that from the IO"). Maps the catalog's more granular values
// (monthly/yearly/annual/one_time/null) down to the two campaign_lines.
// billing_type actually stores here -- anything that isn't literally
// 'one_time' is 'recurring'.
function accountingDerivedBillingType(serviceId) {
  return CATALOG_ROWS[serviceId]?.billing_type === 'one_time' ? 'one_time' : 'recurring';
}
// The catalog's own default_price (or a group's own io_pricing override, same
// mechanism the public IO form itself uses -- see applyCustomPricing() in
// index.html) already says what a flat/recurring/one-time service costs --
// no need to manually type a Gross Budget for one either (2026-08-12, per
// Claire: "Shouldn't have to add the amount, it should take it from the
// services or group override" -- confirmed "same with monthly" when asked
// whether this applies to recurring too, not just one-time). Returns null if
// neither the group override nor the catalog has a real price (e.g. a QUR
// service with no default_price set) -- caller falls back to manual entry.
function accountingDerivedAmount(serviceId, clientId) {
  const client = clientId ? ALL_ACCOUNTING_CLIENTS.find(c => c.id === clientId) : null;
  // Client's own io_pricing (2026-08-20, Phase B) wins over its group's copy --
  // same client-beats-group precedence as everywhere else in this pass.
  if (client?.io_pricing?.[serviceId] != null) return Number(client.io_pricing[serviceId]);
  const pricing = client?.group_io_pricing;
  if (pricing && pricing[serviceId] != null) return Number(pricing[serviceId]);
  const base = CATALOG_ROWS[serviceId]?.default_price;
  return base != null ? Number(base) : null;
}

  const serviceId = document.getElementById('acct-add-service').value;

  billingWrap.style.display = serviceId && !trackable ? 'block' : 'none';
  // Flight End only makes sense for an ongoing/recurring service -- a
  // one-time fee is a single event with just one date, not a range.
  const isOneTime = serviceId && !trackable && accountingDerivedBillingType(serviceId) === 'one_time';
  document.getElementById('acct-add-flight-end-wrap').style.display = isOneTime ? 'none' : '';

  }
  helpText.textContent = serviceId && !trackable

    : 'This creates the campaign as "Campaign Setup" (Pending) in the Strategist Portal, same as any other new order -- Strategist fills in platform/tracking details from there. It will not show up as Active in Accounting until Strategist activates it.';

  const sortedClients = [...ALL_ACCOUNTING_CLIENTS].sort((a, b) => a.name.localeCompare(b.name));

async function accountingSubmitAddService() {
  const clientEl = document.getElementById('acct-add-client');
  const clientId = clientEl.value;
  const serviceId = document.getElementById('acct-add-service').value;
  if (!clientId || !serviceId) { showToast('Client and Tactic are both required.', 'error'); return; }
  const groupId = clientEl.selectedOptions[0]?.dataset.groupId || null;
  const flightStart = document.getElementById('acct-add-flight-start').value || null;
  const trackable = accountingIsSpendTrackable(serviceId);
  const data = {
    client_id: clientId, group_id: groupId || null, service_id: serviceId,
    tactic_label: CATALOG_ROWS[serviceId]?.accounting_label || CATALOG_ROWS[serviceId]?.label || serviceId,
    flight_start: flightStart,
    flight_end: document.getElementById('acct-add-flight-end').value || null,
    has_offline_visits: document.getElementById('acct-add-has-offline-visits').checked,
    has_addl_targeting: document.getElementById('acct-add-has-addl-targeting').checked,
    // Non-spend-trackable service (2026-08-12) -- same treatment the order
    // trigger already gives a flat/recurring/one-time item: accounting-only,
    // straight to active, no Strategist Setup step.
    accounting_only: !trackable,
    status: trackable ? undefined : 'active',
    billing_type: trackable ? 'spend' : accountingDerivedBillingType(serviceId),
  };
  if (trackable) {
    // Only a spend-tracked tactic still takes a manual amount -- its real
    // dollar figure varies per client/CPM, nothing in the catalog to derive.
    const grossBudget = document.getElementById('acct-add-gross-budget').value;
    if (grossBudget) {
      data.initial_gross_budget = parseFloat(grossBudget);
      data.initial_month = new Date().toISOString().slice(0, 10);
    }
  } else {
    // Flat/recurring/one-time: amount comes from the catalog (or the
    // client's group override) automatically -- no manual entry (2026-08-12,
    // per Claire). Seeded against Flight Start (the date it's billed for a
    // one-time fee; the first month for a recurring one) rather than always
    // "today", so a service added to record a past charge lands correctly.
    const derived = accountingDerivedAmount(serviceId, clientId);
    if (derived != null) {
      data.initial_gross_budget = derived;
      data.initial_month = flightStart || new Date().toISOString().slice(0, 10);
    }
  }
  try {
    await sb('rpc/accounting_add_campaign_line', { method: 'POST', body: JSON.stringify({
      p_name: currentAccountingUser.name, p_pw: currentAccountingUser.pw, p_data: data
    }) });
    document.getElementById('accounting-add-service-form').style.display = 'none';
    document.getElementById('accounting-add-service-form').innerHTML = '';
    await fetchAccountingData();
    renderAccountingDashboard();
    showToast(trackable ? 'Service added -- now sitting in Strategist\'s Campaign Setup queue.' : 'Service added to Accounting.');
  } catch(e) { showToast('Error adding service: ' + e.message, 'error'); }
}

// ── BULK MATCH (2026-08-11) ──────────────────────────────────────
// Claire: "a way to verify what may be missing from one portal or the
// other" -- without pasting real client data into chat, this runs entirely
// in her own browser against data already loaded here. Paste one
// Client<TAB>Tactic pair per line (same tab-separated convention as
// Strategist's own "Paste Platform Report" tool) and every row is matched
// against ALL_ACCOUNTING_LINES/ALL_ACCOUNTING_CLIENTS already in memory --
// nothing pasted here ever leaves this page.
function accountingOpenBulkMatchForm() {
  const el = document.getElementById('accounting-bulk-match-form');
  const isOpen = el.style.display !== 'none';
  if (isOpen) { el.style.display = 'none'; el.innerHTML = ''; return; }
  accountingCloseOtherForms('accounting-bulk-match-form');

  el.style.display = 'block';
  el.innerHTML = `<div style="border:1px solid var(--accent);border-radius:10px;padding:16px 18px;background:#F0F9FF">

    <textarea id="acct-bulk-match-input" rows="6" placeholder="Tassel Ridge Winery&#9;FB/IG Ads&#9;750&#10;Fisher &amp; Son Roofing&#9;Website" style="width:100%;padding:8px;border-radius:6px;border:1px solid var(--border);font-size:12px;font-family:monospace;margin-bottom:10px"></textarea>

      <button onclick="accountingOpenBulkMatchForm()" class="btn-quiet-green">Cancel</button>
    </div>
    <div id="acct-bulk-match-results"></div>
  </div>`;
}

function accountingRunBulkMatch() {
  const raw = document.getElementById('acct-bulk-match-input').value;
  const rows = raw.split('\n').map(l => l.trim()).filter(Boolean).map(l => {
    const parts = l.includes('\t') ? l.split('\t') : l.split(',');
    const grossText = (parts[2] || '').trim();
    return { clientText: (parts[0] || '').trim(), tacticText: (parts[1] || '').trim(), grossText };
  });
  const norm = s => (s || '').trim().toLowerCase();

  const resultsHtml = rows.map(row => {
    const client = ALL_ACCOUNTING_CLIENTS.find(c => norm(c.name) === norm(row.clientText));
    const lineMatch = client && ALL_ACCOUNTING_LINES.find(l =>

      : accountingResolveBulkTactic(tacticName);
    if (!client) { errors.push({ rowNum, field: 'client', clientName, tacticName }); return; }
    if (!tacticMatch) { errors.push({ rowNum, field: 'tactic', clientName, tacticName }); return; }
    // Optional "Campaign" column: names the sub-campaign (the line's split_label). A row WITH a campaign name only ever
    // joins a line of that same name -- if there isn't one it becomes a NEW campaign, never an extension of another.
    const campaignName = get('campaign');

    // Lines already in the system for this client + service + label (from the IO flow, Strategist, an earlier import).
    let existingMatches = ALL_ACCOUNTING_LINES.filter(l => l.client_id === client.id && l.service_id === tacticMatch.service.id && l.tactic_label === tacticMatch.tacticLabel && (!campaignName || norm(l.split_label) === norm(campaignName)));
    const candidatesAll = ALL_ACCOUNTING_LINES.filter(l => l.client_id === client.id && l.service_id === tacticMatch.service.id && l.tactic_label === tacticMatch.tacticLabel); // every line for this client+service, for the "add to an existing line instead" choice
    let candidates = existingMatches; // kept for the "which line?" picker
    // Which existing line is this row for? (1) a line she picked in the preview; (2) the campaign name; (3) the flight dates:
    // a row only joins a line whose flight overlaps its own dates, and a row that overlaps none is a NEW campaign, never an
    // extension (2026-10-07, per Claire: separate campaigns for the same client/service are common in the legacy sheet).
    let matchedBy = null, newReason = null;
    const pickedLine = overrides[rowNum]?.lineId ? ALL_ACCOUNTING_LINES.find(l => l.id === overrides[rowNum].lineId && l.client_id === client.id) : null;
    if (pickedLine) { existingMatches = [pickedLine]; matchedBy = 'picked'; }
    else if (campaignName) { if (!existingMatches.length) newReason = 'named'; }
    else if (existingMatches.length && wide) {
      const sStart = inferred ? inferred.start : accountingNormalizeFlightDate(get('flight_start'), 'start'), sEnd = inferred ? inferred.end : accountingNormalizeFlightDate(get('flight_end'), 'end');
      if (sStart) {
        const lo = v => v ? String(v).slice(0, 10) : '0000-01-01', hi = v => v ? String(v).slice(0, 10) : '9999-12-31';
        const overlapping = existingMatches.filter(l => lo(l.flight_start) <= hi(sEnd || '') && hi(l.flight_end) >= sStart);
        if (!overlapping.length) { newReason = 'dates'; existingMatches = []; }
        else if (overlapping.length === 1) { if (existingMatches.length > 1) matchedBy = 'dates'; existingMatches = overlapping; }
        else {
          const mStart = !!inferred || accountingNormalizeDate(get('flight_start')) === null, mEnd = !!inferred || accountingNormalizeDate(get('flight_end')) === null; // sheet gave months only (or none: inferred from months)
          const cmp = (a, b, monthOnly) => monthOnly ? String(a || '').slice(0, 7) === String(b || '').slice(0, 7) : String(a || '').slice(0, 10) === String(b || '').slice(0, 10);
          const exact = overlapping.filter(l => cmp(l.flight_start, sStart, mStart) && (sEnd ? cmp(l.flight_end, sEnd, mEnd) : !l.flight_end));
          if (exact.length === 1) { existingMatches = exact; matchedBy = 'dates'; } else { existingMatches = overlapping; candidates = overlapping; }
        }
      }
    }
    if (existingMatches.length > 1) { errors.push({ rowNum, field: 'ambiguous', clientName, tacticName, candidates: candidates.map(l => ({ id: l.id, status: l.status || 'active', flight_start: l.flight_start, flight_end: l.flight_end, accounting_only: !!l.accounting_only, split_label: l.split_label || '', campaign_name: l.platform_campaign_name || '' })), detail: `${existingMatches.length} lines already match this client and service (for example different agents or counties) -- the import can't tell which one this row is for` }); return; }
    if (ALL_ACCOUNTING_LINES.some(l => l.client_id === client.id && l.agent_name)) { errors.push({ rowNum, field: 'agent', clientName, tacticName, detail: `this client uses Agent/County Split lines and the import can't tell agents apart -- leave this client out and add its lines another way` }); return; }
    const existingLine = existingMatches[0] || null;
    // One group per line it joins; rows that become separate NEW campaigns are told apart by name or by their own dates.
    const identityKey = `${client.id}|${tacticMatch.service.id}|${tacticMatch.tacticLabel}|${norm(campaignName)}|` + (existingLine ? 'L' + existingLine.id : (newReason === 'dates' ? 'D' + (inferred ? inferred.start + '>' + inferred.end : accountingNormalizeFlightDate(get('flight_start'), 'start') + '>' + accountingNormalizeFlightDate(get('flight_end'), 'end')) : ''));

    let flightStart = get('flight_start') || null, flightEnd = get('flight_end') || null;
    let wideMonths = null, clientPrice = null, monthOnlyDates = false; const flags = [];
    let rowCut = null, rowExpected = null; // the system's 44i cut % and expected monthly 44i Revenue (for the download)
    if (wide) {
      const startISO = inferred ? inferred.start : accountingNormalizeFlightDate(get('flight_start'), 'start'), endISO = inferred ? inferred.end : accountingNormalizeFlightDate(get('flight_end'), 'end');
      monthOnlyDates = (startISO && accountingNormalizeDate(get('flight_start')) === null) || (endISO && accountingNormalizeDate(get('flight_end')) === null);
      if (startISO === null || endISO === null) { errors.push({ rowNum, field: 'dates', clientName, tacticName, detail: `a date isn't readable (start "${get('flight_start')}", end "${get('flight_end')}")` }); return; }
      if (startISO && endISO && endISO < startISO) { errors.push({ rowNum, field: 'dates', clientName, tacticName, detail: `the end date (${endISO}) is before the start date (${startISO}) -- check the year` }); return; }
      flightStart = startISO || null; flightEnd = endISO || null;
      clientPrice = accountingParseMoney(get('client_price'));
      if (Number.isNaN(clientPrice)) { errors.push({ rowNum, field: 'amount', clientName, tacticName, detail: `the client price "${get('client_price')}" isn't a number` }); return; }
      const fortyfouriMonthly = accountingParseMoney(get('fortyfouri_revenue'));
      if (Number.isNaN(fortyfouriMonthly)) { errors.push({ rowNum, field: 'amount', clientName, tacticName, detail: `the 44i Revenue "${get('fortyfouri_revenue')}" isn't a number` }); return; }
      wideMonths = [];
      for (const { idx, ym } of monthCols) {
        if (cutoff && ym < cutoff) continue;
        const amt = accountingParseMoney(cols[idx]);
        if (Number.isNaN(amt)) { errors.push({ rowNum, field: 'amount', clientName, tacticName, detail: `the ${ym} amount "${cols[idx]}" isn't a number` }); return; }
        if (amt === null) continue;
        // With a client-price column the month cells are 44i Revenue and the line's Gross Budget is the client price;
        // without one, the month cells are taken as Gross (and the row says so).
        wideMonths.push({ month: ym + '-01', grossBudget: clientPrice !== null ? clientPrice : amt, sheet44i: clientPrice !== null ? amt : null });
      }
      if (!wideMonths.length) { skipped.push({ rowNum, clientName, tacticName }); return; }
      const mk = m => m.month.slice(0, 7);
      const money = n => '$' + Number(n).toLocaleString(undefined, { maximumFractionDigits: 2 });
      if (clientPrice === null) flags.push({ kind: 'noprice', text: 'no client price (Total Revenue) on this row -- the month amounts are being imported as the Gross Budget (client price). If they are 44i Revenue, add the client price.' });
      if (clientPrice !== null) {
        // The system works 44i Revenue out as Gross x 44i cut %. Compare that with the sheet's 44i Revenue for each month.
        const cut = accountingEffectiveCutPct(tacticMatch.service.id, client.id, client.group_id, !!(tacticMatch.visits || /^(true|yes|1)$/i.test(get('has_offline_visits')) || /^(true|yes|1)$/i.test(get('has_addl_targeting'))), clientPrice, existingLine ? existingLine.cut_pct_override : null);
        rowCut = cut; if (cut != null) rowExpected = Math.round(clientPrice * cut) / 100;
        if (cut == null) flags.push({ kind: 'nocut', text: `no 44i cut % is set for this service${client.group_name ? ' in ' + client.group_name : ''}, so the sheet's 44i Revenue can't be checked` });
        else {
          const expected = Math.round(clientPrice * cut) / 100;
          const bad = wideMonths.filter(m => Math.abs(m.sheet44i - expected) > 0.01);
          if (bad.length) {
            const list = bad.slice(0, 6).map(m => `${mk(m)} ${money(m.sheet44i)}`).join(', ') + (bad.length > 6 ? `, +${bad.length - 6} more` : '');
            flags.push({ kind: 'mismatch', text: `44i Revenue doesn't match the system for ${bad.length} of ${wideMonths.length} month(s): sheet says ${list}; the system would give ${money(expected)} (${money(clientPrice)} × ${cut}% 44i cut)` });
          }
        }
        if (fortyfouriMonthly !== null) {
          const off = wideMonths.filter(m => Math.abs(m.sheet44i - fortyfouriMonthly) > 0.005);
          if (off.length) flags.push({ kind: 'differs', text: `${off.length} month(s) differ from the row's 44i Revenue (${money(fortyfouriMonthly)}): ` + off.slice(0, 6).map(m => `${mk(m)} ${money(m.sheet44i)}`).join(', ') + (off.length > 6 ? `, +${off.length - 6} more` : '') });
        }
      }
      if (flightStart) { const out = wideMonths.filter(m => mk(m) < flightStart.slice(0, 7)); if (out.length) flags.push({ kind: 'outside', text: `amount(s) before the start date: ${out.map(mk).join(', ')}` }); }
      if (flightEnd) {
        const out = wideMonths.filter(m => mk(m) > flightEnd.slice(0, 7)); if (out.length) flags.push({ kind: 'outside', text: `amount(s) after the end date: ${out.map(mk).join(', ')}` });
        const have = new Set(wideMonths.map(mk)); const gaps = [];
        let cur = [cutoff, (flightStart || '').slice(0, 7)].filter(Boolean).sort().pop() || wideMonths.map(mk).sort()[0];
        const last = flightEnd.slice(0, 7);
        while (cur && cur <= last && gaps.length < 24) { if (!have.has(cur)) gaps.push(cur); const [y, mo] = cur.split('-').map(Number); cur = mo === 12 ? `${y + 1}-01` : `${y}-${String(mo + 1).padStart(2, '0')}`; }
        if (gaps.length) flags.push({ kind: 'gap', text: `no amount for: ${gaps.join(', ')}` });
      }
    }
    if (wide) wideMonths.forEach(m => { m.system44i = rowExpected; });
    // Date discrepancies (2026-10-07, per Claire). The import never changes an existing line's dates, so say exactly where the
    // sheet and the system disagree, and whether the months being added land outside the line's own flight.
    if (existingLine) {
      const d10 = v => v ? String(v).slice(0, 10) : '';
      const datesWereInferred = !!inferred;
      const aS = d10(existingLine.flight_start), aE = d10(existingLine.flight_end);
      const startMonthOnly = !!flightStart && accountingNormalizeDate(get('flight_start')) === null, endMonthOnly = !!flightEnd && accountingNormalizeDate(get('flight_end')) === null;
      const startDiff = !!(flightStart && aS && (startMonthOnly ? flightStart.slice(0, 7) !== aS.slice(0, 7) : flightStart !== aS));
      const endDiff = endMonthOnly ? (aE ? flightEnd.slice(0, 7) !== aE.slice(0, 7) : true) : ((flightEnd || '') !== aE && !(!flightEnd && !aE));
      const shown = (v, monthOnly) => v ? (monthOnly ? v.slice(0, 7) : v) : '';
      if (!datesWereInferred && (startDiff || (aS && endDiff))) flags.push({ kind: 'dates-kept', text: `DATES DIFFER: the sheet says ${shown(flightStart, startMonthOnly) || 'no start'} – ${shown(flightEnd, endMonthOnly) || 'no end'}, the existing line is ${aS || 'no start'} – ${aE || 'ongoing'}${startMonthOnly || endMonthOnly ? ' (compared by month, since the sheet only gives months)' : ''}. The import adds months but does NOT change the line's dates.` });
      if (wide && wideMonths) {
        const ym = v => v.slice(0, 7), mkk = m => m.month.slice(0, 7);
        const before = aS ? wideMonths.filter(m => mkk(m) < ym(aS)) : [], after = aE ? wideMonths.filter(m => mkk(m) > ym(aE)) : [];
        if (before.length) flags.push({ kind: 'line-outside', text: `DATES: month(s) ${before.map(mkk).join(', ')} are BEFORE the existing line starts (${aS}).` });
        if (after.length) flags.push({ kind: 'line-outside', text: `DATES: month(s) ${after.map(mkk).join(', ')} are AFTER the existing line ends (${aE}). Extend the line's flight in Strategist if the campaign continues.` });
      }
      if (['complete', 'cancelled', 'paused'].includes(existingLine.status)) flags.push({ kind: 'line-status', text: `DATES: the existing line is ${existingLine.status} (${aS || '?'} – ${aE || 'ongoing'}) but is being given months from ${wide && wideMonths && wideMonths.length ? wideMonths.map(m => m.month.slice(0, 7)).sort()[0] : 'the sheet'} on.` });
    }
    const sheetVisits = !!tacticMatch.visits || /^(true|yes|1)$/i.test(get('has_offline_visits'));
    if (existingLine && !!existingLine.has_offline_visits !== sheetVisits) flags.push({ kind: 'visits-differs', text: `the sheet says ${sheetVisits ? 'WITH' : 'WITHOUT'} Offline Visits but the existing line is ${existingLine.has_offline_visits ? 'WITH' : 'WITHOUT'} -- the import adds months but does NOT change that setting` });
    if (groupName && client.group_name && norm(client.group_name) !== norm(groupName)) flags.push({ kind: 'group', text: `the sheet says group "${groupName}" but this client is in "${client.group_name}"` });

    if (!groups.has(identityKey)) {
      // Does this Client+Tactic already exist -- from Strategist's own
      // order flow, an earlier Accounting Add Service, or a prior Bulk
      // Import -- ALL_ACCOUNTING_LINES covers every source (2026-08-12,
      // per Claire: "will it know if something is already in the
      // strategist portal?"). If so, this group ADDS its pasted months
      // to that SAME line instead of creating a duplicate one.
      groups.set(identityKey, {
        client, service: tacticMatch.service, tacticLabel: tacticMatch.tacticLabel,
        flightStart, flightEnd,
        hasOfflineVisits: !!tacticMatch.visits || /^(true|yes|1)$/i.test(get('has_offline_visits')),
        hasAddlTargeting: /^(true|yes|1)$/i.test(get('has_addl_targeting')),
        billingType: get('billing_type').toLowerCase() || null,
        existingLineId: existingLine ? existingLine.id : null, campaignName, matchedBy, newReason, monthOnlyDates, datesInferred: !!inferred,
        altLines: (!existingLine && newReason) || matchedBy === 'dates' ? candidatesAll.map(l => ({ id: l.id, status: l.status || 'active', flight_start: l.flight_start, flight_end: l.flight_end, split_label: l.split_label || '' })) : [],
        clientPrice, cutPct: rowCut, sheetGroup: groupName, sheetClient: clientName, sheetTactic: tacticName, flags, rowNums: [rowNum],
        existingStatus: existingLine ? (existingLine.status || 'active') : null, existingAccountingOnly: existingLine ? !!existingLine.accounting_only : null,
        months: [],

    } else if (wide) {
      const g0 = groups.get(identityKey); g0.rowNums.push(rowNum);
      g0.flags.push({ kind: 'duplicate', text: `row ${rowNum} is the same client and service as row ${g0.rowNums[0]} -- where both have a month, row ${rowNum} wins` });
      g0.flags.push(...flags);
    }
    if (wide) {
      const g = groups.get(identityKey);
      wideMonths.forEach(m => { const at = g.months.findIndex(x => x.month === m.month); if (at === -1) g.months.push(m); else g.months[at] = m; });
      return;
    }
    const monthRaw = get('month'); // YYYY-MM
    const grossBudgetRaw = get('gross_budget');
    if (monthRaw) {
      groups.get(identityKey).months.push({
        month: /^\d{4}-\d{2}$/.test(monthRaw) ? monthRaw + '-01' : monthRaw,
        grossBudget: grossBudgetRaw ? parseFloat(grossBudgetRaw.replace(/[$,]/g, '')) : null,
      });
    }
  });
  // For a line that already exists, which of its saved month amounts would this import CHANGE?
  groups.forEach(g => {
    g.changes = [];
    if (!g.existingLineId) return;
    g.months.forEach(m => {
      if (m.grossBudget == null) return;
      const ex = ALL_ACCOUNTING_MONTHS.find(x => x.campaign_line_id === g.existingLineId && String(x.month).slice(0, 7) === m.month.slice(0, 7));
      if (ex && ex.gross_budget != null && Math.abs(Number(ex.gross_budget) - m.grossBudget) > 0.005) g.changes.push({ month: m.month, from: Number(ex.gross_budget), to: m.grossBudget });
      if (ex && (ex.actual_spend != null || ex.confirmed_by)) g.flags.push({ kind: 'confirmed', text: `${m.month.slice(0, 7)} already has actual spend or a confirmation on the existing line` });

  });

  const keyAt = {}; Object.entries(colIndex).forEach(([k, i]) => { keyAt[i] = k; });

}
