// Builds one row per (client, tactic) -- rolling multiple campaign_lines that
// share the same client+service+tactic into ONE row (a real scenario: a
// client splits one IO tactic across several regions, each tracked as its
// own campaign_line in the Strategist Portal via split_label, per the
// "Split into Multiple Campaigns" feature). A group of 1 renders plain; a
// group of >1 renders as an expandable rollup, aggregate first.
// Same rule as the Strategist Portal's own strategistLineActiveInMonth --
// is the currently-viewed month even within this line's flight at all.
// REAL bug found live (2026-08-12, right after the flat-budget carry-
// forward fix above): Accounting never had this check, and used to get
// away without one because a line's real campaign_months rows simply ran
// out once its flight ended -- once carry-forward started covering
// ORDINARY flat campaigns too, a line with no month row past its own
// flight_end kept showing up anyway (the carried Gross Budget doesn't know
// or care whether the flight's actually over). This is a separate
// visibility check from accountingMonthRowFor's own budget math, same
// separation Strategist's own architecture already has -- a line outside
// its flight for this month is excluded here, full stop, regardless of
// what accountingMonthRowFor would have computed for it.
function accountingCancelledTag(line) {
  if (line.status !== 'cancelled') return '';
  const cx = line.cancel_effective_date ? new Date(String(line.cancel_effective_date).slice(0, 10) + 'T00:00:00').toLocaleDateString('en-US', { month: 'numeric', day: 'numeric', year: '2-digit' }) : null;
  return ` <span title="${cx ? 'Cancelled effective ' + cx + '. Later months no longer show.' : 'Cancelled, but no effective date was recorded, so every month still shows. Set a cancel date in Admin.'}" style="font-size:10px;font-weight:700;color:#B91C1C;background:#FEE2E2;border-radius:4px;padding:0 5px">Cancelled${cx ? ' ' + cx : ' (no date)'}</span>`;
}
// A line cancelled BEFORE it ever launched bills nothing in any month (2026-10-08, per Claire -- Armageddon Arsenal Supply:
// YouTube TV ordered 9/25, still pending, cancelled 10/1 and replaced by Streaming TV; the cancelled line kept showing $1,650).
// "Never launched" = cancelled AND no platform was ever set on it AND no month has real actual spend or a manual confirmation.
// Billed-externally and accounting-only lines are excluded on purpose: they never carry platform data or automatic spend, so
// "nothing recorded" would not mean "never ran" for them.
function accountingCancelledNeverLaunched(line) {
  if (line.status !== 'cancelled' || line.platform || line.billed_externally || line.accounting_only) return false;
  return !ALL_ACCOUNTING_MONTHS.some(m => m.campaign_line_id === line.id && (m.actual_spend != null || m.confirmed_by));
}
function accountingLineActiveInMonth(line, monthDate) {
  const monthKey = accountingMonthKey(monthDate);
  if (accountingCancelledNeverLaunched(line)) return false;
  // Cancelled lines (2026-10-08, per Claire -- RWS Tree Service / State Farm: a cancelled line kept showing and counting).
  // Months AFTER the month of the cancel effective date no longer show or count, and a line cancelled before it ever started
  // shows nowhere. The cancel month itself still shows in full -- how a mid-month cancel should be billed (full month, prorated,
  // none) is Kim's call and not decided yet. A cancelled line with NO effective date keeps its old behaviour (and gets a tag).
  if (line.status === 'cancelled' && line.cancel_effective_date) {
    const cx = String(line.cancel_effective_date).slice(0, 10);
    if (line.flight_start && cx < String(line.flight_start).slice(0, 10)) return false;
    if (monthKey > accountingMonthKey(new Date(cx + 'T00:00:00'))) return false;
  }
  if (line.flight_start && monthKey < accountingMonthKey(new Date(line.flight_start + 'T00:00:00'))) return false;
  // A one-time fee (ACCOUNTING_ONE_TIME_BILLING_TYPES, defined above
  // alongside accountingMonthRowFor() -- reused here too) only ever
  // happened in the single month it was billed. It
  // typically has no real flight_end (nothing ongoing to bound), which
  // previously let this function treat it as "active" every month forever
  // after, so the table kept showing a stray $0.00 "Needs confirmation" row
  // long after the one month it actually billed in (2026-09-02, found live
  // by Claire: "one time costs look like they are ongoing in the accounting
  // portal"). Bounded to its own flight_start month specifically -- the
  // same "only the one month it was billed" rule accountingMonthRowFor()'s
  // carry-forward exclusion already applies to these same billing types.
  if (ACCOUNTING_ONE_TIME_BILLING_TYPES.includes(line.billing_type)) {
    return !line.flight_start || monthKey === accountingMonthKey(new Date(line.flight_start + 'T00:00:00'));
  }
  if (line.flight_end && monthKey > accountingMonthKey(new Date(line.flight_end + 'T00:00:00'))) return false;
  return true;
}
// LLO (SEO) and Rep Monitoring (SEO) aren't their own billed service -- they're
// auto-created by create_campaign_lines_from_order() (2026-08-10) purely so
// Strategist can pace them separately, anchored to a placeholder seo-bp
// service_id with no real pricing/budget of their own. Claire, 2026-08-12:
// they sit within the parent SEO service, not their own accounting line, so
// they shouldn't show in Accounting at all -- only the parent SEO tactic's
// own line (a real catalog row with a real budget) belongs here. Same literal
// tactic_label strings as Strategist's own SEO_TRACKING_ONLY_TACTICS, kept as
// its own copy per this project's "each portal keeps its own copy" convention
// (no shared constant file between the two portals).
const ACCOUNTING_EXCLUDED_TACTIC_LABELS = ['LLO (SEO)', 'Rep Monitoring (SEO)'];
function accountingBuildRows() {
  const filtered = ALL_ACCOUNTING_LINES.filter(l => {
    if (ACCOUNTING_EXCLUDED_TACTIC_LABELS.includes(l.tactic_label)) return false;
    if (accountingGroupFilter && l.group_name !== accountingGroupFilter) return false;
    if (!accountingLineActiveInMonth(l, accountingCurrentMonth)) return false;
    return true;
  });

  const monthStr = accountingMonthKey(accountingCurrentMonth) + '-01';
  const perLine = filtered.map(l => {
    const monthRow = accountingMonthRowFor(l.id, accountingCurrentMonth);
    const gross = monthRow?.gross_budget != null ? Number(monthRow.gross_budget) : null;
    const actualSpend = monthRow?.actual_spend != null ? Number(monthRow.actual_spend) : null;
    const cutPct = l.billing_type === 'setup_fee'
      ? accountingEffectiveSetupFeeCutPct(l.service_id, l.client_id, l.group_id)
      : accountingEffectiveCutPct(l.service_id, l.client_id, l.group_id, l.has_offline_visits || l.has_addl_targeting, gross, l.cut_pct_override);
    const expectedSpend = accountingComputeExpectedSpend(gross, l.service_id, l.client_id, l.group_id, monthRow?.in_platform_override, l.has_offline_visits || l.has_addl_targeting, l.retail_cpm_override, cutPct);
    const split = accountingSplitRevenue(gross, cutPct);
    // Confirmed = real actual-spend entered for the month (automatic), OR a
    // manual confirm from the detail card (for tactics the Strategist Portal
    // never tracks actuals for at all -- 2026-08-11, Claire). No checkbox in
    // the main table either way -- this is just the resolved boolean.
    const confirmed = actualSpend != null || !!monthRow?.confirmed_by;
    // Real gap found live (2026-09-10, per Claire -- a line whose overall
    // Strategist status was "Complete" (client cancelled) still showed as
    // "Paused" here, since this only ever checked the CURRENT month's own
    // paused checkbox, never the line's own top-level status at all. Also
    // true in reverse: a line switched to the top-level "Paused" status
    // never actually flips any month's paused flag (strategistConfirmStatusChange()
    // only ever writes campaign_lines.status), so it could show as
    // Confirmed/Needs Confirmation instead of Paused unless someone also
    // manually checked each month's box. Folding both top-level statuses in
    // here (rather than only in the pill functions) keeps
    // accountingRowIsPaused()'s own stated invariant intact -- whatever's
    // excluded from the stat tiles as "paused" is exactly what's LABELED
    // paused, and a permanently completed line should be excluded there too.
    // isComplete is tracked separately so the PILL can still say "Complete"
    // specifically instead of being folded into the same "Paused" label.
    const paused = !!monthRow?.paused || l.status === 'paused' || l.status === 'complete';
    const isComplete = l.status === 'complete';
    // Flags anything that showed up in a month AFTER it was already marked
    // billed (2026-09-18, per Claire's accountant -- see ACCOUNTING_CLOSED_MONTHS'
    // own comment). addedAfterBilling covers a whole new campaign line
    // (campaign_lines.created_at, already tracked/used elsewhere in this
    // app); changedAfterBilling covers an edit to an EXISTING month's own
    // numbers (campaign_months.updated_at, a new column + trigger added
    // alongside this feature). Both need those two source RPCs
    // (accounting_get_campaign_lines/_campaign_months) to actually select
    // the timestamp columns -- until that's done, l.created_at/monthRow
    // .updated_at simply come back undefined and this never fires, rather
    // than throwing.
    const closedInfo = accountingClosedMonthInfo(accountingCurrentMonth);
    let addedAfterBilling = false, changedAfterBilling = false;
    if (closedInfo) {
      const closedAt = new Date(closedInfo.closed_at);
      if (l.created_at && new Date(l.created_at) > closedAt) addedAfterBilling = true;
      else if (monthRow?.updated_at && new Date(monthRow.updated_at) > closedAt) changedAfterBilling = true;
    }
    return { line: l, gross, actualSpend, expectedSpend, cutPct, split, monthStr, confirmed, paused, isComplete, addedAfterBilling, changedAfterBilling };
  }).filter(r => r.gross != null || r.line.status === 'pending');
  // A pending campaign still shows as a line item for every month in its
  // own flight (2026-08-12, per Claire: "I would like there to be line
  // items for the pending campaigns in whatever months are in their
  // flight") even with no Gross Budget entered yet -- Strategist hasn't
  // set it up, so there's often nothing to show numerically, but the ROW
  // itself (with its own "Pending -- blocked on X" status) shouldn't be
  // invisible just because the number is missing. Every other status
  // still requires a real Gross Budget row -- nothing to show otherwise.

  const groups = new Map();
  perLine.forEach(r => {
    const key = `${r.line.client_id}|${r.line.service_id}|${r.line.tactic_label}`;
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(r);
  });

  const rows = [...groups.entries()].map(([key, children]) => {
    if (children.length === 1) return { key, isRollup: false, ...children[0] };
    const gross = children.reduce((s, c) => s + (c.gross || 0), 0);
    const spends = children.map(c => c.actualSpend).filter(v => v != null);
    const actualSpend = spends.length ? spends.reduce((s, v) => s + v, 0) : null;
    const expected = children.map(c => c.expectedSpend).filter(v => v != null);
    const expectedSpend = expected.length ? expected.reduce((s, v) => s + v, 0) : null;
    const allHaveRate = children.every(c => c.split.fortyfouri != null);
    const fortyfouri = allHaveRate ? children.reduce((s, c) => s + c.split.fortyfouri, 0) : null;
    const groupShare = allHaveRate ? children.reduce((s, c) => s + c.split.group, 0) : null;
    const starts = children.map(c => c.line.flight_start).filter(Boolean).sort();
    // Ongoing (no end date) on ANY child means the rollup as a whole is still
    // ongoing -- at least one region hasn't wrapped up yet.
    const anyOngoing = children.some(c => !c.line.flight_end);
    const ends = children.map(c => c.line.flight_end).filter(Boolean).sort();
    const confirmedCount = children.filter(c => c.confirmed).length;
    return {
      key, isRollup: true, children, line: children[0].line, gross, actualSpend, expectedSpend,
      split: { fortyfouri, group: groupShare },
      flightStart: starts[0] || null, flightEnd: anyOngoing ? null : (ends[ends.length - 1] || null),
      confirmedCount, totalCount: children.length,
    };
  });

  return rows.sort((a, b) => (a.line.client_name || '').localeCompare(b.line.client_name || ''));
}

// Column order matches Claire's spec exactly (2026-08-11): Client, Tactic,
// Flight, Revenue, 44i Revenue, Expected Spend, Actual Spend, Status. 44i Cut
// % and Group's $ (YDA) were dropped as their own columns per that same ask
// -- the cut % is still used internally to compute 44i Revenue, just no
// longer shown as its own column.
function accountingRenderRow(r) {
  if (r.isRollup) {
    const expanded = ACCOUNTING_EXPANDED_SPLITS.has(r.key);
    // Same paused-dollar-graying treatment as the plain-row branch below —
    // a rollup only counts as paused all-or-nothing (accountingRowIsPaused),
    // same rule its own status pill already uses.
    const dollarStyle = accountingRowIsPaused(r) ? ' style="color:var(--muted)"' : '';
    let html = `<tr class="acct-row" onclick="accountingToggleSplit('${r.key}')" role="button" tabindex="0" aria-expanded="${expanded}" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();accountingToggleSplit('${r.key}')}">
      <td><strong>${esc(r.line.client_name || '(unknown)')}</strong></td>
      <td><span style="display:inline-block;width:14px;color:var(--muted)">${expanded ? '▾' : '▸'}</span>${esc(r.line.tactic_label || r.line.service_id || '—')} <span style="color:var(--muted);font-size:10px">(${r.totalCount} regions)</span>${r.children.some(c => c.line.retail_cpm_override != null) ? ' <span title="At least one region below has its own Retail CPM override" style="display:inline-block;padding:1px 6px;margin-left:2px;border-radius:999px;background:var(--light);border:1px solid var(--accent);color:var(--accent-dark);font-size:9.5px;font-weight:700;vertical-align:middle;white-space:nowrap">CPM override(s) below</span>' : ''}${accountingAfterBillingBadgeHtml({ addedAfterBilling: r.children.some(c => c.addedAfterBilling), changedAfterBilling: r.children.some(c => c.changedAfterBilling) })}</td>
      <td>${accountingFormatFlightRange(r.flightStart, r.flightEnd)}</td>
      <td class="num"${dollarStyle}>$${r.gross.toLocaleString(undefined,{minimumFractionDigits:2, maximumFractionDigits:2})}</td>
      <td class="num"${dollarStyle}>${r.split.fortyfouri != null ? '$' + r.split.fortyfouri.toLocaleString(undefined,{minimumFractionDigits:2, maximumFractionDigits:2}) : '—'}</td>
      <td class="num"${dollarStyle}>${r.expectedSpend != null ? '$' + r.expectedSpend.toLocaleString(undefined,{minimumFractionDigits:2, maximumFractionDigits:2}) : '—'}</td>
      <td class="num"${dollarStyle}>${r.actualSpend != null ? '$' + r.actualSpend.toLocaleString(undefined,{minimumFractionDigits:2, maximumFractionDigits:2}) : '—'}</td>
      <td>${accountingRollupStatusPill(r)}</td>
    </tr>`;
    if (expanded) {
      // Region rows tint with the group's own brand color, same "mix toward
      // white" treatment as the stat tiles use, instead of a flat gray
      // (2026-08-11, per Claire) -- falls back to the same flat gray when
      // the group has no brand_color set, via the CSS var's own default.
      const childTint = accountingTintColor(r.line.group_color, 0.92);
      r.children.forEach(c => {
        const selected = c.line.id === accountingSelectedLineId;
        // Agent-fan-out children (2026-08-20) have no split_label -- what
        // distinguishes them is the agent/county, so that goes in the Client
        // column (blank for a manually-created split, same as before) and the
        // Tactic column falls back to '—' instead of the manual-split-only
        // "(unlabeled split)" text, which wouldn't make sense here.
        const isAgentChild = !!(c.line.agent_name && c.line.county);
        html += `<tr class="acct-row acct-child${selected ? ' selected' : ''}"${childTint ? ` style="--child-tint:${esc(childTint)}"` : ''} onclick="event.stopPropagation();accountingSelectLine('${c.line.id}')" role="button" tabindex="0" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();event.stopPropagation();accountingSelectLine('${c.line.id}')}">
          <td>${isAgentChild ? esc(accountingDisplayClientName(c.line)) : ''}</td>
          <td>${esc(c.line.split_label || (isAgentChild ? '—' : '(unlabeled split)'))}${cpmOverrideBadgeHtml(c.line)}${cutPctOverrideBadgeHtml(c.line)}</td>
          <td>${accountingFormatFlightRange(c.line.flight_start, c.line.flight_end, ACCOUNTING_ONE_TIME_BILLING_TYPES.includes(c.line.billing_type))}</td>
          <td class="num">${c.gross != null ? '$' + c.gross.toLocaleString(undefined,{minimumFractionDigits:2, maximumFractionDigits:2}) : '—'}</td>
          <td class="num">${c.split.fortyfouri != null ? '$' + c.split.fortyfouri.toLocaleString(undefined,{minimumFractionDigits:2, maximumFractionDigits:2}) : '—'}</td>
          <td class="num">${c.expectedSpend != null ? '$' + c.expectedSpend.toLocaleString(undefined,{minimumFractionDigits:2, maximumFractionDigits:2}) : '—'}</td>
          <td class="num">${c.actualSpend != null ? '$' + c.actualSpend.toLocaleString(undefined,{minimumFractionDigits:2, maximumFractionDigits:2}) : '—'}</td>
          <td>${accountingLineStatusPill(c)}</td>
        </tr>`;
      });
    }
    return html;
  }
  const selected = r.line.id === accountingSelectedLineId;
  // Paused dollar cells gray out here too (2026-08-27, per Claire: "right now
  // is shows paused but the amount still shows") -- the Detail card's own
  // monthly table has done this since 2026-08-12 (dollarStyle, further down
  // this file), but the main table never got the matching treatment, so a
  // paused row's figures looked exactly as "live" as an active one, right
  // next to its own Paused pill. Same style, same reasoning: the number
  // itself stays visible (still useful to know what was budgeted), just
  // visually de-emphasized instead of looking like real activity.
  const dollarStyle = accountingRowIsPaused(r) ? ' style="color:var(--muted)"' : '';
  return `<tr class="acct-row${selected ? ' selected' : ''}" onclick="accountingSelectLine('${r.line.id}')" role="button" tabindex="0" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();accountingSelectLine('${r.line.id}')}">
    <td><strong>${esc(accountingDisplayClientName(r.line))}</strong></td>
    <td>${esc(r.line.tactic_label || r.line.service_id || '—')}${accountingCancelledTag(r.line)}${r.line.has_offline_visits ? ' <span style="font-size:10px;color:var(--muted)">+Visits</span>' : ''}${r.line.has_addl_targeting ? ' <span style="font-size:10px;color:var(--muted)">+Addl. Targeting</span>' : ''}${cpmOverrideBadgeHtml(r.line)}${cutPctOverrideBadgeHtml(r.line)}${accountingAfterBillingBadgeHtml(r)}</td>
    <td>${accountingFormatFlightRange(r.line.flight_start, r.line.flight_end, ACCOUNTING_ONE_TIME_BILLING_TYPES.includes(r.line.billing_type))}</td>
    <td class="num"${dollarStyle}>${r.gross != null ? '$' + r.gross.toLocaleString(undefined,{minimumFractionDigits:2, maximumFractionDigits:2}) : '—'}</td>
    <td class="num"${dollarStyle}>${r.split.fortyfouri != null ? '$' + r.split.fortyfouri.toLocaleString(undefined,{minimumFractionDigits:2, maximumFractionDigits:2}) : '—'}</td>
    <td class="num"${dollarStyle}>${r.expectedSpend != null ? '$' + r.expectedSpend.toLocaleString(undefined,{minimumFractionDigits:2, maximumFractionDigits:2}) : '—'}</td>
    <td class="num"${dollarStyle}>${r.actualSpend != null ? '$' + r.actualSpend.toLocaleString(undefined,{minimumFractionDigits:2, maximumFractionDigits:2}) : '—'}</td>
    <td>${accountingLineStatusPill(r)}</td>
  </tr>`;
}

function renderAccountingDashboard() {
  document.getElementById('accounting-month-label').textContent = accountingMonthLabel(accountingCurrentMonth);

  const closedInfo = accountingClosedMonthInfo(accountingCurrentMonth);
  const closeControlEl = document.getElementById('accounting-month-close-control');
  closeControlEl.innerHTML = closedInfo
    ? `<span style="font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:999px;background:#DCFCE7;color:#166534;white-space:nowrap;margin-left:6px">✓ Billed by ${esc(closedInfo.closed_by)}, ${esc(new Date(closedInfo.closed_at).toLocaleDateString('en-US',{month:'short',day:'numeric'}))}</span>
       <button onclick="accountingReopenCurrentMonth()" style="margin-left:6px;padding:4px 10px;border-radius:999px;border:1.5px solid var(--border);background:#fff;color:var(--muted);font-size:10.5px;cursor:pointer">Reopen</button>`
    : `<button onclick="accountingCloseCurrentMonth()" style="margin-left:6px;padding:4px 12px;border-radius:999px;border:1.5px solid var(--accent-dark);background:#fff;color:var(--accent-dark);font-size:10.5px;font-weight:600;cursor:pointer">Mark Billing Complete</button>`;

  const groupFilterEl = document.getElementById('accounting-group-filter');
  const groupNames = [...new Set(ALL_ACCOUNTING_LINES.map(l => l.group_name).filter(Boolean))].sort((a, b) => a.localeCompare(b));
  if (accountingGroupFilter && !groupNames.includes(accountingGroupFilter)) accountingGroupFilter = '';
  groupFilterEl.innerHTML = '<option value="">All Groups</option>' +
    groupNames.map(g => `<option value="${esc(g)}" ${g === accountingGroupFilter ? 'selected' : ''}>${esc(g)}</option>`).join('');

  const rows = accountingBuildRows();

  // Stat tiles (mockup's summary bar) -- computed from the SAME filtered rows
  // the table itself renders, so the tiles and the table total row can never
  // silently disagree. "Expected Spend" here is the COMPUTED figure (Retail
  // CPM/Platform CPM formula), not Actual Spend -- the two are genuinely
  // different numbers now that both have their own table column.
  //
  // 44i Revenue excludes anything Billed Externally (2026-08-12, per Claire:
  // "that is the number we should be invoicing" -- a billed-externally line
  // is invoiced by the group directly, not by 44i, so it was never really
  // 44i's revenue to begin with even though the per-row cell still shows the
  // calculated split for reference). Tracked separately as its own tile so
  // the excluded amount doesn't just silently vanish from the summary bar.
  // Pending campaigns are excluded from every stat tile entirely (2026-08-12,
  // per Claire: "their revenues shouldn't be included in the stat tiles
  // until they are active and have spend") -- unlike Billed Externally
  // (which still counts Gross/Expected Spend, only excludes the 44i cut),
  // a still-pending campaign hasn't started at all, so NONE of its
  // projected numbers should count yet. The row itself still shows its own
  // figures if any exist (informational, same as Billed Externally) -- only
  // the aggregate totals skip it. Paused (2026-08-13, per Claire) is excluded
  // the same way -- a paused campaign isn't running that month either.
  //
  // Needs Confirmation (2026-08-13, per Claire: "take those awaiting
  // confirmation numbers out of the totals so it accurately reflects what
  // the confirmed revenue is") -- the 3 stat tiles below now show CONFIRMED
  // revenue only, with the unconfirmed portion broken out underneath as its
  // own smaller sub-total instead of folded into the headline number. Only
  // the TILES exclude it -- totalGross/totalExpectedSpend/totalFortyfouri
  // themselves stay the full figures, since the table's own Total row (and
  // every individual row) still shows its real number regardless of
  // confirmation status, same as Billed Externally rows always have.
  let totalGross = 0, totalExpectedSpend = 0, totalActualSpend = 0, totalFortyfouri = 0, totalBilledExternally = 0;
  let awaitingGross = 0, awaitingExpectedSpend = 0, awaitingFortyfouri = 0;
  rows.forEach(r => {
    if (accountingRowIsPending(r)) return;
    if (accountingRowIsPaused(r)) return;
    totalGross += r.gross || 0;
    if (r.expectedSpend != null) totalExpectedSpend += r.expectedSpend;
    if (r.actualSpend != null) totalActualSpend += r.actualSpend;
    const { invoiceable, excluded } = accountingSplitInvoiceable(r);
    totalFortyfouri += invoiceable;
    totalBilledExternally += excluded;
    if (accountingRowNeedsConfirmation(r)) {
      awaitingGross += r.gross || 0;
      if (r.expectedSpend != null) awaitingExpectedSpend += r.expectedSpend;
      awaitingFortyfouri += invoiceable;
    }
  });
  // Group-brand-color tinting, take 2 (2026-08-12) -- the first version tinted
  // the shared #accounting-stats CONTAINER, which leaked the group's color
  // through the gaps between tiles once they became individually-boxed cards
  // (removed earlier today). Claire confirmed she still wants the group's own
  // brand color on the tiles -- just correctly, on each tile's OWN background
  // this time, not the container. Falls back to the fixed navy/light-blue
  // look when viewing "All Groups" (mixed data, no single brand color applies).
  const filteredGroupColor = accountingGroupFilter
    ? ALL_ACCOUNTING_LINES.find(l => l.group_name === accountingGroupFilter)?.group_color
    : null;
  const tileFill = accountingTintColor(filteredGroupColor, 0.82) || 'var(--light)';
  const tileBorder = filteredGroupColor || 'var(--accent-dark)';
  const stat = (label, value, cls, sub) => `<div class="acct-stat" style="background:${esc(tileFill)};border-color:${esc(tileBorder)}"><div class="acct-stat-label">${esc(label)}</div><div class="acct-stat-value${cls ? ' ' + cls : ''}">${value}</div>${sub ? `<div class="acct-stat-sub">${esc(sub)}</div>` : ''}</div>`;
  const statsEl = document.getElementById('accounting-stats');
  // "Awaiting Confirmation" is no longer its own tile (2026-08-13, per Claire)
  // -- each of the 3 tiles it actually affects gets its own smaller sub-total
  // instead ("$X awaiting confirmation"), so the excluded amount stays
  // visible even though the headline number no longer includes it.
  const acctMoney = amt => amt.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const awaitingSub = amt => amt > 0 ? '$' + acctMoney(amt) + ' awaiting confirmation' : '';
  statsEl.innerHTML =
    stat('Expected Revenue', '$' + acctMoney(totalGross - awaitingGross), '', awaitingSub(awaitingGross)) +
    stat('Expected Spend', '$' + acctMoney(totalExpectedSpend - awaitingExpectedSpend), '', awaitingSub(awaitingExpectedSpend)) +
    stat('Actual Spend', '$' + acctMoney(totalActualSpend)) +
    stat('44i Revenue', '$' + acctMoney(totalFortyfouri - awaitingFortyfouri), '', awaitingSub(awaitingFortyfouri)) +
    stat('SSH Billing (excl.)', '$' + acctMoney(totalBilledExternally));

  accountingRenderDetailCard();

  // Client search + Status filter narrow what the TABLE shows -- computed
  // from `rows` (the same group/month-filtered set the stat tiles above
  // already used), applied AFTER those tiles are built so neither filter
  // can ever change a total (2026-09-02, per Claire: "I don't want it to
  // change any of the totals... I always want the default to be to show
  // all service lines that are ordered"). Both default to empty (show
  // everything), matching that "always show all by default" requirement.
  const visibleRows = rows.filter(r => {
    const search = accountingClientSearch.trim().toLowerCase();
    if (search && !(r.line.client_name || '').toLowerCase().includes(search)) return false;
    if (accountingStatusFilter && accountingRowStatusCategory(r) !== accountingStatusFilter) return false;
    return true;
  });

  // The table's own Total row DOES follow the filter (2026-09-02, per
  // Claire: "I think we could mess with that total row. I just didn't want
  // anything in the top part to change") -- a plain sum of whatever's
  // actually visible below it, unlike the stat tiles above (which stay
  // fixed regardless of filter and deliberately exclude Pending/Paused
  // rows as "not real revenue yet"). The Total row makes no such exclusion
  // -- filtering to "Pending," for instance, should show a real total for
  // those rows, not $0.00 just because the tiles above treat Pending as
  // zero.
  let visibleTotalGross = 0, visibleTotalExpectedSpend = 0, visibleTotalActualSpend = 0, visibleTotalFortyfouri = 0;
  visibleRows.forEach(r => {
    visibleTotalGross += r.gross || 0;
    if (r.expectedSpend != null) visibleTotalExpectedSpend += r.expectedSpend;
    if (r.actualSpend != null) visibleTotalActualSpend += r.actualSpend;
    visibleTotalFortyfouri += accountingSplitInvoiceable(r).invoiceable;
  });

  const wrap = document.getElementById('accounting-table-wrap');
  if (!rows.length) {
    wrap.innerHTML = '<p style="text-align:center;padding:30px;color:var(--muted);font-size:13px">No campaigns with a budget entered for this month yet.</p>';
    fitAccountingTableHeight();
    return;
  }
  if (!visibleRows.length) {
    wrap.innerHTML = '<p style="text-align:center;padding:30px;color:var(--muted);font-size:13px">No campaigns match your search/filter.</p>';
    fitAccountingTableHeight();
    return;
  }

  // Grouped by Group as its own full-width banner row (mockup layout) rather
  // than a plain column -- Group itself is still filterable via the dropdown
  // above, this is purely a display grouping. Colored with that group's own
  // brand color (Admin -> Groups), same as the Strategist Portal's main
  // table (2026-08-11, per Claire) -- falls back to the light neutral band
  // if a group has no brand_color set.
  const byGroup = new Map();
  visibleRows.forEach(r => {
    const g = r.line.group_name || '(No Group)';
    if (!byGroup.has(g)) byGroup.set(g, { color: r.line.group_color, rows: [] });
    byGroup.get(g).rows.push(r);
  });
  const groupOrder = [...byGroup.keys()].sort((a, b) => a.localeCompare(b));

  let bodyRows = '';
  groupOrder.forEach(groupName => {
    const bg = byGroup.get(groupName).color || '#EBF4FB';
    const fg = accountingContrastTextColor(bg);
    bodyRows += `<tr><th class="sticky-group-td" scope="colgroup" colspan="8" style="position:sticky;z-index:2;padding:8px 12px;font-weight:700;font-size:11px;letter-spacing:.04em;text-transform:uppercase;text-align:left;background:${esc(bg)};color:${fg}">${esc(groupName)}</th></tr>`;
    byGroup.get(groupName).rows.forEach(r => { bodyRows += accountingRenderRow(r); });
  });

  const th = (label, num) => `<th${num ? ' class="num"' : ''}>${label}</th>`;
  // Total row uses one literal <td> per column (no colspan) so it can never
  // drift out of alignment with the header/body columns above it (2026-08-11,
  // per Claire: "the total column is way too small and doesn't line up with
  // the columns" -- a colspan-merged label cell sizes differently than a
  // plain cell under certain content-width combinations; this removes that
  // possibility entirely by keeping the same 8 real cells every row has).
  wrap.innerHTML = `<table>
    <thead class="acct-sticky-thead">
      <tr>
        ${th('Client')}${th('Tactic')}${th('Flight')}${th('Revenue', true)}${th('44i Revenue', true)}${th('Expected Spend', true)}${th('Actual Spend', true)}${th('Status')}
      </tr>
    </thead>
    <tbody>${bodyRows}</tbody>
    <tfoot>
      <tr style="font-weight:700;border-top:2px solid var(--border)">
        <td>Total</td>
        <td></td>
        <td></td>
        <td class="num">$${visibleTotalGross.toLocaleString(undefined,{minimumFractionDigits:2, maximumFractionDigits:2})}</td>
        <td class="num">$${visibleTotalFortyfouri.toLocaleString(undefined,{minimumFractionDigits:2, maximumFractionDigits:2})}</td>
        <td class="num">$${visibleTotalExpectedSpend.toLocaleString(undefined,{minimumFractionDigits:2, maximumFractionDigits:2})}</td>
        <td class="num">$${visibleTotalActualSpend.toLocaleString(undefined,{minimumFractionDigits:2, maximumFractionDigits:2})}</td>
        <td></td>
      </tr>
    </tfoot>
  </table>`;
  applyStickyGroupOffset('accounting-table-wrap');
  fitAccountingTableHeight();
}

// Sizes #accounting-table-wrap's max-height to whatever vertical room is actually
// left in the viewport (2026-08-17, per Claire), replacing the flat CSS
// max-height:70vh -- the header bar/topbar/stat tiles above it add up to more or
// less room depending on how many stat tiles render, so a fixed 70vh guess left
// the page a few px taller than most windows, needing its own tiny scrollbar even
// though nothing inside it needed to move. Same live-measurement approach as
// strategist's fitStrategistScrollBoxes()/applyStickyGroupOffset(). The 40px
// reserved below the box is .acct-wrap's own bottom padding -- the space still
// needed after the box for the page to end cleanly instead of the box touching
// the very bottom of the viewport.
function fitAccountingTableHeight() {
  const box = document.getElementById('accounting-table-wrap');
  if (!box) return;
  const top = box.getBoundingClientRect().top + window.scrollY;
  const fit = Math.max(200, window.innerHeight - top - 40);
  box.style.maxHeight = Math.min(fit, window.innerHeight * 0.7) + 'px';
  // --accounting-sticky-offset feeds the scroll-margin-top rule (2026-08-17, per
  // Claire -- same bug and fix as /admin's identical scrollIntoView issue found the
  // same day): opening the detail card via accountingSelectLine()'s
  // scrollIntoView({block:'start'}) aligned its top edge with the page's literal
  // top, which the sticky header bar now permanently covers, hiding the card's own
  // title/first fields until scrolled up manually.
  const header = document.querySelector('#page-accounting .acct-header');
  if (header) document.querySelector('#page-accounting .acct-wrap').style.setProperty('--accounting-sticky-offset', header.getBoundingClientRect().height + 'px');
}
window.addEventListener('resize', () => {
  if (typeof currentAccountingUser !== 'undefined' && currentAccountingUser) fitAccountingTableHeight();
});
// Catches every other way the content above the table can change height without
// going through renderAccountingDashboard() -- opening/closing the Add Service,
// Bulk Match, or Bulk Import forms (2026-08-17, found auditing for other
// instances of the same bug fixed in Strategist's detail panel earlier: none of
// those three toggle functions called fitAccountingTableHeight() either, so
// opening one could overflow the page again and closing one could leave the
// table wrongly condensed). Same "observe the container, don't hunt every call
// site" approach as admin's #admin-content-area / strategist's
// #strategist-content-area ResizeObservers.
new ResizeObserver(() => {
  if (typeof currentAccountingUser !== 'undefined' && currentAccountingUser) fitAccountingTableHeight();
}).observe(document.querySelector('#page-accounting .acct-wrap'));

// Sticky header row + sticky "current group" banner while scrolling a long
// table (2026-08-11, per Claire). The group banner's sticky offset has to sit
// right below the header row, but the header's height isn't hardcoded here
// (it can change with font/zoom), so it's measured from the live DOM after
// each render rather than assumed. Same helper duplicated in the Strategist
// Portal -- kept local rather than moved to shared.js since shared.js's own
// convention is code both index.html and admin.html call, not every portal.
function applyStickyGroupOffset(wrapId) {
  const wrap = document.getElementById(wrapId);
  if (!wrap) return;
  const thead = wrap.querySelector('thead');
  if (!thead) return;
  const top = thead.getBoundingClientRect().height;
  wrap.querySelectorAll('.sticky-group-td').forEach(td => { td.style.top = top + 'px'; });
}

document.addEventListener('DOMContentLoaded', async () => {
  if (await tryRestoreAccountingSession()) return;
  promptAccountingLogin();
});
</script>
