    const fd = plan.firstDates;
    html += `<details style="font-size:12px;margin:0 0 8px"><summary style="cursor:pointer;color:#1E3A8A">What the import read from your sheet (click to check the columns)</summary><div style="padding:6px 10px;border:1px solid var(--border);border-radius:6px;margin-top:4px">
      ${other.map(c => `<div>${esc(c.header || '(blank)')} → <strong style="${c.role === 'NOT USED' ? 'color:#B91C1C' : ''}">${esc(c.role)}</strong></div>`).join('')}
      <div>${mc.length} month column(s): ${mc.length ? esc(mc[0].header) + ' … ' + esc(mc[mc.length - 1].header) : 'none'}</div>
      <div style="margin-top:4px">First data row's flight cells: start = <strong>${fd && fd.start !== null ? '"' + esc(fd.start) + '"' : 'no Flight Start column found'}</strong>, end = <strong>${fd && fd.end !== null ? '"' + esc(fd.end) + '"' : 'no Flight End column found'}</strong></div></div></details>`;
  }
  const inferredRows = plan.groups.filter(g => g.datesInferred).length;
  if (inferredRows) html += `<p style="font-size:12px;margin:0 0 6px;color:#1E3A8A">ℹ ${inferredRows} row(s) have no flight dates, so each one's dates were worked out from its months that have an amount (the 1st of the first month to the last day of the last month). They are used to match existing lines and to date NEW campaigns; existing lines' dates are never changed. The download shows the dates used for each new line.</p>`;
  const monthOnlyRows = plan.groups.filter(g => g.monthOnlyDates).length;
  if (monthOnlyRows) html += `<p style="font-size:12px;margin:0 0 6px;color:#1E3A8A">ℹ ${monthOnlyRows} row(s) give flight dates as a month only (like Feb-27). A start is read as the 1st of that month and an end as its last day; existing lines are compared by month and their dates are never changed. New lines get those whole-month dates.</p>`;
  const dateRows = plan.groups.filter(g => (g.flags || []).some(f => ACCT_DATE_FLAG_KINDS.includes(f.kind))).length;
  if (dateRows) html += `<p style="font-size:12px;margin:0 0 6px;color:#7C2D12">📅 ${dateRows} row(s) have a date discrepancy (marked below). Dates on existing lines are never changed by this import.</p>`;
  if (plan.groups.length) html += `<label style="display:block;font-size:12px;margin:0 0 6px"><input type="checkbox" ${ACCT_BULK_ONLY_FLAGGED ? 'checked' : ''} onchange="accountingToggleBulkOnlyFlagged(this.checked)"/> Show only the rows that need a look (flagged or changing existing amounts)</label>`;
  html += plan.groups.map(g => {
    const trackable = accountingIsSpendTrackable(g.service.id);
    const tag = g.existingLineId
      ? `already in the system (${g.existingAccountingOnly ? 'accounting-only' : 'also in the Strategist portal'}, status ${g.existingStatus}) -- adding months to it`
      : trackable ? 'new campaign (will also appear in the Strategist portal)' : 'new campaign, accounting-only';
    const dd = v => v ? String(v).slice(0, 10) : 'ongoing';
    const altSelect = (g.altLines || []).length ? ` <select onchange="if (this.value) accountingSetBulkImportOverride(${g.rowNums[0]}, 'lineId', this.value)" style="font-size:11px;padding:2px 5px;border-radius:5px;border:1px dashed var(--accent);color:var(--text)"><option value="">${g.existingLineId ? 'Use a different line…' : 'Add to an existing line instead…'}</option>${g.altLines.map(l => `<option value="${esc(l.id)}">${l.split_label ? esc(l.split_label) + ' · ' : ''}${esc(l.status)} · ${dd(l.flight_start)} – ${dd(l.flight_end)}</option>`).join('')}</select>` : '';
    const newBecauseNamed = g.newReason === 'named' && (g.altLines || []).length > 0;
    const visitsTag = g.hasOfflineVisits ? ' <span style="font-size:10px;font-weight:600;color:var(--accent-dark);border:1px solid var(--accent);border-radius:4px;padding:0 4px">+ Offline Visits</span>' : '';
    const money = n => '$' + Number(n).toLocaleString(undefined, { maximumFractionDigits: 2 });
    const monthTotal = g.months.reduce((t, m) => t + (m.grossBudget || 0), 0);
    const infoBox = t => `<div style="font-size:11.5px;color:#1E3A8A;background:#DBEAFE;border-radius:5px;padding:3px 8px;margin-top:4px">ℹ ${t}${altSelect}</div>`;
    const namedHtml = newBecauseNamed ? infoBox(`This client already has other line(s) for this service, none named "${esc(g.campaignName)}" -- so this becomes a NEW campaign, not an extension.`)
      : (!g.existingLineId && g.newReason === 'dates' && (g.altLines || []).length) ? infoBox(`No existing line for this service overlaps these dates (${esc(g.flightStart || '?')} – ${esc(g.flightEnd || 'ongoing')}) -- so this becomes a NEW campaign, not an extension.`)
      : g.matchedBy === 'dates' ? infoBox(`Matched to the existing line whose dates overlap this row's dates (the client has ${g.altLines.length} lines for this service).`)
      : g.matchedBy === 'picked' ? `<div style="font-size:11.5px;color:#1E3A8A;background:#DBEAFE;border-radius:5px;padding:3px 8px;margin-top:4px">ℹ Added to the line you picked.</div>` : '';
    const flagHtml = namedHtml + (g.flags || []).map(f => ACCT_DATE_FLAG_KINDS.includes(f.kind)
      ? `<div style="font-size:11.5px;color:#7C2D12;background:#FFEDD5;border:1px solid #FDBA74;border-radius:5px;padding:3px 8px;margin-top:4px">📅 ${esc(f.text)}</div>`
      : `<div style="font-size:11.5px;color:#92400E;background:#FEF3C7;border-radius:5px;padding:3px 8px;margin-top:4px">⚠ ${esc(f.text)}</div>`).join('');
    const changeHtml = (g.changes || []).length ? `<div style="font-size:11.5px;color:#991B1B;background:#FEE2E2;border-radius:5px;padding:3px 8px;margin-top:4px">⚠ This will CHANGE ${g.changes.length} amount(s) already saved on the existing line: ${g.changes.map(c => `${c.month.slice(0, 7)} ${money(c.from)} → ${money(c.to)}`).join(', ')}</div>` : '';
    const needsLook = (g.flags || []).some(f => ['mismatch', 'nocut', 'noprice', 'differs', 'confirmed', 'closed', 'gap', 'outside', 'duplicate', 'group', 'visits-differs', 'dates-kept', 'line-outside', 'line-status'].includes(f.kind)) || (g.changes || []).length > 0;
    if (ACCT_BULK_ONLY_FLAGGED && !needsLook) return '';
    const holdBtn = g.rowNums && g.rowNums.length ? `<button onclick="accountingSetBulkImportOverride(${g.rowNums[0]}, 'excluded', true)" style="float:right;font-size:11px;padding:2px 8px;border-radius:5px;background:var(--light);border:1px solid var(--border);cursor:pointer">Hold back this row</button>` : '';
    return `<div style="padding:9px 12px;font-size:12.5px;border-bottom:1px solid var(--border)">${holdBtn}
      <strong style="color:var(--text)">${esc(g.client.name)}</strong>${g.client.group_name ? ` <span style="color:var(--muted)">[${esc(g.client.group_name)}]</span>` : ''} — <span style="color:var(--text)">${esc(g.tacticLabel)}</span>${g.campaignName ? ` <span style="color:var(--text)">· Campaign: <strong>${esc(g.campaignName)}</strong></span>` : ''}${visitsTag} <span style="color:var(--muted)">(${g.months.length || 0} month(s)${g.months.length ? ', ' + money(monthTotal) + ' total' : ''}, ${tag})</span>${flagHtml}${changeHtml}
    </div>`;
  }).join('');
  // Totals per group, to compare against the spreadsheet before confirming.
  if (plan.groups.length) {
    const money = n => '$' + Number(n).toLocaleString(undefined, { maximumFractionDigits: 2 });
    const byGroup = new Map();
    plan.groups.forEach(g => { const k = g.client.group_name || '(no group)'; const t = byGroup.get(k) || { lines: 0, months: 0, total: 0, sheet44i: 0 }; t.lines++; t.months += g.months.length; t.total += g.months.reduce((x, m) => x + (m.grossBudget || 0), 0); t.sheet44i += g.months.reduce((x, m) => x + (m.sheet44i || 0), 0); byGroup.set(k, t); });
    const grand = [...byGroup.values()].reduce((a, t) => ({ lines: a.lines + t.lines, months: a.months + t.months, total: a.total + t.total, sheet44i: a.sheet44i + t.sheet44i }), { lines: 0, months: 0, total: 0, sheet44i: 0 });
    html += `<table style="margin:12px 0 4px;border-collapse:collapse;font-size:12px"><thead><tr style="text-align:left;color:var(--muted)"><th style="padding:3px 14px 3px 0">Totals by group</th><th style="padding:3px 14px">Campaigns</th><th style="padding:3px 14px">Months</th><th style="padding:3px 14px;text-align:right">Client pays (Gross)</th><th style="padding:3px 0 3px 14px;text-align:right">44i Revenue (sheet)</th></tr></thead><tbody>` +
      [...byGroup.entries()].sort((a, b) => a[0].localeCompare(b[0])).map(([k, t]) => `<tr><td style="padding:2px 14px 2px 0">${esc(k)}</td><td style="padding:2px 14px">${t.lines}</td><td style="padding:2px 14px">${t.months}</td><td style="padding:2px 14px;text-align:right">${money(t.total)}</td><td style="padding:2px 0 2px 14px;text-align:right">${t.sheet44i ? money(t.sheet44i) : '—'}</td></tr>`).join('') +
      `<tr style="font-weight:700;border-top:1px solid var(--border)"><td style="padding:3px 14px 2px 0">All groups</td><td style="padding:3px 14px 2px">${grand.lines}</td><td style="padding:3px 14px 2px">${grand.months}</td><td style="padding:3px 14px 2px;text-align:right">${money(grand.total)}</td><td style="padding:3px 0 2px 14px;text-align:right">${grand.sheet44i ? money(grand.sheet44i) : '—'}</td></tr></tbody></table>`;
  }
  if (plan.skipped && plan.skipped.length) {
    html += `<p style="font-size:11.5px;color:var(--muted);margin:8px 0 0">${plan.skipped.length} row(s) skipped: no amount on or after ${esc(plan.cutoff || 'the first month')} (rows ${plan.skipped.slice(0, 15).map(r => r.rowNum).join(', ')}${plan.skipped.length > 15 ? ', …' : ''}).</p>`;
  }
  if (plan.errors.length) {
    const unmatched = new Map();
    plan.errors.filter(e => e.field === 'tactic').forEach(e => { const k = e.tacticName.trim(); const u = unmatched.get(k) || { n: 0, rows: [] }; u.n++; u.rows.push(e.rowNum); unmatched.set(k, u); });
    if (unmatched.size) html += `<div style="font-size:12px;margin:10px 0 0;padding:8px 10px;border:1px solid #FCA5A5;border-radius:6px;background:#FEF2F2"><strong>${unmatched.size} service name(s) in the sheet aren't matched to a service yet</strong> (only rows with amounts from ${esc(plan.cutoff || 'the first month')} on are counted):<ul style="margin:4px 0 0 18px;padding:0">${[...unmatched.entries()].sort((x, y) => y[1].n - x[1].n).map(([k, u]) => `<li>${esc(k)} -- ${u.n} row(s)</li>`).join('')}</ul></div>`;
    html += `<p style="font-size:12px;font-weight:600;color:#B91C1C;margin:10px 0 4px">Needs fixing -- pick the right one below, or remove the row (no need to re-paste):</p>`;
    html += plan.errors.map(e => accountingRenderBulkImportErrorRow(e)).join('');
  }
  html += `<div style="margin-top:12px">
    <button onclick="accountingDownloadBulkPreview()" class="btn-quiet-green" style="margin-right:12px;font-size:12px">Download preview (CSV, your sheet + checks)</button>
    <button id="accounting-bulk-import-confirm-btn" onclick="accountingConfirmBulkImport()" ${plan.groups.length ? '' : 'disabled'} style="padding:7px 16px;border-radius:6px;background:var(--accent-dark);color:#fff;border:none;font-size:12.5px;font-weight:600;cursor:pointer">Confirm Import</button>
  </div></div>`;
  resultsEl.innerHTML = html;
}

// One unresolved row's fix-it UI: a "did you mean X?" suggestion (plain
// edit-distance nearest match, pre-selected but never auto-applied) plus a
// dropdown of every real option and a Remove-row button -- picking either
// re-runs Preview against an override, the pasted text is never touched.
function accountingRenderBulkImportErrorRow(e) {
  if (e.field === 'ambiguous' && e.candidates && e.candidates.length > 1) {
    const d = v => v ? String(v).slice(0, 10) : 'ongoing';
    const opts = [...e.candidates].sort((a, b) => String(a.flight_start).localeCompare(String(b.flight_start)))
      .map(l => `<option value="${esc(l.id)}">${l.split_label ? esc(l.split_label) + ' · ' : ''}${esc(l.status)} · ${d(l.flight_start)} – ${d(l.flight_end)} · ${l.accounting_only ? 'accounting-only' : 'also in Strategist'}${l.campaign_name ? ' · ' + esc(l.campaign_name) : ''}</option>`).join('');
    return `<div style="display:flex;align-items:center;flex-wrap:wrap;gap:8px;padding:5px 0;font-size:12px;color:#B91C1C">
      <span>Row ${e.rowNum} (${esc(e.clientName)} — ${esc(e.tacticName)}): ${e.candidates.length} lines already exist for this client and service (separate campaigns or sub-campaigns) -- which one do these months belong to?</span>
      <select onchange="if (this.value) accountingSetBulkImportOverride(${e.rowNum}, 'lineId', this.value)" style="font-size:11px;padding:3px 6px;border-radius:5px;border:1px dashed var(--accent);color:var(--text)">
        <option value="">— Pick the line —</option>${opts}
      </select>
      <button onclick="accountingSetBulkImportOverride(${e.rowNum}, 'excluded', true)" style="font-size:11px;padding:3px 8px;border-radius:5px;background:var(--light);border:1px solid var(--border);cursor:pointer;color:var(--text)">Remove row</button>
    </div>`;
  }
  if (e.field === 'dates' || e.field === 'amount' || e.field === 'ambiguous' || e.field === 'agent') {
    return `<div style="display:flex;align-items:center;flex-wrap:wrap;gap:8px;padding:5px 0;font-size:12px;color:#B91C1C">
      <span>Row ${e.rowNum} (${esc(e.clientName)} — ${esc(e.tacticName)}): ${esc(e.detail)} -- fix it in your sheet and paste again, or remove the row.</span>
      <button onclick="accountingSetBulkImportOverride(${e.rowNum}, 'excluded', true)" style="font-size:11px;padding:3px 8px;border-radius:5px;background:var(--light);border:1px solid var(--border);cursor:pointer">Remove row</button>
    </div>`;
  }
  const rawText = e.field === 'client' ? e.clientName : e.tacticName;
  const suggestion = e.field === 'client' ? accountingSuggestSimilarClient(rawText) : accountingSuggestSimilarTactic(rawText);
  const suggestionId = suggestion ? (e.field === 'client' ? suggestion.id : suggestion.service.id) : null;
  const suggestionLabel = suggestion ? (e.field === 'client' ? suggestion.name : suggestion.tacticLabel) : null;
  const overrideKey = e.field === 'client' ? 'clientId' : 'serviceId';
  const options = e.field === 'client'
    ? [...ALL_ACCOUNTING_CLIENTS].sort((a, b) => a.name.localeCompare(b.name))
        .map(c => `<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('')
    : (() => {
        // Grouped by section (e.g. "Location Targeting") because many catalog names are only the variant ("Event or Lookback").
        const eligibleRows = Object.values(CATALOG_ROWS).filter(r => r.pricing_mode !== 'modifier' && !r.is_cpm_adjustment);
        const order = id => { const k = ACCOUNTING_SECTIONS.findIndex(x => x.id === id); return k < 0 ? 999 : k; };
        const secIds = [...new Set(eligibleRows.map(r => r.section))].sort((a, b) => order(a) - order(b));
        return secIds.map(sec => `<optgroup label="${esc(accountingSectionLabel(sec))}">` + eligibleRows.filter(r => r.section === sec)
          .sort((a, b) => (a.accounting_label || a.label || '').localeCompare(b.accounting_label || b.label || ''))
          .map(r => {
            const lbl = esc(r.accounting_label || r.label);
            const hasVisits = Object.values(CATALOG_ROWS).some(m => m.section === r.section && m.pricing_mode === 'modifier' && /offline/i.test(m.label || ''));
            return `<option value="${esc(r.id)}">${lbl}</option>` + (hasVisits ? `<option value="${esc(r.id)}+visits">${lbl} + Offline Visits</option>` : '');
          }).join('') + '</optgroup>').join('');
      })();
  return `<div style="display:flex;align-items:center;flex-wrap:wrap;gap:8px;padding:5px 0;font-size:12px;color:#B91C1C">
    <span>Row ${e.rowNum}: ${e.field} "${esc(rawText)}" not found${suggestionLabel ? ` — did you mean "${esc(suggestionLabel)}"?` : ''}</span>
    ${suggestionId ? `<button onclick="accountingSetBulkImportOverride(${e.rowNum}, '${overrideKey}', '${esc(suggestionId)}')" style="font-size:11px;padding:3px 8px;border-radius:5px;background:var(--accent-dark);color:#fff;border:none;cursor:pointer">Use "${esc(suggestionLabel)}"</button>` : ''}
    <select onchange="if (this.value) accountingSetBulkImportOverride(${e.rowNum}, '${overrideKey}', this.value)" style="font-size:11px;padding:3px 6px;border-radius:5px;border:1px dashed var(--accent);color:var(--text)">
      <option value="">— Pick the right ${e.field} —</option>
      ${options}
    </select>
    <button onclick="accountingSetBulkImportOverride(${e.rowNum}, 'excluded', true)" style="font-size:11px;padding:3px 8px;border-radius:5px;background:var(--light);border:1px solid var(--border);cursor:pointer;color:var(--text)">Remove row</button>
  </div>`;
}
const ACCT_DATE_FLAG_KINDS = ['dates-kept', 'line-outside', 'line-status', 'outside', 'gap'];
let ACCT_BULK_ONLY_FLAGGED = false; // preview filter: show only rows that need a look
function accountingToggleBulkOnlyFlagged(on) { ACCT_BULK_ONLY_FLAGGED = !!on; accountingPreviewBulkImport(); }
let ACCT_BULK_IMPORT_OVERRIDES = {}; // rowNum -> { clientId?, serviceId?, excluded? }
function accountingSetBulkImportOverride(rowNum, key, value) {
  if (!ACCT_BULK_IMPORT_OVERRIDES[rowNum]) ACCT_BULK_IMPORT_OVERRIDES[rowNum] = {};
  ACCT_BULK_IMPORT_OVERRIDES[rowNum][key] = value;
  accountingPreviewBulkImport();
}

async function accountingConfirmBulkImport() {
  if (!ACCT_BULK_IMPORT_PLAN || !ACCT_BULK_IMPORT_PLAN.groups.length) return;
  // Same double-submit guard added to admin/index.html's slow save/confirm
  // buttons and Strategist's own bulk-import confirm the same day
  // (2026-09-04) — this one creates brand-new campaign lines in a loop
  // (accounting_add_campaign_line, one per group with no existing line), so
  // a repeat click before the first pass finishes would create duplicates.
  const confirmBtn = document.getElementById('accounting-bulk-import-confirm-btn');
  if (confirmBtn?.disabled) return;
  if (confirmBtn) { confirmBtn.disabled = true; confirmBtn.textContent = 'Saving…'; }

  const { groups } = ACCT_BULK_IMPORT_PLAN;
  let linesCreated = 0, linesMatched = 0, monthsSaved = 0;
  // A record of exactly what this import wrote (2026-10-07) -- offered as a download afterwards so any import
  // can be reviewed, and undone precisely, later. `previous` = the amount a month had BEFORE this import.
  const record = [];
  const prevOf = (lineId, month) => { const ex = ALL_ACCOUNTING_MONTHS.find(x => x.campaign_line_id === lineId && String(x.month).slice(0, 7) === month.slice(0, 7)); return ex && ex.gross_budget != null ? Number(ex.gross_budget) : null; };
  try {
    for (const g of groups) {
      const sortedMonths = [...g.months].sort((a, b) => a.month.localeCompare(b.month));
      let lineId = g.existingLineId;

      if (lineId) {
        // Already in the system (Strategist's own order flow, an earlier
        // Add Service, or a prior Bulk Import) -- add these months to that
        // SAME line rather than creating a duplicate one (2026-08-12, per
        // Claire: "will it know if something is already in the strategist
        // portal?"). Every month goes through accounting_save_campaign_month
        // here, including the first -- there's no "initial month" concept
        // for a line that already exists.
        linesMatched++;
        for (const m of sortedMonths) {
          if (m.grossBudget == null) continue;
          const prevAmt = prevOf(lineId, m.month);
          await sb('rpc/accounting_save_campaign_month', { method: 'POST', body: JSON.stringify({
            p_name: currentAccountingUser.name, p_pw: currentAccountingUser.pw,
            p_campaign_line_id: lineId, p_month: m.month, p_data: { gross_budget: m.grossBudget }
          }) });
          record.push({ action: 'month added to existing line', line_id: lineId, group: g.client.group_name || '', client: g.client.name, service: g.tacticLabel, month: m.month.slice(0, 7), amount: m.grossBudget, previous: prevAmt, sheet44i: m.sheet44i });
          monthsSaved++;
        }
        continue;
      }

      const trackable = accountingIsSpendTrackable(g.service.id);
      const firstMonth = sortedMonths[0];
      const data = {
        client_id: g.client.id, group_id: g.client.group_id || null, service_id: g.service.id,
        tactic_label: g.tacticLabel, flight_start: g.flightStart, flight_end: g.flightEnd,
        split_label: g.campaignName || undefined,
        has_offline_visits: g.hasOfflineVisits,
        has_addl_targeting: g.hasAddlTargeting,
        accounting_only: !trackable,
        status: trackable ? undefined : 'active',
        billing_type: trackable ? 'spend' : (g.billingType === 'one-time' || g.billingType === 'one_time' ? 'one_time' : 'recurring'),
      };
      if (firstMonth && firstMonth.grossBudget != null) {
        data.initial_gross_budget = firstMonth.grossBudget;
        data.initial_month = firstMonth.month;
      }
      const newId = await sb('rpc/accounting_add_campaign_line', { method: 'POST', body: JSON.stringify({
        p_name: currentAccountingUser.name, p_pw: currentAccountingUser.pw, p_data: data
      }) });
      linesCreated++;
      if (firstMonth) monthsSaved++;
      if (firstMonth && firstMonth.grossBudget != null) record.push({ action: 'new line + month', line_id: newId, group: g.client.group_name || '', client: g.client.name, service: g.tacticLabel, month: firstMonth.month.slice(0, 7), amount: firstMonth.grossBudget, previous: null, sheet44i: firstMonth.sheet44i });
      // Any month beyond the first goes through accounting_save_campaign_month --
      // accounting_add_campaign_line only ever handles ONE initial month.
      for (const m of sortedMonths.slice(1)) {
        if (m.grossBudget == null) continue;
        await sb('rpc/accounting_save_campaign_month', { method: 'POST', body: JSON.stringify({
          p_name: currentAccountingUser.name, p_pw: currentAccountingUser.pw,
          p_campaign_line_id: newId, p_month: m.month, p_data: { gross_budget: m.grossBudget }
        }) });
        record.push({ action: 'new line + month', line_id: newId, group: g.client.group_name || '', client: g.client.name, service: g.tacticLabel, month: m.month.slice(0, 7), amount: m.grossBudget, previous: null, sheet44i: m.sheet44i });
        monthsSaved++;
      }
    }
    ACCT_LAST_IMPORT_RECORD = record;
    const formEl = document.getElementById('accounting-bulk-import-form');
    formEl.style.display = 'block';
    formEl.innerHTML = `<div style="border:1px solid var(--accent);border-radius:10px;padding:14px 18px;background:#F0FDF4;font-size:12.5px">
      <strong>Import finished:</strong> ${linesCreated} new campaign(s), ${linesMatched} existing campaign(s) added to, ${monthsSaved} month amount(s) saved.
      <div style="margin-top:8px"><button onclick="accountingDownloadImportRecord()" style="padding:6px 14px;border-radius:6px;background:var(--accent-dark);color:#fff;border:none;font-size:12px;font-weight:600;cursor:pointer">Download import record (CSV)</button>
      <button onclick="document.getElementById('accounting-bulk-import-form').style.display='none';document.getElementById('accounting-bulk-import-form').innerHTML=''" class="btn-quiet-green" style="margin-left:8px;font-size:12px">Close</button></div>
      <p style="margin:8px 0 0;color:var(--muted);font-size:11.5px">Keep the record: it lists every line and month this import wrote, and the amount each month had before, so the import can be reviewed or undone exactly.</p></div>`;
    ACCT_BULK_IMPORT_PLAN = null;
    await fetchAccountingData();
    renderAccountingDashboard();
    showToast(`${linesCreated} new campaign(s) created, ${linesMatched} already-existing campaign(s) matched, ${monthsSaved} month(s) saved.`);
  } catch(e) {
    showToast('Error during bulk import: ' + e.message, 'error');
    if (confirmBtn) { confirmBtn.disabled = false; confirmBtn.textContent = 'Confirm Import'; }
  }
}

// Download of the PREVIEW (2026-10-07, per Claire -- easier to cross-reference against the spreadsheet). Nothing is
// saved by this. 'rows' = one line per sheet row with its outcome and flags; 'months' = one line per month with the
// amount to be saved, the sheet's 44i Revenue, the system's, and the difference.
function accountingDownloadBulkPreview() {
  const plan = ACCT_BULK_IMPORT_PLAN; if (!plan || !plan.rawRows) { showToast('Click Preview first.', 'error'); return; }
  const q = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
  const num = v => v == null || Number.isNaN(v) ? '' : Math.round(v * 100) / 100;
  const money = n => '$' + Number(n).toLocaleString(undefined, { maximumFractionDigits: 2 });

// Confirmed = a real actual-spend figure entered for the month, OR a manual
// confirm from the detail card (for tactics the Strategist Portal never
// Same keys/labels as the Strategist Portal's own SETUP_BLOCKER_LABELS --
// duplicated here rather than shared, same "each portal keeps its own copy"
// convention as everywhere else this session -- so a blocker reads
// identically in either portal without the two files depending on each
// other's internals.
const ACCT_SETUP_BLOCKER_LABELS = {
  creative: 'Waiting on Creative',
  platform_access: 'Waiting on Platform Access',
  intake_form: 'Waiting on Intake Form',
  pending_website: 'Pending Website',
};
// A pending campaign's own pill (2026-08-12, per Claire: "like paused, I
// want something that notes it is pending and what the blocker is") --
// one pill per recognized blocker, same visual treatment as Strategist's
// own strategistSetupBlockerPill. Falls back to a plain "Pending" pill if

// row's height with wrapping blocker pills; the main table now always shows
// a plain "Pending" pill, and accountingRenderDetailCard() below shows the

function accountingPendingStatusPill(line) {
  return accountingStatusPill('pending', 'Pending');
}
// tracks actuals for at all). Either one is sufficient. Priority order:
// Billed Externally > Pending > Paused > Confirmed/Needs confirmation.
// Pending (2026-08-12, per Claire) sits above Paused -- a campaign that
// hasn't even started in Strategist yet was never "running" to begin with,
// so Paused doesn't apply to it; Billed Externally still wins over
// everything (a manually-invoiced tactic can be billed regardless of its
// own setup/pause state).
function accountingLineStatusPill(r) {
  if (r.line.billed_externally) return accountingStatusPill('external', 'SSH Billing');
  if (r.line.status === 'pending') return accountingPendingStatusPill(r.line);
  // Checked before the generic `paused` flag (2026-09-10) -- r.paused is now
  // also true for a Complete line (see accountingBuildRows()'s own comment),
  // so this line, and its rollup/category counterparts below, would
  // otherwise show the same "Paused" label a genuinely-temporary pause gets.
  // A permanently cancelled campaign is a meaningfully different thing for
  // anyone doing revenue reconciliation.
  if (r.isComplete) return accountingStatusPill('complete', 'Complete');
  if (r.paused) return accountingStatusPill('paused', 'Paused');
  if (r.confirmed) return accountingStatusPill('confirmed', 'Confirmed');
  // A cancelled line is not waiting on a charge to be confirmed the way a live one is (2026-10-08, per Claire).
  if (r.line.status === 'cancelled') return accountingStatusPill('cancelled', 'Cancelled');
  return accountingStatusPill('needs', 'Needs confirmation');
}
// Status text for a rollup PARENT row -- summarizes across all its children
// rather than picking one child's state, since a split can have some regions
// confirmed and others not (the mockup's "2 of 3 confirmed" example). Same
// priority as the single-line pill -- only shows a whole-rollup Pending/
// Paused when EVERY region is in that state, otherwise a partial one falls
// through to the normal confirmed-count summary (that detail is visible in
// the expanded rows).
function accountingRollupStatusPill(r) {
  if (r.children.every(c => c.line.billed_externally)) return accountingStatusPill('external', 'SSH Billing');
  if (r.children.every(c => c.line.status === 'pending')) return accountingPendingStatusPill(r.children[0].line);
  // Same "Complete" distinction as accountingLineStatusPill() above, checked
  // before Paused for the same reason.
  if (r.children.every(c => c.isComplete)) return accountingStatusPill('complete', 'Complete');
  if (r.children.every(c => c.paused)) return accountingStatusPill('paused', 'Paused');
  if (r.confirmedCount === r.totalCount) return accountingStatusPill('confirmed', 'Confirmed');
  if (r.confirmedCount === 0) return accountingStatusPill('needs', 'Needs confirmation');
  return accountingStatusPill('needs', `${r.confirmedCount} of ${r.totalCount} confirmed`);
}

// Single source of truth for a row's status CATEGORY, shared between the

// that pill -- same priority order (Billed Externally > Pending > Paused >

function accountingRowStatusCategory(r) {

// Real gap found live (2026-08-11, Claire cross-checking against her revenue
// spreadsheet): every "w/Visits" tactic came out wrong -- e.g. Geofencing is
// 45% normally but 45.59% with Offline Visits Tracking. This isn't a new
// rate concept -- Admin's Accounting Map has supported a per-(tactic,
// modifier)-pairing override for this since 2026-07-31 (Offline Visits
// Tracking is modeled as its own is_cpm_adjustment service, paired with the
// tactic) -- this portal just never fetched or applied it. When a line has
// Offline Visits Tracking, the pairing rate wins outright if one's been set
// for that tactic; otherwise falls through to the normal group-then-base
// resolution below (so a tactic with no pairing override configured yet
// doesn't silently show as "not set" just because visits tracking is on --
// only the DIFFERENCE from the plain rate needs its own override, same as
// Admin's own UI: the base entry stays authoritative until someone
// overrides the pairing specifically).
//
// Known gap, not silently invented: a per-GROUP override of a pairing rate
// isn't supported here, because Admin's own per-group override table isn't
// pairing-aware either -- matching existing behavior, not a new limitation.
// SEM's 44i Revenue isn't a flat cut % -- it's tiered by how much is being
// spent (2026-08-11, Claire: "SEM < $1,000... 75%, SEM $5,000+... 85%").
// Looked up against the month's own Gross Budget, same figure the flat rate
// already multiplies against. When a service has tiers configured, they
// REPLACE the flat rate entirely -- a group override of the flat rate is
// irrelevant once tiers exist (documented gap, not silently invented, same
// as the Offline Visits pairing rate's own group-override gap).
// groupId (2026-08-27, per Claire — 3 groups need a different 44i Cut %
// than the base schedule once spend crosses the schedule's TOP breakpoint,
// e.g. SEM's "$5,000+" tier) — only the top bucket (the one with max==null,
// "and up") can be overridden per group; lower buckets always come from the
// base schedule. Deliberately not a whole per-group tier schedule — a group
// only ever needs to state the one number that differs for it, not
// duplicate every breakpoint (which would silently go stale if the base
// schedule's lower breakpoints ever changed).
function accountingEffectiveCutPctTier(serviceId, groupId, grossBudget) {
  const tiers = ACCOUNTING_CUT_TIERS[serviceId];
  if (!tiers || !tiers.length || grossBudget == null) return null;
  const tier = tiers.find(t => t.max == null || Number(grossBudget) <= Number(t.max));
  if (!tier) return null;
  if (tier.max == null && groupId) {
    const topOverride = ACCOUNTING_SPEND_TIER_TOP_OVERRIDE.group[`${groupId}|${serviceId}`];
    if (topOverride != null) return Number(topOverride);
  }
  return Number(tier.cut_pct);
}
// hasModifier -- true when EITHER Offline Visits Tracking OR YouTube TV's
// Addl. Targeting is checked (2026-08-12). Safe to OR them into one flag:
// no tactic in this catalog currently offers both as independently
// toggleable options, so there's no case where the two pairing rates could
// collide into this single lookup. If that ever changes, this needs a real
// per-modifier pairing key instead of one flat serviceId -> rate map.
// clientId (2026-08-20, Phase B of the MS Farm Bureau pricing work) -- checked
// right after the tier lookup and before the group override, same precedence
// as everywhere else client-level now beats group-level. Sourced from the
// client's own accounting_overrides (ALL_ACCOUNTING_CLIENTS), not the base/
// group/pairing `rates` dataset, which has no client scope. Same documented
// gap as the pre-existing group-override case: a client override of a PAIRING
// rate isn't supported (hasModifier is only ever a plain boolean).
// lineOverride (2026-08-27, per Claire — QUR services quote at a varying
// price, so the 44i Cut % on those lines isn't a fixed tier schedule, it's
// whatever was actually agreed at quote time) beats every other source,
// including the pairing rate -- it's a manual call on this exact line, more
// specific than any tier/client/group/base rate below it. Restricted to QUR
// services in the UI (accountingCutPctOverrideFieldHtml), but not re-checked
// here -- a stray value on a non-QUR line would still just mean "use this
// instead," same as every other override in this chain.
function accountingEffectiveCutPct(serviceId, clientId, groupId, hasModifier, grossBudget, lineOverride) {
  if (lineOverride != null) return Number(lineOverride);
  if (hasModifier) {
    const pairingRate = ACCOUNTING_CUT_RATES.pairing[serviceId];
    if (pairingRate != null) return pairingRate;
  }
  const tierRate = accountingEffectiveCutPctTier(serviceId, groupId, grossBudget);
  if (tierRate != null) return tierRate;
  const client = clientId ? ALL_ACCOUNTING_CLIENTS.find(c => c.id === clientId) : null;
  const clientRate = client?.accounting_overrides?.[serviceId]?.fortyfouri_cut_pct;
  if (clientRate != null) return Number(clientRate);
  const groupRate = groupId ? ACCOUNTING_CUT_RATES.group[`${groupId}|${serviceId}`] : undefined;
  if (groupRate != null) return groupRate;
  const baseRate = ACCOUNTING_CUT_RATES.base[serviceId];
  return baseRate != null ? baseRate : null;
}

// The split % for a service's OWN auto-add setup fee (2026-08-13) --
// deliberately separate from accountingEffectiveCutPct above, since Admin's
// "Setup Fee Split %" field can be a different ratio than that service's
// regular 44i Cut % (confirmed 2026-07-30 for SEM's $200 fee: 50/50, not
// SEM's regular split). No tier/pairing concept here -- a setup fee is a
// flat one-time amount, never spend-tiered or modifier-paired.
function accountingEffectiveSetupFeeCutPct(serviceId, clientId, groupId) {
  const client = clientId ? ALL_ACCOUNTING_CLIENTS.find(c => c.id === clientId) : null;
  const clientRate = client?.accounting_overrides?.[serviceId]?.setup_fee_cut_pct;

// 44i's $ = Gross Budget x Cut % ; Group's $ (YDA) = the remainder of Gross --
// confirmed rule (100 - Cut % is always the Group's share, per Admin's own
// "Group's cut (YDA) is always 100% minus this" note). Returns nulls (not 0s)
// when Gross Budget or Cut % isn't available, so a missing rate is visibly
// missing in the table rather than rendering as $0.
function accountingSplitRevenue(grossBudget, cutPct) {
  if (grossBudget == null || cutPct == null) return { fortyfouri: null, group: null };
  const fortyfouri = Number(grossBudget) * (Number(cutPct) / 100);
  return { fortyfouri, group: Number(grossBudget) - fortyfouri };
}

// Splits a row's (already-computed) 44i Revenue into what's actually
// invoiceable by 44i vs. what's Billed Externally and needs to be excluded
// (2026-08-12, per Claire: "if a service is billed externally it should
// not be included in the 44i revenue, because that is the number we should
// be invoicing"). Only affects TOTALS (stat tiles, the Total row) -- the
// per-row table cell keeps showing the calculated split either way, since
// that number is still useful as a reference even for a billed-externally
// line. A rollup can have some regions billed externally and others not,
// so this checks each CHILD individually rather than the rollup as a
// whole.
function accountingSplitInvoiceable(r) {
  if (r.isRollup) {
    let invoiceable = 0, excluded = 0;
    r.children.forEach(c => {
      if (c.split.fortyfouri == null) return;
      if (c.line.billed_externally) excluded += c.split.fortyfouri;
      else invoiceable += c.split.fortyfouri;
    });
    return { invoiceable, excluded };
  }
  if (r.split.fortyfouri == null) return { invoiceable: 0, excluded: 0 };
  return r.line.billed_externally ? { invoiceable: 0, excluded: r.split.fortyfouri } : { invoiceable: r.split.fortyfouri, excluded: 0 };
}

// A row is "fully pending" when every real campaign it represents is still

// same all-or-nothing convention already used for Paused/Billed Externally

function accountingRowIsPending(r) {
  return r.isRollup ? r.children.every(c => c.line.status === 'pending') : r.line.status === 'pending';
}

// A row is "fully paused" the same all-or-nothing way a rollup counts as
// pending above (2026-08-13, per Claire -- a paused campaign isn't running
// that month either, same reasoning already applied to Pending, so it's
// excluded from the stat tiles the same way). Uses the exact same `paused`

function accountingRowIsPaused(r) {

}

// "Expected Spend" (2026-08-11, per Claire: it's a genuinely different number
// from Actual Spend, needs its own column) -- exactly the Strategist Portal's
// own In-Platform Budget formula: Budgeted Impressions (Gross ÷ Retail CPM ×
// 1000) × Platform CPM ÷ 1000, or Gross × In-Platform % for a service with no
// Retail CPM at all (e.g. SEM). Retail CPM comes from the public services
// catalog (CATALOG_ROWS, loaded via shared.js's loadCatalog() -- same data
// source the Strategist Portal reads, no separate accounting RPC needed for
// it). A per-month manual override (campaign_months.in_platform_override --
// the same column the Strategist Portal writes to) always wins, same
// "override wins" rule used everywhere else in this project.
// hasModifier -- same OR-merge as accountingEffectiveCutPct's own hasModifier
// param (2026-08-13, per Claire: "we will also need to update the CPM if
// offline tracking is added" -- Platform CPM's own pairing override existed
// in Admin's Accounting Map since the pairing mechanism was built, but was
// never actually looked up here; only the cut % pairing rate was). Pairing
// wins outright over group/base, same precedence as the cut % pairing rate.
function accountingEffectivePlatformCpm(serviceId, clientId, groupId, hasModifier) {
  if (hasModifier) {
    const pairingRate = ACCOUNTING_PLATFORM_CPM_RATES.pairing[serviceId];
    if (pairingRate != null) return pairingRate;
  }
  const client = clientId ? ALL_ACCOUNTING_CLIENTS.find(c => c.id === clientId) : null;
  const clientRate = client?.accounting_overrides?.[serviceId]?.platform_cpm;
  if (clientRate != null) return Number(clientRate);
  const groupRate = groupId ? ACCOUNTING_PLATFORM_CPM_RATES.group[`${groupId}|${serviceId}`] : undefined;
  if (groupRate != null) return groupRate;
  const baseRate = ACCOUNTING_PLATFORM_CPM_RATES.base[serviceId];
  return baseRate != null ? baseRate : null;
}
// Same spend-tiered lookup as accountingEffectiveCutPctTier() below, kept in
// its own ACCOUNTING_IN_PLATFORM_TIERS cache/column (2026-08-13: SEM, 50%
// under $5,000 / 70% at $5,000+) since it has to stay safe to expose to the
// Strategist Portal too -- unlike ACCOUNTING_CUT_TIERS, which carries
// cut_pct and must never leave Accounting/Admin.
function accountingEffectiveInPlatformPctTier(serviceId, grossBudget) {
  const tiers = ACCOUNTING_IN_PLATFORM_TIERS[serviceId];
  if (!tiers || !tiers.length || grossBudget == null) return null;
  const tier = tiers.find(t => t.max == null || Number(grossBudget) <= Number(t.max));
  return tier ? Number(tier.in_platform_pct) : null;
}
// A tiered rate (when configured) replaces the flat base/group rate
// entirely -- same "tiers win outright" rule as 44i Cut % -- UNLESS that
// specific override carries in_platform_pct_force (2026-08-25, MS Farm
// Bureau: their per-agent SEM lines each sit under $5,000 on their own, so
// the catalog-wide tier was silently beating STMM Digital's already-
// configured 70% group override. Scoped to just the flagged group/client so
// every other tiered service's existing behavior stays untouched).
function accountingEffectiveInPlatformPct(serviceId, clientId, groupId, grossBudget) {
  const client = clientId ? ALL_ACCOUNTING_CLIENTS.find(c => c.id === clientId) : null;
  const clientOverride = client?.accounting_overrides?.[serviceId];
  if (clientOverride?.in_platform_pct_force && clientOverride.in_platform_pct != null) {
    return Number(clientOverride.in_platform_pct);
  }
  const groupKey = groupId ? `${groupId}|${serviceId}` : '';
  if (groupId && ACCOUNTING_IN_PLATFORM_PCT_FORCE.group[groupKey] && ACCOUNTING_IN_PLATFORM_PCT_RATES.group[groupKey] != null) {
    return Number(ACCOUNTING_IN_PLATFORM_PCT_RATES.group[groupKey]);
  }
  const tierRate = accountingEffectiveInPlatformPctTier(serviceId, grossBudget);
  if (tierRate != null) return tierRate;
  const clientRate = clientOverride?.in_platform_pct;
  if (clientRate != null) return Number(clientRate);
  const groupRate = groupId ? ACCOUNTING_IN_PLATFORM_PCT_RATES.group[groupKey] : undefined;
  if (groupRate != null) return groupRate;
  const baseRate = ACCOUNTING_IN_PLATFORM_PCT_RATES.base[serviceId];
  return baseRate != null ? baseRate : null;
}
// A group's Retail CPM override lives in the SAME io_pricing JSONB the public
// form's applyCustomPricing() already reads (2026-08-19 -- Claire: "some groups
// have different retail cpms", built as a Custom Pricing override in
// admin/index.html) -- not a separate per-group accounting field, since it's
// the same real-world number the client sees on the catalog, just read here
// for the internal Expected Spend calc instead. Looked up via any client
// belonging to the group (accounting_get_clients already returns each
// client's own group_io_pricing; every client under one group carries an
// identical copy) rather than adding a new groups-keyed fetch just for this.
// Client-level Retail CPM (2026-08-20, Phase B) wins over the group's -- same
// clients.io_pricing a client can now set in Admin's own Client editor,
// checked before falling through to the group's copy of the same JSONB shape.
// lineOverride (2026-08-25) -- a per-campaign-line Retail CPM the strategist
// records when an AE (e.g. within the Kingfish group) actually sold at a
// different real rate than the group/catalog standard. Wins over the
// client/group rate, same as every other override -- see strategistEffective
// RetailCpm()'s own comment in strategist/index.html for the full reasoning.
function accountingEffectiveRetailCpm(serviceId, clientId, groupId, lineOverride) {
  if (lineOverride != null) return Number(lineOverride);
  const client = clientId ? ALL_ACCOUNTING_CLIENTS.find(c => c.id === clientId) : null;
  if (client?.io_pricing?.[serviceId] != null) return Number(client.io_pricing[serviceId]);
  if (!groupId) return null;
  const groupClient = ALL_ACCOUNTING_CLIENTS.find(c => c.group_id === groupId && c.group_io_pricing && c.group_io_pricing[serviceId] != null);
  return groupClient ? Number(groupClient.group_io_pricing[serviceId]) : null;
}
// Fallback for flat-fee services with no ad platform at all (LLO, Reputation
// Mgmt.) -- 2026-09-17, per Claire: uses accounting_map.budgeted_spend_pct
// (Admin's "Budgeted Spend % (legacy)"), which already existed but was never
// wired into this portal. Verified against Claire's real spreadsheet formula
// and real numbers: LLO's 9.92 / its 45% cut = $22.04/mo, matching her real
// 9-month total ($198.32 / 9). No tier/pairing/client-override complexity --
// just base/group, same shape as the other rate lookups here.
function accountingEffectiveBudgetedSpendPct(serviceId, groupId) {
  const groupKey = groupId ? `${groupId}|${serviceId}` : '';
  const groupRate = groupId ? ACCOUNTING_BUDGETED_SPEND_RATES.group[groupKey] : undefined;
  if (groupRate != null) return Number(groupRate);
  const baseRate = ACCOUNTING_BUDGETED_SPEND_RATES.base[serviceId];
  return baseRate != null ? Number(baseRate) : null;
}
function accountingComputeExpectedSpend(grossBudget, serviceId, clientId, groupId, inPlatformOverride, hasModifier, retailCpmLineOverride, cutPct) {
  if (inPlatformOverride != null) return Number(inPlatformOverride);
  if (grossBudget == null) return null;
  const retailCpmOverride = accountingEffectiveRetailCpm(serviceId, clientId, groupId, retailCpmLineOverride);
  const retailCpm = retailCpmOverride != null ? retailCpmOverride : (CATALOG_ROWS[serviceId]?.retail_cpm != null ? Number(CATALOG_ROWS[serviceId].retail_cpm) : null);
  const platformCpm = accountingEffectivePlatformCpm(serviceId, clientId, groupId, hasModifier);
  if (retailCpm != null && platformCpm != null) {
    const impressions = (Number(grossBudget) / retailCpm) * 1000;
    return impressions * platformCpm / 1000;
  }
  const pct = accountingEffectiveInPlatformPct(serviceId, clientId, groupId, grossBudget);
  if (pct != null) return Number(grossBudget) * pct / 100;
  const budgetedPct = accountingEffectiveBudgetedSpendPct(serviceId, groupId);
  if (budgetedPct != null && cutPct != null && Number(cutPct) !== 0) {
    return budgetedPct / (Number(cutPct) / 100);
  }
  return null;
}

// Same relative-luminance contrast pick as the Strategist Portal's own
// strategistContrastTextColor -- an arbitrary group brand color (light or
// dark) always gets readable text against it, and the same visual language
// as that other table's group banners (2026-08-11, per Claire: "use the
// group color for their header like the strategists").
// Rewritten 2026-08-18 (accessibility audit) alongside Strategist's copy -- same bug,
// duplicated independently rather than shared: uncorrected "perceived brightness"
// instead of real WCAG relative luminance, so a plausible mid-blue brand color (e.g.
// #4A90D9) picked white text that only reached 3.34:1, failing AA. See
// strategistContrastTextColor()'s own comment for the full explanation.
function accountingContrastTextColor(hex) {
  if (!hex || !/^#[0-9a-fA-F]{6}$/.test(hex)) return '#0E5D82';
  const relLuminance = (h) => {
    const c = [1,3,5].map(i => parseInt(h.slice(i,i+2),16) / 255);
    const [r,g,b] = c.map(v => v <= 0.03928 ? v/12.92 : Math.pow((v+0.055)/1.055, 2.4));
    return 0.2126*r + 0.7152*g + 0.0722*b;
  };
  const contrast = (l1,l2) => (Math.max(l1,l2)+0.05) / (Math.min(l1,l2)+0.05);
  const bgLum = relLuminance(hex);
  const white = 1.0, dark = relLuminance('#1F2937');
  const whiteContrast = contrast(bgLum, white);
  const darkContrast = contrast(bgLum, dark);
  if (whiteContrast >= 4.5 && whiteContrast >= darkContrast) return '#FFFFFF';
  if (darkContrast >= 4.5) return '#1F2937';
  return whiteContrast > darkContrast ? '#FFFFFF' : '#1F2937';
}
// Light tint of a brand color for the stat-tile bar's background (2026-08-11,
// per Claire: "I am talking about the stat tiles" -- when filtered to one
// Group, the summary bar should carry that group's brand color too, not just
// the table's own banner rows). Mixed heavily toward white so the tile text
// (dark, unconditionally) stays comfortably readable regardless of how
// saturated the source brand color is.
function accountingTintColor(hex, amount) {
  if (!hex || !/^#[0-9a-fA-F]{6}$/.test(hex)) return null;
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  const mix = c => Math.round(c + (255 - c) * amount);
  return `#${[mix(r), mix(g), mix(b)].map(v => v.toString(16).padStart(2, '0')).join('')}`;
}

  ALL_ACCOUNTING_MONTHS = months || [];

  ACCOUNTING_CUT_RATES = { base: {}, group: {}, pairing: {} };
  ACCOUNTING_CUT_TIERS = {};
  ACCOUNTING_IN_PLATFORM_TIERS = {};
  ACCOUNTING_PLATFORM_CPM_RATES = { base: {}, group: {}, pairing: {} };
  ACCOUNTING_IN_PLATFORM_PCT_RATES = { base: {}, group: {} };
  ACCOUNTING_BUDGETED_SPEND_RATES = { base: {}, group: {} };
  ACCOUNTING_IN_PLATFORM_PCT_FORCE = { group: {} };
  ACCOUNTING_SETUP_FEE_CUT_RATES = { base: {}, group: {} };
  ACCOUNTING_SPEND_TIER_TOP_OVERRIDE = { group: {} };

    if (r.scope === 'base') {
      ACCOUNTING_CUT_RATES.base[r.service_id] = r.fortyfouri_cut_pct != null ? Number(r.fortyfouri_cut_pct) : null;
      if (r.platform_cpm != null) ACCOUNTING_PLATFORM_CPM_RATES.base[r.service_id] = Number(r.platform_cpm);
      if (r.in_platform_pct != null) ACCOUNTING_IN_PLATFORM_PCT_RATES.base[r.service_id] = Number(r.in_platform_pct);

      if (r.platform_cpm != null) ACCOUNTING_PLATFORM_CPM_RATES.group[key] = Number(r.platform_cpm);
      if (r.in_platform_pct != null) ACCOUNTING_IN_PLATFORM_PCT_RATES.group[key] = Number(r.in_platform_pct);

      if (r.setup_fee_cut_pct != null) ACCOUNTING_SETUP_FEE_CUT_RATES.group[key] = Number(r.setup_fee_cut_pct);

// Carries a Gross Budget forward for a 'recurring' accounting-only line
// (2026-08-12, per Claire: "track all services ordered, not just tactics
// with spend") -- a flat monthly service like Website Hosting never gets
// touched by Strategist at all (accounting-only, on purpose), so nothing
// proactively inserts its NEXT month's campaign_months row the way
// Strategist's own prefill mechanism does for spend campaigns. Rather than
// building an equivalent prefill job, this carries the last known month's
// Gross Budget forward live -- same "hasn't changed, so it's still $X"
// convention the Strategist Portal's own monthRowFor() already uses for a
// flat/non-varying spend budget. Deliberately does NOT carry forward for
// 'one_time' fees (billing_type other than 'recurring') -- those only ever
// happened in the one month they were billed, and for ordinary spend-
// tracked lines Strategist's real prefilled rows already cover this, so
// the fallback rarely even applies to them.
// Carries forward for any line that's NOT flagged "varies by month" -- an
// ORDINARY flat-budget ad-spend campaign included, not just this session's
// new 'recurring' flat-fee lines (2026-08-12, per Claire: "when a service
// is ordered will every month in the flight automatically be filled in?").
// Real gap found answering that: Strategist's own monthRowFor() already
// carries a flat campaign's Gross Budget forward live -- that's WHY a
// standard campaign only ever needs its first campaign_months row, never
// an explicit one every month. Accounting never had the equivalent, so an
// ordinary flat-budget campaign would eventually vanish from Accounting
// after its first month too, once Strategist's own real prefilled rows
// ran out -- same class of bug as the flat-fee one, just a different set
// of lines. 'one_time' fees are the one deliberate exception -- they never
// carry forward regardless of budget_varies_by_month, since they only
// ever happened in the one month they were billed.
// 'hosting_proration'/'setup_fee' (2026-08-13) are one-time in exactly the
// same sense 'one_time' is -- each only ever happened in the single month it
// was billed -- so they're excluded from carry-forward the same way.
const ACCOUNTING_ONE_TIME_BILLING_TYPES = ['one_time', 'hosting_proration', 'setup_fee'];
function accountingMonthRowFor(lineId, monthDate) {
  const key = accountingMonthKey(monthDate);
  const exact = ALL_ACCOUNTING_MONTHS.find(m => m.campaign_line_id === lineId && m.month.slice(0, 7) === key);
  const line = ALL_ACCOUNTING_LINES.find(l => l.id === lineId);
  const carriesForward = line && !ACCOUNTING_ONE_TIME_BILLING_TYPES.includes(line.billing_type) && !line.budget_varies_by_month;

  // Same edge case Strategist's own monthRowFor() already handles: a real
  // row can exist for this exact month with actual_spend/confirmed_by set
  // but gross_budget still null (e.g. a platform report got pasted before
  // anyone entered a budget) -- without this, that null would win outright
  // and blank the whole row instead of carrying just the budget forward
  // while keeping this month's own real actuals.
  if (exact) {
    if (exact.gross_budget == null && carriesForward) {
      const prior = accountingMostRecentPriorMonth(lineId, key);
      if (prior) return { ...exact, gross_budget: prior.gross_budget };
    }
    return exact;
  }

  if (!carriesForward) return null;
  const prior = accountingMostRecentPriorMonth(lineId, key);
  if (!prior) return null;
  // Synthetic row -- carries ONLY the Gross Budget forward, never actual
  // spend/confirmed/paused state from the prior month (that would make the
  // current month look confirmed/paused just because a past one was).
  return { campaign_line_id: lineId, month: key + '-01', gross_budget: prior.gross_budget, actual_spend: null, confirmed_by: null, confirmed_at: null, in_platform_override: null, paused: false };
}
function accountingMostRecentPriorMonth(lineId, key) {
  const priorRows = ALL_ACCOUNTING_MONTHS
    .filter(m => m.campaign_line_id === lineId && m.month.slice(0, 7) < key)
    .sort((a, b) => a.month.localeCompare(b.month));
  return priorRows.length ? priorRows[priorRows.length - 1] : null;
}
