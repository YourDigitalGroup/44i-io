<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>44i Accounting Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="../shared.css"/>
<!-- Layout additions scoped to #page-accounting (2026-08-11) -- same light
     palette as /admin and /strategist (shared.css's --border/--muted/--text/
     --accent/--light: Claire confirmed the dark look in her screenshot was
     just her OS being in dark mode triggering the mockup doc's own
     prefers-color-scheme block, not an intended design -- "keep the coloring
     the same as admin and strategists"). Only new here: the stat-tile
     summary row, the top filter-pill buttons, and the click-a-row detail
     card -- structural pieces from the mockup that v2 didn't have yet. -->
<style>
  #page-accounting .acct-wrap{max-width:1180px;margin:24px auto 0;padding:0 16px 40px}
  #page-accounting .acct-header{display:flex;justify-content:space-between;align-items:center;padding-bottom:14px;margin-bottom:16px;border-bottom:1px solid var(--border)}
  #page-accounting .acct-topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;flex-wrap:wrap;gap:10px}
  #page-accounting .acct-month-nav{display:flex;align-items:center;gap:10px}
  #page-accounting .acct-month-nav button{background:var(--light);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:5px 11px;cursor:pointer;font-size:14px}
  #page-accounting .acct-month-label{font-weight:700;font-size:15px;min-width:120px;text-align:center;color:var(--text)}
  #page-accounting .acct-filters{display:flex;gap:10px}
  #page-accounting .acct-filter-btn{display:flex;align-items:center;gap:5px;border:1px solid var(--border);border-radius:6px;padding:6px 10px 6px 12px;font-size:11.5px;letter-spacing:.03em;color:var(--muted);background:#fff}
  #page-accounting .acct-filter-btn select{background:transparent;color:var(--text);border:none;font-family:inherit;font-size:11.5px;cursor:pointer;padding-right:2px}
  #page-accounting .acct-stats{display:grid;grid-template-columns:repeat(6,1fr);background:#fff;border:1px solid var(--border);border-radius:8px;margin-bottom:18px;overflow:hidden;box-shadow:0 1px 2px rgba(20,40,60,.05)}
  #page-accounting .acct-stat{padding:14px 20px}
  #page-accounting .acct-stat + .acct-stat{border-left:1px solid var(--border)}
  #page-accounting .acct-stat-label{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
  #page-accounting .acct-stat-value{font-size:22px;font-weight:700;color:var(--text)}
  #page-accounting .acct-stat-value.warn{color:#B45309}
  #page-accounting .acct-detail-card{background:#fff;border:1px solid var(--border);border-radius:8px;padding:16px 18px;margin-bottom:18px;box-shadow:0 1px 2px rgba(20,40,60,.05)}
  #page-accounting .acct-detail-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;flex-wrap:wrap;gap:8px}
  #page-accounting .acct-detail-title{font-weight:700;font-size:14px;color:var(--text)}
  #page-accounting .acct-detail-sub{color:var(--muted);font-size:12px}
  #page-accounting .acct-detail-close{background:var(--light);border:1px solid var(--border);color:var(--muted);border-radius:6px;padding:3px 9px;font-size:11px;cursor:pointer}
  /* max-height (2026-08-12, per Claire: "sticky headers not working") --
     overflow:auto alone makes this div its OWN scroll container for sticky
     purposes, but with no height limit it never actually scrolls internally
     (the page scrolls instead), so the sticky thead/group-row just sat frozen
     at the top of this div and never tracked page scroll at all. Bounding
     the height makes it a real scrolling panel, which is what sticky needs
     to have something to stick against. */
  #page-accounting .acct-table-wrap{border:1px solid var(--border);border-radius:8px;overflow:auto;max-height:70vh;background:#fff}
  #page-accounting table{width:100%;border-collapse:collapse;font-size:12.5px}
  #page-accounting thead th{position:sticky;top:0;z-index:3;background:#fff;text-align:left;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:9px 12px;border-bottom:1px solid var(--border);white-space:nowrap}
  #page-accounting thead th.num, #page-accounting td.num{text-align:right}
  #page-accounting tbody td{padding:9px 12px;border-bottom:1px solid var(--border);font-variant-numeric:tabular-nums;color:var(--text)}
  #page-accounting tfoot td{padding:10px 12px;font-variant-numeric:tabular-nums;color:var(--text);font-size:12.5px}
  #page-accounting tr.acct-group-row td{background:var(--light);font-weight:700;color:var(--muted);font-size:11px;letter-spacing:.04em;text-transform:uppercase;padding:8px 12px}
  #page-accounting tr.acct-row{cursor:pointer}
  #page-accounting tr.acct-row:hover td{background:var(--light)}
  #page-accounting tr.acct-row.selected td{background:var(--light)}
  #page-accounting tr.acct-child td{background:var(--child-tint, #FAFCFE)}
  #page-accounting tr.acct-child td:first-of-type{color:var(--muted);padding-left:26px}
  #page-accounting .acct-status-pill{display:inline-flex;align-items:center;padding:3px 9px;border-radius:20px;font-size:10.5px;font-weight:700;white-space:nowrap}
  #page-accounting .acct-status-pill.confirmed{background:#DDF2DE;color:#2E7D42}
  #page-accounting .acct-status-pill.needs{background:#FBF3C7;color:#8A6D12}
  #page-accounting .acct-status-pill.external{background:#DBEAFE;color:#1E40AF}
  #page-accounting .acct-status-pill.paused{background:#E5E7EB;color:#4B5563}
  #page-accounting .acct-status-pill.pending{background:#EDE9FE;color:#6D28D9}
</style>
</head>
<body>

<div id="toast" class="toast"></div>

<!-- ACCOUNTING PORTAL — v3 layout (2026-08-11), matching the original
     "Accounting Portal — Concept & Open Questions" dashboard mockup's actual
     structure (stat-tile summary row, a per-campaign detail card with a
     short month lookahead) per Claire's "it still doesn't look like the
     mockup" -- v2 (same day, earlier) matched the mockup's grouping/split-
     rollup/Confirmed/Billed-Externally structure but kept a plain table-only
     layout, missing the summary bar and detail card entirely. First attempt
     at this pass used the mockup DOC's dark-mode CSS (the screenshot Claire
     sent happened to be taken with her OS in dark mode, triggering that
     doc's own prefers-color-scheme block) -- corrected immediately per
     Claire: "keep the coloring the same as admin and strategists," so this
     uses shared.css's normal light palette throughout, same as every other
     portal. Everything from v2 (RPCs, rollup logic, Confirmed/Billed
     Externally mechanics) is unchanged -- this is presentation + the new
     detail-card feature, not a data model change. -->
<div id="page-accounting" style="display:none">
  <div class="acct-wrap">
    <div class="acct-header">
      <div id="accounting-user-badge" style="font-size:12px;color:var(--muted)"></div>
      <div style="display:flex;align-items:center;gap:10px">
        <a id="accounting-admin-portal-link" href="../admin/index.html" onclick="adminPortalHandoff()" style="display:none;font-size:12px;font-weight:600;color:var(--accent);text-decoration:none">Go to Admin →</a>
        <button onclick="accountingLogout()" style="background:var(--light);border:1px solid var(--border);color:var(--muted);padding:5px 14px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:600">Logout</button>
      </div>
    </div>

    <!-- Top bar: month picker + filters -->
    <div class="acct-topbar">
      <div class="acct-month-nav">
        <button onclick="accountingShiftMonth(-1)">‹</button>
        <span id="accounting-month-label" class="acct-month-label"></span>
        <button onclick="accountingShiftMonth(1)">›</button>
      </div>
      <div class="acct-filters">
        <label class="acct-filter-btn">Group:
          <select id="accounting-group-filter" onchange="accountingSetGroupFilter(this.value)">
            <option value="">All Groups</option>
          </select>
        </label>
        <label class="acct-filter-btn">Status:
          <select id="accounting-status-filter" onchange="accountingSetStatusFilter(this.value)">
            <option value="">All Lines</option>
            <option value="active">Active</option>
            <option value="paused">Paused</option>
            <option value="complete">Complete</option>
          </select>
        </label>
        <button onclick="accountingOpenAddServiceForm()" style="padding:6px 14px;border-radius:7px;border:1px solid var(--accent);background:#fff;color:var(--accent);cursor:pointer;font-weight:600;font-size:12px">+ Add Service</button>
        <button onclick="accountingOpenBulkMatchForm()" style="padding:6px 14px;border-radius:7px;border:1px solid var(--accent);background:#fff;color:var(--accent);cursor:pointer;font-weight:600;font-size:12px">Bulk Match</button>
        <button onclick="accountingOpenBulkImportForm()" style="padding:6px 14px;border-radius:7px;border:1px solid var(--accent);background:#fff;color:var(--accent);cursor:pointer;font-weight:600;font-size:12px">Bulk Import (CSV)</button>
      </div>
    </div>

    <!-- "+ Add Service" single-entry form, "Bulk Match" paste tool, and
         "Bulk Import (CSV)" -- all hidden until opened (2026-08-11/12, per
         Claire: a way to manually add a tactic Strategist doesn't track, a
         way to check what's missing from one portal vs. the other without
         pasting real data into chat, and a way to add many rows at once
         ["there are a lot of rows to add"] -- all three run entirely in
         this page, client-side, until Confirm is clicked). -->
    <div id="accounting-add-service-form" style="display:none;margin-bottom:16px"></div>
    <div id="accounting-bulk-match-form" style="display:none;margin-bottom:16px"></div>
    <div id="accounting-bulk-import-form" style="display:none;margin-bottom:16px"></div>

    <!-- Summary stat tiles -->
    <div id="accounting-stats" class="acct-stats"></div>

    <!-- Per-campaign detail card -- only rendered when a row is selected -->
    <div id="accounting-detail-card"></div>

    <div id="accounting-table-wrap" class="acct-table-wrap"></div>
  </div>
</div>

<!-- ACCOUNTING LOGIN MODAL — same shape as /strategist's, scoped to
     accounting/super roles only. -->
<div id="accounting-login-modal" style="position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9000;display:none;align-items:center;justify-content:center">
  <div style="background:#fff;border-radius:14px;padding:36px 32px;width:340px;box-shadow:0 24px 64px rgba(0,0,0,.2);text-align:center">
    <div style="font-size:32px;margin-bottom:12px">🔒</div>
    <h3 style="font-size:16px;font-weight:700;margin-bottom:6px;color:var(--text)">Accounting Access</h3>
    <p style="font-size:12px;color:var(--muted);margin-bottom:20px">Select your name and enter your password</p>
    <select id="accounting-name-select" style="width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--border);font-size:14px;text-align:center;margin-bottom:10px;font-family:inherit;background:#fff">
      <option value="">— Select your name —</option>
    </select>
    <input type="password" id="accounting-pw-input" placeholder="Password" onkeydown="if(event.key==='Enter')checkAccountingPw()" style="width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--border);font-size:14px;text-align:center;letter-spacing:.2em;margin-bottom:12px"/>
    <div id="accounting-pw-error" style="display:none;color:#EF4444;font-size:12px;margin-bottom:10px">Incorrect password. Please try again.</div>
    <div style="display:flex;gap:9px">
      <button onclick="checkAccountingPw()" style="flex:1;padding:10px;border-radius:8px;background:var(--accent);color:#fff;border:none;font-size:13px;font-weight:600;cursor:pointer">Enter</button>
    </div>
  </div>
</div>

<script src="../shared.js"></script>
<script>
let currentAccountingUser = null; // {name, email, role, pw}

async function loadAccountingRoster() {
  const sel = document.getElementById('accounting-name-select');
  let roster = [];
  try {
    roster = await sb('rpc/get_login_roster', { method: 'POST', body: JSON.stringify({}) }) || [];
  } catch(e) {
    console.warn('Could not load login roster:', e.message);
  }
  const eligible = roster.filter(u => u.role === 'accounting' || u.role === 'super');
  sel.innerHTML = '<option value="">— Select your name —</option>' +
    eligible.map(u => `<option value="${esc(u.name)}">${esc(u.name)}</option>`).join('');
}

function promptAccountingLogin() {
  document.getElementById('accounting-login-modal').style.display = 'flex';
  document.getElementById('accounting-name-select').value = '';
  document.getElementById('accounting-pw-input').value = '';
  document.getElementById('accounting-pw-error').style.display = 'none';
}

async function attemptAccountingLogin(name, pw) {
  if (!name) return { ok: false, error: 'Please select your name.' };
  let row;
  try {
    const res = await sb('rpc/admin_login', { method:'POST', body: JSON.stringify({ p_name: name, p_pw: pw }) });
    row = Array.isArray(res) ? res[0] : res;
  } catch(e) {
    return { ok: false, error: 'Could not reach the login service. Check your connection and try again.' };
  }
  if (!row || !row.role) return { ok: false, error: 'Incorrect password. Please try again.' };
  if (row.role !== 'accounting' && row.role !== 'super') {
    return { ok: false, error: 'This account isn\'t set up for the Accounting portal.' };
  }
  return { ok: true, role: row.role, email: row.email || '' };
}

async function checkAccountingPw() {
  const name = document.getElementById('accounting-name-select').value;
  const pw = document.getElementById('accounting-pw-input').value;
  const errEl = document.getElementById('accounting-pw-error');
  const result = await attemptAccountingLogin(name, pw);
  if (result.ok) {
    currentAccountingUser = { name, email: result.email, role: result.role, pw };
    document.getElementById('accounting-login-modal').style.display = 'none';
    showAccountingPanel(true);
  } else {
    errEl.textContent = result.error;
    errEl.style.display = 'block';
    document.getElementById('accounting-pw-input').value = '';
    if (result.error.includes('select your name')) return;
    document.getElementById('accounting-pw-input').focus();
  }
}

function showAccountingPanel(show) {
  document.getElementById('page-accounting').style.display = show ? 'block' : 'none';
  if (show && currentAccountingUser) {
    const badge = document.getElementById('accounting-user-badge');
    const roleLabel = currentAccountingUser.role === 'super' ? 'Super Admin' : 'Accounting';
    badge.innerHTML = `<span style="display:inline-flex;align-items:center;gap:6px"><span style="width:8px;height:8px;border-radius:50%;background:#0EA5E9"></span><strong style="color:var(--text)">${esc(currentAccountingUser.name)}</strong> <span style="color:var(--muted)">— ${roleLabel}</span></span>`;
    // Only a super admin gets a way back to /admin from here -- an accounting-role
    // login is deliberately rejected by /admin (attemptAdminLogin), so showing this
    // link to a real accounting user would just dead-end them (carried over from
    // the original scaffold, 2026-08-07).
    const adminLink = document.getElementById('accounting-admin-portal-link');
    if (adminLink) adminLink.style.display = currentAccountingUser.role === 'super' ? 'inline' : 'none';
    loadAccountingDashboard();
  }
}

// Handoff to admin/index.html's tryAdminHandoffLogin() -- same one-time sessionStorage
// pattern used between /admin and /strategist. Only relevant for a super admin here,
// since a real accounting login has nowhere to hand off to.
function adminPortalHandoff() {
  if (!currentAccountingUser) return;
  try {
    sessionStorage.setItem('admin_handoff_name', currentAccountingUser.name);
    sessionStorage.setItem('admin_handoff_pw', currentAccountingUser.pw);
  } catch(e) { /* sessionStorage blocked -- the link's normal navigation still works, just prompts for login again */ }
}

// Silent handoff FROM the admin portal's "Go to Accounting Portal" link -- same
// one-time sessionStorage pattern as the existing admin<->strategist handoff.
async function tryAccountingHandoffLogin() {
  let name, pw;
  try {
    name = sessionStorage.getItem('accounting_handoff_name');
    pw = sessionStorage.getItem('accounting_handoff_pw');
    sessionStorage.removeItem('accounting_handoff_name');
    sessionStorage.removeItem('accounting_handoff_pw');
  } catch(e) { return false; }
  if (!name || !pw) return false;
  const result = await attemptAccountingLogin(name, pw);
  if (!result.ok) return false;
  currentAccountingUser = { name, email: result.email, role: result.role, pw };
  showAccountingPanel(true);
  return true;
}

function accountingLogout() {
  currentAccountingUser = null;
  showAccountingPanel(false);
  promptAccountingLogin();
}

// ══════════════════════════════════════════════════════════════════════════
// ACCOUNTING DASHBOARD (2026-08-11) — v2 layout, matching the 2026-08-07
// concept mockup's look (grouped by Group, Flight + Actual Spend columns,
// split rollups, Confirmed/Billed Externally). Two of those (Confirmed,
// Billed Externally) are genuinely NEW mechanisms, not previously decided
// anywhere -- built as the simplest version of what the mockup showed (a
// plain toggle) per Claire's "build it the way we planned for it to look."
// Deeper questions from that doc (should a confirmed month lock? who can
// un-confirm?) are still open and NOT decided by this -- anyone with
// Accounting/super access can check/uncheck either at any time.
// ══════════════════════════════════════════════════════════════════════════

let ALL_ACCOUNTING_LINES = [];
let ALL_ACCOUNTING_MONTHS = [];
let ALL_ACCOUNTING_CLIENTS = []; // {id, name, group_id, group_name} -- for the Add Service picker and Bulk Match lookups
let ACCOUNTING_CUT_RATES = { base: {}, group: {}, pairing: {} }; // service_id -> pct, group_id|service_id -> pct, and (offline-visits pairing) service_id -> pct
let ACCOUNTING_CUT_TIERS = {}; // service_id -> [{ max, cut_pct }, ...] sorted ascending, e.g. SEM
let ACCOUNTING_PLATFORM_CPM_RATES = { base: {}, group: {} }; // for Expected Spend -- same shape as the Strategist Portal's own PLATFORM_CPM_RATES
let ACCOUNTING_IN_PLATFORM_PCT_RATES = { base: {}, group: {} }; // Expected Spend fallback for a service with no Retail CPM (e.g. SEM)
let accountingCurrentMonth = new Date();
let accountingGroupFilter = '';
let accountingStatusFilter = ''; // '' = All Lines, matching the mockup's default -- was 'active'-only before this pass
let ACCOUNTING_EXPANDED_SPLITS = new Set(); // rollup keys currently expanded -- always starts empty on load
let accountingSelectedLineId = null; // drives the per-campaign detail card below the stat tiles

// Same wrap-avoidance fix as the Strategist Portal's own strategistFormatFlightDate/
// Range (2026-08-11, found live in that table's narrow Flight column, applies here
// for the same reason -- non-breaking space within a date, plus wrapping "– end" in
// its own nowrap span since an en dash carries its own line-break opportunity that
// a non-breaking space alone doesn't suppress). Returns HTML -- callers must NOT
// wrap this in esc() (safe: only ever built from Date output, never free-typed text).
function accountingFormatFlightDate(dateStr) {
  if (!dateStr) return null;
  const d = new Date(dateStr + 'T00:00:00');
  return (d.toLocaleString('en-US', { month: 'short' }) + ' \'' + String(d.getFullYear()).slice(-2)).replace(/ /g, '\xa0');
}
function accountingFormatFlightRange(start, end) {
  const s = accountingFormatFlightDate(start), e = accountingFormatFlightDate(end);
  if (!s && !e) return '—';
  return `${s || '—'} <span style="white-space:nowrap">– ${e || 'Ongoing'}</span>`;
}
// Fuller "Aug 2026 – Jan 2027" format for the detail card header only -- the
// main table stays on the shorter "Aug '26" form (narrower column).
function accountingFormatFullFlightDate(dateStr) {
  if (!dateStr) return null;
  const d = new Date(dateStr + 'T00:00:00');
  return d.toLocaleString('en-US', { month: 'short', year: 'numeric' }).replace(/ /g, '\xa0');
}
function accountingFormatFullFlightRange(start, end) {
  const s = accountingFormatFullFlightDate(start), e = accountingFormatFullFlightDate(end);
  if (!s && !e) return '—';
  return `${s || '—'} <span style="white-space:nowrap">– ${e || 'Ongoing'}</span>`;
}
function accountingToggleSplit(key) {
  if (ACCOUNTING_EXPANDED_SPLITS.has(key)) ACCOUNTING_EXPANDED_SPLITS.delete(key);
  else ACCOUNTING_EXPANDED_SPLITS.add(key);
  renderAccountingDashboard();
}
// Clicking a single campaign's row (not a rollup parent, which toggles its own
// split expansion instead) opens the mockup's per-campaign detail card -- a
// short 3-month lookahead starting at whatever month the top bar is currently
// showing, so Confirmed can be checked off for several upcoming months without
// having to step the month picker back and forth.
function accountingSelectLine(lineId) {
  const opening = accountingSelectedLineId !== lineId;
  accountingSelectedLineId = opening ? lineId : null;
  renderAccountingDashboard();
  // Same scroll-to-editor convention as strategist/admin (2026-08-11, per Claire:
  // the detail card renders above the table, so opening it while scrolled down a
  // long list left it off-screen above the click).
  if (opening) document.getElementById('accounting-detail-card').scrollIntoView({ behavior: 'smooth', block: 'start' });
}
function accountingCloseDetailCard() {
  accountingSelectedLineId = null;
  renderAccountingDashboard();
}
// A row still needs attention if it isn't fully confirmed and isn't (fully)
// billed externally -- drives both the table's own status pill logic (already
// built) and the "Awaiting Confirmation" stat tile below.
function accountingRowNeedsConfirmation(r) {
  if (r.isRollup) {
    if (r.children.every(c => c.line.billed_externally)) return false;
    return r.confirmedCount < r.totalCount;
  }
  if (r.line.billed_externally) return false;
  return !r.confirmed;
}
function accountingRenderDetailCard() {
  const el = document.getElementById('accounting-detail-card');
  const line = accountingSelectedLineId ? ALL_ACCOUNTING_LINES.find(l => l.id === accountingSelectedLineId) : null;
  if (!line) { el.innerHTML = ''; el.className = ''; accountingSelectedLineId = null; return; }
  el.className = 'acct-detail-card';

  const months = [0, 1, 2].map(offset => {
    const d = new Date(accountingCurrentMonth.getFullYear(), accountingCurrentMonth.getMonth() + offset, 1);
    const monthKey = accountingMonthKey(d);
    const monthStr = monthKey + '-01';
    // Shared helper, not a raw lookup (2026-08-12) -- carries a flat/non-
    // varying line's Gross Budget forward the same way the main table
    // does, so the detail card doesn't show "—" for a future month just
    // because nothing explicitly wrote a row for it yet. Still gated by
    // accountingLineActiveInMonth, though (2026-08-12 fix) -- a month past
    // this line's own flight_end shows nothing, same as the main table,
    // regardless of what the carry-forward would otherwise compute.
    const monthRow = accountingLineActiveInMonth(line, d) ? accountingMonthRowFor(line.id, d) : null;
    const gross = monthRow?.gross_budget != null ? Number(monthRow.gross_budget) : null;
    const actualSpend = monthRow?.actual_spend != null ? Number(monthRow.actual_spend) : null;
    const expectedSpend = accountingComputeExpectedSpend(gross, line.service_id, line.group_id, monthRow?.in_platform_override);
    const cutPct = accountingEffectiveCutPct(line.service_id, line.group_id, line.has_offline_visits, gross);
    const split = accountingSplitRevenue(gross, cutPct);
    const manuallyConfirmed = !!monthRow?.confirmed_by;
    return {
      label: d.toLocaleString('en-US', { month: 'short' }) + ' \'' + String(d.getFullYear()).slice(-2),
      monthStr, gross, actualSpend, expectedSpend, split,
      confirmed: actualSpend != null || manuallyConfirmed, manuallyConfirmed,
      paused: !!monthRow?.paused,
    };
  });

  el.innerHTML = `<div class="acct-detail-head">
      <div class="acct-detail-title">${esc(line.client_name || '(unknown)')} — ${esc(line.tactic_label || line.service_id || '—')}${accountingLineSectionTag(line)}</div>
      <div style="display:flex;align-items:center;gap:14px">

      </div>`;
    })()}
    ${(line.campaign_notes || line.order_line_notes) ? `<div style="border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:12px;background:#FFFBEB">
      ${line.campaign_notes ? `<div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:#92400E;margin-bottom:2px">IO Campaign Notes</div><div style="font-size:12.5px;color:var(--text);margin-bottom:${line.order_line_notes ? '8px' : '0'}">${esc(line.campaign_notes)}</div>` : ''}
      ${line.order_line_notes ? `<div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:#92400E;margin-bottom:2px">Note on this line</div><div style="font-size:12.5px;color:var(--text)">${esc(line.order_line_notes)}</div>` : ''}

    <table>

          // styled ancestor <tr> and would otherwise win.

          <td class="num"${dollarStyle}>${m.actualSpend != null ? '$' + m.actualSpend.toLocaleString(undefined,{maximumFractionDigits:2}) : '—'}</td>

              </label>` : ''}
            </div>

        }).join('')}</tbody>

}

// ── "+ ADD SERVICE" MANUAL ADD (2026-08-11; extended 2026-08-12) ─────
// Mirrors the Strategist Portal's own "+ New Campaign" import, for a tactic
// Accounting knows is real (e.g. it's on the client's invoice) but Strategist
// never entered -- per Claire: "a way to manually add services, similar to
// the strategists for services that they don't track." The deliberate
// difference from Strategist's version (which defaults straight to Active):
// a SPEND-trackable tactic added here defaults to status='pending', so it
// lands in Strategist's existing Campaign Setup queue automatically -- that
// queue IS the "make sure Strategist knows about this" mechanism, nothing
// new to build there.
//
// 2026-08-12, per Claire ("I don't see all of the services... just the ones
// from the strategist portal"): the Tactic dropdown originally used the SAME
// spend-trackable-only filter as Strategist's own import form -- which made
// sense for the ORIGINAL "Strategist doesn't know about this yet" use case,
// but froze out every flat/recurring/one-time service (Website Hosting, a
// retainer, a one-time fee) -- exactly the category "track all ordered
// services" (same session) was built to cover. Now lists every active
// service; picking a non-spend-trackable one reveals a Billing choice
// (Recurring monthly / One-time fee) and creates the line the SAME way the
// order trigger does for one of those -- accounting_only=true, status=
// 'active', skipping Strategist's queue entirely, since there's no setup
// step for a flat hosting fee.
const ACCT_TRACKABLE_FLAT_SERVICE_IDS = ['llo-bp', 'rep-bp'];
function accountingIsSpendTrackable(serviceId) {
  const r = CATALOG_ROWS[serviceId];
  return !!r && (r.pricing_mode === 'spend' || ACCT_TRACKABLE_FLAT_SERVICE_IDS.includes(serviceId));
}
function accountingAddServiceTacticChanged() {
  const serviceId = document.getElementById('acct-add-service').value;
  const billingWrap = document.getElementById('acct-add-billing-wrap');
  const helpText = document.getElementById('acct-add-help-text');
  const trackable = serviceId ? accountingIsSpendTrackable(serviceId) : true;
  billingWrap.style.display = serviceId && !trackable ? 'block' : 'none';
  helpText.textContent = serviceId && !trackable
    ? 'This creates an Accounting-only line, same as the IO would for a flat/recurring/one-time service -- Strategist never sees this one, there’s no setup step for it.'
    : 'This creates the campaign as "Campaign Setup" (Pending) in the Strategist Portal, same as any other new order -- Strategist fills in platform/tracking details from there. It will not show up as Active in Accounting until Strategist activates it.';
}
// Closes every OTHER top-tools form when one is opened -- only one of Add
// Service / Bulk Match / Bulk Import makes sense open at a time.
const ACCT_TOP_FORM_IDS = ['accounting-add-service-form', 'accounting-bulk-match-form', 'accounting-bulk-import-form'];
function accountingCloseOtherForms(exceptId) {
  ACCT_TOP_FORM_IDS.filter(id => id !== exceptId).forEach(id => {
    const other = document.getElementById(id);
    other.style.display = 'none';
    other.innerHTML = '';
  });
}
function accountingOpenAddServiceForm(prefill) {
  const el = document.getElementById('accounting-add-service-form');
  const isOpen = el.style.display !== 'none';
  if (isOpen && !prefill) { el.style.display = 'none'; el.innerHTML = ''; return; }
  accountingCloseOtherForms('accounting-add-service-form');

  // Excludes modifier/add-on rows (2026-08-12, per Claire: "there are a
  // bunch of offline tracking on their own. we have the toggle for that")
  // -- Offline Visits Tracking and any other pricing_mode:'modifier' or
  // is_cpm_adjustment service are meant to be toggled ONTO a real tactic
  // (the "+ Offline Visits Tracking" checkbox right below this dropdown),
  // never picked as a standalone Tactic in their own right.
  //
  // Grouped into <optgroup>s by section (2026-08-12, per Claire: "there are
  // multiple business tiers that don't show the section they are under") --
  // several sections reuse the same tier naming (Business Builder/Starter/
  // Pro shows up under SEO, Social Media, etc.), so a flat alphabetical list
  // left it ambiguous which one a plain "Business Pro" actually was.
  const allServices = Object.values(CATALOG_ROWS)
    .filter(r => r.pricing_mode !== 'modifier' && !r.is_cpm_adjustment);
  const acctSectionOrder = {};
  ACCOUNTING_SECTIONS.forEach((s, i) => { acctSectionOrder[s.id] = s.sort_order ?? i; });
  const acctServicesBySection = new Map();
  allServices.forEach(r => {
    const key = r.section || '';
    if (!acctServicesBySection.has(key)) acctServicesBySection.set(key, []);
    acctServicesBySection.get(key).push(r);
  });
  const acctServiceOptionsHtml = [...acctServicesBySection.keys()]
    .sort((a, b) => (acctSectionOrder[a] ?? Infinity) - (acctSectionOrder[b] ?? Infinity))
    .map(key => {
      const rows = acctServicesBySection.get(key).sort((a, b) => (a.accounting_label || a.label || '').localeCompare(b.accounting_label || b.label || ''));
      return `<optgroup label="${esc(accountingSectionLabel(key))}">${rows.map(s => `<option value="${esc(s.id)}">${esc(s.accounting_label || s.label)}</option>`).join('')}</optgroup>`;
    }).join('');
  const sortedClients = [...ALL_ACCOUNTING_CLIENTS].sort((a, b) => a.name.localeCompare(b.name));
  el.style.display = 'block';
  el.innerHTML = `<div style="border:1px solid var(--accent);border-radius:10px;padding:16px 18px;background:#F0F9FF">
    <strong style="font-size:13px;display:block;margin-bottom:10px">Add a service Strategist doesn't have on record yet</strong>
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:10px">
      <div>
        <label class="lbl">Client</label>
        <select id="acct-add-client" style="width:100%;padding:7px 8px;border-radius:6px;border:1px solid var(--border);font-size:12.5px">
          <option value="">— Select —</option>
          ${sortedClients.map(c => `<option value="${esc(c.id)}" data-group-id="${esc(c.group_id || '')}" ${prefill && prefill.clientId === c.id ? 'selected' : ''}>${esc(c.name)}${c.group_name ? ' (' + esc(c.group_name) + ')' : ''}</option>`).join('')}
        </select>
      </div>
      <div>
        <label class="lbl">Tactic</label>
        <select id="acct-add-service" onchange="accountingAddServiceTacticChanged()" style="width:100%;padding:7px 8px;border-radius:6px;border:1px solid var(--border);font-size:12.5px">
          <option value="">— Select —</option>
          ${acctServiceOptionsHtml}
        </select>
        <label style="display:flex;align-items:center;gap:5px;font-size:11px;margin-top:5px;cursor:pointer">
          <input type="checkbox" id="acct-add-has-offline-visits"/> + Offline Visits Tracking
        </label>
        <div id="acct-add-billing-wrap" style="display:none;margin-top:5px">
          <select id="acct-add-billing-type" style="width:100%;padding:6px 8px;border-radius:6px;border:1px dashed var(--accent);font-size:11.5px">
            <option value="recurring">Recurring monthly</option>
            <option value="one_time">One-time fee</option>
          </select>
        </div>
      </div>
      <div>
        <label class="lbl">Flight Start</label>
        <input type="date" id="acct-add-flight-start" style="width:100%;padding:7px 8px;border-radius:6px;border:1px solid var(--border);font-size:12.5px"/>
      </div>
      <div>
        <label class="lbl">Flight End</label>
        <input type="date" id="acct-add-flight-end" style="width:100%;padding:7px 8px;border-radius:6px;border:1px solid var(--border);font-size:12.5px"/>
      </div>
      <div style="grid-column:span 2">
        <label class="lbl">Current Gross Budget <span style="font-weight:400;text-transform:none;letter-spacing:0;color:var(--muted)">(optional -- creates this month's row too)</span></label>
        <input type="number" id="acct-add-gross-budget" placeholder="$/mo" style="width:100%;padding:7px 8px;border-radius:6px;border:1px solid var(--border);font-size:12.5px"/>
      </div>
    </div>
    <p id="acct-add-help-text" style="font-size:11px;color:var(--muted);margin:0 0 12px">This creates the campaign as "Campaign Setup" (Pending) in the Strategist Portal, same as any other new order -- Strategist fills in platform/tracking details from there. It will not show up as Active in Accounting until Strategist activates it.</p>
    <div style="display:flex;gap:10px">
      <button onclick="accountingSubmitAddService()" style="padding:7px 16px;border-radius:6px;background:var(--accent);color:#fff;border:none;font-size:12.5px;font-weight:600;cursor:pointer">Add Service</button>
      <button onclick="accountingOpenAddServiceForm()" style="padding:7px 16px;border-radius:6px;background:var(--light);border:1px solid var(--border);font-size:12.5px;font-weight:600;cursor:pointer">Cancel</button>
    </div>
  </div>`;
}

async function accountingSubmitAddService() {
  const clientEl = document.getElementById('acct-add-client');
  const clientId = clientEl.value;
  const serviceId = document.getElementById('acct-add-service').value;
  if (!clientId || !serviceId) { showToast('Client and Tactic are both required.', 'error'); return; }
  const groupId = clientEl.selectedOptions[0]?.dataset.groupId || null;
  const grossBudget = document.getElementById('acct-add-gross-budget').value;
  const trackable = accountingIsSpendTrackable(serviceId);
  const data = {
    client_id: clientId, group_id: groupId || null, service_id: serviceId,
    tactic_label: CATALOG_ROWS[serviceId]?.accounting_label || CATALOG_ROWS[serviceId]?.label || serviceId,
    flight_start: document.getElementById('acct-add-flight-start').value || null,
    flight_end: document.getElementById('acct-add-flight-end').value || null,
    has_offline_visits: document.getElementById('acct-add-has-offline-visits').checked,
    // Non-spend-trackable service (2026-08-12) -- same treatment the order
    // trigger already gives a flat/recurring/one-time item: accounting-only,
    // straight to active, no Strategist Setup step.
    accounting_only: !trackable,
    status: trackable ? undefined : 'active',
    billing_type: trackable ? 'spend' : document.getElementById('acct-add-billing-type').value,
  };
  if (grossBudget) {
    data.initial_gross_budget = parseFloat(grossBudget);
    data.initial_month = new Date().toISOString().slice(0, 10);
  }
  try {
    await sb('rpc/accounting_add_campaign_line', { method: 'POST', body: JSON.stringify({
      p_name: currentAccountingUser.name, p_pw: currentAccountingUser.pw, p_data: data
    }) });
    document.getElementById('accounting-add-service-form').style.display = 'none';
    document.getElementById('accounting-add-service-form').innerHTML = '';
    await fetchAccountingData();
    renderAccountingDashboard();
    showToast(trackable ? 'Service added -- now sitting in Strategist\'s Campaign Setup queue.' : 'Service added to Accounting.');
  } catch(e) { showToast('Error adding service: ' + e.message, 'error'); }
}

// ── BULK MATCH (2026-08-11) ──────────────────────────────────────
// Claire: "a way to verify what may be missing from one portal or the
// other" -- without pasting real client data into chat, this runs entirely
// in her own browser against data already loaded here. Paste one
// Client<TAB>Tactic pair per line (same tab-separated convention as
// Strategist's own "Paste Platform Report" tool) and every row is matched
// against ALL_ACCOUNTING_LINES/ALL_ACCOUNTING_CLIENTS already in memory --
// nothing pasted here ever leaves this page.
function accountingOpenBulkMatchForm() {
  const el = document.getElementById('accounting-bulk-match-form');
  const isOpen = el.style.display !== 'none';
  if (isOpen) { el.style.display = 'none'; el.innerHTML = ''; return; }
  accountingCloseOtherForms('accounting-bulk-match-form');

  el.style.display = 'block';
  el.innerHTML = `<div style="border:1px solid var(--accent);border-radius:10px;padding:16px 18px;background:#F0F9FF">
    <strong style="font-size:13px;display:block;margin-bottom:6px">Bulk match against what's already in the system</strong>
    <p style="font-size:11px;color:var(--muted);margin:0 0 10px">Paste rows from your own tracking sheet as <strong>Client, Tactic, Gross Budget</strong> (Gross Budget is optional -- one row per line, tab or comma separated). Nothing here is sent anywhere except back to your own browser -- this only checks it against campaigns already loaded in this portal, for the month currently showing in the top bar (${esc(accountingMonthLabel(accountingCurrentMonth))}).</p>
    <textarea id="acct-bulk-match-input" rows="6" placeholder="Tassel Ridge Winery&#9;FB/IG Ads&#9;750&#10;Fisher &amp; Son Roofing&#9;Website" style="width:100%;padding:8px;border-radius:6px;border:1px solid var(--border);font-size:12px;font-family:monospace;margin-bottom:10px"></textarea>
    <div style="display:flex;gap:10px;margin-bottom:12px">
      <button onclick="accountingRunBulkMatch()" style="padding:7px 16px;border-radius:6px;background:var(--accent);color:#fff;border:none;font-size:12.5px;font-weight:600;cursor:pointer">Check Matches</button>
      <button onclick="accountingOpenBulkMatchForm()" style="padding:7px 16px;border-radius:6px;background:var(--light);border:1px solid var(--border);font-size:12.5px;font-weight:600;cursor:pointer">Cancel</button>
    </div>
    <div id="acct-bulk-match-results"></div>
  </div>`;
}

function accountingRunBulkMatch() {
  const raw = document.getElementById('acct-bulk-match-input').value;
  const rows = raw.split('\n').map(l => l.trim()).filter(Boolean).map(l => {
    const parts = l.includes('\t') ? l.split('\t') : l.split(',');
    const grossText = (parts[2] || '').trim();
    return { clientText: (parts[0] || '').trim(), tacticText: (parts[1] || '').trim(), grossText };
  });
  const norm = s => (s || '').trim().toLowerCase();

  const resultsHtml = rows.map(row => {
    const client = ALL_ACCOUNTING_CLIENTS.find(c => norm(c.name) === norm(row.clientText));
    const lineMatch = client && ALL_ACCOUNTING_LINES.find(l =>
      l.client_id === client.id && norm(l.tactic_label).includes(norm(row.tacticText)));

    if (lineMatch) {
      // Gross Budget discrepancy check (2026-08-12, per Claire) -- read-only
      // flag, never an auto-update. Only fires when BOTH a pasted number and
      // a system figure for the currently-viewed month exist and genuinely
      // differ (>$0.01, to ignore float noise) -- silent when either side
      // has nothing to compare against, rather than guessing at a mismatch.
      const pastedGross = row.grossText ? parseFloat(row.grossText.replace(/[$,]/g, '')) : null;
      const systemMonthRow = accountingMonthRowFor(lineMatch.id, accountingCurrentMonth);
      const systemGross = systemMonthRow?.gross_budget != null ? Number(systemMonthRow.gross_budget) : null;
      const hasDiscrepancy = pastedGross != null && !isNaN(pastedGross) && systemGross != null && Math.abs(pastedGross - systemGross) > 0.01;

      if (hasDiscrepancy) {
        return `<div style="padding:7px 10px;border-bottom:1px solid var(--border);font-size:12px">⚠️ <strong>${esc(row.clientText)}</strong> — ${esc(row.tacticText)} <span style="color:#8A6D12">Gross Budget mismatch: your sheet says $${pastedGross.toLocaleString(undefined,{maximumFractionDigits:2})}, system says $${systemGross.toLocaleString(undefined,{maximumFractionDigits:2})} for ${esc(accountingMonthLabel(accountingCurrentMonth))}</span></div>`;
      }
      return `<div style="padding:7px 10px;border-bottom:1px solid var(--border);font-size:12px">✅ <strong>${esc(row.clientText)}</strong> — ${esc(row.tacticText)} <span style="color:var(--muted)">already in the system</span></div>`;
    }
    if (client) {
      return `<div style="padding:7px 10px;border-bottom:1px solid var(--border);font-size:12px;display:flex;justify-content:space-between;align-items:center;gap:10px">
        <span>⚠️ <strong>${esc(row.clientText)}</strong> — ${esc(row.tacticText)} <span style="color:var(--muted)">client found, this tactic isn't tracked yet</span></span>
        <button onclick='accountingOpenAddServiceForm({clientId:"${esc(client.id)}"})' style="padding:4px 10px;border-radius:6px;background:var(--accent);color:#fff;border:none;font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap">+ Add</button>
      </div>`;
    }
    return `<div style="padding:7px 10px;border-bottom:1px solid var(--border);font-size:12px">❌ <strong>${esc(row.clientText)}</strong> — ${esc(row.tacticText)} <span style="color:var(--muted)">client not found -- add the client in Admin first</span></div>`;
  }).join('');

  document.getElementById('acct-bulk-match-results').innerHTML = rows.length
    ? `<div style="border-top:1px solid var(--border)">${resultsHtml}</div>`
    : `<p style="font-size:12px;color:var(--muted)">Paste at least one row above.</p>`;
}

// ── BULK IMPORT (2026-08-12, per Claire: "there are a lot of rows to
// add") ────────────────────────────────────────────────────────────
// Mirrors the Strategist Portal's own "Bulk Import (CSV)" -- paste,

// same reason as there) -- picking a non-spend-trackable tactic gets the
// same accounting-only/active treatment a single Add Service submission
// would, no Setup queue detour. An unresolved row (2026-08-12, per Claire:
// "add the dropdowns like the strategist so that I don't have to
// repaste") now gets its own fix-it dropdown right in the preview --
// mirrors Strategist's own override mechanism (ACCT_BULK_IMPORT_OVERRIDES,
// keyed by row number) so picking the right Client/Tactic re-runs Preview
// against the SAME pasted text, no re-typing. Each unresolved row also
// gets a "did you mean X?" suggestion (per Claire: "note if something
// looks similar") -- a plain Levenshtein-distance nearest match against
// real clients/tactics, pre-selected in that row's dropdown but never
// auto-applied without her picking it.
function accountingResolveBulkClient(name) {
  const norm = (name || '').trim().toLowerCase();
  return ALL_ACCOUNTING_CLIENTS.find(c => c.name.trim().toLowerCase() === norm) || null;
}
function accountingResolveBulkTactic(name) {
  const norm = (name || '').trim().toLowerCase();
  if (!norm) return null;
  const eligible = (r) => r.pricing_mode !== 'modifier' && !r.is_cpm_adjustment;
  if (CATALOG_ROWS[name] && eligible(CATALOG_ROWS[name])) {
    const r = CATALOG_ROWS[name];
    return { service: r, tacticLabel: r.accounting_label || r.label };
  }
  const direct = Object.values(CATALOG_ROWS).find(r => eligible(r) && (r.accounting_label || r.label || '').trim().toLowerCase() === norm);
  return direct ? { service: direct, tacticLabel: direct.accounting_label || direct.label } : null;
}
// Plain edit-distance -- how many single-character insertions/deletions/
// substitutions turn one string into the other. Used only for a "did you
// mean" suggestion, never to silently resolve a match on its own.
function accountingLevenshtein(a, b) {
  const m = a.length, n = b.length;
  const dp = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));
  for (let i = 0; i <= m; i++) dp[i][0] = i;
  for (let j = 0; j <= n; j++) dp[0][j] = j;
  for (let i = 1; i <= m; i++) {
    for (let j = 1; j <= n; j++) {
      dp[i][j] = a[i - 1] === b[j - 1] ? dp[i - 1][j - 1] : 1 + Math.min(dp[i - 1][j], dp[i][j - 1], dp[i - 1][j - 1]);
    }
  }
  return dp[m][n];
}
// Nearest real client by typed text -- close enough to guess a typo, never
// close enough to guess an entirely different name. Threshold scales with
// the typed text's own length so a short name isn't over-matched.
function accountingSuggestSimilarClient(name) {
  const norm = (name || '').trim().toLowerCase();
  if (!norm) return null;
  let best = null, bestDist = Infinity;
  ALL_ACCOUNTING_CLIENTS.forEach(c => {
    const d = accountingLevenshtein(norm, c.name.trim().toLowerCase());
    if (d < bestDist) { bestDist = d; best = c; }
  });
  const threshold = Math.max(2, Math.ceil(norm.length * 0.3));
  return best && bestDist > 0 && bestDist <= threshold ? best : null;
}
function accountingSuggestSimilarTactic(name) {
  const norm = (name || '').trim().toLowerCase();
  if (!norm) return null;
  const eligible = (r) => r.pricing_mode !== 'modifier' && !r.is_cpm_adjustment;
  let best = null, bestDist = Infinity;
  Object.values(CATALOG_ROWS).filter(eligible).forEach(r => {
    const label = (r.accounting_label || r.label || '').trim().toLowerCase();
    const d = accountingLevenshtein(norm, label);
    if (d < bestDist) { bestDist = d; best = { service: r, tacticLabel: r.accounting_label || r.label }; }
  });
  const threshold = Math.max(2, Math.ceil(norm.length * 0.3));
  return best && bestDist > 0 && bestDist <= threshold ? best : null;
}
function accountingParseCsvRows(text) {
  return text.trim().split(/\r?\n/).filter(line => line.trim()).map(line =>
    (line.includes('\t') ? line.split('\t') : line.split(',')).map(c => c.trim())
  );
}
const ACCT_BULK_IMPORT_COLUMNS = [
  { key: 'client', names: ['client'] },
  { key: 'tactic', names: ['tactic'] },
  { key: 'flight_start', names: ['flight start'] },
  { key: 'flight_end', names: ['flight end'] },
  { key: 'month', names: ['month'] },
  { key: 'gross_budget', names: ['gross budget'] },
  { key: 'billing_type', names: ['billing', 'billing type'] },
  { key: 'has_offline_visits', names: ['offline visits', 'offline visits tracking'] },
];
// Pure parse: paste text in, a plan out, never touches the database. Groups
// data rows sharing the same Client+Tactic into one campaign (its own
// month rows collected together), same grouping convention as Strategist's
// own bulk import.
// `overrides` (keyed by rowNum, 2026-08-12 per Claire -- "add the dropdowns
// like the strategist so that I don't have to repaste") lets a specific
// row's client/tactic be forced to a real id picked from a dropdown, or the
// row dropped entirely, WITHOUT touching the pasted text at all -- re-
// parsing with the same raw text plus an override is how a correction
// actually takes effect. Same convention as Strategist's own bulk import.
function accountingParseBulkImport(raw, overrides = {}) {
  const rows = accountingParseCsvRows(raw);
  if (rows.length < 2) return { error: 'Need a header row plus at least one data row.' };
  const header = rows[0].map(h => h.trim().toLowerCase());
  const colIndex = {};
  ACCT_BULK_IMPORT_COLUMNS.forEach(({ key, names }) => {
    const idx = header.findIndex(h => names.includes(h));
    if (idx !== -1) colIndex[key] = idx;
  });
  const missingRequired = ['client', 'tactic'].filter(k => colIndex[k] === undefined);
  if (missingRequired.length) return { error: 'Header row is missing required column(s): ' + missingRequired.join(', ') };

  const errors = []; // { rowNum, field, clientName, tacticName }
  const groups = new Map(); // identityKey -> { client, service, tacticLabel, flightStart, flightEnd, hasOfflineVisits, billingType, months: [{month, grossBudget}] }
  rows.slice(1).forEach((cols, i) => {
    const rowNum = i + 2;
    if (overrides[rowNum]?.excluded) return; // removed from the import, per her own review
    const get = (key) => colIndex[key] !== undefined ? (cols[colIndex[key]] || '').trim() : '';
    const clientName = get('client'), tacticName = get('tactic');
    if (!clientName && !tacticName) return; // blank line
    const clientOverrideId = overrides[rowNum]?.clientId;
    const serviceOverrideId = overrides[rowNum]?.serviceId;
    const client = clientOverrideId ? ALL_ACCOUNTING_CLIENTS.find(c => c.id === clientOverrideId) : accountingResolveBulkClient(clientName);
    const tacticMatch = serviceOverrideId
      ? (CATALOG_ROWS[serviceOverrideId] ? { service: CATALOG_ROWS[serviceOverrideId], tacticLabel: CATALOG_ROWS[serviceOverrideId].accounting_label || CATALOG_ROWS[serviceOverrideId].label } : null)
      : accountingResolveBulkTactic(tacticName);
    if (!client) { errors.push({ rowNum, field: 'client', clientName, tacticName }); return; }
    if (!tacticMatch) { errors.push({ rowNum, field: 'tactic', clientName, tacticName }); return; }
    const identityKey = `${client.id}|${tacticMatch.service.id}|${tacticMatch.tacticLabel}`;
    if (!groups.has(identityKey)) {
      // Does this Client+Tactic already exist -- from Strategist's own
      // order flow, an earlier Accounting Add Service, or a prior Bulk
      // Import -- ALL_ACCOUNTING_LINES covers every source (2026-08-12,
      // per Claire: "will it know if something is already in the
      // strategist portal?"). If so, this group ADDS its pasted months
      // to that SAME line instead of creating a duplicate one.
      const existingLine = ALL_ACCOUNTING_LINES.find(l =>
        l.client_id === client.id && l.service_id === tacticMatch.service.id && l.tactic_label === tacticMatch.tacticLabel);
      groups.set(identityKey, {
        client, service: tacticMatch.service, tacticLabel: tacticMatch.tacticLabel,
        flightStart: get('flight_start') || null, flightEnd: get('flight_end') || null,
        hasOfflineVisits: /^(true|yes|1)$/i.test(get('has_offline_visits')),
        billingType: get('billing_type').toLowerCase() || null,
        existingLineId: existingLine ? existingLine.id : null,
        months: [],
      });
    }
    const monthRaw = get('month'); // YYYY-MM
    const grossBudgetRaw = get('gross_budget');
    if (monthRaw) {
      groups.get(identityKey).months.push({
        month: /^\d{4}-\d{2}$/.test(monthRaw) ? monthRaw + '-01' : monthRaw,
        grossBudget: grossBudgetRaw ? parseFloat(grossBudgetRaw.replace(/[$,]/g, '')) : null,
      });
    }
  });
  return { groups: [...groups.values()], errors };
}

let ACCT_BULK_IMPORT_PLAN = null; // set by Preview, consumed by Confirm -- never touched by typing alone

// One unresolved row's fix-it UI: a "did you mean X?" suggestion (plain
// edit-distance nearest match, pre-selected but never auto-applied) plus a
// dropdown of every real option and a Remove-row button -- picking either
// re-runs Preview against an override, the pasted text is never touched.
function accountingRenderBulkImportErrorRow(e) {
  const rawText = e.field === 'client' ? e.clientName : e.tacticName;
  const suggestion = e.field === 'client' ? accountingSuggestSimilarClient(rawText) : accountingSuggestSimilarTactic(rawText);
  const suggestionId = suggestion ? (e.field === 'client' ? suggestion.id : suggestion.service.id) : null;
  const suggestionLabel = suggestion ? (e.field === 'client' ? suggestion.name : suggestion.tacticLabel) : null;
  const overrideKey = e.field === 'client' ? 'clientId' : 'serviceId';
  const options = e.field === 'client'
    ? [...ALL_ACCOUNTING_CLIENTS].sort((a, b) => a.name.localeCompare(b.name))
        .map(c => `<option value="${esc(c.id)}" ${suggestionId === c.id ? 'selected' : ''}>${esc(c.name)}</option>`).join('')
    : Object.values(CATALOG_ROWS).filter(r => r.pricing_mode !== 'modifier' && !r.is_cpm_adjustment)
        .sort((a, b) => (a.accounting_label || a.label || '').localeCompare(b.accounting_label || b.label || ''))
        .map(r => `<option value="${esc(r.id)}" ${suggestionId === r.id ? 'selected' : ''}>${esc(r.accounting_label || r.label)}</option>`).join('');
  return `<div style="display:flex;align-items:center;flex-wrap:wrap;gap:8px;padding:5px 0;font-size:12px;color:#B91C1C">
    <span>Row ${e.rowNum}: ${e.field} "${esc(rawText)}" not found${suggestionLabel ? ` — did you mean "${esc(suggestionLabel)}"?` : ''}</span>
    <select onchange="accountingSetBulkImportOverride(${e.rowNum}, '${overrideKey}', this.value)" style="font-size:11px;padding:3px 6px;border-radius:5px;border:1px dashed var(--accent);color:var(--text)">
      <option value="">— Pick the right ${e.field} —</option>
      ${options}
    </select>
    <button onclick="accountingSetBulkImportOverride(${e.rowNum}, 'excluded', true)" style="font-size:11px;padding:3px 8px;border-radius:5px;background:var(--light);border:1px solid var(--border);cursor:pointer;color:var(--text)">Remove row</button>
  </div>`;
}
let ACCT_BULK_IMPORT_OVERRIDES = {}; // rowNum -> { clientId?, serviceId?, excluded? }
function accountingSetBulkImportOverride(rowNum, key, value) {
  if (!ACCT_BULK_IMPORT_OVERRIDES[rowNum]) ACCT_BULK_IMPORT_OVERRIDES[rowNum] = {};
  ACCT_BULK_IMPORT_OVERRIDES[rowNum][key] = value;
  accountingPreviewBulkImport();
}

async function accountingConfirmBulkImport() {
  if (!ACCT_BULK_IMPORT_PLAN || !ACCT_BULK_IMPORT_PLAN.groups.length) return;
  const { groups } = ACCT_BULK_IMPORT_PLAN;
  let linesCreated = 0, linesMatched = 0, monthsSaved = 0;
  try {
    for (const g of groups) {
      const sortedMonths = [...g.months].sort((a, b) => a.month.localeCompare(b.month));
      let lineId = g.existingLineId;

      if (lineId) {
        // Already in the system (Strategist's own order flow, an earlier
        // Add Service, or a prior Bulk Import) -- add these months to that
        // SAME line rather than creating a duplicate one (2026-08-12, per
        // Claire: "will it know if something is already in the strategist
        // portal?"). Every month goes through accounting_save_campaign_month
        // here, including the first -- there's no "initial month" concept
        // for a line that already exists.
        linesMatched++;
        for (const m of sortedMonths) {
          if (m.grossBudget == null) continue;
          await sb('rpc/accounting_save_campaign_month', { method: 'POST', body: JSON.stringify({
            p_name: currentAccountingUser.name, p_pw: currentAccountingUser.pw,
            p_campaign_line_id: lineId, p_month: m.month, p_data: { gross_budget: m.grossBudget }
          }) });
          monthsSaved++;
        }
        continue;
      }

      const trackable = accountingIsSpendTrackable(g.service.id);
      const firstMonth = sortedMonths[0];
      const data = {
        client_id: g.client.id, group_id: g.client.group_id || null, service_id: g.service.id,
        tactic_label: g.tacticLabel, flight_start: g.flightStart, flight_end: g.flightEnd,
        has_offline_visits: g.hasOfflineVisits,
        accounting_only: !trackable,
        status: trackable ? undefined : 'active',
        billing_type: trackable ? 'spend' : (g.billingType === 'one-time' || g.billingType === 'one_time' ? 'one_time' : 'recurring'),
      };
      if (firstMonth && firstMonth.grossBudget != null) {
        data.initial_gross_budget = firstMonth.grossBudget;
        data.initial_month = firstMonth.month;
      }
      const newId = await sb('rpc/accounting_add_campaign_line', { method: 'POST', body: JSON.stringify({
        p_name: currentAccountingUser.name, p_pw: currentAccountingUser.pw, p_data: data
      }) });
      linesCreated++;
      if (firstMonth) monthsSaved++;
      // Any month beyond the first goes through accounting_save_campaign_month --
      // accounting_add_campaign_line only ever handles ONE initial month.
      for (const m of sortedMonths.slice(1)) {
        if (m.grossBudget == null) continue;
        await sb('rpc/accounting_save_campaign_month', { method: 'POST', body: JSON.stringify({
          p_name: currentAccountingUser.name, p_pw: currentAccountingUser.pw,
          p_campaign_line_id: newId, p_month: m.month, p_data: { gross_budget: m.grossBudget }
        }) });
        monthsSaved++;
      }
    }
    document.getElementById('accounting-bulk-import-form').style.display = 'none';
    document.getElementById('accounting-bulk-import-form').innerHTML = '';
    ACCT_BULK_IMPORT_PLAN = null;
    await fetchAccountingData();
    renderAccountingDashboard();
    showToast(`${linesCreated} new campaign(s) created, ${linesMatched} already-existing campaign(s) matched, ${monthsSaved} month(s) saved.`);
  } catch(e) { showToast('Error during bulk import: ' + e.message, 'error'); }
}

function accountingStatusPill(kind, text) {

// Confirmed = a real actual-spend figure entered for the month, OR a manual
// confirm from the detail card (for tactics the Strategist Portal never
// Same keys/labels as the Strategist Portal's own SETUP_BLOCKER_LABELS --
// duplicated here rather than shared, same "each portal keeps its own copy"
// convention as everywhere else this session -- so a blocker reads
// identically in either portal without the two files depending on each
// other's internals.
const ACCT_SETUP_BLOCKER_LABELS = {
  creative: 'Waiting on Creative',
  platform_access: 'Waiting on Platform Access',
  intake_form: 'Waiting on Intake Form',
  pending_website: 'Pending Website',
};
// A pending campaign's own pill (2026-08-12, per Claire: "like paused, I
// want something that notes it is pending and what the blocker is") --
// one pill per recognized blocker, same visual treatment as Strategist's
// own strategistSetupBlockerPill. Falls back to a plain "Pending" pill if
// no blocker is set yet (or none of the ones set are recognized).
// Blocker sub-pills moved into the detail card (2026-08-12, per Claire: "move
// the pending blockers to the details so that those lines don't grow") --
// a pending campaign waiting on several things at once used to grow the main
// row's height with wrapping blocker pills; the main table now always shows
// a plain "Pending" pill, and accountingRenderDetailCard() below shows the
// full blocker list once you click into that line.
function accountingPendingStatusPill(line) {
  return accountingStatusPill('pending', 'Pending');
}
// tracks actuals for at all). Either one is sufficient. Priority order:
// Billed Externally > Pending > Paused > Confirmed/Needs confirmation.
// Pending (2026-08-12, per Claire) sits above Paused -- a campaign that
// hasn't even started in Strategist yet was never "running" to begin with,
// so Paused doesn't apply to it; Billed Externally still wins over
// everything (a manually-invoiced tactic can be billed regardless of its
// own setup/pause state).
function accountingLineStatusPill(r) {
  if (r.line.billed_externally) return accountingStatusPill('external', 'Billed externally');
  if (r.line.status === 'pending') return accountingPendingStatusPill(r.line);
  if (r.paused) return accountingStatusPill('paused', 'Paused');
  if (r.confirmed) return accountingStatusPill('confirmed', 'Confirmed');
  return accountingStatusPill('needs', 'Needs confirmation');
}
// Status text for a rollup PARENT row -- summarizes across all its children
// rather than picking one child's state, since a split can have some regions
// confirmed and others not (the mockup's "2 of 3 confirmed" example). Same
// priority as the single-line pill -- only shows a whole-rollup Pending/
// Paused when EVERY region is in that state, otherwise a partial one falls
// through to the normal confirmed-count summary (that detail is visible in
// the expanded rows).
function accountingRollupStatusPill(r) {
  if (r.children.every(c => c.line.billed_externally)) return accountingStatusPill('external', 'Billed externally');
  if (r.children.every(c => c.line.status === 'pending')) return accountingPendingStatusPill(r.children[0].line);
  if (r.children.every(c => c.paused)) return accountingStatusPill('paused', 'Paused');
  if (r.confirmedCount === r.totalCount) return accountingStatusPill('confirmed', 'Confirmed');
  if (r.confirmedCount === 0) return accountingStatusPill('needs', 'Needs confirmation');
  return accountingStatusPill('needs', `${r.confirmedCount} of ${r.totalCount} confirmed`);
}
